name: Install the app workspace
description: Install the app/.mise.toml toolchain and the frozen app/ dependency graph, from a cached installed workspace or a lockfile-keyed pnpm store.

inputs:
  install-args:
    description: Extra `pnpm install` arguments.
    default: ''
  mise-env:
    description: Export the app/.mise.toml environment.
    default: 'true'
  save-store:
    # demo: the demo trunk saves its own store too; its lockfile differs from main's (MERGING.md V8).
    description: >-
      Save a missed pnpm store on main or the sales demo branch. Exactly one job of a workflow sets this, so
      parallel jobs never race to save.
    default: 'false'
  restore-node-modules:
    # demo: a caller that passes install-args (the quality audit, the stage deploy) installs from the store as before.
    description: >-
      Restore the installed workspace a complete `pnpm install --frozen-lockfile` saved, and skip the install when it
      resolves. A caller that must install with its own arguments from the pnpm store sets 'false'; it then cannot save one.
    default: 'true'
  save-node-modules:
    # demo: no cache warmer; a branch never writes the default branch's caches.
    description: >-
      Save a missed complete installed workspace. The typecheck row saves a missed install in its own run's branch
      scope, early in its job, so the jobs that start after the build shards (owner rows, bootstrap row, unit rows
      that read build outputs) restore it, and later runs of the same branch start from it.
    default: 'false'
  restore-typescript-build:
    # demo: the demo trunk saves its own TS-Go build, from its typecheck row.
    description: >-
      Restore the newest TS-Go typecheck build (app/node_modules/.cache/tsgo) saved for this toolchain and
      lockfile. TS-Go rechecks every file whose content changed, so a stale build only costs time.
    default: 'false'

outputs:
  typescript-build-key:
    description: The cache key this commit's TS-Go typecheck build saves under.
    value: ${{ steps.typescript-build.outputs.key }}

runs:
  using: composite
  steps:
    # A merge group's ref (gh-readonly-queue/main/pr-<number>-<base>) belongs to one queue entry, so no later
    # run reads a toolchain saved there, and inside the run a fresh install of the two tools (about 4 s) is
    # as fast as a restore (2 to 6 s) while the save costs 9 to 12 s: 13 such 132 MB entries sat unread.
    - name: Setup mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        working_directory: app
        env: ${{ inputs.mise-env }}
        minimum_release_age: 24h
        cache_save: ${{ github.event_name != 'merge_group' }}

    # The installed tree, not just the store pnpm installs it from. A store restore followed by
    # `pnpm install --frozen-lockfile` downloads nothing on a hit and still spends ~30 s linking 1461
    # packages into node_modules, in every job that installs; restoring the finished tree spends that once.
    #
    # The key is exact and carries NO prefix restore-keys: a half-restored dependency graph is a wrong
    # answer, so a changed input must miss and install. It covers this action's install code and arguments,
    # the hosted runner's ImageOS and ImageVersion, the pinned toolchain (app/.mise.toml),
    # the resolution (app/pnpm-lock.yaml), the workspace settings that decide the SHAPE of the tree
    # (app/pnpm-workspace.yaml: packageImportMethod, enableGlobalVirtualStore, patchedDependencies), the
    # patches themselves, and every workspace manifest. The manifests are in the key so that the one thing
    # skipping the install would otherwise stop checking still gets checked: `--frozen-lockfile` fails when
    # a manifest asks for a dependency the lockfile does not lock, and a manifest change that leaves the
    # lockfile alone (5 of the last 120 commits on main) is exactly when that install must really run.
    #
    # The packages are the directories the `packages:` globs of app/pnpm-workspace.yaml match, negations
    # included, read from that file rather than spelled out here: pnpm refuses to run in a tree where a
    # workspace package lacks its node_modules (ERR_PNPM_VERIFY_DEPS_BEFORE_RUN), so an entry that misses one
    # fails every job that restores it. The entry holds exactly their node_modules, and the key hashes each
    # package's path and manifest, so a workspace with another package set never restores this one's tree.
    #
    # The store is deliberately NOT in this entry. app/pnpm-workspace.yaml pins
    # `packageImportMethod: clone-or-copy` and `enableGlobalVirtualStore: false`, so app/node_modules/.pnpm
    # holds real files and the only symlinks are relative ones inside it - verified: zero dangling links and
    # zero link targets outside app/. Adding the 619 MB store would roughly double a ~0.6 GB entry and spend
    # the saved time restoring it again. A tree that is somehow not self-contained must not become a
    # confusing module-resolution failure later: the next step turns it into a clean miss, and the save
    # below refuses to publish such a tree at all.
    - name: List the workspace packages
      id: packages
      if: inputs.restore-node-modules == 'true' && inputs.install-args == ''
      shell: bash
      working-directory: app
      run: |
        set -euo pipefail
        shopt -s nullglob
        positives=()
        negatives=()
        listing=false
        entry='^[[:space:]]*-[[:space:]]+([^[:space:]]+)[[:space:]]*(#.*)?$'
        shape='^[A-Za-z0-9@_*?-][A-Za-z0-9@._*?-]*(/[A-Za-z0-9@_*?-][A-Za-z0-9@._*?-]*)*$'
        while IFS= read -r line || [[ -n "$line" ]]; do
          if [[ "$line" =~ ^packages:[[:space:]]*(#.*)?$ ]]; then
            listing=true
            continue
          fi
          [[ "$listing" == 'true' ]] || continue
          [[ "$line" =~ ^[[:space:]]*(#.*)?$ ]] && continue
          [[ "$line" =~ ^[^[:space:]#-] ]] && break
          if [[ ! "$line" =~ $entry ]]; then
            echo "::error::The install action cannot read this packages: entry of app/pnpm-workspace.yaml: $line"
            exit 1
          fi
          pattern="${BASH_REMATCH[1]}"
          if [[ "$pattern" =~ ^\'(.*)\'$ || "$pattern" =~ ^\"(.*)\"$ ]]; then
            pattern="${BASH_REMATCH[1]}"
          fi
          glob="${pattern#!}"
          if [[ ! "$glob" =~ $shape || "$glob" == *'**'* ]]; then
            echo "::error::The install action expands only '*' and '?' inside package directories; app/pnpm-workspace.yaml lists '$pattern'."
            exit 1
          fi
          if [[ "$pattern" == '!'* ]]; then
            negatives+=("$glob")
          else
            positives+=("$glob")
          fi
        done <pnpm-workspace.yaml
        # One directory per line: a directory name may hold a space, never a newline.
        excluded=$'\n'
        for glob in ${negatives[@]+"${negatives[@]}"}; do
          for manifest in $glob/package.json; do
            excluded+="${manifest%/package.json}"$'\n'
          done
        done
        directories=()
        for glob in ${positives[@]+"${positives[@]}"}; do
          # pnpm also reads package.yaml and package.json5; this listing reads only package.json, so it refuses them.
          for manifest in $glob/package.yaml $glob/package.json5; do
            # A glob without a wildcard stays as written even when it names no file.
            [[ -e "$manifest" ]] || continue
            echo "::error::The install action reads only package.json manifests; app/pnpm-workspace.yaml matches $manifest."
            exit 1
          done
          for manifest in $glob/package.json; do
            directory="${manifest%/package.json}"
            [[ "$excluded" == *$'\n'"$directory"$'\n'* || "/$directory/" == */node_modules/* ]] || directories+=("$directory")
          done
        done
        if [[ "${#directories[@]}" == '0' ]]; then
          echo '::error::app/pnpm-workspace.yaml lists no package directory.'
          exit 1
        fi
        packages="$(printf '%s\n' "${directories[@]}" | LC_ALL=C sort -u)"
        manifests="$(while IFS= read -r directory; do sha256sum "$directory/package.json"; done <<<"$packages" | sha256sum)"
        {
          echo 'directories<<EOF'
          echo "$packages"
          echo 'EOF'
          echo 'paths<<EOF'
          printf '%s\n' app/node_modules '!app/node_modules/.cache'
          # actions/cache reads each path as a glob: [ * ? in a directory name are bracketed to match literally.
          sed -e 's/[[*?]/[&]/g' -e 's|.*|app/&/node_modules|' <<<"$packages"
          echo 'EOF'
          echo "manifests=${manifests%% *}"
        } >>"$GITHUB_OUTPUT"

    - name: Name the installed workspace
      id: workspace-key
      if: inputs.restore-node-modules == 'true' && inputs.install-args == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "key=pnpm-workspace-${{ runner.os }}-${{ runner.arch }}-${ImageOS:?}-${ImageVersion:?}-${{ hashFiles('.github/actions/install-app/action.yml', 'app/.mise.toml', 'app/pnpm-lock.yaml', 'app/pnpm-workspace.yaml', 'app/package.json', 'app/patches/**') }}-${{ steps.packages.outputs.manifests }}" >>"$GITHUB_OUTPUT"

    - name: Restore the installed workspace
      id: workspace
      if: inputs.restore-node-modules == 'true' && inputs.install-args == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.packages.outputs.paths }}
        key: ${{ steps.workspace-key.outputs.key }}

    # A restored tree is used only if it resolves: the virtual store and pnpm's own state file are present
    # and no dependency link of the root or of a workspace package dangles. Anything else is removed and
    # installed from the store below, so a bad entry costs one install instead of failing 34 jobs with a
    # module-resolution error. It catches a broken tree, not every tree pnpm refuses: an entry that missed a
    # workspace package passed it and failed every job (demo 353b91df5), which the derived list above prevents.
    - name: Verify the restored workspace resolves
      id: restored
      if: inputs.restore-node-modules == 'true' && inputs.install-args == ''
      shell: bash
      working-directory: app
      env:
        RESTORED: ${{ steps.workspace.outputs.cache-hit }}
        PACKAGES: ${{ steps.packages.outputs.directories }}
      run: |
        set -euo pipefail
        mapfile -t packages <<<"$PACKAGES"
        usable=false
        if [[ "$RESTORED" == 'true' && -d node_modules/.pnpm && -f node_modules/.modules.yaml ]]; then
          farms=(node_modules)
          for package in "${packages[@]}"; do
            [[ -d "$package/node_modules" ]] && farms+=("$package/node_modules")
          done
          # Each farm's direct dependency links and the links inside its @scope directories, such as
          # node_modules/@effect/sql-pg; with -L, `-type l` matches only the links that do not resolve.
          dangling="$(find -L "${farms[@]}" -mindepth 1 -maxdepth 2 \( -path '*/node_modules/@*/*' -o ! -path '*/node_modules/*/*' \) -type l -print | wc -l | tr -d ' ')"
          if [[ "$dangling" == '0' ]]; then
            usable=true
          else
            echo "::warning::$dangling dependency links of the restored app/ workspace do not resolve."
          fi
        fi
        if [[ "$RESTORED" == 'true' && "$usable" != 'true' ]]; then
          echo '::warning::Installing instead of using the restored workspace.'
          rm -rf node_modules
          for package in "${packages[@]}"; do
            rm -rf "./$package/node_modules"
          done
        fi
        echo "usable=$usable" >>"$GITHUB_OUTPUT"

    - name: Locate the pnpm store
      id: store
      if: steps.restored.outputs.usable != 'true'
      shell: bash
      working-directory: app
      run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

    # The exact key covers the pinned pnpm (app/.mise.toml) and the lockfile. A changed lockfile misses
    # it, so the prefix restore-keys still seed the newest store for this toolchain: pnpm verifies what
    # it restored and fetches only the changed packages, instead of the whole graph. A partial restore
    # leaves `cache-hit` empty, so the save below still stores the complete store under the exact key.
    - name: Restore the pnpm store
      id: restore
      if: steps.restored.outputs.usable != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/.mise.toml', 'app/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies from the frozen lockfile
      if: steps.restored.outputs.usable != 'true'
      shell: bash
      working-directory: app
      run: mise exec -- pnpm install --frozen-lockfile ${{ inputs.install-args }}

    - name: Save the pnpm store
      if: >-
        inputs.save-store == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo/sales-crm') &&
        steps.restored.outputs.usable != 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

    # Only a complete install may be published: an entry saved from a run that passed `install-args`
    # (`--ignore-scripts`, for example) would hand an incomplete tree to every job that restores it.
    # The tree must also be self-contained, because nothing outside app/ is in the entry.
    - name: Check that the installed workspace may be published
      id: publishable
      if: >-
        inputs.save-node-modules == 'true' && inputs.restore-node-modules == 'true' &&
        steps.workspace.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        PACKAGES: ${{ steps.packages.outputs.directories }}
      run: |
        set -euo pipefail
        mapfile -t packages <<<"$PACKAGES"
        if [[ -n "${INSTALL_ARGS// /}" ]]; then
          echo "::error::save-node-modules needs a complete install; this job installed with $INSTALL_ARGS."
          exit 1
        fi
        if [[ ! -d node_modules/.pnpm ]]; then
          echo '::error::There is no installed app/ workspace to save.'
          exit 1
        fi
        farms=(node_modules)
        for package in "${packages[@]}"; do
          [[ -d "$package/node_modules" ]] && farms+=("$package/node_modules")
        done
        dangling="$(find -L "${farms[@]}" -mindepth 1 -maxdepth 2 \( -path '*/node_modules/@*/*' -o ! -path '*/node_modules/*/*' \) -type l -print | wc -l | tr -d ' ')"
        outside="$(find "${farms[@]}" -type l -print0 | xargs -0 -r readlink -f -- | grep -cv "^$PWD/" || true)"
        if [[ "$dangling" != '0' || "$outside" != '0' ]]; then
          echo "::error::The installed workspace is not self-contained ($dangling dangling, $outside outside app/); it cannot be cached without the pnpm store."
          exit 1
        fi
        echo 'The installed workspace is complete and self-contained.'

    # The same condition as the check above, not its outcome: a composite action stops at the failing step, so
    # reaching this one means the check passed, and an unsupported `outcome` could silently never save anything.
    # A tree restored under the exact key is never saved again: that entry exists, and a tree the verify step
    # refused was reinstalled only for this job.
    - name: Save the installed workspace
      if: >-
        inputs.save-node-modules == 'true' && inputs.restore-node-modules == 'true' &&
        steps.workspace.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.packages.outputs.paths }}
        key: ${{ steps.workspace.outputs.cache-primary-key }}

    # Restored after the install, which creates app/node_modules. The key names this commit, so the
    # restore takes the newest build saved for this toolchain and lockfile. app/node_modules/.cache is
    # left out of the installed-workspace entry above, so this build stays keyed and saved on its own.
    - name: Name the TS-Go typecheck build
      id: typescript-build
      shell: bash
      run: echo "key=tsgo-${{ runner.os }}-${{ hashFiles('app/.mise.toml', 'app/pnpm-lock.yaml') }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Restore the TS-Go typecheck build
      if: inputs.restore-typescript-build == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: app/node_modules/.cache/tsgo
        key: ${{ steps.typescript-build.outputs.key }}
        restore-keys: tsgo-${{ runner.os }}-${{ hashFiles('app/.mise.toml', 'app/pnpm-lock.yaml') }}-
