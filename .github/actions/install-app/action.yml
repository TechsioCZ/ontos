name: Install the app workspace
description: Install the app/.mise.toml toolchain and the frozen app/ dependency graph from a lockfile-keyed pnpm store.

inputs:
  install-args:
    description: Extra `pnpm install` arguments.
    default: ""
  mise-env:
    description: Export the app/.mise.toml environment.
    default: "true"
  save-store:
    description: Save a missed pnpm store on main. Exactly one job sets this, so parallel jobs never race to save.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        working_directory: app
        env: ${{ inputs.mise-env }}

    - name: Locate the pnpm store
      id: store
      shell: bash
      working-directory: app
      run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

    # The key covers the pinned pnpm (app/.mise.toml) and the lockfile; there are no restore-keys, so a
    # stale store never masquerades as a hit.
    - name: Restore the pnpm store
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/.mise.toml', 'app/pnpm-lock.yaml') }}

    - name: Install dependencies from the frozen lockfile
      shell: bash
      working-directory: app
      run: mise exec -- pnpm install --frozen-lockfile ${{ inputs.install-args }}

    - name: Save the pnpm store
      if: inputs.save-store == 'true' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
