name: Format and lint through every pre-commit job
description: Exhaust the selected files and hook jobs, print all failures and fixes, and require an unchanged commit.
inputs:
  shard:
    description: '0 for changed paths; 1, 2, 3 for the shared whole-tree slices.'
    required: true
  changed-paths:
    description: NUL-separated repository paths, required for shard 0.
    default: ''
runs:
  using: composite
  steps:
    - name: Select the hook's files
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
        CHANGED_PATHS: ${{ inputs.changed-paths }}
      run: bash app/scripts/ci/lint-shard-files.sh "$SHARD" "$CHANGED_PATHS" >"$RUNNER_TEMP/hook-files"
    # One whole-tree lint process held all type programs and lost its 16 GB runner. Bounded hook batches retain
    # that memory limit, but unlike Lefthook's internal chunks they all run after a failure (lint-files.sh).
    - name: Run every hook batch and require the exact commit
      shell: bash
      run: mise exec --cd app -- bash scripts/ci/lint-files.sh <"$RUNNER_TEMP/hook-files"
