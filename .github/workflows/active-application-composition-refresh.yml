name: Active Application Composition Refresh

# Consumers stop trusting the published snapshot at validUntil, so each deployed environment re-observes its
# live services and re-publishes it well inside the validity window. The cadence and window live in
# app/scripts/active-application-composition.mts (ACTIVE_APPLICATION_COMPOSITION_POLICY).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  refresh-stage:
    name: Re-observe and re-publish the stage Application Composition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Refreshing is not a deployment: without deployment: false the job would record a successful stage
    # deployment for the schedule's main SHA, which the stage deploy would then treat as its diff base.
    environment:
      name: stage
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    outputs:
      edge-consumers: ${{ steps.edge-consumers.outputs.edge_consumers }}
      snapshot: ${{ steps.publish.outputs.snapshot }}
    env:
      # The publisher observes Zerops subdomains or, on the Cloudflare target, the Worker URLs, and
      # restarts the Outbox Worker services that consume the snapshot: the dedicated ones, or the one host,
      # as the stage OUTBOX_WORKER_MODE variable (required, `dedicated` or `host`) chooses.
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'zerops' }}
      OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # On the Cloudflare target the Workers are what the snapshot observes, and a failed edge rollout leaves
      # the last successful stage-edge revision live even after a newer stage deployment succeeded.
      - name: Resolve the last successful stage deployment
        id: base
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_environment=stage
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            deployment_environment=stage-edge
          fi
          mise exec -- pnpm deployment-base:resolve --environment "$deployment_environment"

      # An OUTBOX_WORKER_MODE switch takes effect at the next stage deploy, which starts this mode's Outbox
      # Workers and stops the other mode's. Until then the workers drift from the mode: the other mode's still
      # run, or this mode's do not. Restarting consumers would wake this mode's stopped workers on stale
      # builds, or fail on a worker the stage never provisioned.
      - name: Detect Outbox Workers that do not match the Outbox Worker mode
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-mode-drift

      - name: Leave the pending Outbox Worker mode switch to the stage deploy
        if: steps.worker-drift.outputs.drift == 'true'
        env:
          MODE: ${{ env.OUTBOX_WORKER_MODE }}
        run: >-
          echo "::warning title=Refresh skipped::OUTBOX_WORKER_MODE is $MODE but the Outbox Workers still reflect
          the other mode. Run the stage deploy to finish the switch; it re-publishes the composition."

      # The publisher and topology of the deployed revision describe what stage actually runs.
      - name: Check out the deployed revision
        if: steps.worker-drift.outputs.drift != 'true'
        env:
          DEPLOYED_SHA: ${{ steps.base.outputs.base }}
        run: git checkout --detach "$DEPLOYED_SHA"

      - name: Install the deployed revision's app workspace
        if: steps.worker-drift.outputs.drift != 'true'
        uses: ./.github/actions/install-app

      - name: Re-observe live services and re-publish the active Application Composition
        id: publish
        if: steps.worker-drift.outputs.drift != 'true'
        working-directory: app
        env:
          SNAPSHOT_FILE: ${{ runner.temp }}/active-application-composition.json
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          snapshot_arguments=()
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            snapshot_arguments=(--snapshot-file "$SNAPSHOT_FILE")
          fi
          mise exec -- pnpm active-composition:publish publish \
            --environment stage \
            --restart-consumers \
            --recover-consumers \
            "${snapshot_arguments[@]}"
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            # The encoded snapshot is one JSON line, and it holds no secret.
            echo "snapshot=$(<"$SNAPSHOT_FILE")" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve the placed Workers that consume the snapshot
        id: edge-consumers
        if: env.DEPLOY_TARGET == 'cloudflare' && steps.worker-drift.outputs.drift != 'true'
        working-directory: app
        run: mise exec -- pnpm --silent active-composition:publish edge-consumers

  # Placed Worker consumers read the snapshot from the composition KV namespace, not the Zerops project
  # variable, so they need each re-publication too. Only stage-edge holds the Cloudflare token.
  refresh-stage-edge:
    name: Hand the re-published Application Composition to its Worker consumers
    if: needs.refresh-stage.outputs.edge-consumers != '' && needs.refresh-stage.outputs.edge-consumers != '[]'
    needs: [refresh-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Write the snapshot to the composition KV namespace the consumer Workers read
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.refresh-stage.outputs.snapshot }}
        run: app/scripts/put-edge-composition-snapshot.sh

  # Production runs on Zerops, the only target outside stage, and publishes a snapshot of the same validity.
  # A production that is not configured or has never deployed has no snapshot to refresh.
  refresh-production:
    name: Re-observe and re-publish the production Application Composition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      deployment: false
    concurrency:
      group: zerops-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    env:
      DEPLOY_TARGET: zerops
      # Production chooses its Outbox Worker mode like any environment; it runs `dedicated`.
      OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Check the production Zerops project and token
        id: configuration
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          if [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo '::notice title=Production not configured::Production has no Zerops project and token, so there is no snapshot to refresh.'
          fi

      - name: Checkout main
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        if: steps.configuration.outputs.configured == 'true'
        uses: ./.github/actions/install-app

      - name: Resolve the last successful production deployment
        id: base
        if: steps.configuration.outputs.configured == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(mise exec -- pnpm --silent deployment-base:resolve --environment production --optional)"
          if [[ -z "$base" ]]; then
            echo '::notice title=Production not deployed::Production has no successful deployment, so there is no snapshot to refresh.'
          fi

      # A production OUTBOX_WORKER_MODE switch, like stage's, takes effect at the next production deploy.
      - name: Detect Outbox Workers that do not match the Outbox Worker mode
        id: worker-drift
        if: steps.base.outputs.base != ''
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-mode-drift

      - name: Leave the pending Outbox Worker mode switch to the production deploy
        if: steps.worker-drift.outputs.drift == 'true'
        env:
          MODE: ${{ env.OUTBOX_WORKER_MODE }}
        run: >-
          echo "::warning title=Refresh skipped::OUTBOX_WORKER_MODE is $MODE but the Outbox Workers still reflect
          the other mode. Run the production deploy to finish the switch; it re-publishes the composition."

      # The publisher and topology of the deployed revision describe what production actually runs.
      - name: Check out the deployed revision
        if: steps.base.outputs.base != '' && steps.worker-drift.outputs.drift != 'true'
        env:
          DEPLOYED_SHA: ${{ steps.base.outputs.base }}
        run: git checkout --detach "$DEPLOYED_SHA"

      - name: Install the deployed revision's app workspace
        if: steps.base.outputs.base != '' && steps.worker-drift.outputs.drift != 'true'
        uses: ./.github/actions/install-app

      - name: Re-observe live services and re-publish the active Application Composition
        if: steps.base.outputs.base != '' && steps.worker-drift.outputs.drift != 'true'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: >-
          mise exec -- pnpm active-composition:publish publish
          --environment production
          --restart-consumers
          --recover-consumers
