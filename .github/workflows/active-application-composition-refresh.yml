name: Active Application Composition Refresh

# Consumers stop trusting the published snapshot at validUntil, so stage re-observes the live services and
# re-publishes it well inside the validity window. The cadence and window live in
# app/scripts/active-application-composition.mts (ACTIVE_APPLICATION_COMPOSITION_POLICY).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  refresh-stage:
    name: Re-observe and re-publish the stage Application Composition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Refreshing is not a deployment: without deployment: false the job would record a successful stage
    # deployment for the schedule's main SHA, which the stage deploy would then treat as its diff base.
    environment:
      name: stage
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    env:
      # Selects which Outbox Worker services consume the snapshot: the dedicated ones, or the one host.
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'zerops' }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Resolve the last successful stage deployment
        id: base
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm deployment-base:resolve --environment stage

      # A DEPLOY_TARGET switch takes effect at the next stage deploy, which starts this target's Outbox Workers
      # and stops the other target's. Until then the other target's workers still running is that pending
      # switch, and restarting consumers would wake this target's stopped workers beside them.
      - name: Detect Outbox Workers left running by the other deploy target
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-target-drift

      - name: Leave the pending deploy target switch to the stage deploy
        if: steps.worker-drift.outputs.other_target_running == 'true'
        env:
          TARGET: ${{ env.DEPLOY_TARGET }}
        run: >-
          echo "::warning title=Refresh skipped::DEPLOY_TARGET is $TARGET but the other target's Outbox Workers
          are still running. Run the stage deploy to finish the switch; it re-publishes the composition."

      # The publisher and topology of the deployed revision describe what stage actually runs.
      - name: Check out the deployed revision
        if: steps.worker-drift.outputs.other_target_running != 'true'
        env:
          DEPLOYED_SHA: ${{ steps.base.outputs.base }}
        run: git checkout --detach "$DEPLOYED_SHA"

      - name: Install the deployed revision's app workspace
        if: steps.worker-drift.outputs.other_target_running != 'true'
        uses: ./.github/actions/install-app

      - name: Re-observe live services and re-publish the active Application Composition
        if: steps.worker-drift.outputs.other_target_running != 'true'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: >-
          mise exec -- pnpm active-composition:publish publish
          --environment stage
          --restart-consumers
          --recover-consumers
