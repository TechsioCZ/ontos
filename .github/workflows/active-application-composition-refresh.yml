name: Active Application Composition Refresh
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-wire-probe:
    name: Diagnose the native PostgreSQL wire boundary without domain writes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: stage-edge
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_TARGET: cloudflare
      OUTBOX_WORKER_MODE: host
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Checkout this diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install the app workspace
        uses: ./.github/actions/install-app
      - name: Download the existing approved candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: approved-application-composition-candidate
          path: app/.composition-candidate
          github-token: ${{ github.token }}
          run-id: 37155123700
      - name: Download the existing initial quiescence receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: 37111714997
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}
      - name: Publish the existing approved release with safe phase diagnostics
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: timeout --signal=INT --kill-after=10s 180s mise exec -- pnpm active-composition:publish publish --environment stage --candidate-file .composition-candidate/active-application-composition-candidate.json
      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}
