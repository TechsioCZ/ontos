name: Active Application Composition Refresh
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-wire-probe:
    name: Diagnose the native PostgreSQL wire boundary without domain writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Checkout this diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install the app workspace
        uses: ./.github/actions/install-app
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}
      - name: Probe an isolated temporary session lock and pooled query
        working-directory: app
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          probe_path="$RUNNER_TEMP/native-pg-wire-probe.cjs"
          trap 'rm --force -- "$probe_path"' EXIT
          cat >"$probe_path" <<'PROBE'
          const appRequire = require('node:module').createRequire(process.cwd() + '/package.json');
          const { Effect, Redacted } = appRequire('effect');
          const { Reactivity } = appRequire('effect/unstable/reactivity');
          const { PgClient } = appRequire('@effect/sql-pg');
          const { randomUUID } = require('node:crypto');
          module.exports.run = async function(connectionString) {
            let phase = 'start';
            const phases = [];
            const mark = (value) => { phase = value; phases.push({ phase, checkedAt: new Date().toISOString() }); };
            const watchdog = setTimeout(() => {
              console.log('ONTOS_WIRE_DEADLINE_' + JSON.stringify({ outcome: 'hard-fifteen-second-deadline', phase, phases }));
              process.exit(124);
            }, 15_000);
            const program = Effect.scoped(Effect.gen(function* () {
              yield* Effect.sync(() => mark('client-acquiring'));
              const reactivity = yield* Reactivity.make;
              const client = yield* PgClient.make({
                url: Redacted.make(connectionString),
                connectTimeout: '5 seconds',
                startupParameters: {
                  default_transaction_read_only: 'on',
                  statement_timeout: '30000ms',
                  application_name: 'ontos-native-pg-wire-probe'
                }
              }).pipe(Effect.provideService(Reactivity.Reactivity, reactivity));
              const connection = yield* client.reserve;
              yield* Effect.sync(() => mark('connection-reserved'));
              const key = 'ontos.native-wire-probe.' + randomUUID();
              yield* Effect.acquireRelease(
                connection.executeValues('select pg_advisory_lock(hashtextextended($1,0))', [key]).pipe(Effect.tap(() => Effect.sync(() => mark('void-lock-returned')))),
                () => connection.executeValues('select pg_advisory_unlock(hashtextextended($1,0))', [key]).pipe(Effect.tap((rows) => Effect.sync(() => {
                  if (rows[0]?.[0] !== true) throw Error('temporary diagnostic lock did not unlock');
                  mark('temporary-lock-unlocked');
                })))
              );
              const same = yield* connection.executeValues('select true as same_session', []);
              if (same[0]?.[0] !== true) return yield* Effect.fail(Error('temporary diagnostic result invalid'));
              yield* Effect.sync(() => mark('same-session-select-returned'));
              const pooled = yield* client.unsafe('select true as pooled_session').values;
              if (pooled[0]?.[0] !== true) return yield* Effect.fail(Error('temporary pooled result invalid'));
              yield* Effect.sync(() => mark('pooled-select-returned'));
            }));
            try {
              await Effect.runPromise(program);
              mark('scopes-closed');
              return { outcome: 'native-wire-complete', phase, phases };
            } catch {
              return { outcome: 'native-wire-failed-no-sensitive-output', phase, phases };
            } finally { clearTimeout(watchdog); }
          };
          
          const connectionString = process.env.DATABASE_ADMIN_URL;
          if (typeof connectionString !== 'string' || connectionString.length === 0) throw Error('ADMIN_CONFIGURATION_MISSING');
          console.log(JSON.stringify({ phase: 'native-runner-start', node: process.version }));
          module.exports.run(connectionString).then(result => {
            console.log(JSON.stringify(result));
            process.exit(result.outcome === 'native-wire-complete' ? 0 : 1);
          });
          PROBE
          timeout 25s mise exec -- node "$probe_path"
      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}
