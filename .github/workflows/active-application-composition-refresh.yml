name: Active Application Composition Refresh
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  stage-hostnames:
    name: Inspect the failing stage module hostname routing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: stage-edge
      deployment: false
    steps:
      - name: Inspect the configured provider DNS and Access destinations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          base='https://api.cloudflare.com/client/v4'
          zone='5f2fa51dab472aea051ce9d1bc3555bd'
          account='e8608e0073bff00c7875f171ac38b8c6'
          endpoints=[('dns','/zones/'+zone+'/dns_records?per_page=100'),('zone-access','/zones/'+zone+'/access/apps'),('account-access','/accounts/'+account+'/access/apps')]
          for label,path in endpoints:
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(request,timeout=12) as response: data=json.load(response)
                  if label=='dns':
                      records=[{k:x.get(k) for k in ['id','name','type','content','proxied','ttl']} for x in data.get('result',[]) if 'ontos-stage' in x.get('name','') or x.get('name')=='*.bleeding.dev']
                  else:
                      records=[{k:x.get(k) for k in ['id','name','domain','type','destinations','self_hosted_domains']} for x in data.get('result',[]) if 'ontos' in x.get('name','').lower() or 'ontos' in x.get('domain','')]
                  print(json.dumps({'kind':label,'success':data.get('success'),'records':records}))
              except urllib.error.HTTPError as error:
                  data=json.load(error)
                  print(json.dumps({'kind':label,'httpStatus':error.code,'errors':data.get('errors')}))
          PYTHON
