name: Apply reviewed match and claim serialization fixes

on:
  push:
    branches:
      - docs/party-registry-foundations

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Apply reviewed-match and claim-lock fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          party_path = Path('app/docs/architecture/PARTY_REGISTRY.md')
          party = party_path.read_text()

          old_start = '''  begin canonical transaction
            lock/reuse Action idempotency anchor
            resolve every qualifying strong identifier claim
            partition them into resolved Party claims and unclaimed claims
          '''
          new_start = '''  begin CoreSDK-owned canonical transaction
            lock/reuse Action idempotency anchor
            acquire deterministic transaction-scoped locks for every qualifying claim key
            resolve every qualifying strong identifier claim
            partition them into resolved Party claims and unclaimed claims
          '''
          if old_start in party:
              party = party.replace(old_start, new_start, 1)
          elif new_start not in party:
              raise SystemExit('Party transaction start did not match')

          party = party.replace(
              '''      acquire every compatible unclaimed strong claim for that Party
                conflict means restart claim resolution in a fresh transaction
          ''',
              '''      attach every compatible unclaimed strong claim to that Party
                uniqueness is protected by the already-held claim-key locks
          ''',
              1,
          )
          party = party.replace(
              '''    reserve every unclaimed qualifying claim for one prospective Party identity
              conflict means restart claim resolution in a fresh transaction
          ''',
              '''    reserve every unclaimed qualifying claim for one prospective Party identity
              uniqueness is protected by the already-held claim-key locks
          ''',
              1,
          )

          marker = '''```

          A preflight fuzzy search may improve user experience, but the transaction repeats every invariant
          read against the Party Registry operational store. A result from Core Search is never sufficient to
          create, match, or reject a Party.
          '''
          inserted = '''```

          CoreSDK opens the one canonical transaction and constructs an owner-local
          `PartyIdentifierClaimService` bound to it. Before reading claims, the service sorts every normalized
          claim key and acquires transaction-scoped database locks in that deterministic order. An equivalent
          conflict-tolerant single-transaction primitive is acceptable only when it provides the same observable
          serialization. The service then reads or attaches claims without exposing a database executor and
          without allowing the handler to begin, commit, roll back, or retry a transaction.

          A competing Action waits for the same claim-key locks and then observes the committed owner before it
          decides. A uniqueness conflict after those locks indicates a broken invariant, not an instruction for
          the business handler to open a fresh transaction. Database unavailability or an indeterminate commit
          follows the existing Core-owned Action reconciliation lifecycle.

          A preflight fuzzy search may improve user experience, but the transaction repeats every invariant
          read against the Party Registry operational store. A result from Core Search is never sufficient to
          create, match, or reject a Party.
          '''
          if marker in party:
              party = party.replace(marker, inserted, 1)
          elif inserted not in party:
              raise SystemExit('Claim service insertion marker did not match')

          old_resolution = '''A case whose strong claims resolve to one or several existing Parties must instead match an existing
          Party, correct/retract/reassign the wrong claim through an authorized Party Correction and then match,
          confirm duplicate existing Parties for the separate merge flow, request evidence, or dismiss the input
          as not representing a subject. Every resolution re-enters the atomic Party Create/Match boundary and
          repeats claim resolution; the case decision alone never bypasses uniqueness.

          Creating or reusing the case and its AMBIGUOUS Party Match Decision is a committed successful Action
          outcome. Resolution is a separate Action. Repeated identical evidence reuses the prior open or
          resolved case unless a new fact, policy version, or Candidate meaning changes the decision input.
          '''
          new_resolution = '''A case whose strong claims resolve to one or several existing Parties must instead match an existing
          Party, correct/retract/reassign the wrong claim through an authorized Party Correction and then match,
          confirm duplicate existing Parties for the separate merge flow, request evidence, or dismiss the input
          as not representing a subject.

          `MATCH_EXISTING` consumes an explicit canonical `selectedPartyRef`; it does not rerun ordinary matching
          without the review decision:

          ```text
          ResolveDuplicateCandidateMatch(caseRef, selectedPartyRef, expectedRevision)
            begin CoreSDK-owned canonical transaction
              lock the open case and selected canonical Party
              reject stale case revision, cross-Tenant Party, Party Alias, or closed case
              acquire deterministic locks for every qualifying Candidate claim key
              resolve all claims and re-evaluate authoritative conflicts

              if any qualifying claim is owned by a different Party
                reject ClaimOwnedByDifferentParty

              attach every compatible unclaimed claim to selectedPartyRef
              insert accepted compatible assertions on selectedPartyRef
              close the case as MATCH_EXISTING
              persist a new MATCHED PartyMatchDecision linked to this resolution Action
              return MATCHED_EXISTING(selectedPartyRef, decisionRef)

            commit case resolution, assertions, claims, Action evidence,
              Domain Events, Outbox Messages, and invocation success atomically
          ```

          A weak-evidence case with no strong claims may still be resolved to the selected Party when the
          Identity Reviewer has the required authority and the current Match Rule permits reviewed matching. The
          explicit selection is part of the resolution Action input and evidence; it is never inferred again from
          the unchanged Candidate.

          `CREATE_NEW` uses a separate resolution Action with no selected Party. It acquires the same claim-key
          locks, repeats canonical claim resolution, and may create only when every qualifying claim is still
          unclaimed or the approved no-strong-identifier policy applies. The case decision alone never bypasses
          uniqueness.

          Creating or reusing the case and its AMBIGUOUS Party Match Decision is a committed successful Action
          outcome. Resolution is a separate Action. Repeated identical evidence reuses the prior open or
          resolved case unless a new fact, policy version, or Candidate meaning changes the decision input.
          '''
          if old_resolution in party:
              party = party.replace(old_resolution, new_resolution, 1)
          elif new_resolution not in party:
              raise SystemExit('Reviewed match block did not match')

          party_path.write_text(party)

          adr_path = Path('docs/adr/0018-party-registry-operational-boundaries.md')
          adr = adr_path.read_text()

          old_steps = '''2. resolves exact active identity claims from the Party Registry operational store and
             partitions them into resolved Party claims and unclaimed claims;
          3. creates or reuses a Duplicate Candidate case when resolved claims point to several Parties or
             authoritative evidence conflicts;
          4. when all resolved claims point to one Party, validates every remaining authoritative fact and
             atomically acquires every compatible unclaimed claim for that Party before returning it;
          5. when no claim resolves, acquires or conflicts on every type-specific uniqueness claim before
             creating one Party and its accepted initial assertions;
          6. restarts canonical claim resolution after a concurrent claim conflict instead of trusting a stale
             preflight result;
          7. stores one Party Match Decision linked to the Action Invocation and resulting Party or case.
          '''
          new_steps = '''2. asks a CoreSDK-constructed owner-local claim service to lock every normalized strong-claim key in
             deterministic order inside the one Core-owned transaction;
          3. resolves exact active claims from the Party Registry operational store and partitions them into
             resolved Party claims and unclaimed claims;
          4. creates or reuses a Duplicate Candidate case when resolved claims point to several Parties or
             authoritative evidence conflicts;
          5. when all resolved claims point to one Party, validates every remaining authoritative fact and
             atomically attaches every compatible unclaimed claim to that Party before returning it;
          6. when no claim resolves, reserves every type-specific uniqueness claim before creating one Party and
             its accepted initial assertions;
          7. stores one Party Match Decision linked to the Action Invocation and resulting Party or case.
          '''
          if old_steps in adr:
              adr = adr.replace(old_steps, new_steps, 1)
          elif new_steps not in adr:
              raise SystemExit('ADR claim steps did not match')

          old_para = '''Core Search, Neo4j, caches, and other projections are never used to enforce identity uniqueness.
          Weak-signal matching may rank candidates, but it cannot replace the transactional exact-claim
          invariant. Creating a Party without a strong identifier is an explicit policy path and may require an
          Identity Reviewer. A Duplicate Candidate resolution may authorize `CREATE_NEW` only after a canonical
          transactional recheck proves all qualifying strong claims are unclaimed. Claims already owned by an
          existing Party must be matched, explicitly corrected/reassigned, or resolved through the duplicate
          existing-Party flow; authoritative evidence cannot be silently discarded to create another Party.
          '''
          new_para = '''Core Search, Neo4j, caches, and other projections are never used to enforce identity uniqueness.
          Weak-signal matching may rank candidates, but it cannot replace the transactional exact-claim
          invariant. CoreSDK owns the transaction and supplies the owner-local claim service bound to it; the
          business handler never receives an executor and never opens, commits, rolls back, or retries a
          transaction. Contending Actions serialize on deterministic transaction-scoped claim-key locks and the
          later Action observes the committed owner.

          Creating a Party without a strong identifier is an explicit policy path and may require an Identity
          Reviewer. A Duplicate Candidate resolution may authorize `CREATE_NEW` only after a canonical
          transactional recheck proves all qualifying strong claims are unclaimed. Claims already owned by an
          existing Party must be matched, explicitly corrected/reassigned, or resolved through the duplicate
          existing-Party flow; authoritative evidence cannot be silently discarded to create another Party.

          A reviewed `MATCH_EXISTING` decision is a dedicated Action carrying `caseRef`, `selectedPartyRef`, and
          expected case revision. Inside one Core-owned transaction it locks the case, selected Party, and every
          Candidate claim key; rejects any claim owned by another Party; attaches compatible unclaimed claims;
          closes the case; and commits a new MATCHED Party Match Decision. It does not loop through ordinary
          matching without consuming the selected Party.
          '''
          if old_para in adr:
              adr = adr.replace(old_para, new_para, 1)
          elif new_para not in adr:
              raise SystemExit('ADR claim service paragraph did not match')

          adr_path.write_text(adr)

          diagram_path = Path('docs/diagrams/party-registry-boundaries.md')
          diagram = diagram_path.read_text()
          diagram = diagram.replace(
              '''    matching[Party Matching]
              decision[Party Match Decision]
              duplicateCase[Duplicate Candidate Case]
              reviewer[Identity Reviewer]
          ''',
              '''    matching[Party Matching]
              claimBoundary[Atomic Party claim boundary]
              decision[Party Match Decision]
              duplicateCase[Duplicate Candidate Case]
              reviewer[Identity Reviewer]
              resolution[Duplicate Candidate Resolution Action]
          ''',
              1,
          )
          old_edges = '''  candidate --> matching
            matching -->|MATCHED| decision
            matching -->|NO_MATCH + atomic claim| decision
            matching -->|"AMBIGUOUS: create/reuse"| duplicateCase
            duplicateCase -->|caseRef| reviewer
            reviewer -->|resolution Action| matching
            decision -->|partyRef| party
          '''
          new_edges = '''  candidate --> matching
            matching -->|MATCHED / NO_MATCH| claimBoundary
            matching -->|"AMBIGUOUS: create/reuse"| duplicateCase
            duplicateCase -->|caseRef| decision
            duplicateCase -->|caseRef| reviewer
            reviewer -->|selected Party or create decision| resolution
            resolution -->|locked claim validation| claimBoundary
            claimBoundary -->|CREATED / MATCHED_EXISTING| decision
            decision -->|partyRef| party
          '''
          if old_edges in diagram:
              diagram = diagram.replace(old_edges, new_edges, 1)
          elif new_edges not in diagram:
              raise SystemExit('Diagram edge block did not match')

          old_key = '''- AMBIGUOUS commits one Party Match Decision and creates or reuses one Duplicate Candidate Case; it
            returns a caseRef instead of looping back to the Candidate.
          '''
          new_key = '''- AMBIGUOUS commits one Party Match Decision and creates or reuses one Duplicate Candidate Case; it
            returns a caseRef instead of looping back to the Candidate.
          - Reviewed MATCH_EXISTING and CREATE_NEW outcomes use dedicated resolution Actions that consume the
            review decision and revalidate locked canonical claims.
          '''
          if old_key in diagram:
              diagram = diagram.replace(old_key, new_key, 1)
          elif new_key not in diagram:
              raise SystemExit('Diagram key block did not match')

          diagram_path.write_text(diagram)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Run repository formatter
        working-directory: app
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Commit review fixes
        env:
          TARGET_BRANCH: docs/party-registry-foundations
        run: |
          git add \
            app/docs/architecture/PARTY_REGISTRY.md \
            docs/adr/0018-party-registry-operational-boundaries.md \
            docs/diagrams/party-registry-boundaries.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close reviewed match and claim serialization gaps"
          git push origin "HEAD:${TARGET_BRANCH}"
