name: Catalog 398 remediation workbench

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/catalog-398-workbench.yml

permissions:
  contents: read

concurrency:
  group: catalog-398-workbench
  cancel-in-progress: false

jobs:
  portable-tests:
    if: github.repository == 'TechsioCZ/ontos' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/catalog-398-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact remediation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.7.0'
      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566
      - name: Install the frozen workspace
        working-directory: app
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Package only installed public dependencies and toolchain
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog-398-portable
          cp -a "$(mise where node)" /tmp/catalog-398-portable/node
          cp -a "$(mise where pnpm)" /tmp/catalog-398-portable/pnpm
          cd ..
          find app -name node_modules -type d -prune -print0 > /tmp/catalog-398-dependency-paths
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' --null -czf /tmp/catalog-398-dependencies.tar.gz -T /tmp/catalog-398-dependency-paths
          tar -C /tmp -czf /tmp/catalog-398-toolchain.tar.gz catalog-398-portable
          git archive --format=tar.gz HEAD > /tmp/catalog-398-source.tar.gz
          git rev-parse HEAD > /tmp/catalog-398-source-revision.txt
          sha256sum /tmp/catalog-398-*.tar.gz
          du -h /tmp/catalog-398-*.tar.gz
      - name: Publish portable test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-398-portable-test-inputs
          path: |
            /tmp/catalog-398-dependencies.tar.gz
            /tmp/catalog-398-toolchain.tar.gz
            /tmp/catalog-398-source.tar.gz
            /tmp/catalog-398-source-revision.txt
          compression-level: 0
          retention-days: 1
