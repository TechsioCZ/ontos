name: Apply Party documentation formatting

on:
  push:
    branches:
      - docs/party-registry-foundations

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  format-party-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Install dependencies and run repository formatter
        working-directory: app
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Commit formatter output
        env:
          TARGET_BRANCH: docs/party-registry-foundations
        run: |
          git add \
            app/README.md \
            app/docs/architecture/PARTY_REGISTRY.md \
            app/docs/integrations/ares.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Party Registry documentation"
          git push origin "HEAD:${TARGET_BRANCH}"
