name: Initial Application Composition Cutover

# Disposable diagnostic branch: read metadata with the same sealed stage-edge credentials.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment whose provider credentials are checked.
        type: choice
        options: [stage]
        default: stage
      inventory-file:
        description: Reviewed stage inventory under app/topology, relative to app.
        type: string
        required: true
        default: topology/initial-composition-execution.stage.json

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  credential-probe:
    name: Read reviewed provider metadata with the sealed stage credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    concurrency:
      group: zerops-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      EXECUTION_INVENTORY_FILE: ${{ inputs.inventory-file }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
    steps:
      - name: Checkout the diagnostic revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read provider status without exposing credentials or response bodies
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          account = "e8608e0073bff00c7875f171ac38b8c6"
          namespace = "d51f044c49bc4757a5613c61b19b46d8"
          project = "t1ljmn3DRDafgi8AuPvhdQ"
          service = "CtExzcDCTVCzKt5mMZhuRA"
          workers = (
              "app-assortment", "app-catalog", "app-commerce-customer-context",
              "app-commerce-market-catalog", "app-inventory", "app-party-registry",
              "app-payment-term-catalog", "app-price-group-catalog", "app-pricing",
              "app-shell-super-app", "app-storefront-registry",
          )
          path = "topology/initial-composition-execution.stage.json"
          inventory = json.loads(Path("app", path).read_text())
          if (
              os.environ.get("EXECUTION_INVENTORY_FILE") != path
              or inventory["environment"] != "stage"
              or inventory["cloudflare"]["accountId"] != account
              or inventory["cloudflare"]["compositionPointer"]["namespaceId"] != namespace
              or tuple(item["name"] for item in inventory["cloudflare"]["workers"]) != workers
              or tuple(item["serviceId"] for item in inventory["zerops"]) != (service,)
          ):
              print(json.dumps({"probe": "inventory", "status": 0, "errorCodes": []}))
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def probe(label, url, token, read_namespace=False):
              record = {"probe": label, "status": 0, "errorCodes": []}
              if read_namespace:
                  record["namespaceConfirmed"] = False
              response = None
              try:
                  if not token:
                      raise ValueError()
                  request = urllib.request.Request(
                      url, method="GET", headers={"Authorization": "Bearer " + token}
                  )
                  try:
                      response = opener.open(request, timeout=15)
                  except urllib.error.HTTPError as error:
                      response = error
                  record["status"] = response.status
                  # Executable Worker GET bodies are never consumed, even on errors.
                  if read_namespace:
                      body = response.read(65537)
                      if len(body) <= 65536:
                          envelope = json.loads(body)
                          if isinstance(envelope, dict):
                              errors = envelope.get("errors", [])
                              if isinstance(errors, list):
                                  record["errorCodes"] = [
                                      item["code"] for item in errors
                                      if isinstance(item, dict) and type(item.get("code")) is int
                                  ][:16]
                              result = envelope.get("result")
                              record["namespaceConfirmed"] = (
                                  isinstance(result, dict) and result.get("id") == namespace
                              )
              except Exception:
                  # Never print exception text, headers, bodies, or credential values.
                  pass
              finally:
                  if response is not None:
                      response.close()
              print(json.dumps(record, separators=(",", ":")))

          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          cf_base = "https://api.cloudflare.com/client/v4/accounts/" + account
          probe("cloudflare.namespace", cf_base + "/storage/kv/namespaces/" + namespace, cf_token, True)
          for worker in workers:
              probe("cloudflare.worker." + worker, cf_base + "/workers/scripts/" + worker, cf_token)
          zerops_token = os.environ.get("ZEROPS_TOKEN", "")
          zerops_base = "https://api.app-prg1.zerops.io/api/rest/public"
          probe("zerops.project", zerops_base + "/project/" + project, zerops_token)
          probe("zerops.old-service", zerops_base + "/service-stack/" + service, zerops_token)
          PY
