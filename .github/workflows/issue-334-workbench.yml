name: Issue 334 isolated repair workbench

on:
  push:
    branches: [audit/334-repair-workbench]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verified-source:
    if: github.ref == 'refs/heads/audit/334-repair-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_INSECURE: 'true'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Check out isolated workbench and its comparison baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository toolchain
        uses: ./.github/actions/install-app
      - name: Apply repairs and generate append-only migration
        run: |
          python3 .github/issue-334-repair.py
          python3 .github/issue-334-test-refinements.py
      - name: Format and lint every changed product file
        working-directory: app
        run: |
          mkdir -p /tmp/issue-334-proof
          git add -- .
          git diff --cached --name-only --diff-filter=ACM --relative dd4d0cfbbf8b68f8ed2a6e2cbe93fccdf293e166 > /tmp/issue-334-proof/changed-files.txt
          xargs -r mise exec -- pnpm exec oxfmt --no-error-on-unmatched-pattern < /tmp/issue-334-proof/changed-files.txt
          xargs -r mise exec -- pnpm exec oxlint --fix --no-error-on-unmatched-pattern < /tmp/issue-334-proof/changed-files.txt
          xargs -r mise exec -- pnpm exec oxfmt --no-error-on-unmatched-pattern < /tmp/issue-334-proof/changed-files.txt
          git add -- .
      - name: Start isolated database services
        working-directory: app
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify clean installation including the new migration
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm --filter @app/price-group-catalog db:check
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify
      - name: Verify focused regressions and owner contracts
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/commerce-customer-context exec rstest run --project unit tests/unit/price-group-currentness-regressions.test.ts 2>&1 | tee /tmp/issue-334-proof/commerce-regressions.log
          mise exec -- pnpm --filter @app/price-group-catalog exec rstest run --project integration tests/integration/price-group-currentness-regressions.test.ts tests/integration/governed-routine-behavior.test.ts 2>&1 | tee /tmp/issue-334-proof/catalog-regressions.log
          mise exec -- pnpm exec rstest run --project scripts scripts/tests/zerops-migrator-owner-coverage.test.mts 2>&1 | tee /tmp/issue-334-proof/deployment-regressions.log
          mise exec -- pnpm typecheck 2>&1 | tee /tmp/issue-334-proof/typecheck.log
          mise exec -- pnpm format:check 2>&1 | tee /tmp/issue-334-proof/format.log
          xargs -r mise exec -- pnpm exec oxlint --no-error-on-unmatched-pattern < /tmp/issue-334-proof/changed-files.txt 2>&1 | tee /tmp/issue-334-proof/changed-lint.log
      - name: Export exact product source for connector publication
        if: always()
        run: |
          mkdir -p /tmp/issue-334-proof
          git add -- app
          git diff --cached --binary dd4d0cfbbf8b68f8ed2a6e2cbe93fccdf293e166 -- app > /tmp/issue-334-proof/product.patch
          git diff --cached --stat dd4d0cfbbf8b68f8ed2a6e2cbe93fccdf293e166 -- app > /tmp/issue-334-proof/product-stat.txt
          tree=$(git write-tree)
          git archive --format=tar --output=/tmp/issue-334-proof/product-source.tar "$tree" app
          git status --short > /tmp/issue-334-proof/worktree-status.txt
      - name: Keep verification logs and exact source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-334-verified-source
          path: /tmp/issue-334-proof
          retention-days: 3
      - name: Remove isolated services
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans
