name: Issue 334 isolated repair workbench

on:
  push:
    branches: [audit/334-repair-workbench]

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/334-repair-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Check out the isolated workbench
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Archive committed source only
        run: git archive --format=tar --output=/tmp/ontos-source.tar HEAD
      - name: Export committed source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-334-source
          path: /tmp/ontos-source.tar
          retention-days: 1
