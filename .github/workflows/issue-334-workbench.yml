name: Issue 334 isolated repair workbench

on:
  push:
    branches: [audit/334-repair-workbench]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runtime-access-proof:
    if: github.ref == 'refs/heads/audit/334-repair-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_INSECURE: 'true'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: 32754af4798a438aabb56a72ae1b5db7aeb720a9
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: 32754af4798a438aabb56a72ae1b5db7aeb720a9
          fetch-depth: 0
      - name: Install repository toolchain
        uses: ./.github/actions/install-app
      - name: Format and lint the four access-repair files
        working-directory: app
        run: |
          mkdir -p /tmp/issue-334-acl
          git diff --name-only --relative 625c8328f06b428621c66c0d95fdbfd55c4d47cb HEAD -- . > /tmp/issue-334-acl/changed-files.txt
          xargs -r mise exec -- pnpm exec oxfmt < /tmp/issue-334-acl/changed-files.txt
          xargs -r mise exec -- pnpm exec oxlint --fix < /tmp/issue-334-acl/changed-files.txt 2>&1 | tee /tmp/issue-334-acl/lint.log
          xargs -r mise exec -- pnpm exec oxfmt < /tmp/issue-334-acl/changed-files.txt
      - name: Start isolated database services
        working-directory: app
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Migrate and verify the full fresh database
        working-directory: app
        run: |
          mise exec -- pnpm db:migrate 2>&1 | tee /tmp/issue-334-acl/migrations.log
          mise exec -- pnpm db:verify 2>&1 | tee /tmp/issue-334-acl/schema-verification.log
      - name: Prove missing privileges, exact runtime calls, RLS and negative readiness controls
        working-directory: app
        run: mise exec -- pnpm exec rstest run --project integration scripts/integration/migrator-runtime-owner-access.test.mts 2>&1 | tee /tmp/issue-334-acl/runtime-access.log
      - name: Typecheck the complete workspace
        working-directory: app
        run: mise exec -- pnpm typecheck 2>&1 | tee /tmp/issue-334-acl/typecheck.log
      - name: Export exact reviewed source
        if: always()
        run: |
          mkdir -p /tmp/issue-334-acl
          git add -- app
          git diff --cached --binary HEAD -- app > /tmp/issue-334-acl/format.patch
          tree=$(git write-tree)
          git archive --format=tar --output=/tmp/issue-334-acl/access-repair.tar "$tree" app/scripts/postgres/bootstrap-runtime-role.mts app/scripts/integration/migrator-runtime-owner-access.test.mts app/verticals/pricing/scripts/verify-db-schema.mts app/verticals/storefront-registry/scripts/verify-db-schema.mts
          echo "$tree" > /tmp/issue-334-acl/verified-tree.txt
      - name: Keep verification logs and exact source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-334-runtime-access-proof
          path: /tmp/issue-334-acl
          retention-days: 3
      - name: Remove isolated services
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans
