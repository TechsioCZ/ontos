name: Issue 334 isolated repair workbench

on:
  push:
    branches: [audit/334-repair-workbench]

permissions:
  contents: read

jobs:
  red-proof:
    if: github.ref == 'refs/heads/audit/334-repair-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_INSECURE: 'true'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Check out isolated baseline and regression tests
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        uses: ./.github/actions/install-app
      - name: Start fresh PostgreSQL and SpiceDB
        working-directory: app
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Apply the unchanged main database migrations
        working-directory: app
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify
      - name: Confirm the regressions fail against the unchanged implementation
        working-directory: app
        run: |
          mkdir -p /tmp/issue-334-proof
          expect_failure() {
            name="$1"; shift
            set +e
            mise exec -- "$@" 2>&1 | tee "/tmp/issue-334-proof/$name.log"
            code=${PIPESTATUS[0]}
            set -e
            printf '%s exit=%s\n' "$name" "$code" | tee -a /tmp/issue-334-proof/results.txt
            if [[ "$code" == 0 ]]; then
              echo "::error::Expected an implementation regression for $name"
              exit 1
            fi
          }
          expect_failure commerce-red pnpm --filter @app/commerce-customer-context exec rstest run --project unit tests/unit/price-group-currentness-regressions.test.ts
          expect_failure catalog-red pnpm --filter @app/price-group-catalog exec rstest run --project integration tests/integration/price-group-currentness-regressions.test.ts
          expect_failure deployment-red pnpm exec rstest run --project scripts scripts/tests/zerops-migrator-owner-coverage.test.mts
      - name: Typecheck the added regressions
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/commerce-customer-context typecheck
          mise exec -- pnpm --filter @app/price-group-catalog typecheck
      - name: Keep bounded proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-334-red-proof
          path: /tmp/issue-334-proof
          retention-days: 3
      - name: Remove isolated services
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans
