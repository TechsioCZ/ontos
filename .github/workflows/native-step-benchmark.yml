name: Native step benchmark
on:
  push:
    branches: [ci/native-parallel-steps-20261007]
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: 035e1ea04e305b20be82c8402e2c55be62ee4abd
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 035e1ea04e305b20be82c8402e2c55be62ee4abd
          persist-credentials: false
      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
      - name: Record benchmark identity
        run: |
          git rev-parse HEAD
          uname -a
          nproc
          free -m
          echo "image=$ImageOS/$ImageVersion runner=$RUNNER_NAME"
          printf 'pair\tmode\twall_ns\n' > "$RUNNER_TEMP/native-step-benchmark.tsv"
      - name: Warm-up Validate the root lefthook config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: app/node_modules/.bin/lefthook validate

      - name: Warm-up Skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm skills:check

      - name: Warm-up I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: Warm-up Database Access Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm database-access:check

      - name: Warm-up Lean Core Dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm lean-core:check

      - name: Warm-up Workspace Contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm contract:check

      - name: Warm-up Module Contract Generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm check:module-contracts

      - name: Warm-up Action Unit Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm action:test:unit

      - name: Start pair 1 serial
        id: p1_serial
        run: echo "start=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Pair 1 serial Validate the root lefthook config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_0.time" app/node_modules/.bin/lefthook validate

      - name: Pair 1 serial Skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_1.time" mise exec -- pnpm skills:check

      - name: Pair 1 serial I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_2.time" mise exec -- pnpm i18n:boundaries

      - name: Pair 1 serial Database Access Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_3.time" mise exec -- pnpm database-access:check

      - name: Pair 1 serial Lean Core Dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_4.time" mise exec -- pnpm lean-core:check

      - name: Pair 1 serial Workspace Contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_5.time" mise exec -- pnpm contract:check

      - name: Pair 1 serial Module Contract Generation
