        run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_serial_7.time" mise exec -- pnpm action:test:unit

      - name: Finish pair 5 serial
        if: ${{ always() }}
        env:
          START: ${{ steps.p5_serial.outputs.start }}
        run: |
          end=$(date +%s%N)
          printf '5\tserial\t%s\n' "$((end - START))" >> "$RUNNER_TEMP/native-step-benchmark.tsv"
      - name: Start pair 5 parallel
        id: p5_parallel
        run: echo "start=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - parallel:
          - name: Pair 5 parallel Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_0.time" app/node_modules/.bin/lefthook validate

          - name: Pair 5 parallel Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_1.time" mise exec -- pnpm skills:check

          - name: Pair 5 parallel I18n Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_2.time" mise exec -- pnpm i18n:boundaries

          - name: Pair 5 parallel Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_3.time" mise exec -- pnpm database-access:check

          - name: Pair 5 parallel Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_4.time" mise exec -- pnpm lean-core:check

          - name: Pair 5 parallel Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_5.time" mise exec -- pnpm contract:check

          - name: Pair 5 parallel Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_6.time" mise exec -- pnpm check:module-contracts

          - name: Pair 5 parallel Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: /usr/bin/time -v -o "$RUNNER_TEMP/p5_parallel_7.time" mise exec -- pnpm action:test:unit

      - name: Finish pair 5 parallel
        if: ${{ always() }}
        env:
          START: ${{ steps.p5_parallel.outputs.start }}
        run: |
          end=$(date +%s%N)
          printf '5\tparallel\t%s\n' "$((end - START))" >> "$RUNNER_TEMP/native-step-benchmark.tsv"
      - name: Publish benchmark measurements
        if: always()
        run: |
          cat "$RUNNER_TEMP/native-step-benchmark.tsv"
          cat "$RUNNER_TEMP"/p*.time
      - name: Preserve benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-step-benchmark
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-step-benchmark.tsv
            ${{ runner.temp }}/p*.time
