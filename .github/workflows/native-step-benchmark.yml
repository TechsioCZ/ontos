        working-directory: app
        run: /usr/bin/time -v -o "$RUNNER_TEMP/p1_serial_7.time" mise exec -- pnpm action:test:unit

      - name: Finish pair 1 serial
        if: ${{ always() }}
        env:
          START: ${{ steps.p1_serial.outputs.start }}
        run: |
          end=$(date +%s%N)
          printf '1\tserial\t%s\n' "$((end - START))" >> "$RUNNER_TEMP/native-step-benchmark.tsv"
