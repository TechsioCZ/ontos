name: Quality Audit

# This stays a separate workflow. Do not fold it into Ultramodern Workspace Gates.
# Wall clock, last 100 runs on main (80 successes): min 2.8, p50 5.0, p90 6.8, max 7.2 min, zero over 10.
# It blocks nothing and duplicates no gates work: `lint:suppressions` and `quality:audit` appear in neither
# ultramodern-workspace-gates.yml nor scripts/ci-matrices.json. Folding it in would spend its ~6 machine-minutes
# on the same 20 concurrent hosted runners as the gates and would turn audit reports into findings of
# "Workspace gates", a merge-policy change rather than a speed-up.
#
# Repository-root documentation is outside the audited app/ workspace.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  push:
    # No demo/sales-crm: on the demo trunk this workflow enforces nothing, so it cannot catch a real failure.
    branches:
      - main
      - stage
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: app

concurrency:
  group: quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: Quality Audit Reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare fresh report directory
        id: prepare
        run: |
          rm -rf -- .codex/reports/quality-audit
          mkdir -p .codex/reports/quality-audit

      - name: Install the app workspace without lifecycle scripts
        uses: ./.github/actions/install-app
        with:
          install-args: --ignore-scripts
          mise-env: "false"

      # No self-test step (`pnpm quality:audit:test`, 32-51 s): every file it names is a
      # `scripts/tests/*.test.mts`, which the gates' Repository Tooling Tests rows already run in full.
      # A broken runner still cannot report clean: the integrity step below reads summary.json and
      # fails closed on an absent, empty or truncated summary (quality-audit-gate.test.mts).
      - name: Report lint suppressions
        run: mise exec -- pnpm lint:suppressions

      # Findings succeed; invalid or incomplete analysis fails visibly.
      - name: Audit unused code, duplication, and complexity
        id: audit
        run: mise exec -- pnpm quality:audit --output .codex/reports/quality-audit

      - name: Validate report integrity
        run: mise exec -- pnpm quality:audit:gate --summary .codex/reports/quality-audit/summary.json

      - name: Publish job summary
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          if [[ -f .codex/reports/quality-audit/summary.md ]]; then
            cat .codex/reports/quality-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Quality audit did not produce a summary. Check the failed or cancelled steps; no clean result is implied.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: ${{ always() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.codex/reports/quality-audit/
          # The dedicated generated report directory is beneath hidden .codex/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
