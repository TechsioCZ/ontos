name: Quality Audit

# This stays a separate workflow. Do not fold it into Ultramodern Workspace Gates.
# Wall clock, last 100 runs (80 successes): min 2.8, p50 5.0, p90 6.8, max 7.2 min, zero over 10.
# It is already inside the 10-minute target and blocks nothing.
# It duplicates no gates work: `lint:suppressions` and `quality:audit` each appear zero times in
# ultramodern-workspace-gates.yml and in scripts/ci-matrices.json, and both scripts exist only here.
# Folding it in would spend its ~6 machine-minutes competing for the same 20 concurrent hosted
# runners that set the blocking gate's wall-clock floor, and would promote audit findings into
# "Workspace gates", the single required status check -- a merge-policy change, not a speed-up.
#
# No `branches:` filter on pull_request either. Measured base refs over the last 100 pull requests:
# main 60, demo/sales-crm 25, stacked bases 15 (tax-907/* 11, codex/* 4). An allowlist of main and
# demo/sales-crm would drop this workflow from those 15 stacked pull requests, where new code lands
# first, and save zero wall clock on any pipeline because this one runs beside the gates.
#
# Repository-root documentation is outside the audited app/ workspace.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  push:
    branches:
      - main
      - stage
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: app

concurrency:
  group: quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: Quality Audit Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare fresh report directory
        id: prepare
        run: |
          rm -rf -- .codex/reports/quality-audit
          mkdir -p .codex/reports/quality-audit

      - name: Install the app workspace without lifecycle scripts
        uses: ./.github/actions/install-app
        with:
          install-args: --ignore-scripts
          mise-env: "false"

      # `pnpm quality:audit:test` runs eight `scripts/tests/*.test.mts` files, which the blocking gate
      # already runs through `pnpm test:scripts` on pull requests to main, merge groups and pushes to
      # main. Every other base, such as demo/sales-crm or a stacked branch, gets no gate run, so the
      # audit runner proves itself here. A silently broken runner still cannot report clean: the gate
      # step below reads summary.json and fails closed.
      - name: Verify audit runner and gate behavior where the blocking gate does not run
        if: ${{ !((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        run: mise exec -- pnpm quality:audit:test

      - name: Hold lint suppressions at the committed baseline
        run: mise exec -- pnpm lint:suppressions

      # Findings succeed; invalid or incomplete analysis fails visibly.
      - name: Audit unused code, duplication, and complexity
        id: audit
        run: mise exec -- pnpm quality:audit --output .codex/reports/quality-audit

      - name: Enforce calibrated quality guardrails
        run: mise exec -- pnpm quality:audit:gate --summary .codex/reports/quality-audit/summary.json

      - name: Publish job summary
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          if [[ -f .codex/reports/quality-audit/summary.md ]]; then
            cat .codex/reports/quality-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Quality audit did not produce a summary. Check the failed or cancelled steps; no clean result is implied.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: ${{ always() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.codex/reports/quality-audit/
          # The dedicated generated report directory is beneath hidden .codex/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
