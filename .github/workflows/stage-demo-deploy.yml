name: Stage Demo Deploy

# Deploys the sales demo branch to stage (Cloudflare Workers + the Zerops outbox host). The plan hashes every
# served unit's inputs (app/scripts/ci/deploy-plan.mts) and only units whose digest changed build, each on its
# own runner. The release job holds the stage lock from the start: it prepares the database while the builds
# run, streams each finished unit's upload, publishes the Application Composition, then deploys the prebuilt
# outbox host next to the Shell ingress, rebrand and AKROS storefront. Unchanged units keep their live Workers
# through the receipts of the stage-release-ledger artifact.
# Pushes run only while the repository variable STAGE_DEMO_CI_DEPLOY is 'true'; a dispatch deploys when its
# deploy input is on and otherwise builds every unit. force_full (or the STAGE_DEMO_FORCE_FULL variable)
# rebuilds every unit and runs the full sealed database chain.
on:
  push:
    branches:
      - demo/sales-crm
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and publish after building (off = build every unit only, stage untouched).
        type: boolean
        default: false
      force_full:
        description: Rebuild and upload every unit, deploy the host and run the full sealed database chain.
        type: boolean
        default: false
      outbox_only:
        description: Retry the outbox host only when this exact revision is already the successful stage-edge release.
        type: boolean
        default: false
      continue_migrated_publication:
        description: Continue the completed migration from incident run 40252598522 through the full publication path.
        type: boolean
        default: false
      retired_composition_revision:
        description: Exact bare lowercase 64-hex revision of the migrated composition retired by incident run 40252598522.
        type: string
        default: ''
      profile_recovery_mode:
        description: Operator-only recovery of one existing profile operation. Does not build, migrate or deploy.
        type: choice
        options:
          - none
          - check
          - reconcile
        default: none
      profile_recovery_transition:
        description: Which admitted owner operation the recovery inspects or reconciles.
        type: choice
        options:
          - ensure-retail-customer-profile
          - party-customer-enroll
        default: ensure-retail-customer-profile
      profile_recovery_request:
        description: Exact reviewed operation identity as JSON (profile also takes expected journal revisions). No credentials or customer data.
        type: string
        default: ''
      profile_recovery_approval_sha256:
        description: For reconcile only, the exact approval digest returned by the read-only check.
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run deploys at a time; a newer push replaces a run that is still waiting.
concurrency:
  group: stage-demo-deploy
  cancel-in-progress: false

env:
  WORKERS_DEV_SUBDOMAIN: edution
  STAGE_SHELL_URL: https://ontos-stage.bleeding.dev
  STAGE_ZONE: bleeding.dev
  STAGE_STOREFRONT_CATALOG_KV_ID: 24a10598d6154b7aa788fd5b8fc449a7
  STAGE_STOREFRONT_URL: https://ontos-stage-akros.bleeding.dev

jobs:
  # An operator command, not a replacement release or a new worker artifact. It calls only the
  # original owner's native recovery contract and never changes the published build identity.
  profile-recovery:
    name: Inspect or reconcile one admitted profile operation
    if: github.event_name == 'workflow_dispatch' && inputs.profile_recovery_mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
    steps:
      - name: Require an isolated manual operator request on demo
        env:
          RECOVERY_MODE: ${{ inputs.profile_recovery_mode }}
          RECOVERY_TRANSITION: ${{ inputs.profile_recovery_transition }}
          APPROVAL_SHA256: ${{ inputs.profile_recovery_approval_sha256 }}
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          CONTINUE_MIGRATED: ${{ inputs.continue_migrated_publication }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/demo/sales-crm || "$DEPLOY" != false ||
                "$OUTBOX_ONLY" != false || "$CONTINUE_MIGRATED" != false ||
                ( "$RECOVERY_MODE" != check && "$RECOVERY_MODE" != reconcile ) ]]; then
            echo '::error::Profile recovery requires an isolated manual demo/sales-crm request with deployment disabled' >&2
            exit 1
          fi
          if [[ ( "$RECOVERY_MODE" == reconcile && ! "$APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ) ||
                ( "$RECOVERY_MODE" == check && -n "$APPROVAL_SHA256" ) ]]; then
            echo '::error::Only reconcile accepts and requires the exact read-only approval digest' >&2
            exit 1
          fi
          if [[ "$RECOVERY_TRANSITION" != ensure-retail-customer-profile && "$RECOVERY_TRANSITION" != party-customer-enroll ]]; then
            echo '::error::Profile recovery supports only its reviewed owner transitions' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Test the bounded operator command before stage access
        working-directory: app
        run: >-
          mise exec -- pnpm test:scripts
          scripts/tests/recover-admitted-retail-profile.test.mts
          scripts/tests/recover-admitted-customer-directory.test.mts
          scripts/tests/stage-profile-recovery-workflow.test.mts

      - name: Connect the operator to the private database network
        id: recovery-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Load existing database identity credentials without changing them
        timeout-minutes: 5
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ops/database-identities.mts
          --github-environment-file "$GITHUB_ENV"

      - name: Run only the exact admitted profile recovery
        timeout-minutes: 2
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          ONTOS_STAGE_PROFILE_RECOVERY_MODE: ${{ inputs.profile_recovery_mode }}
          ONTOS_STAGE_PROFILE_RECOVERY_REQUEST_JSON: ${{ inputs.profile_recovery_request }}
          ONTOS_STAGE_PROFILE_RECOVERY_APPROVAL_SHA256: ${{ inputs.profile_recovery_approval_sha256 }}
          ONTOS_STAGE_PROFILE_RECOVERY_SOURCE_REVISION: ${{ github.sha }}
          RECOVERY_TRANSITION: ${{ inputs.profile_recovery_transition }}
        run: |
          ONTOS_SHELL_GATEWAY_BASE_URL="$(jq -er '."commerce-customer-context".ONTOS_SHELL_GATEWAY_BASE_URL | select(type == "string" and length > 0)' <<<"$ALL_RELEASE_SECRETS")"
          ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY="$(jq -er '."commerce-customer-context".ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY | select(type == "string" and length > 0)' <<<"$ALL_RELEASE_SECRETS")"
          unset ALL_RELEASE_SECRETS
          masked_key="${ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY//%/%25}"
          masked_key="${masked_key//$'\r'/%0D}"
          masked_key="${masked_key//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$masked_key"
          unset masked_key
          export ONTOS_SHELL_GATEWAY_BASE_URL ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY
          case "$RECOVERY_TRANSITION" in
            ensure-retail-customer-profile)
              mise exec -- pnpm exec node verticals/commerce-customer-context/scripts/recover-admitted-retail-profile.mts
              ;;
            party-customer-enroll)
              mise exec -- pnpm exec node verticals/commerce-customer-context/scripts/recover-admitted-customer-directory.mts
              ;;
            *)
              echo '::error::Unsupported profile recovery transition' >&2
              exit 1
              ;;
          esac

      - name: Clear only the operator runner's private network
        if: always() && steps.recovery-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.recovery-vpn.outputs.state-directory }}
          cli-path: ${{ steps.recovery-vpn.outputs.cli-path }}

  # Hashes every served unit's inputs and decides what this run builds. It reads the release secrets and the
  # fingerprint key only to fingerprint them (HMAC): a rotated secret must re-upload its Worker.
  plan:
    name: Plan the changed units
    if: (github.event_name == 'workflow_dispatch' && !inputs.outbox_only && inputs.profile_recovery_mode == 'none') || (github.event_name == 'push' && vars.STAGE_DEMO_CI_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    permissions:
      actions: read
      contents: read
    outputs:
      units: ${{ steps.plan.outputs.units }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      build_count: ${{ steps.plan.outputs.build_count }}
      host_mode: ${{ steps.plan.outputs.host_mode }}
      host_digest: ${{ steps.plan.outputs.host_digest }}
      storefront_mode: ${{ steps.plan.outputs.storefront_mode }}
      storefront_digest: ${{ steps.plan.outputs.storefront_digest }}
      db_inputs_digest: ${{ steps.plan.outputs.db_inputs_digest }}
      db_mode: ${{ steps.plan.outputs.db_mode }}
      force_full: ${{ steps.plan.outputs.force_full }}
      # An environment variable: the builds run without the environment, so they take it from here.
      cloudflare_account_id: ${{ steps.plan.outputs.cloudflare_account_id }}
    steps:
      - name: Require a full manual deployment for migration continuation
        if: inputs.continue_migrated_publication
        env:
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$DEPLOY" != true || "$OUTBOX_ONLY" != false ||
                "$GITHUB_REF" != refs/heads/demo/sales-crm || ! "$ONTOS_RETIRED_COMPOSITION_REVISION" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Migration continuation requires a full manual demo/sales-crm deployment and an exact retired composition revision' >&2
            exit 1
          fi

      # The digests hash Git blob ids and read package manifests, tsconfigs and imports, so the plan needs the
      # whole tree but no dependency install.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup the pinned Node
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: app

      - name: Require one published UI kit version
        working-directory: app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const workspace = readFileSync('pnpm-workspace.yaml', 'utf8');
          const catalogVersion = workspace.match(/^catalog:\n  '@techsio\/ui-kit': (\S+)$/m)?.[1];
          assert.ok(catalogVersion, 'UI kit must have one default catalog version');
          const lock = readFileSync('pnpm-lock.yaml', 'utf8');
          const versions = [...new Set([...lock.matchAll(/^  '@techsio\/ui-kit@([^'(:\s]+)[^\n]*:/gm)].map(match => match[1]))];
          assert.deepEqual(versions, [catalogVersion], `UI kit lockfile versions: ${versions.join(', ')}`);
          console.log(`Every UI kit resolution uses published ${catalogVersion}`);
          NODE

      # Live state decides reuse: a unit is retained only when the ledger receipt's Workers are still active.
      # A build-only dispatch builds every unit, so its artifacts are reusable by the next deploy.
      - name: Plan the changed units from their input digests
        id: plan
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          RELEASE_FINGERPRINT_KEY: ${{ secrets.RELEASE_FINGERPRINT_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Unit digest inputs (deploy-plan.mts DIGEST_ENV_KEYS): the build and release jobs set the same values.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TARGET: cloudflare
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_DISABLE_BUILD_TS_CHECKER: '1'
          # Storefront digest inputs (deploy-plan.mts STOREFRONT_ENV_KEYS): the storefront build and the release's
          # plan check set the same literals. Unset, the plan could not reuse a storefront build.
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
          STAGE_DEMO_FORCE_FULL: ${{ vars.STAGE_DEMO_FORCE_FULL }}
          FORCE_FULL: ${{ inputs.force_full == true || (github.event_name == 'workflow_dispatch' && !inputs.deploy) }}
        run: |
          args=(plan --output "$RUNNER_TEMP/deploy-plan/deploy-plan.json")
          if [[ "$FORCE_FULL" == true ]]; then
            args+=(--force-full)
          fi
          mkdir -p "$RUNNER_TEMP/deploy-plan"
          mise exec -- node scripts/ci/deploy-plan.mts "${args[@]}"
          printf 'cloudflare_account_id=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >>"$GITHUB_OUTPUT"

      - name: Upload the deploy plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-plan
          path: ${{ runner.temp }}/deploy-plan/deploy-plan.json
          if-no-files-found: error
          retention-days: 14

  # Building runs dependency code, so build jobs get no environment and no deploy credentials. They trust the
  # lockfile: release-script-tests runs this run's one supply-chain policy check, and the release job, which
  # holds the secrets, runs its own.
  build:
    name: Build ${{ matrix.unit.id }}
    needs: [plan]
    if: needs.plan.outputs.build_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    env:
      UNIT_ID: ${{ matrix.unit.id }}
      UNIT_PACKAGE: ${{ matrix.unit.package }}
      UNIT_PATH: ${{ matrix.unit.path }}
      ONTOS_UNIT_INPUT_DIGEST: ${{ matrix.unit.digest }}
      # The plan's HMAC of the unit's release secrets, so inputs.json recomputes the digest without any secret.
      ONTOS_UNIT_SECRET_FINGERPRINT: ${{ matrix.unit.secretFingerprint }}
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
      # Unit digest inputs, as the plan computed them. The account is a stage-edge environment variable, which this
      # job without an environment cannot read. The explicit TS-Go reference build type-checks the unit, so the
      # bundler's checker is off.
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.plan.outputs.cloudflare_account_id }}
      DEPLOY_TARGET: cloudflare
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      ULTRAMODERN_DISABLE_BUILD_TS_CHECKER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # The unit's own TS-Go reference build, else main's whole-workspace build: TS-Go rechecks every changed file.
      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile
          restore-typescript-build: 'true'
          typescript-build-unit: ${{ matrix.unit.id }}

      # Checks the unit's digest against the plan, plans the release origin, builds the unit's TS-Go reference graph,
      # builds and verifies it for Cloudflare, writes inputs.json and packs $RUNNER_TEMP/edge-unit.tar.zst.
      - name: Build and verify the unit for Cloudflare
        run: bash app/scripts/ci/build-edge-unit.sh

      - name: Save the unit's TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      # The name carries the input digest, so a later run with the same digest re-uploads this exact output.
      - name: Upload the unit's build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-unit-${{ matrix.unit.id }}-${{ matrix.unit.digest }}
          path: ${{ runner.temp }}/edge-unit.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # The outbox host ships as a prebuilt musl artifact, so the Zerops push only deploys it.
  build-outbox-host:
    name: Build the outbox host
    needs: [plan]
    if: needs.plan.outputs.host_mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build the host in Alpine
        env:
          ONTOS_OUTBOX_HOST_DIGEST: ${{ needs.plan.outputs.host_digest }}
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          docker run --rm \
            --env ONTOS_OUTBOX_HOST_DIGEST --env ULTRAMODERN_SOURCE_REVISION --env RUNNER_TEMP=/runner-temp \
            --volume "$GITHUB_WORKSPACE:/src" --volume "$RUNNER_TEMP:/runner-temp" --workdir /src \
            alpine:3.23 sh app/scripts/ci/build-outbox-host.sh
          ls -lh "$RUNNER_TEMP/outbox-host.tar.zst"

      - name: Upload the host artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outbox-host-${{ needs.plan.outputs.host_digest }}
          path: ${{ runner.temp }}/outbox-host.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # The release scripts decide what reaches stage, so the release job waits for these tests (barrier B1)
  # before its first stage change. They start with the plan and run this run's one full supply-chain
  # policy install, which also saves the branch's pnpm store.
  release-script-tests:
    name: Test the release scripts
    if: (github.event_name == 'workflow_dispatch' && !inputs.outbox_only && inputs.profile_recovery_mode == 'none') || (github.event_name == 'push' && vars.STAGE_DEMO_CI_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          save-store: 'true'

      # Includes topology-only sources (availability): a per-built-unit check is not a release-wide gate.
      - name: Check all Shell UI candidates
        working-directory: app
        run: mise exec -- pnpm shell:ui-candidates:check

      - name: Run the immutable release tests
        working-directory: app
        run: >-
          mise exec -- pnpm exec rstest --project scripts
          scripts/tests/immutable-application-release.test.mts
          scripts/tests/immutable-shell-release.test.mts
          scripts/tests/stage-demo-deploy-workflow.test.mts
          scripts/tests/deploy-plan.test.mts
          scripts/tests/generate-shell-ui-candidates.test.mts
          scripts/tests/deployment-build-inputs.test.mts
          scripts/tests/release-stream.test.mts
          scripts/tests/database-state-fingerprint.test.mts
          scripts/tests/await-outbox-admission.test.mts
          scripts/tests/materialize-zerops-environment.test.mts
          scripts/tests/rebrand-rental-demo.test.mts
          scripts/tests/prepare-stage-release-secrets.test.mts
          scripts/tests/stage-demo-migrate.test.mts
          scripts/tests/stage-deploy-diagnostics.test.mts
          scripts/tests/application-composition-authority-publication.test.mts
          scripts/tests/application-composition-release-lifecycle.test.mts
          scripts/tests/bootstrap-runtime-role.test.mts
          scripts/tests/application-db-owner-verification.test.mts
          scripts/tests/database-login-roles.test.mts
          scripts/tests/enrollment-recovery-host-config.test.mts
          scripts/tests/recover-admitted-retail-profile.test.mts
          scripts/tests/recover-admitted-customer-directory.test.mts
          scripts/tests/stage-profile-recovery-workflow.test.mts
          scripts/tests/verify-stage-migration-continuation.test.mts
          scripts/tests/prepare-stage-customer.test.mts
          scripts/tests/typecheck-project-references.test.mts
          scripts/tests/database-identity-environment.test.mts
          scripts/tests/cloudflare-data-plane-bindings.test.mts
          scripts/tests/generate-zerops-provider-deployment.test.mts
          scripts/tests/outbox-worker-delivery.test.mts
          scripts/tests/reconcile-stage-service-grants.test.mts
          scripts/tests/verification-context.test.mts
          scripts/tests/mcp-proof-transport.test.mts

      # Reject missing protected bindings before the release changes stage. This check has no
      # provider/database credentials and removes its private bundle on every exit.
      # Release still prepares and validates its own fresh bundle under the deployment lock.
      - name: Check release secret bindings before deployment builds
        if: github.event_name == 'push' || inputs.deploy
        timeout-minutes: 3
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
        run: |
          umask 077
          directory=""
          cleanup() {
            if [[ -n "$directory" ]]; then
              rm -f -- "$directory/bundle.json"
              rmdir -- "$directory"
            fi
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          directory="$(mktemp -d "$RUNNER_TEMP/stage-release-secrets.XXXXXX")"
          chmod 700 "$directory"
          mise exec -- node scripts/prepare-stage-release-secrets.mts --output-file "$directory/bundle.json"

  build-storefront:
    name: Build akros-storefront
    needs: [plan]
    if: needs.plan.outputs.storefront_mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      # These four build literals are storefront digest inputs: the plan and the release plan check set the same values.
      - name: Build the storefront Worker
        working-directory: app/akros-storefront
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
        run: |
          mise exec -- pnpm run cloudflare:build
          tar --create --zstd --file "$RUNNER_TEMP/storefront.tar.zst" .open-next .wrangler.generated.json
          ls -lh "$RUNNER_TEMP/storefront.tar.zst"

      - name: Upload the storefront build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akros-storefront-${{ needs.plan.outputs.storefront_digest }}
          path: ${{ runner.temp }}/storefront.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # Identity bootstrap, migrations, edge publication, outbox and storefront deployment hold one lock shared with the
  # composition refresh. The job records the stage-edge deployment, so the refresh re-publishes this revision.
  # It starts with the plan: database preparation overlaps the builds, it waits for the release script tests
  # (barrier B1) before its first stage change, and it uploads each unit as soon as that unit's build succeeds.
  # Everything the outbox host deploy can prepare happens before publication; after it only the host configuration
  # apply and the deploy-only push run, beside the Shell ingress, rebrand and storefront.
  release:
    name: Deploy, publish and activate stage
    needs: [plan]
    if: >-
      always() && !cancelled() &&
      ((needs.plan.result == 'success' && (github.event_name == 'push' || inputs.deploy)) ||
       (github.event_name == 'workflow_dispatch' && inputs.outbox_only && inputs.profile_recovery_mode == 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stage-edge
    permissions:
      actions: read
      contents: read
      deployments: read
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_LOGIN_ROLE_POLICY: reconcile
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      DEPLOY_TARGET: cloudflare
      # A unit digest input: the digest checks recompute with the plan's value.
      ULTRAMODERN_DISABLE_BUILD_TS_CHECKER: '1'
      OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: topology/initial-composition-execution.stage.json
      # Unit digests fingerprint the secrets and database identities with this key. Missing, every digest
      # check fails closed and the database takes the full sealed chain.
      RELEASE_FINGERPRINT_KEY: ${{ secrets.RELEASE_FINGERPRINT_KEY }}
      UNITS_JSON: ${{ needs.plan.outputs.units }}
      DB_INPUTS_DIGEST: ${{ needs.plan.outputs.db_inputs_digest }}
      DB_MODE: ${{ needs.plan.outputs.db_mode }}
    steps:
      # Release scripts require a clean Git checkout, so everything this job writes lives in the runner temp.
      - name: Name the release files in the runner temp
        run: |
          {
            echo "ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE=$RUNNER_TEMP/initial-composition-cutover/initial-composition-cutover-receipt.json"
            echo "CANDIDATE_FILE=$RUNNER_TEMP/composition-candidate/active-application-composition-candidate.json"
            echo "RECEIPTS=$RUNNER_TEMP/release-receipts"
            echo "PLAN_FILE=$RUNNER_TEMP/deploy-plan/deploy-plan.json"
            echo "STREAM_DIRECTORY=$RUNNER_TEMP/release-stream"
            echo "LEDGER_DIRECTORY=$RUNNER_TEMP/stage-release-ledger"
          } >>"$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require the exact published revision for an outbox-only retry
        if: inputs.outbox_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=""
          while IFS=$'\t' read -r id sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')"
            if [[ "$state" == success ]]; then published="$sha"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=stage-edge&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          if [[ -z "$published" || "$published" != "$GITHUB_SHA" ]]; then
            echo "::error title=Revision mismatch::outbox-only retries require this exact revision to be the published stage-edge release; run a full hardened release instead" >&2
            exit 1
          fi

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # Only Projects may be added, from native shared bindings and derived public JWKS.
      # The private directory transfers to the final cleanup step only after preparation succeeds.
      # Outbox-only retries need this too: native recovery check/apply always consume the file.
      - name: Prepare the runner-only immutable release secret bundle
        id: release-secrets
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
        run: |
          umask 077
          directory=""
          cleanup() {
            if [[ -n "$directory" ]]; then
              rm -f -- "$directory/bundle.json" "$directory/raw.json"
              rmdir -- "$directory"
            fi
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          directory="$(mktemp -d "$RUNNER_TEMP/stage-release-secrets.XXXXXX")"
          chmod 700 "$directory"
          mise exec -- node scripts/prepare-stage-release-secrets.mts --output-file "$directory/bundle.json"
          # Unit digests fingerprint the stored secrets, before Projects is derived, exactly as the plan job did.
          printf '%s' "$ALL_RELEASE_SECRETS" >"$directory/raw.json"
          printf 'directory=%s\npath=%s/bundle.json\nraw-path=%s/raw.json\n' "$directory" "$directory" "$directory" >>"$GITHUB_OUTPUT"
          trap - EXIT HUP INT TERM

      # Check the whole served inventory before VPN access, database preparation or provider writes.
      # This remains fail-closed after the bounded Projects-only preparation.
      - name: Validate the complete immutable release secret inventory
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { NodeServices } from '@effect/platform-node';
          import { Effect, Redacted, Schema } from 'effect';
          import { OntosDeploymentAppIdSchema } from './packages/core-runtime/src/modules/manifest.ts';
          import { ApplicationReleaseIntentSchema } from './scripts/application-release-intent.mts';
          import { workerReleaseSecretNames, workerSecretPlan } from './scripts/ops/cloudflare-stage-cutover.mts';
          import { readEdgeUnits } from './scripts/ops/stage-edge-units.mts';

          const failures = [];
          const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          try {
            const intent = Schema.decodeUnknownSync(Schema.fromJsonString(ApplicationReleaseIntentSchema))(
              readFileSync('topology/application-release-intent.json', 'utf-8'),
            );
            const ids = ['shell-super-app', ...intent.modules.map(module => module.appId)];
            const selected = Schema.decodeUnknownSync(Schema.fromJsonString(
              Schema.Array(Schema.Struct({ id: OntosDeploymentAppIdSchema })),
            ))(process.env.UNITS_JSON);
            const selectedIds = selected.map(unit => unit.id);
            if (new Set(ids).size !== ids.length ||
                selectedIds.length !== ids.length || new Set(selectedIds).size !== ids.length ||
                ids.some(id => !selectedIds.includes(id))) {
              failures.push('planned units do not match the complete served release inventory');
            }
            const units = await Effect.runPromise(readEdgeUnits.pipe(Effect.provide(NodeServices.layer)));
            const served = units.filter(unit => ids.includes(unit.id));
            if (served.length !== ids.length || new Set(served.map(unit => unit.id)).size !== ids.length) {
              failures.push('served release inventory is not completely placed in the native topology');
            }
            // Values are unused: only the native planner's binding names are inspected.
            const nameOnly = Redacted.make('name-projection-only');
            const hostname = new URL(process.env.STAGE_SHELL_URL).hostname;
            const plan = workerSecretPlan(served, { shellHostname: hostname, stageZone: process.env.STAGE_ZONE }, {
              betterAuthSecret: nameOnly,
              commerceCustomerContextGatewayApiKey: nameOnly,
              commerceMarketCatalogGatewayApiKey: nameOnly,
              crmPartyIntakeApiKey: nameOnly,
              gatewayPrivateJwk: nameOnly,
              gatewayPublicJwks: nameOnly,
              pricingGatewayApiKey: nameOnly,
              spicedbPresharedKey: nameOnly,
            });
            const bundle = JSON.parse(readFileSync(process.env.ALL_RELEASE_SECRETS_FILE, 'utf-8'));
            if (!isRecord(bundle)) {
              failures.push('DEMO_IMMUTABLE_RELEASE_SECRETS must be a JSON owner record');
            } else {
              for (const unit of served) {
                const owner = Object.hasOwn(bundle, unit.id) ? bundle[unit.id] : undefined;
                if (!isRecord(owner)) {
                  failures.push(`${unit.id}: missing or invalid owner secret object`);
                  continue;
                }
                for (const key of workerReleaseSecretNames(unit, plan.get(unit.workerName), owner)) {
                  if (!Object.hasOwn(owner, key) || typeof owner[key] !== 'string' || owner[key].trim() === '') {
                    failures.push(`${unit.id}.${key}: missing or invalid required binding`);
                  }
                }
                if (Object.values(owner).some(value => typeof value !== 'string' || value.trim() === '')) {
                  failures.push(`${unit.id}: secret bindings must all be non-empty strings`);
                }
              }
            }
          } catch {
            // Parser and schema errors can contain their input. Do not render them.
            failures.push('release secret inventory or topology could not be decoded');
          }
          delete process.env.ALL_RELEASE_SECRETS_FILE;
          const message = failures.length === 0
            ? 'Complete served release secret inventory validated. No secret values printed.'
            : `Release secret inventory rejected before stage mutation:\n${failures.join('\n')}`;
          console.log(message);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          if (failures.length !== 0) {
            console.error('::error title=Incomplete release secret inventory::See the name-only inventory diagnostics');
            process.exitCode = 1;
          }
          NODE

      # Read-only source/provenance gate before connecting to stage or changing any database identity.
      - name: Verify the completed migration incident and reviewed continuation source
        if: inputs.continue_migrated_publication
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_MIGRATED_PUBLICATION: ${{ inputs.continue_migrated_publication }}
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: mise exec -- pnpm exec node scripts/verify-stage-migration-continuation.mts

      - name: Download the deploy plan
        if: ${{ !inputs.outbox_only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-plan
          path: ${{ runner.temp }}/deploy-plan

      # The plan job's digests decide what is reused; the same planner at this clean checkout must agree with
      # every one of them before anything reaches stage. The ledger carries every still-valid earlier record.
      - name: Recompute the deploy plan at the clean checkout
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.raw-path }}
          # The storefront digest inputs, exactly as the plan job and the storefront build set them.
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
        run: |
          mise exec -- node scripts/ci/deploy-plan.mts verify --plan "$PLAN_FILE"
          mkdir -p "$LEDGER_DIRECTORY"
          mise exec -- node scripts/ci/release-ledger.mts init --plan "$PLAN_FILE" --output "$LEDGER_DIRECTORY/stage-release-ledger.json"

      # An outbox-only retry deploys the trusted prebuilt host artifact of this exact published revision's host
      # digest, never a new build: a revision without one needs a full release.
      - name: Plan the outbox host of the published revision
        if: inputs.outbox_only
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.raw-path }}
        run: |
          digest="$(mise exec -- node scripts/ci/deploy-plan.mts host-digest)"
          mkdir -p "$(dirname "$PLAN_FILE")"
          mise exec -- pnpm exec node scripts/ci/release-stream.mts host-plan --digest "$digest" --output "$PLAN_FILE"

      # Every upload takes the composition publication advisory lock in the stage database.
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      # Read-only: reuse existing sensitive migrator secrets. A missing dedicated secret stops the release.
      - name: Load the dedicated database identity credentials
        timeout-minutes: 5
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ops/database-identities.mts
          --github-environment-file "$GITHUB_ENV"

      # Read-only: fail before database preparation if the canonical owner configuration cannot
      # start recovery. Missing host copies are planned additions, never replacement credentials.
      - name: Validate canonical enrollment recovery host configuration
        timeout-minutes: 2
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts check

      # Advisory only: live pending work may drain, and initial/sealed releases still need their
      # authoritative native guards. Unknown diagnostics fail before any identity or schema mutation.
      - name: Inspect migration readiness before database preparation
        id: migration-readiness
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 2
        working-directory: app
        run: |
          status=0
          mise exec -- pnpm exec node scripts/stage-demo-migrate.mts --readiness \
            >"$RUNNER_TEMP/stage-migration-readiness.json" || status=$?
          node --input-type=module - "$RUNNER_TEMP/stage-migration-readiness.json" "$status" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { Schema } from 'effect';
          import { ApplicationCompositionReadinessSchema, migratedRevisionForSchemaRetry } from './scripts/application-composition-authority-publication.mts';
          import { formatStageDeployDiagnostic } from './scripts/stage-deploy-diagnostics.mts';

          const [path, exitCode] = process.argv.slice(2);
          let input;
          for (const line of readFileSync(path, 'utf8').split(/\r?\n/u)) {
            try {
              const candidate = JSON.parse(line);
              if (candidate?.advisoryOnly === true) input = candidate;
            } catch {
              // Runtime error rendering is not an authoritative readiness record.
            }
          }
          let result;
          let reportedByCommand = false;
          try {
            result = Schema.decodeUnknownSync(ApplicationCompositionReadinessSchema)(input);
            reportedByCommand = true;
          } catch {
            result = { advisoryOnly: true, reason: 'diagnostic-unavailable', status: 'unknown' };
          }
          // The command already emits its canonical diagnostic. Only a missing/invalid record
          // needs a fallback here, otherwise the step would append a second, incomplete summary.
          if (!reportedByCommand) {
            const formatted = formatStageDeployDiagnostic({
              migrationsCompleted: false,
              migrationStarted: false,
              phase: 'readiness',
              reason: result.reason,
              status: 'unknown',
            });
            console.error(formatted.stderr);
            console.error(formatted.annotation);
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, formatted.summary);
            }
          }
          const guardedRetry = exitCode === '1' &&
            ['pending-work', 'authority-missing', 'authority-sealed'].includes(result.reason);
          const retryRevision = migratedRevisionForSchemaRetry(result, Number(exitCode));
          if (retryRevision !== undefined && process.env.GITHUB_OUTPUT) {
            appendFileSync(process.env.GITHUB_OUTPUT, `resume-migrated-revision=${retryRevision}\n`);
          }
          const guardedSchemaRetry = retryRevision !== undefined && Boolean(process.env.GITHUB_OUTPUT);
          if (!(result.status === 'ready' && exitCode === '0') && !guardedRetry && !guardedSchemaRetry) process.exitCode = 1;
          NODE

      # Read-only. The sealed chain is skipped only when the authority is active, every login authenticates and
      # the live catalog fingerprint equals the one recorded after the last successful preparation of these
      # exact database inputs and identities. Any doubt, a schema retry or a forced run takes the full chain.
      - name: Decide the database preparation path
        id: database-path
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 3
        working-directory: app
        env:
          # The same identities the sealed chain and the recorded fingerprint cover.
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          RESUME_MIGRATED_REVISION: ${{ steps.migration-readiness.outputs.resume-migrated-revision }}
        run: |
          record="$RUNNER_TEMP/previous-database-record.json"
          jq -c '.database // empty' "$LEDGER_DIRECTORY/stage-release-ledger.json" >"$record"
          args=(--plan --inputs-digest "$DB_INPUTS_DIGEST" --database-record "$record")
          if [[ "$DB_MODE" != auto || -n "$RESUME_MIGRATED_REVISION" ]]; then
            args+=(--force-full)
          fi
          status=0
          mise exec -- pnpm exec node scripts/stage-demo-migrate.mts "${args[@]}" >"$RUNNER_TEMP/database-plan.json" || status=$?
          mise exec -- pnpm exec node scripts/ci/release-stream.mts database-path \
            --database-plan "$RUNNER_TEMP/database-plan.json" --exit-code "$status" >>"$GITHUB_OUTPUT"

      # Barrier B1: nothing changes stage until the release script tests of this run have passed.
      - name: Wait for the release script tests
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 15
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm exec node scripts/ci/release-stream.mts await --job 'Test the release scripts' --timeout-seconds 840

      # Uploads only create immutable release Workers; nothing serves them until publication. The stream starts right
      # after barrier B1 and runs in the background beside the database preparation: it verifies every retained
      # unit's live Workers against its ledger receipt, fetches and unpacks each unit as soon as its build job
      # succeeds, and fails as soon as any expected build fails (barrier B2). No unit uploads before the start file
      # exists: at once on the database light path, after the sealed migrations otherwise. Eight upload at a time
      # (Cloudflare API rate limits). Owner secrets reach each upload only through its environment.
      - name: Start the unit upload stream
        id: uploads
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          RAW_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.raw-path }}
          DATABASE_MODE: ${{ steps.database-path.outputs.mode }}
        run: |
          mkdir -p "$RECEIPTS" "$RUNNER_TEMP/upload-logs" "$STREAM_DIRECTORY"
          if [[ "$DATABASE_MODE" == light ]]; then
            touch "$STREAM_DIRECTORY/start"
          fi
          (
            status=0
            mise exec -- pnpm exec node scripts/ci/release-stream.mts stream \
              --plan "$PLAN_FILE" --receipts "$RECEIPTS" --logs "$RUNNER_TEMP/upload-logs" \
              --state "$STREAM_DIRECTORY/units.json" --start-file "$STREAM_DIRECTORY/start" \
              --stop-file "$STREAM_DIRECTORY/stop" --parallelism 8 --timeout-seconds 2700 \
              >"$STREAM_DIRECTORY/stream.log" 2>&1 || status=$?
            printf '%s\n' "$status" >"$STREAM_DIRECTORY/exit-code"
          ) </dev/null >/dev/null 2>&1 &
          echo "Streaming the uploads in the background (process $!)"

      # Both paths: the bootstrap reconciles the mutable gateway trust mapping, which the catalog fingerprint
      # deliberately leaves out (scripts/ci/database-preparation-inputs.json audit).
      - name: Bootstrap every database identity before migrations
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 10
        working-directory: app
        run: mise exec -- pnpm db:bootstrap-runtime-role

      # The stage provider quiescence was proven when stage first cut over (operator receipt, 2026-10-22).
      - name: Write the initial cutover receipt
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication && steps.database-path.outputs.mode == 'full' }}
        working-directory: app
        run: |
          mkdir -p "$(dirname "$ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE")"
          printf '%s' '{"environment":"stage","inventorySha256":"40ec38189570c5e41abcfb1852b47e9d167902d2490c89a28bac432adbac6ae0","schemaVersion":"2","verifiedAt":"2026-10-22T01:51:15.913Z"}' \
            >"$ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE"

      # Native durable drain and committed sealing precede the complete workspace db:migrate chain, which ends
      # with db:verify. The runner-local child inherits the stage identities, including the Commerce portal
      # runtime/admin pair. Failure keeps the native fence and stops the release before any upload or publication.
      # Exact-published-revision outbox retries cannot seal: they do not publish a replacement composition.
      - name: Migrate every owner schema
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication && steps.database-path.outputs.mode == 'full' }}
        timeout-minutes: 20
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          RESUME_MIGRATED_REVISION: ${{ steps.migration-readiness.outputs.resume-migrated-revision }}
        run: |
          args=()
          if [[ -n "$RESUME_MIGRATED_REVISION" ]]; then
            args+=(--resume-migrated-revision "$RESUME_MIGRATED_REVISION")
          fi
          mise exec -- pnpm exec node scripts/stage-demo-migrate.mts "${args[@]}"

      # This read-only native guard takes the publication lock and requires the exact migrated authority.
      - name: Continue publication of the completed owner migration
        if: inputs.continue_migrated_publication && !inputs.outbox_only
        timeout-minutes: 5
        working-directory: app
        env:
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: mise exec -- pnpm exec node scripts/stage-demo-migrate.mts --continue-publication

      # The sealed chain ends with db:verify. The light path skips that chain and a continuation never ran it in this
      # release, so both verify here; a failed verification also leaves no preparation record.
      - name: Verify every migrated owner schema
        if: ${{ !inputs.outbox_only && (inputs.continue_migrated_publication || steps.database-path.outputs.mode == 'light') }}
        timeout-minutes: 10
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm db:verify

      # From here every unit uploads as soon as its build output is unpacked. The full path keeps its strict order: no
      # upload before the sealed chain (or the continuation's verification) succeeded. The light path, which runs no
      # migration, already allowed the uploads when the stream started.
      - name: Upload every immutable release Worker
        if: ${{ !inputs.outbox_only }}
        run: touch "$STREAM_DIRECTORY/start"

      # Reuse the native service TLS secrets and existing VPN; no GitHub secret copies or key rotation. One --apply
      # reads every grant, writes only what is missing and reads the result back.
      - name: Reconcile storefront, Commerce and Privacy service grants
        timeout-minutes: 10
        working-directory: app
        env:
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          # The job's composition URL is the Cloudflare KV REST value endpoint, which needs a bearer token.
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_URL: ${{ env.STAGE_SHELL_URL }}
          # Only whole secrets are masked; a field read with fromJSON would print in the step's env block.
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          BETTER_AUTH_SECRET="$(jq -er '."shell-super-app".BETTER_AUTH_SECRET' <<<"$ALL_RELEASE_SECRETS")"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          export BETTER_AUTH_SECRET
          unset ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/demo/reconcile-stage-service-grants.mts --zerops --apply

      # Recorded after the grants, so the next run compares its live catalogs with the state this run left.
      - name: Record the prepared database fingerprint
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 3
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: >-
          mise exec -- pnpm exec node scripts/postgres/database-state-fingerprint.mts
          --inputs-digest "$DB_INPUTS_DIGEST" --output "$RUNNER_TEMP/database-record.json"

      # Barrier B2 for the outbox host and the storefront, and everything their deploys can prepare before
      # publication. A host or storefront this run builds must have built: the old host cannot admit the new owner
      # build markers, so a failed host build stops the release before publication. Kept ones come from the plan.
      - name: Fetch the outbox host build output
        timeout-minutes: 30
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise exec -- pnpm exec node scripts/ci/release-stream.mts fetch
          --plan "$PLAN_FILE" --artifact outbox-host --output "$RUNNER_TEMP/outbox-host"

      - name: Fetch the storefront build output
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 30
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise exec -- pnpm exec node scripts/ci/release-stream.mts fetch
          --plan "$PLAN_FILE" --artifact akros-storefront --output "$RUNNER_TEMP/storefront"

      # Zerops rejects a build file over 50 kB, so the deploy reads only the outbox host's setup.
      - name: Materialize the stage outbox host zerops.yaml
        working-directory: app
        env:
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.outbox.yaml
        run: |
          mise exec -- pnpm --silent zerops:materialize-environment --environment stage --input zerops.yaml --setup outbox-worker-host --output "$ZEROPS_YAML_PATH"
          wc -c "$ZEROPS_YAML_PATH"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      # The host always redeploys after the configuration apply: Zerops resolves native secret references outside the
      # materialized configuration, so no live digest can prove the running configuration current. This names the
      # artifact the push deploys and the revision it was built from.
      - name: Name the outbox host release
        id: host-release
        working-directory: app
        run: mise exec -- pnpm exec node scripts/ci/release-stream.mts host-release --plan "$PLAN_FILE" >>"$GITHUB_OUTPUT"

      # A failed or cancelled step between the stream's start and this join stops it: no waiting unit starts (not even
      # one already unpacked at the start gate), and the job waits only for the uploads already running, so none is
      # cut off halfway and a cancelled run does not hold the stage lock until the stream's deadline.
      - name: Stop the unit uploads after a failed release step
        if: (failure() || cancelled()) && steps.uploads.outcome == 'success'
        run: touch "$STREAM_DIRECTORY/stop"

      - name: Wait for every unit upload
        if: always() && steps.uploads.outcome == 'success'
        timeout-minutes: 45
        working-directory: app
        run: mise exec -- pnpm exec node scripts/ci/release-stream.mts join --directory "$STREAM_DIRECTORY" --timeout-seconds 2640

      - name: Assemble the composition candidate
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        run: |
          receipts=()
          while IFS= read -r id; do
            receipts+=(--receipt-file "$RECEIPTS/$id.json")
          done < <(jq -r '.modules[].appId' topology/application-release-intent.json)
          mkdir -p "$(dirname "$CANDIDATE_FILE")"
          mise exec -- pnpm exec node scripts/immutable-application-release.mts candidate \
            --intent-file topology/application-release-intent.json "${receipts[@]}" \
            --shell-receipt-file "$RECEIPTS/shell-super-app.json" \
            --candidate-file "$CANDIDATE_FILE"

      # Publishing from an active authority drains the old composition itself.
      - name: Publish the Application Composition
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 20
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm active-composition:publish publish --environment stage --candidate-file "$CANDIDATE_FILE"

      # A created or removed host secret reaches the running host through the redeploy that always follows.
      - name: Provision canonical enrollment recovery host configuration
        timeout-minutes: 5
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts apply
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts verify

      # Runs beside the Shell ingress, rebrand and storefront: a deploy-only Zerops push of the host artifact fetched
      # before publication.
      - name: Start the outbox worker host deploy
        id: host-start
        env:
          UNITS_JSON: '["outbox-worker-host"]'
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZCLI_PATH: ${{ steps.composition-vpn.outputs.cli-path }}
          OUTBOX_HOST_ARTIFACT: ${{ runner.temp }}/outbox-host/outbox-host.tar.zst
          OUTBOX_HOST_DIGEST: ${{ steps.host-release.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/outbox-host-deploy" "$RUNNER_TEMP/zcli-bin"
          ln -sf -- "$ZCLI_PATH" "$RUNNER_TEMP/zcli-bin/zcli"
          export PATH="$RUNNER_TEMP/zcli-bin:$PATH"
          (
            status=0
            app/scripts/push-zerops-units.sh >"$RUNNER_TEMP/outbox-host-deploy/stream.log" 2>&1 || status=$?
            printf '%s\n' "$status" >"$RUNNER_TEMP/outbox-host-deploy/exit-code"
          ) </dev/null >/dev/null 2>&1 &
          echo "Deploying the outbox host in the background (process $!)"

      - name: Archive the candidate and receipts
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-demo-release
          path: |
            ${{ runner.temp }}/composition-candidate
            ${{ runner.temp }}/release-receipts
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the per-unit upload logs
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-logs
          path: ${{ runner.temp }}/upload-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize the upload phases
        if: always() && !inputs.outbox_only
        run: |
          grep -h ' phase \|receipt written' "$RUNNER_TEMP"/upload-logs/*.log | sed -E 's/^.*(release [^ ]+ (phase|receipt))/\1/' | sort || true
          grep -h 'release CLI exit' "$RUNNER_TEMP"/upload-logs/*.log | sort | uniq -c || true

      # Checkpoint: every receipt this run wrote or verified and the database it prepared, so the next run reuses them.
      # These always run, even after a failed step, and sit in the tail beside the host deploy, not before publication.
      - name: Record the uploaded units in the release ledger
        id: ledger-units
        if: always() && !inputs.outbox_only && steps.release-secrets.outputs.directory != ''
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ci/release-stream.mts ledger
          --ledger "$LEDGER_DIRECTORY/stage-release-ledger.json"
          --state "$STREAM_DIRECTORY/units.json" --receipts "$RECEIPTS"
          --database-record "$RUNNER_TEMP/database-record.json"

      - name: Upload the release ledger checkpoint
        if: always() && steps.ledger-units.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-release-ledger
          path: ${{ runner.temp }}/stage-release-ledger/stage-release-ledger.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Activate the Shell ingress
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 20
        working-directory: app
        env:
          PREPARED_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          # A Shell kept from an earlier revision proves its inputs unchanged: its digest fingerprints the stored
          # secrets, exactly as the plan job did.
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.raw-path }}
        run: |
          export ONTOS_IMMUTABLE_RELEASE_SECRETS
          ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer '.["shell-super-app"] | select(type == "object")' "$PREPARED_SECRETS_FILE")"
          artifact="$(jq -er '.[] | select(.id == "shell-super-app") | .artifactName' "$STREAM_DIRECTORY/units.json")"
          mise exec -- pnpm exec node scripts/immutable-shell-release.mts ingress-deploy \
            --app-directory apps/shell-super-app \
            --artifact-name "$artifact" \
            --inputs-file .codex/reports/releases/shell-super-app/inputs.json \
            --receipt-file "$RECEIPTS/shell-super-app.json"

      - name: Rebrand the rental demo through the native Shell Action
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 5
        working-directory: app
        # A deliberate deployment rerun reauthorizes the convergent operation; never retry an uncertain write here.
        run: >-
          mise exec -- pnpm demo:rebrand:rental --apply --shell-url "$STAGE_SHELL_URL"
          --idempotency-key "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-najempark-v1"

      - name: Deploy the AKROS storefront
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 15
        working-directory: app/akros-storefront
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
        run: |
          tar --extract --zstd --file "$RUNNER_TEMP/storefront/storefront.tar.zst"
          mise exec -- pnpm run cloudflare:deploy

      # Joined even after a failed tail step, so the job never ends with the host deploy cut off halfway.
      - name: Push the outbox worker host
        if: always() && steps.host-start.outcome == 'success'
        timeout-minutes: 20
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ci/release-stream.mts join
          --directory "$RUNNER_TEMP/outbox-host-deploy" --timeout-seconds 1140

      # Every expected owner must report this composition revision admitted and a completed cycle after the
      # publication on the redeployed host's internal /status.
      - name: Require the new host to admit the published composition
        timeout-minutes: 5
        working-directory: app
        env:
          ZEROPS_OUTBOX_WORKER_HOST_HOSTNAME: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_HOSTNAME }}
          HOST_DIGEST: ${{ steps.host-release.outputs.digest }}
        run: |
          revision="$(curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL" \
            | jq -er '.composition.revision | select(type == "string" and test("^[a-f0-9]{64}$"))')"
          mise exec -- pnpm exec node scripts/ci/await-outbox-admission.mts \
            --revision "$revision" --host-digest "$HOST_DIGEST" --timeout 180

      - name: Record the outbox host in the release ledger
        if: ${{ !inputs.outbox_only && steps.host-release.outputs.source-revision != '' }}
        working-directory: app
        env:
          HOST_DIGEST: ${{ steps.host-release.outputs.digest }}
          HOST_SOURCE_REVISION: ${{ steps.host-release.outputs.source-revision }}
        run: >-
          mise exec -- node scripts/ci/release-ledger.mts record-host
          --ledger "$LEDGER_DIRECTORY/stage-release-ledger.json"
          --digest "$HOST_DIGEST" --source-revision "$HOST_SOURCE_REVISION"

      - name: Prepare the native demo customer fixture
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 5
        working-directory: app
        env:
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm exec node scripts/demo/prepare-stage-customer.mts

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

      # One short check, no load: the stage Workers CPU budget is capped.
      - name: Smoke the Shell login and OAuth metadata
        if: ${{ !inputs.outbox_only }}
        run: |
          check() {
            local url="$1" status
            for _ in 1 2 3 4 5; do
              status="$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 30 "$url" || true)"
              echo "$url -> $status"
              [[ "$status" == 200\ * ]] && return 0
              sleep 10
            done
            echo "::error title=Smoke failed::$url did not answer 200" >&2
            return 1
          }
          check "$STAGE_SHELL_URL/cs/login"
          check "$STAGE_SHELL_URL/.well-known/oauth-authorization-server"

      - name: Upload the final release ledger
        if: always() && steps.ledger-units.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-release-ledger
          path: ${{ runner.temp }}/stage-release-ledger/stage-release-ledger.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Remove the runner-only immutable release secret bundle
        if: always() && steps.release-secrets.outputs.directory != ''
        env:
          PREPARED_SECRETS_DIRECTORY: ${{ steps.release-secrets.outputs.directory }}
        run: |
          parent="${PREPARED_SECRETS_DIRECTORY%/*}"
          name="${PREPARED_SECRETS_DIRECTORY##*/}"
          if [[ "$parent" != "$RUNNER_TEMP" || ! "$name" =~ ^stage-release-secrets\.[A-Za-z0-9]+$ || -L "$PREPARED_SECRETS_DIRECTORY" ]]; then
            echo '::error::Refusing cleanup outside the exact runner-owned secret directory' >&2
            exit 1
          fi
          rm -f -- "$PREPARED_SECRETS_DIRECTORY/bundle.json" "$PREPARED_SECRETS_DIRECTORY/raw.json"
          if [[ -d "$PREPARED_SECRETS_DIRECTORY" ]]; then
            rmdir -- "$PREPARED_SECRETS_DIRECTORY"
          fi

  # One verification pass after every deploy, no load (the stage Workers CPU budget is capped).
  verify:
    name: Verify stage once
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      - name: Install headless Chromium for the OAuth consent screens
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install --with-deps chromium

      - name: Time /cs, OAuth metadata and the storefront home
        working-directory: app
        run: mise exec -- node scripts/ops/stage-demo-verify.mjs

      # The timing probe remains blocking, but its failure must not skip this independent browser proof.
      - name: Prove the native newsletter grant and withdrawal
        if: (success() || failure()) && !inputs.outbox_only
        working-directory: app
        env:
          AKROS_TEST_BASE_URL: ${{ env.STAGE_STOREFRONT_URL }}
          AKROS_EVIDENCE_DIR: ${{ runner.temp }}/newsletter-consent
        run: |
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node akros-storefront/tests/browser/newsletter-consent.mjs

      - name: Upload the newsletter screenshots
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsletter-consent
          path: ${{ runner.temp }}/newsletter-consent/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Prove MCP over OAuth end to end
        working-directory: app
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_OAUTH_ISSUER: ${{ env.STAGE_SHELL_URL }}/shell-super-app-api/oauth
          E2E_OUT_DIR: ${{ runner.temp }}/mcp-oauth-e2e
          E2E_SHOTS_DIR: ${{ runner.temp }}/mcp-oauth-e2e/shots
        run: |
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node scripts/demo/prove-mcp-oauth.mts --variant=1 --verification

      - name: Upload the MCP OAuth proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-oauth-e2e
          path: ${{ runner.temp }}/mcp-oauth-e2e
          if-no-files-found: ignore
          retention-days: 14
