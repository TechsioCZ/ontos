name: Stage Demo Deploy

# Deploys the sales demo branch to stage (Cloudflare Workers + the Zerops outbox host): every served unit
# builds on its own runner in parallel, then one job holding the stage lock uploads the release Workers,
# publishes the Application Composition, activates the Shell ingress and deploys the AKROS storefront.
# Pushes run only while the repository variable STAGE_DEMO_CI_DEPLOY is 'true'; a dispatch deploys when its
# deploy input is on and otherwise only builds.
on:
  push:
    branches:
      - demo/sales-crm
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and publish after building (off = build every unit only, stage untouched).
        type: boolean
        default: false
      outbox_only:
        description: Retry the outbox host only when this exact revision is already the successful stage-edge release.
        type: boolean
        default: false
      continue_migrated_publication:
        description: Continue the completed migration from incident run 40252598522 through the full publication path.
        type: boolean
        default: false
      retired_composition_revision:
        description: Exact bare lowercase 64-hex revision of the migrated composition retired by incident run 40252598522.
        type: string
        default: ''
      profile_recovery_mode:
        description: Operator-only recovery of one existing profile operation. Does not build, migrate or deploy.
        type: choice
        options:
          - none
          - check
          - reconcile
        default: none
      profile_recovery_request:
        description: Exact reviewed operation identity and expected journal revisions as JSON. No credentials or customer data.
        type: string
        default: ''
      profile_recovery_approval_sha256:
        description: For reconcile only, the exact approval digest returned by the read-only check.
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run deploys at a time; a newer push replaces a run that is still waiting.
concurrency:
  group: stage-demo-deploy
  cancel-in-progress: false

env:
  WORKERS_DEV_SUBDOMAIN: edution
  STAGE_SHELL_URL: https://ontos-stage.bleeding.dev
  STAGE_ZONE: bleeding.dev
  STAGE_STOREFRONT_CATALOG_KV_ID: 24a10598d6154b7aa788fd5b8fc449a7
  STAGE_STOREFRONT_URL: https://ontos-stage-akros.bleeding.dev

jobs:
  # An operator command, not a replacement release or a new worker artifact. It calls only the
  # original owner's native recovery contract and never changes the published build identity.
  profile-recovery:
    name: Inspect or reconcile one admitted profile operation
    if: github.event_name == 'workflow_dispatch' && inputs.profile_recovery_mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
    steps:
      - name: Require an isolated manual operator request on demo
        env:
          RECOVERY_MODE: ${{ inputs.profile_recovery_mode }}
          APPROVAL_SHA256: ${{ inputs.profile_recovery_approval_sha256 }}
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          CONTINUE_MIGRATED: ${{ inputs.continue_migrated_publication }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/demo/sales-crm || "$DEPLOY" != false ||
                "$OUTBOX_ONLY" != false || "$CONTINUE_MIGRATED" != false ||
                ( "$RECOVERY_MODE" != check && "$RECOVERY_MODE" != reconcile ) ]]; then
            echo '::error::Profile recovery requires an isolated manual demo/sales-crm request with deployment disabled' >&2
            exit 1
          fi
          if [[ ( "$RECOVERY_MODE" == reconcile && ! "$APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ) ||
                ( "$RECOVERY_MODE" == check && -n "$APPROVAL_SHA256" ) ]]; then
            echo '::error::Only reconcile accepts and requires the exact read-only approval digest' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Test the bounded operator command before stage access
        working-directory: app
        run: >-
          mise exec -- pnpm test:scripts
          scripts/tests/recover-admitted-retail-profile.test.mts
          scripts/tests/stage-profile-recovery-workflow.test.mts

      - name: Connect the operator to the private database network
        id: recovery-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Load existing database identity credentials without changing them
        timeout-minutes: 5
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ops/database-identities.mts
          --github-environment-file "$GITHUB_ENV"

      - name: Run only the exact admitted profile recovery
        timeout-minutes: 2
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          ONTOS_STAGE_PROFILE_RECOVERY_MODE: ${{ inputs.profile_recovery_mode }}
          ONTOS_STAGE_PROFILE_RECOVERY_REQUEST_JSON: ${{ inputs.profile_recovery_request }}
          ONTOS_STAGE_PROFILE_RECOVERY_APPROVAL_SHA256: ${{ inputs.profile_recovery_approval_sha256 }}
          ONTOS_STAGE_PROFILE_RECOVERY_SOURCE_REVISION: ${{ github.sha }}
        run: |
          ONTOS_SHELL_GATEWAY_BASE_URL="$(jq -er '."commerce-customer-context".ONTOS_SHELL_GATEWAY_BASE_URL | select(type == "string" and length > 0)' <<<"$ALL_RELEASE_SECRETS")"
          ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY="$(jq -er '."commerce-customer-context".ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY | select(type == "string" and length > 0)' <<<"$ALL_RELEASE_SECRETS")"
          unset ALL_RELEASE_SECRETS
          masked_key="${ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY//%/%25}"
          masked_key="${masked_key//$'\r'/%0D}"
          masked_key="${masked_key//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$masked_key"
          unset masked_key
          export ONTOS_SHELL_GATEWAY_BASE_URL ONTOS_COMMERCE_CUSTOMER_CONTEXT_GATEWAY_API_KEY
          mise exec -- pnpm exec node verticals/commerce-customer-context/scripts/recover-admitted-retail-profile.mts

      - name: Clear only the operator runner's private network
        if: always() && steps.recovery-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.recovery-vpn.outputs.state-directory }}
          cli-path: ${{ steps.recovery-vpn.outputs.cli-path }}

  plan:
    name: Plan the served units
    if: (github.event_name == 'workflow_dispatch' && !inputs.outbox_only && inputs.profile_recovery_mode == 'none') || (github.event_name == 'push' && vars.STAGE_DEMO_CI_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - name: Require a full manual deployment for migration continuation
        if: inputs.continue_migrated_publication
        env:
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$DEPLOY" != true || "$OUTBOX_ONLY" != false ||
                "$GITHUB_REF" != refs/heads/demo/sales-crm || ! "$ONTOS_RETIRED_COMPOSITION_REVISION" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Migration continuation requires a full manual demo/sales-crm deployment and an exact retired composition revision' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            app/topology
            app/pnpm-lock.yaml
            app/pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - name: Require one published UI kit version
        working-directory: app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const workspace = readFileSync('pnpm-workspace.yaml', 'utf8');
          const catalogVersion = workspace.match(/^catalog:\n  '@techsio\/ui-kit': (\S+)$/m)?.[1];
          assert.ok(catalogVersion, 'UI kit must have one default catalog version');
          const lock = readFileSync('pnpm-lock.yaml', 'utf8');
          const versions = [...new Set([...lock.matchAll(/^  '@techsio\/ui-kit@([^'(:\s]+)[^\n]*:/gm)].map(match => match[1]))];
          assert.deepEqual(versions, [catalogVersion], `UI kit lockfile versions: ${versions.join(', ')}`);
          console.log(`Every UI kit resolution uses published ${catalogVersion}`);
          NODE

      # The served set is the Shell plus every module of the release intent (what the composition publishes).
      - name: List the Shell and every released module
        id: units
        working-directory: app
        run: |
          units="$(jq -c --slurpfile intent topology/application-release-intent.json '
            ([.shell] + .verticals) as $all
            | (["shell-super-app"] + [$intent[0].modules[].appId])
            | map(. as $id | $all[] | select(.id == $id) | {id, package, path})' topology/reference-topology.json)"
          echo "units=$units" >>"$GITHUB_OUTPUT"
          jq -r '"\(length) units: \(map(.id) | join(" "))"' <<<"$units"

  # Saves the pnpm store for this lockfile on this branch, so later runs' build jobs restore it.
  warm-store:
    name: Save the pnpm store for the branch
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Locate the pnpm store
        id: store
        working-directory: app
        run: echo "path=$(mise exec -- pnpm store path)" >>"$GITHUB_OUTPUT"

      - name: Save the pnpm store under the install key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/.mise.toml', 'app/pnpm-lock.yaml') }}

  # Building runs dependency code, so build jobs get no environment and no deploy credentials.
  build:
    name: Build ${{ matrix.unit.id }}
    needs: [plan, release-script-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      UNIT_ID: ${{ matrix.unit.id }}
      UNIT_PACKAGE: ${{ matrix.unit.package }}
      UNIT_PATH: ${{ matrix.unit.path }}
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
      DEMO_DISABLE_TS_CHECKER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Plan the immutable release origin
        working-directory: app
        run: |
          mkdir -p ".codex/reports/releases/$UNIT_ID"
          if [[ "$UNIT_ID" == shell-super-app ]]; then
            mise exec -- pnpm exec node scripts/immutable-shell-release.mts plan \
              --workers-dev-subdomain "$WORKERS_DEV_SUBDOMAIN" \
              --plan-file ".codex/reports/releases/$UNIT_ID/plan.json"
          else
            mise exec -- pnpm exec node scripts/immutable-application-release.mts plan \
              --vertical "$UNIT_ID" --workers-dev-subdomain "$WORKERS_DEV_SUBDOMAIN" \
              --plan-file ".codex/reports/releases/$UNIT_ID/plan.json"
          fi

      # Project-mode checks in modern build consume declarations but do not build references.
      - name: Build the unit typecheck reference graph
        working-directory: app
        run: mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build "$UNIT_PATH/tsconfig.json"

      - name: Build and verify the unit for Cloudflare
        working-directory: app
        env:
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' ".codex/reports/releases/$UNIT_ID/plan.json")
          mise exec -- pnpm --filter "$UNIT_PACKAGE" run cloudflare:build
          mise exec -- pnpm --filter "$UNIT_PACKAGE" exec ultramodern-create ultramodern cloudflare-output-verify --app "$UNIT_ID" --require-public-urls

      - name: Pack the unit's build output
        working-directory: app
        run: |
          files="$RUNNER_TEMP/edge-unit-files"
          git ls-files --others --ignored --exclude-standard --directory -z -- "$UNIT_PATH" \
            | grep -zv '/node_modules/$' >"$files"
          test -f ".codex/reports/releases/$UNIT_ID/plan.json"
          printf '%s\0' ".codex/reports/releases/$UNIT_ID" >>"$files"
          tar --null --files-from="$files" --create --zstd --file "$RUNNER_TEMP/edge-unit.tar.zst"
          ls -lh "$RUNNER_TEMP/edge-unit.tar.zst"

      - name: Upload the unit's build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-unit-${{ matrix.unit.id }}
          path: ${{ runner.temp }}/edge-unit.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  # The release scripts decide what reaches stage, so their tests gate every release.
  release-script-tests:
    name: Test the release scripts
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Run the immutable release tests
        working-directory: app
        run: >-
          mise exec -- pnpm exec rstest --project scripts
          scripts/tests/immutable-application-release.test.mts
          scripts/tests/immutable-shell-release.test.mts
          scripts/tests/stage-demo-deploy-workflow.test.mts
          scripts/tests/prepare-stage-release-secrets.test.mts
          scripts/tests/stage-demo-migrate.test.mts
          scripts/tests/stage-deploy-diagnostics.test.mts
          scripts/tests/application-composition-authority-publication.test.mts
          scripts/tests/application-composition-release-lifecycle.test.mts
          scripts/tests/bootstrap-runtime-role.test.mts
          scripts/tests/database-login-roles.test.mts
          scripts/tests/enrollment-recovery-host-config.test.mts
          scripts/tests/recover-admitted-retail-profile.test.mts
          scripts/tests/stage-profile-recovery-workflow.test.mts
          scripts/tests/verify-stage-migration-continuation.test.mts
          scripts/tests/prepare-stage-customer.test.mts
          scripts/tests/typecheck-project-references.test.mts
          scripts/tests/database-identity-environment.test.mts
          scripts/tests/cloudflare-data-plane-bindings.test.mts
          scripts/tests/generate-zerops-provider-deployment.test.mts
          scripts/tests/outbox-worker-delivery.test.mts
          scripts/tests/reconcile-stage-service-grants.test.mts
          scripts/tests/verification-context.test.mts
          scripts/tests/mcp-proof-transport.test.mts

      # Reject missing protected bindings before paying for every deployment build. This check
      # has no provider/database credentials and removes its private bundle on every exit.
      # Release still prepares and validates its own fresh bundle under the deployment lock.
      - name: Check release secret bindings before deployment builds
        if: github.event_name == 'push' || inputs.deploy
        timeout-minutes: 3
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
        run: |
          umask 077
          directory=""
          cleanup() {
            if [[ -n "$directory" ]]; then
              rm -f -- "$directory/bundle.json"
              rmdir -- "$directory"
            fi
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          directory="$(mktemp -d "$RUNNER_TEMP/stage-release-secrets.XXXXXX")"
          chmod 700 "$directory"
          mise exec -- node scripts/prepare-stage-release-secrets.mts --output-file "$directory/bundle.json"

  build-storefront:
    name: Build akros-storefront
    needs: [plan, release-script-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the storefront Worker
        working-directory: app/akros-storefront
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
        run: |
          mise exec -- pnpm run cloudflare:build
          tar --create --zstd --file "$RUNNER_TEMP/storefront.tar.zst" .open-next .wrangler.generated.json
          ls -lh "$RUNNER_TEMP/storefront.tar.zst"

      - name: Upload the storefront build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akros-storefront
          path: ${{ runner.temp }}/storefront.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  # Identity bootstrap, migrations, edge publication, outbox and storefront deployment hold one lock shared with the
  # composition refresh. The job records the stage-edge deployment, so the refresh re-publishes this revision.
  release:
    name: Deploy, publish and activate stage
    needs: [plan, build, build-storefront, release-script-tests]
    if: >-
      always() && !cancelled() &&
      ((needs.plan.result == 'success' && needs.build.result == 'success' && needs.build-storefront.result == 'success' && needs.release-script-tests.result == 'success' && (github.event_name == 'push' || inputs.deploy)) ||
       (github.event_name == 'workflow_dispatch' && inputs.outbox_only && inputs.profile_recovery_mode == 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stage-edge
    permissions:
      actions: read
      contents: read
      deployments: read
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_LOGIN_ROLE_POLICY: reconcile
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      DEPLOY_TARGET: cloudflare
      OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: topology/initial-composition-execution.stage.json
      UNITS_JSON: ${{ needs.plan.outputs.units }}
    steps:
      # Release scripts require a clean Git checkout, so everything this job writes lives in the runner temp.
      - name: Name the release files in the runner temp
        run: |
          {
            echo "ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE=$RUNNER_TEMP/initial-composition-cutover/initial-composition-cutover-receipt.json"
            echo "CANDIDATE_FILE=$RUNNER_TEMP/composition-candidate/active-application-composition-candidate.json"
            echo "RECEIPTS=$RUNNER_TEMP/release-receipts"
          } >>"$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require the exact published revision for an outbox-only retry
        if: inputs.outbox_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=""
          while IFS=$'\t' read -r id sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')"
            if [[ "$state" == success ]]; then published="$sha"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=stage-edge&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          if [[ -z "$published" || "$published" != "$GITHUB_SHA" ]]; then
            echo "::error title=Revision mismatch::outbox-only retries require this exact revision to be the published stage-edge release; run a full hardened release instead" >&2
            exit 1
          fi

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # Only Projects may be added, from native shared bindings and derived public JWKS.
      # The private directory transfers to the final cleanup step only after preparation succeeds.
      # Outbox-only retries need this too: native recovery check/apply always consume the file.
      - name: Prepare the runner-only immutable release secret bundle
        id: release-secrets
        working-directory: app
        env:
          ALL_RELEASE_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
        run: |
          umask 077
          directory=""
          cleanup() {
            if [[ -n "$directory" ]]; then
              rm -f -- "$directory/bundle.json"
              rmdir -- "$directory"
            fi
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          directory="$(mktemp -d "$RUNNER_TEMP/stage-release-secrets.XXXXXX")"
          chmod 700 "$directory"
          mise exec -- node scripts/prepare-stage-release-secrets.mts --output-file "$directory/bundle.json"
          printf 'directory=%s\npath=%s/bundle.json\n' "$directory" "$directory" >>"$GITHUB_OUTPUT"
          trap - EXIT HUP INT TERM

      # Check the whole served inventory before VPN access, database preparation or provider writes.
      # This remains fail-closed after the bounded Projects-only preparation.
      - name: Validate the complete immutable release secret inventory
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { NodeServices } from '@effect/platform-node';
          import { Effect, Redacted, Schema } from 'effect';
          import { OntosDeploymentAppIdSchema } from './packages/core-runtime/src/modules/manifest.ts';
          import { ApplicationReleaseIntentSchema } from './scripts/application-release-intent.mts';
          import { workerSecretPlan } from './scripts/ops/cloudflare-stage-cutover.mts';
          import { readEdgeUnits } from './scripts/ops/stage-edge-units.mts';

          const failures = [];
          const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          try {
            const intent = Schema.decodeUnknownSync(Schema.fromJsonString(ApplicationReleaseIntentSchema))(
              readFileSync('topology/application-release-intent.json', 'utf-8'),
            );
            const ids = ['shell-super-app', ...intent.modules.map(module => module.appId)];
            const selected = Schema.decodeUnknownSync(Schema.fromJsonString(
              Schema.Array(Schema.Struct({ id: OntosDeploymentAppIdSchema })),
            ))(process.env.UNITS_JSON);
            const selectedIds = selected.map(unit => unit.id);
            if (new Set(ids).size !== ids.length ||
                selectedIds.length !== ids.length || new Set(selectedIds).size !== ids.length ||
                ids.some(id => !selectedIds.includes(id))) {
              failures.push('planned units do not match the complete served release inventory');
            }
            const units = await Effect.runPromise(readEdgeUnits.pipe(Effect.provide(NodeServices.layer)));
            const served = units.filter(unit => ids.includes(unit.id));
            if (served.length !== ids.length || new Set(served.map(unit => unit.id)).size !== ids.length) {
              failures.push('served release inventory is not completely placed in the native topology');
            }
            // Values are unused: only the native planner's binding names are inspected.
            const nameOnly = Redacted.make('name-projection-only');
            const hostname = new URL(process.env.STAGE_SHELL_URL).hostname;
            const plan = workerSecretPlan(served, { shellHostname: hostname, stageZone: process.env.STAGE_ZONE }, {
              betterAuthSecret: nameOnly,
              commerceCustomerContextGatewayApiKey: nameOnly,
              commerceMarketCatalogGatewayApiKey: nameOnly,
              crmPartyIntakeApiKey: nameOnly,
              gatewayPrivateJwk: nameOnly,
              gatewayPublicJwks: nameOnly,
              pricingGatewayApiKey: nameOnly,
              spicedbPresharedKey: nameOnly,
            });
            const bundle = JSON.parse(readFileSync(process.env.ALL_RELEASE_SECRETS_FILE, 'utf-8'));
            if (!isRecord(bundle)) {
              failures.push('DEMO_IMMUTABLE_RELEASE_SECRETS must be a JSON owner record');
            } else {
              for (const unit of served) {
                const owner = Object.hasOwn(bundle, unit.id) ? bundle[unit.id] : undefined;
                if (!isRecord(owner)) {
                  failures.push(`${unit.id}: missing or invalid owner secret object`);
                  continue;
                }
                for (const key of Object.keys(plan.get(unit.workerName))) {
                  if (!Object.hasOwn(owner, key) || typeof owner[key] !== 'string' || owner[key].trim() === '') {
                    failures.push(`${unit.id}.${key}: missing or invalid required binding`);
                  }
                }
                if (Object.values(owner).some(value => typeof value !== 'string' || value.trim() === '')) {
                  failures.push(`${unit.id}: secret bindings must all be non-empty strings`);
                }
              }
            }
          } catch {
            // Parser and schema errors can contain their input. Do not render them.
            failures.push('release secret inventory or topology could not be decoded');
          }
          delete process.env.ALL_RELEASE_SECRETS_FILE;
          const message = failures.length === 0
            ? 'Complete served release secret inventory validated. No secret values printed.'
            : `Release secret inventory rejected before stage mutation:\n${failures.join('\n')}`;
          console.log(message);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          if (failures.length !== 0) {
            console.error('::error title=Incomplete release secret inventory::See the name-only inventory diagnostics');
            process.exitCode = 1;
          }
          NODE

      # Read-only source/provenance gate before connecting to stage or changing any database identity.
      - name: Verify the completed migration incident and reviewed continuation source
        if: inputs.continue_migrated_publication
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_MIGRATED_PUBLICATION: ${{ inputs.continue_migrated_publication }}
          DEPLOY: ${{ inputs.deploy }}
          OUTBOX_ONLY: ${{ inputs.outbox_only }}
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: mise exec -- pnpm exec node scripts/verify-stage-migration-continuation.mts

      - name: Download every unit's build output
        if: ${{ !inputs.outbox_only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edge-unit-*
          path: ${{ runner.temp }}/edge-units

      - name: Unpack the build outputs
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        run: |
          while IFS=$'\t' read -r id package; do
            tar --extract --zstd --file "$RUNNER_TEMP/edge-units/edge-unit-$id/edge-unit.tar.zst"
            mise exec -- pnpm --filter "$package" exec test -f .output/wrangler.json
            test -f ".codex/reports/releases/$id/plan.json"
          done < <(jq -r '.[] | [.id, .package] | @tsv' <<<"$UNITS_JSON")

      - name: Require a clean checkout before the uploads
        if: ${{ !inputs.outbox_only }}
        run: |
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "::error title=Dirty checkout::release scripts require a clean Git checkout"
            head -40 <<<"$dirty"
            exit 1
          fi

      # Every upload takes the composition publication advisory lock in the stage database.
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      # Read-only: reuse existing sensitive migrator secrets. A missing dedicated secret stops the release.
      - name: Load the dedicated database identity credentials
        timeout-minutes: 5
        working-directory: app
        run: >-
          mise exec -- pnpm exec node scripts/ops/database-identities.mts
          --github-environment-file "$GITHUB_ENV"

      # Read-only: fail before database preparation if the canonical owner configuration cannot
      # start recovery. Missing host copies are planned additions, never replacement credentials.
      - name: Validate canonical enrollment recovery host configuration
        timeout-minutes: 2
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
          ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts check

      # Advisory only: live pending work may drain, and initial/sealed releases still need their
      # authoritative native guards. Unknown diagnostics fail before any identity or schema mutation.
      - name: Inspect migration readiness before database preparation
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 2
        working-directory: app
        run: |
          status=0
          mise exec -- pnpm exec node scripts/stage-demo-migrate.mts --readiness \
            >"$RUNNER_TEMP/stage-migration-readiness.json" || status=$?
          node --input-type=module - "$RUNNER_TEMP/stage-migration-readiness.json" "$status" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { Schema } from 'effect';
          import { ApplicationCompositionReadinessSchema } from './scripts/application-composition-authority-publication.mts';
          import { formatStageDeployDiagnostic } from './scripts/stage-deploy-diagnostics.mts';

          const [path, exitCode] = process.argv.slice(2);
          let input;
          for (const line of readFileSync(path, 'utf8').split(/\r?\n/u)) {
            try {
              const candidate = JSON.parse(line);
              if (candidate?.advisoryOnly === true) input = candidate;
            } catch {
              // Runtime error rendering is not an authoritative readiness record.
            }
          }
          let result;
          let reportedByCommand = false;
          try {
            result = Schema.decodeUnknownSync(ApplicationCompositionReadinessSchema)(input);
            reportedByCommand = true;
          } catch {
            result = { advisoryOnly: true, reason: 'diagnostic-unavailable', status: 'unknown' };
          }
          // The command already emits its canonical diagnostic. Only a missing/invalid record
          // needs a fallback here, otherwise the step would append a second, incomplete summary.
          if (!reportedByCommand) {
            const formatted = formatStageDeployDiagnostic({
              migrationsCompleted: false,
              migrationStarted: false,
              phase: 'readiness',
              reason: result.reason,
              status: 'unknown',
            });
            console.error(formatted.stderr);
            console.error(formatted.annotation);
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, formatted.summary);
            }
          }
          const guardedRetry = exitCode === '1' &&
            ['pending-work', 'authority-missing', 'authority-sealed'].includes(result.reason);
          if (!(result.status === 'ready' && exitCode === '0') && !guardedRetry) process.exitCode = 1;
          NODE

      - name: Bootstrap every database identity before migrations
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 10
        working-directory: app
        run: mise exec -- pnpm db:bootstrap-runtime-role

      # The stage provider quiescence was proven when stage first cut over (operator receipt, 2026-10-22).
      - name: Write the initial cutover receipt
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        working-directory: app
        run: |
          mkdir -p "$(dirname "$ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE")"
          printf '%s' '{"environment":"stage","inventorySha256":"40ec38189570c5e41abcfb1852b47e9d167902d2490c89a28bac432adbac6ae0","schemaVersion":"2","verifiedAt":"2026-10-22T01:51:15.913Z"}' \
            >"$ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE"

      # Native durable drain and committed sealing precede the complete workspace db:migrate chain.
      # The runner-local child inherits the stage identities, including the Commerce portal runtime/admin
      # pair. Failure keeps the native fence and stops the release before any upload or publication.
      # Exact-published-revision outbox retries cannot seal: they do not publish a replacement composition.
      - name: Migrate every owner schema
        if: ${{ !inputs.outbox_only && !inputs.continue_migrated_publication }}
        timeout-minutes: 20
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm exec node scripts/stage-demo-migrate.mts

      # This read-only native guard takes the publication lock and requires the exact migrated authority.
      - name: Continue publication of the completed owner migration
        if: inputs.continue_migrated_publication && !inputs.outbox_only
        timeout-minutes: 5
        working-directory: app
        env:
          ONTOS_RETIRED_COMPOSITION_REVISION: ${{ inputs.retired_composition_revision }}
        run: mise exec -- pnpm exec node scripts/stage-demo-migrate.mts --continue-publication

      # Final exact grants and portal migrations already ran inside the sealed child. Verify here
      # instead of executing a third full bootstrap after marking migration complete.
      - name: Verify every migrated owner schema
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 10
        working-directory: app
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm db:verify

      # Reuse the native service TLS secrets and existing VPN; no GitHub secret copies or key rotation.
      - name: Reconcile storefront, Commerce and Privacy service grants
        timeout-minutes: 10
        working-directory: app
        env:
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          # The job's composition URL is the Cloudflare KV REST value endpoint, which needs a bearer token.
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_URL: ${{ env.STAGE_SHELL_URL }}
          # Only whole secrets are masked; a field read with fromJSON would print in the step's env block.
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          BETTER_AUTH_SECRET="$(jq -er '."shell-super-app".BETTER_AUTH_SECRET' <<<"$ALL_RELEASE_SECRETS")"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          export BETTER_AUTH_SECRET
          unset ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/demo/reconcile-stage-service-grants.mts --zerops --check
          mise exec -- pnpm exec node scripts/demo/reconcile-stage-service-grants.mts --zerops --apply
          mise exec -- pnpm exec node scripts/demo/reconcile-stage-service-grants.mts --zerops --verify

      # Deploys only upload immutable release Workers; nothing serves them until publication. Each upload
      # locks only its own release identity, so eight run side by side (Cloudflare API rate limits).
      - name: Upload every immutable release Worker
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          UPLOAD_PARALLELISM: '8'
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          mkdir -p "$RECEIPTS" "$RUNNER_TEMP/upload-logs"
          upload() {
            local id="$1" unit_path="$2" script=scripts/immutable-application-release.mts started=$SECONDS
            local log="$RUNNER_TEMP/upload-logs/$id.log"
            [[ "$id" == shell-super-app ]] && script=scripts/immutable-shell-release.mts
            if ! ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer --arg app "$id" '.[$app] | select(type == "object")' <<<"$ALL_RELEASE_SECRETS" 2>/dev/null)"; then
              printf '::error title=Missing release secrets::%s has no valid owner secret object; upload not started\n' "$id" | tee "$log" >&2
              return 1
            fi
            export ONTOS_IMMUTABLE_RELEASE_SECRETS
            # The release script retries a transient Cloudflare failure (unknown error 10013, internal 10021,
            # 429/5xx, dropped connections) up to three times, removing the attempt's half release first so
            # the same identity uploads again; any other failure ends the unit at once.
            if mise exec -- pnpm exec node "$script" deploy \
              --app-directory "$unit_path" \
              --plan-file ".codex/reports/releases/$id/plan.json" \
              --receipt-file "$RECEIPTS/$id.json" >>"$log" 2>&1; then
              echo "uploaded $id in $((SECONDS - started)) s"
              return 0
            fi
            echo "::group::$id upload log"; tail -80 "$log"; echo '::endgroup::'
            echo "::error title=Upload failed::$id (see its upload log; a unit that failed only transiently left no half release, so re-running the job retries it)"
            return 1
          }
          export -f upload
          export RECEIPTS
          # shellcheck disable=SC2016
          jq -r '.[] | [.id, .path] | @tsv' <<<"$UNITS_JSON" \
            | xargs -P "$UPLOAD_PARALLELISM" -L 1 bash -c 'upload "$0" "$1"'

      - name: Upload the per-unit upload logs
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-logs
          path: ${{ runner.temp }}/upload-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize the upload phases
        if: always() && !inputs.outbox_only
        run: |
          grep -h ' phase \|receipt written' "$RUNNER_TEMP"/upload-logs/*.log | sed -E 's/^.*(release [^ ]+ (phase|receipt))/\1/' | sort || true
          grep -h 'release CLI exit' "$RUNNER_TEMP"/upload-logs/*.log | sort | uniq -c || true

      - name: Assemble the composition candidate
        if: ${{ !inputs.outbox_only }}
        working-directory: app
        run: |
          receipts=()
          while IFS= read -r id; do
            receipts+=(--receipt-file "$RECEIPTS/$id.json")
          done < <(jq -r '.modules[].appId' topology/application-release-intent.json)
          mkdir -p "$(dirname "$CANDIDATE_FILE")"
          mise exec -- pnpm exec node scripts/immutable-application-release.mts candidate \
            --intent-file topology/application-release-intent.json "${receipts[@]}" \
            --shell-receipt-file "$RECEIPTS/shell-super-app.json" \
            --candidate-file "$CANDIDATE_FILE"

      - name: Archive the candidate and receipts
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-demo-release
          path: |
            ${{ runner.temp }}/composition-candidate
            ${{ runner.temp }}/release-receipts
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the Application Composition
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 20
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm active-composition:publish publish --environment stage --candidate-file "$CANDIDATE_FILE"

      - name: Activate the Shell ingress
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 20
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          export ONTOS_IMMUTABLE_RELEASE_SECRETS
          ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer '.["shell-super-app"] | select(type == "object")' <<<"$ALL_RELEASE_SECRETS")"
          mise exec -- pnpm exec node scripts/immutable-shell-release.mts ingress-deploy \
            --app-directory apps/shell-super-app \
            --receipt-file "$RECEIPTS/shell-super-app.json"

      # The host is built from this same checkout and source SHA, before the single stage lock is released.
      - name: Install Zerops CLI
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      # Zerops rejects a build file over 50 kB, so the push reads only the outbox host's setup.
      - name: Materialize the stage outbox host zerops.yaml
        working-directory: app
        env:
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.outbox.yaml
        run: |
          mise exec -- pnpm --silent zerops:materialize-environment --environment stage --input zerops.yaml --output "$RUNNER_TEMP/zerops.yaml"
          awk 'BEGIN { print "zerops:" } /^  - setup: / { keep = ($0 ~ /outbox-worker-host/) } keep' "$RUNNER_TEMP/zerops.yaml" >"$ZEROPS_YAML_PATH"
          grep -q "setup: 'outbox-worker-host'" "$ZEROPS_YAML_PATH"
          wc -c "$ZEROPS_YAML_PATH"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Provision canonical enrollment recovery host configuration
        timeout-minutes: 5
        working-directory: app
        env:
          ALL_RELEASE_SECRETS_FILE: ${{ steps.release-secrets.outputs.path }}
          ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
          ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID }}
        run: |
          ALL_RELEASE_SECRETS="$(cat -- "$ALL_RELEASE_SECRETS_FILE")"
          export ALL_RELEASE_SECRETS
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts apply
          mise exec -- pnpm exec node scripts/ops/enrollment-recovery-host-config.mts verify

      - name: Push the outbox worker host
        env:
          UNITS_JSON: '["outbox-worker-host"]'
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # A host that does not match the published composition logs OutboxWorkerDescriptorError on every poll.
      - name: Require the new host to admit the published composition
        env:
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_SERVICE_ID: ${{ vars.ZEROPS_OUTBOX_WORKER_HOST_SERVICE_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          # zcli push returns once the new container is ready; only its lines count.
          since="$(date -u +%Y-%m-%dT%H:%M:%S)"
          sleep 60
          zcli service log --project-id "$ZEROPS_PROJECT_ID" --service-id "$ZEROPS_SERVICE_ID" \
            --limit 500 --minimum-severity DEBUG >"$RUNNER_TEMP/outbox.log" 2>&1 || true
          awk -v since="$since" '$2 >= since' "$RUNNER_TEMP/outbox.log" >"$RUNNER_TEMP/outbox-new.log"
          echo "$(wc -l <"$RUNNER_TEMP/outbox-new.log") host log lines since $since"
          if grep -q 'OutboxWorkerDescriptorError\|outbox_worker_descriptor_invalid' "$RUNNER_TEMP/outbox-new.log"; then
            grep -m 20 -B1 -A3 'OutboxWorkerDescriptorError' "$RUNNER_TEMP/outbox-new.log" || true
            echo "::error title=Outbox host rejects the composition::OutboxWorkerDescriptorError after the push"
            exit 1
          fi
          tail -15 "$RUNNER_TEMP/outbox-new.log"

      - name: Download the storefront build output
        if: ${{ !inputs.outbox_only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: akros-storefront
          path: ${{ runner.temp }}/storefront

      - name: Deploy the AKROS storefront
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 15
        working-directory: app/akros-storefront
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_SHELL_WORKER_NAME: app-shell-super-app
          STOREFRONT_CATALOG_KV_ID: ${{ env.STAGE_STOREFRONT_CATALOG_KV_ID }}
          STOREFRONT_IMAGE_HOSTS: ''
        run: |
          tar --extract --zstd --file "$RUNNER_TEMP/storefront/storefront.tar.zst"
          mise exec -- pnpm run cloudflare:deploy

      - name: Prepare the native demo customer fixture
        if: ${{ !inputs.outbox_only }}
        timeout-minutes: 5
        working-directory: app
        env:
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm exec node scripts/demo/prepare-stage-customer.mts

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

      # One short check, no load: the stage Workers CPU budget is capped.
      - name: Smoke the Shell login and OAuth metadata
        if: ${{ !inputs.outbox_only }}
        run: |
          check() {
            local url="$1" status
            for _ in 1 2 3 4 5; do
              status="$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 30 "$url" || true)"
              echo "$url -> $status"
              [[ "$status" == 200\ * ]] && return 0
              sleep 10
            done
            echo "::error title=Smoke failed::$url did not answer 200" >&2
            return 1
          }
          check "$STAGE_SHELL_URL/cs/login"
          check "$STAGE_SHELL_URL/.well-known/oauth-authorization-server"

      - name: Remove the runner-only immutable release secret bundle
        if: always() && steps.release-secrets.outputs.directory != ''
        env:
          PREPARED_SECRETS_DIRECTORY: ${{ steps.release-secrets.outputs.directory }}
        run: |
          parent="${PREPARED_SECRETS_DIRECTORY%/*}"
          name="${PREPARED_SECRETS_DIRECTORY##*/}"
          if [[ "$parent" != "$RUNNER_TEMP" || ! "$name" =~ ^stage-release-secrets\.[A-Za-z0-9]+$ || -L "$PREPARED_SECRETS_DIRECTORY" ]]; then
            echo '::error::Refusing cleanup outside the exact runner-owned secret directory' >&2
            exit 1
          fi
          rm -f -- "$PREPARED_SECRETS_DIRECTORY/bundle.json"
          if [[ -d "$PREPARED_SECRETS_DIRECTORY" ]]; then
            rmdir -- "$PREPARED_SECRETS_DIRECTORY"
          fi

  # One verification pass after every deploy, no load (the stage Workers CPU budget is capped).
  verify:
    name: Verify stage once
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Install headless Chromium for the OAuth consent screens
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install --with-deps chromium

      - name: Time /cs, OAuth metadata and the storefront home
        working-directory: app
        run: mise exec -- node scripts/ops/stage-demo-verify.mjs

      # The timing probe remains blocking, but its failure must not skip this independent browser proof.
      - name: Prove the native newsletter grant and withdrawal
        if: (success() || failure()) && !inputs.outbox_only
        working-directory: app
        env:
          AKROS_TEST_BASE_URL: ${{ env.STAGE_STOREFRONT_URL }}
          AKROS_EVIDENCE_DIR: ${{ runner.temp }}/newsletter-consent
        run: |
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node akros-storefront/tests/browser/newsletter-consent.mjs

      - name: Upload the newsletter screenshots
        if: always() && !inputs.outbox_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsletter-consent
          path: ${{ runner.temp }}/newsletter-consent/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Prove MCP over OAuth end to end
        working-directory: app
        env:
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_OAUTH_ISSUER: ${{ env.STAGE_SHELL_URL }}/shell-super-app-api/oauth
          E2E_OUT_DIR: ${{ runner.temp }}/mcp-oauth-e2e
          E2E_SHOTS_DIR: ${{ runner.temp }}/mcp-oauth-e2e/shots
        run: |
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node scripts/demo/prove-mcp-oauth.mts --variant=1 --verification

      - name: Upload the MCP OAuth proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-oauth-e2e
          path: ${{ runner.temp }}/mcp-oauth-e2e
          if-no-files-found: ignore
          retention-days: 14
