name: Stage Edge Cost Guard

# Hourly check of the account-wide Workers usage for the current billing cycle. Past the request or CPU
# budget, it enables the OntOS stage kill-switch rule (and nothing else) and fails, so Workers Paid stays at its base price.
# Undo with `node scripts/ops/cloudflare-stage-cutover.mts resume` (docs/architecture/DEPLOYMENT.md).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-edge-cost-guard
  cancel-in-progress: false

jobs:
  check-usage:
    name: Check stage Workers usage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Environment variables only resolve once the job has entered stage-edge, so the gate is a step:
      # the job stays idle until `cloudflare-stage-cutover.mts cost-guards` records the stage zone.
      - name: Check that the cost guards are provisioned
        id: gate
        shell: bash
        env:
          CLOUDFLARE_STAGE_ZONE_ID: ${{ vars.CLOUDFLARE_STAGE_ZONE_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_STAGE_ZONE_ID" ]]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::stage-edge has no CLOUDFLARE_STAGE_ZONE_ID yet; run cloudflare-stage-cutover.mts cost-guards"
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.provisioned == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        if: steps.gate.outputs.provisioned == 'true'
        uses: ./.github/actions/install-app

      - name: Enforce the stage usage budget
        if: steps.gate.outputs.provisioned == 'true'
        working-directory: app
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGE_ZONE_ID: ${{ vars.CLOUDFLARE_STAGE_ZONE_ID }}
          STAGE_BILLING_CYCLE_DAY: ${{ vars.STAGE_BILLING_CYCLE_DAY }}
          STAGE_WORKERS_CPU_MS_LIMIT: ${{ vars.STAGE_WORKERS_CPU_MS_LIMIT }}
          STAGE_WORKERS_REQUEST_LIMIT: ${{ vars.STAGE_WORKERS_REQUEST_LIMIT }}
        run: |
          # Unset optional limits the environment leaves blank, so the script applies its defaults.
          for name in STAGE_BILLING_CYCLE_DAY STAGE_WORKERS_CPU_MS_LIMIT STAGE_WORKERS_REQUEST_LIMIT; do
            [[ -n "${!name}" ]] || unset "$name"
          done
          mise exec -- node scripts/ops/cloudflare-stage-cost-guard.mts check
