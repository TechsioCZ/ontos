name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # Always report Workspace gates. The ci-plan job, not workflow path filtering, selects required work.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force-ci-full:
        description: Run every CI gate even if the merge queue already proved this commit.
        type: boolean
        default: false
      full:
        description: Deploy the whole topology instead of the diff since the environment's last successful deployment (seeding or rewritten history).
        type: boolean
        default: false
      environment:
        description: GitHub deployment environment to deploy to Zerops. The retired Cloudflare target is rejected. Main deploys only while the MAIN_DEPLOY_ENABLED repository variable is 'true'.
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  queue-proof:
    name: Find the merge queue proof of this commit
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.force-ci-full != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi

  ci-plan:
    name: Select required checks from changed inputs
    needs: [queue-proof]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
      expected: ${{ steps.selection.outputs.expected || steps.changes.outputs.expected }}
      source: ${{ steps.selection.outputs.source || steps.changes.outputs.source }}
      unit: ${{ steps.selection.outputs.unit || steps.changes.outputs.unit }}
      integration: ${{ steps.selection.outputs.integration || steps.changes.outputs.integration }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout the exact comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete diff without app dependencies
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_PROVEN: ${{ needs.queue-proof.outputs.proven }}
          FORCE_FULL: ${{ inputs.force-ci-full }}
        run: bash app/scripts/plan-ci-changes.sh "$RUNNER_TEMP/ci-changed-paths"
      - name: Record the documentation or exact-commit no-op
        if: steps.changes.outputs.mode == 'docs' || steps.changes.outputs.mode == 'proven'
        env:
          REASON: ${{ steps.changes.outputs.reason }}
        run: printf '## CI selection\n\n%s\n\nNo app dependencies, builds or services are needed.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      # $RUNNER_TEMP is job-local and format-and-lint checks out at depth 1, so it can neither read this
      # path nor recompute the diff. Publishing the planner's exact NUL-delimited list is the only way that
      # gate can lint the run's changed files. The list is empty whenever the comparison is unavailable
      # (full, docs and proven modes), so an empty file is a valid result and must not fail the upload.
      - name: Publish the exact changed-path list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-changed-paths
          if-no-files-found: warn
          retention-days: 1
      # Every gate needs this install. Publish the complete workspace before fanning out, rather than
      # making every first-wave job repeat the install while waiting for build shard 1 to save it.
      - name: Install the app workspace for code impact analysis
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        uses: ./.github/actions/install-app
        with:
          mise-env: 'false'
          save-node-modules: ${{ github.ref != 'refs/heads/main' }}
      - name: Resolve affected packages and required matrices
        id: selection
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        working-directory: app
        env:
          BOOTSTRAP_MODE: ${{ steps.changes.outputs.mode }}
        run: |
          args=(--paths-file "$RUNNER_TEMP/ci-changed-paths")
          [[ "$BOOTSTRAP_MODE" != full ]] || args+=(--full)
          mise exec -- node scripts/plan-ci-checks.mts "${args[@]}"

  # The default-branch producer of the caches the gates restore, where every pull request and merge
  # group can read them: the pnpm store, the installed node_modules, the TS-Go typecheck build,
  # the Playwright Chromium build, and the apt packages of Chromium's
  # system libraries. An Actions cache is readable from the current branch or the default branch only, so
  # a merge group run (gh-readonly-queue/main/*) can read nothing a pull request saved, and the gate jobs
  # never run on a proven push to main: this job publishes the shared caches. ci-plan also saves its
  # complete installed workspace before any downstream gate starts.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'
          save-store: 'true'
          save-node-modules: 'true'

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check for the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          lookup-only: true

      - name: Download the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          # The marker keeps the cache saveable on an image that already has every library.
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;
          echo "Cached $(find ~/.cache/playwright-apt-debs -name '*.deb' | wc -l) packages."

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

  # Source checks start immediately after planning; they do not wait for Node artifacts.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.source) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  workspace-unit:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Download the same-run Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  # Share one install. Keep the memory-heavy API analyzer after the parallel group;
  # module generation must finish before the i18n scanner walks generated directories.
  static-contracts:
    name: Static Contracts (${{ matrix.row }})
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['static-contracts'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        row: [contracts]
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        if: matrix.row == 'contracts'
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # zerops.yaml still defines a cloudflared service, so this verifies live stage infrastructure.
      - name: Verify the pinned Cloudflare Tunnel binary
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
        working-directory: app
        timeout-minutes: 5
        run: |
          commands="$(mise exec -- node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse } from "yaml";
            const service = parse(readFileSync("zerops.yaml", "utf8")).zerops.find(({ setup }) => setup === "cloudflared");
            if (!Array.isArray(service?.build?.buildCommands) || service.build.buildCommands.length === 0) {
              throw new Error("Cloudflare Tunnel build commands are missing");
            }
            process.stdout.write(service.build.buildCommands.join("\n"));
          ')"
          scratch="$(mktemp -d "$RUNNER_TEMP/ontos-cloudflared.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          (
            cd "$scratch"
            bash -euo pipefail -c "$commands"
            app/.zerops/runtime/cloudflared/cloudflared --version
          )

      # Share one install across independent checks and retain a log for each check.
      # Keep the memory-heavy API analyzer outside this group.
      - parallel:
          - name: Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            run: app/node_modules/.bin/lefthook validate

          - name: Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm skills:check

          - name: Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm database-access:check

          - name: Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm lean-core:check

          - name: Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm contract:check

          - name: Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm check:module-contracts

          - name: Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm action:test:unit

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories: it shares this row with the
      # group above for exactly that reason, and the scanner costs seconds.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
        working-directory: app
        env:
          # The whole-workspace analyzer exceeds V8's ~4 GiB default while releasing its graph.
          NODE_OPTIONS: --max-old-space-size=6144
        run: mise exec -- pnpm api:check

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it.
  # It can only prove that already-committed files are formatted and linted, and the same lefthook hook
  # proves that at commit time, so it runs over the run's changed files instead of the whole tree. The one
  # real failure a changed-file sweep would miss is a changed formatter, linter or hook configuration,
  # which reformats files nobody touched: that sweeps every tracked file, as do the nightly cron and any
  # run whose exact diff is unavailable. ci-plan publishes the list; $RUNNER_TEMP is job-local and this
  # job checks out at depth 1, so it can neither read that path nor recompute the diff.
  format-and-lint:
    name: Format and Lint through the pre-commit hook
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['format-and-lint'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A missing artifact fails this step, which is the point: without the list this gate proves nothing.
      - name: Download the exact changed-path list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-plan

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Format and Lint the run's changed files through the pre-commit hook
        env:
          FULL_SWEEP: ${{ github.event_name == 'schedule' }}
          PLAN_MODE: ${{ needs.ci-plan.outputs.mode }}
        run: |
          changed="$RUNNER_TEMP/ci-plan/ci-changed-paths"
          files="$RUNNER_TEMP/hook-files"
          # A changed path is a literal file name, never a pathspec pattern.
          export GIT_LITERAL_PATHSPECS=1
          if [[ ! -f "$changed" ]]; then
            echo "::error title=No changed-path list::ci-plan published no changed-path list, so this gate cannot prove anything."
            exit 1
          fi
          sweep=changed
          paths=()
          while IFS= read -r -d '' path; do
            paths+=("$path")
            # A formatter, linter or hook configuration reformats files nobody touched: the one real
            # failure a changed-file sweep would miss.
            if [[ "$path" =~ (^|/)[^/]*(prettier|oxlint|oxfmt|lefthook)[^/]*$ ||
              "$path" == app/tools/oxlint/* || "$path" == app/patches/* ||
              "$path" =~ ^app/tsconfig[^/]*\.json$ ||
              "$path" == app/pnpm-lock.yaml || "$path" == app/pnpm-workspace.yaml || "$path" == app/.mise.toml ]]; then
              sweep=all
              echo "::notice title=Tool configuration changed::$path changes a formatter, linter or hook configuration; every tracked file is linted."
            fi
          done <"$changed"
          if [[ "$FULL_SWEEP" == true ]]; then
            sweep=all
            echo 'The nightly run lints every tracked file.'
          elif [[ ${#paths[@]} -eq 0 ]]; then
            # plan-ci-changes.sh writes an empty list exactly when the exact comparison is unavailable.
            if [[ "$PLAN_MODE" == affected ]]; then
              echo "::error title=Empty changed-path list::Affected mode selected this gate with an empty changed-path list, so it would prove nothing."
              exit 1
            fi
            sweep=all
            echo "The exact diff is unavailable in '$PLAN_MODE' mode; every tracked file is linted."
          elif [[ ${#paths[@]} -gt 2000 ]]; then
            sweep=all
            echo "${#paths[@]} changed paths exceed one argument list; every tracked file is linted instead."
          fi
          if [[ "$sweep" == all ]]; then
            git ls-files -z >"$files"
          else
            # A path the diff deleted, or that this commit does not track, has nothing to check.
            git ls-files -z -- "${paths[@]}" >"$files"
          fi
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$files"
          git diff --exit-code HEAD

  # Three service runners: bootstrap plus federation proof, integration, and browsers.
  # Integration starts four independent PostgreSQL clusters and SpiceDB datastores
  # once, then schedules every package and root shard onto those runner-local lanes.
  # This avoids paying for another hosted runner, install and migration per shard.
  service-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integration) }}
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # Native receiving fixtures and Inventory workers use genuine published owner metadata, and the
      # proof row derives the whole Composition from every delivery unit.
      # Restore this run's outputs instead of rebuilding or substituting synthetic build identities.
      # Bootstrap also proves federation, so both backend rows read these exact outputs.
      - name: Download the same-run Node artifacts for native owner fixtures
        if: matrix.suite != 'browser'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts for native owner fixtures
        if: matrix.suite != 'browser'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Derive the fresh built Composition for native owner fixtures
        if: matrix.native-composition == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: |
          mise exec -- pnpm active-composition:publish prove-build --snapshot-output "$RUNNER_TEMP/native-composition-snapshot.json"
          echo "NATIVE_1290_COMPOSITION_SNAPSHOT_PATH=$RUNNER_TEMP/native-composition-snapshot.json" >> "$GITHUB_ENV"
      - name: Materialize the native Customer Context worker artifact
        if: matrix.root-suite == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm zerops:materialize --app commerce-customer-context --package @app/commerce-customer-context --package-dir verticals/commerce-customer-context --worker

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          restore-keys: playwright-apt-debs-

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        background: true
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi
          if [ "$CHROMIUM_CACHED" = true ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright "$@"

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      # Only the bootstrap row removes the pre-seeded runtime role: it is what makes the migrator prove
      # deployment bootstrap ordering against a scratch cluster. A row that dropped it and then restored
      # nothing would have no runtime login for its own suites.
      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'bootstrap'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          # Closed dotenv discovery: no workspace .env file may leak into the cluster this proves.
          APP_ENV_PATH: /dev/null
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      # Every row migrates its own fresh cluster, which is the only database preparation left here: the
      # bootstrap row runs the stage-shaped migrator artifact, the grant audit and the Outbox Worker host
      # proof once for the whole run, because none of the three reads a matrix input.
      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it. The
      # migrations directly above provision the identities this audits, and it reads no matrix input, so
      # one row covers the run.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm database-trust:audit

      # Stage-shaped: the host is materialized by its zerops.yaml build command, ships only its
      # deployFiles, polls every hosted owner's outbox against the freshly migrated database until
      # /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      # The whole-topology Node artifact proof. It needs every build shard's outputs, so it used to run
      # inside the last build shard, which made the complete integration wave wait for it: shard 1 ended
      # at 6.0 min and the proving shard at 11.6. As a row of this matrix it starts with the wave instead,
      # on the PostgreSQL this job already starts and migrates, and it still blocks the required check
      # through this job's single gate id.
      - name: Generate federated types and check performance readiness over every unit
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Prove Node backend-federation artifacts
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm node:proof

      # The deployed publisher derives the snapshot from exactly these artifact kinds; this proves its
      # output decodes with the consumers' ActiveApplicationCompositionSnapshotSchema before stage
      # depends on it.
      - name: Prove the active Application Composition publisher output decodes
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm active-composition:publish prove-build

      - name: Give each integration worker its own PostgreSQL cluster and SpiceDB datastore
        if: matrix.suite == 'integration'
        working-directory: app
        run: bash scripts/ci/start-integration-workers.sh

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        # The job environment above is the whole configuration. Native fixtures refuse to start unless
        # dotenv discovery is closed, so no workspace .env file can leak into an owned test database.
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
          PACKAGE_FILTERS: ${{ matrix.package-filters }}
          NATIVE_PREPROPOSAL: ${{ matrix.native-preproposal }}
          ROOT_SUITE: ${{ matrix.root-suite }}
          ONTOS_CI_ISOLATED_WORKERS: '4'
        # Same commands as `pnpm test:integration`, with separate Rstest shards for the root and large packages.
        run: bash scripts/ci/run-integration-suites.sh

      - name: Prove native preproposal basis and genuine approval through registered owners
        if: matrix.native-preproposal == true
        working-directory: app
        timeout-minutes: 20
        env:
          APP_ENV_PATH: /dev/null
        # Reuse this shard's services; each case migrates its own disposable source database.
        run: mise exec -- pnpm --filter @app/commerce-customer-context run test:integration:native-preproposal

      # `wait` always runs, including on non-browser shards where the install was skipped.
      - name: Wait for the Chromium install
        wait: chromium-install

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Verify browser recovery into a newly published release
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          ONTOS_E2E_RETAINED_PARTY_R2: 'true'
        run: >-
          mise exec -- pnpm --filter @app/shell-super-app exec playwright test
          tests/e2e/login.spec.ts --grep 'reloads failed Contacts into a genuinely published R2'
          --workers 1

      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload closed native startup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-startup-${{ strategy.job-index }}
          path: app/verticals/commerce-market-catalog/.cache/ontos-1250/startup-diagnostic-*.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: |
          workers="$(docker ps --all --quiet --filter label=ontos-ci-worker)"
          if [[ -n "$workers" ]]; then
            docker rm --force --volumes $workers
          fi
          docker compose down --volumes --remove-orphans

  # Release outputs embed this exact commit in their identities. Build them here;
  # source-content caching across commits hands native fixtures another release.
  # Dependency and incremental typecheck caches remain independent of releases.
  node-artifact-build:
    name: Build node artifacts (${{ matrix.shard }}/1)
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        include:
          - { shard: 1, units: verticals/catalog verticals/tax verticals/commerce-cart verticals/commerce-customer-context verticals/storefront-registry verticals/commerce-order verticals/assortment apps/shell-super-app verticals/promotion verticals/payment verticals/party-registry verticals/inventory verticals/availability verticals/symmy-integration verticals/commerce-market-catalog verticals/price-group-catalog verticals/pricing verticals/payment-term-catalog verticals/privacy verticals/projects }
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Node artifacts
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          printf 'Hosted build capacity: %s CPUs\n' "$(nproc)"
          free --mebi
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=4 "${filters[@]}" run build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  cloudflare-artifact-build:
    name: Build cloudflare artifacts (${{ matrix.shard }}/5)
    needs: [ci-plan]
    # The proving shard reads its siblings' job results.
    permissions:
      actions: read
      contents: read
    # Cloudflare Workers are retired from CI/CD. Keep the job definition, but never run its builds or proofs.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        include:
          - { shard: 1, proof: topology, units: verticals/assortment verticals/pricing verticals/commerce-cart }
          - {
              shard: 2,
              proof: none,
              units: verticals/party-registry verticals/price-group-catalog verticals/availability verticals/commerce-order verticals/payment,
            }
          - { shard: 3, proof: outputs, units: verticals/catalog verticals/storefront-registry verticals/promotion }
          - { shard: 4, proof: none, units: verticals/commerce-customer-context apps/shell-super-app verticals/tax }
          - {
              shard: 5,
              proof: none,
              units: verticals/inventory verticals/commerce-market-catalog verticals/payment-term-catalog verticals/privacy verticals/projects verticals/symmy-integration,
            }
    env:
      # Placeholder data-plane IDs: locally a Worker's HYPERDRIVE binding connects to the proof's
      # PostgreSQL, its SPICEDB binding is served by a local gateway Worker and its composition KV
      # binding is a local namespace.
      ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_GATEWAY_ISSUER_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_PARTY_REGISTRY_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Cloudflare artifacts one unit at a time
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          SHARD_UNITS: ${{ matrix.units }}
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_AVAILABILITY: https://availability.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CART: https://commerce-cart.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_ORDER: https://commerce-order.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT: https://payment.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_PRIVACY: https://privacy.invalid
          ULTRAMODERN_PUBLIC_URL_PROJECTS: https://projects.invalid
          ULTRAMODERN_PUBLIC_URL_PROMOTION: https://promotion.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
          ULTRAMODERN_PUBLIC_URL_SYMMY_INTEGRATION: https://symmy-integration.invalid
          ULTRAMODERN_PUBLIC_URL_TAX: https://tax.invalid
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run cloudflare:build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # Development-only service values for the Worker topology proof (as in service-integration). Both
      # proofs see them, but the build above does not.
      - name: Set the development-only service values of the Worker proofs
        if: matrix.proof != 'none'
        env:
          DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
          ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
          PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
          PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
          SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
          POSTGRES_DB: ontos_ci
          POSTGRES_PASSWORD: ontos_ci_admin
          POSTGRES_PORT: '5433'
          POSTGRES_USER: ontos_ci_admin
          SPICEDB_ENDPOINT: localhost:50051
          SPICEDB_GRPC_PORT: '50051'
          SPICEDB_HTTP_PORT: '8443'
          SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
          BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
          BETTER_AUTH_URL: http://localhost:3020
          ONTOS_GATEWAY_ISSUER: http://localhost:3020
          ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
          ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
        run: printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_|PARTY_REGISTRY_DATABASE_URL=|PARTY_REGISTRY_WORKER_DATABASE_URL=|SHELL_GATEWAY_ISSUER_DATABASE_URL=)' >> "$GITHUB_ENV"

      # The topology proof's services start and migrate from source while the other shards still build.
      - name: Create the local SpiceDB TLS certificate
        if: matrix.proof == 'topology'
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services for the Worker topology
        if: matrix.proof == 'topology'
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Migrate and initialize the local tenant for the Worker topology
        if: matrix.proof == 'topology'
        working-directory: app
        # The migrations and local initialization read the app .env; write it from this job's
        # development-only service values so every tool sees the same database and SpiceDB.
        run: |
          # SPICEDB_CA_CERT spans lines, so it goes in as one double-quoted dotenv value.
          printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_|PARTY_REGISTRY_DATABASE_URL=|PARTY_REGISTRY_WORKER_DATABASE_URL=|SHELL_GATEWAY_ISSUER_DATABASE_URL=)' | grep -v '^SPICEDB_CA_CERT=' > .env
          awk 'BEGIN { printf "SPICEDB_CA_CERT=\"" } NF { printf "%s\\n", $0 } END { print "\"" }' .spicedb-tls/cert.pem >> .env
          mise exec -- pnpm db:migrate
          mise exec -- pnpm local:initialize

      - name: Wait for every other Cloudflare build shard to upload its outputs
        if: matrix.proof != 'none'
        working-directory: app
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-build-shards.sh 'Build cloudflare artifacts (' 5 'Build cloudflare artifacts (${{ matrix.shard }}/5)'

      - name: Download every shard's Cloudflare build outputs
        if: matrix.proof != 'none'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cloudflare-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Cloudflare build outputs of every delivery unit
        if: matrix.proof != 'none'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types, verify the Worker outputs and prove their SSR
        if: matrix.proof == 'outputs'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_AVAILABILITY: https://availability.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CART: https://commerce-cart.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_ORDER: https://commerce-order.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT: https://payment.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_PRIVACY: https://privacy.invalid
          ULTRAMODERN_PUBLIC_URL_PROJECTS: https://projects.invalid
          ULTRAMODERN_PUBLIC_URL_PROMOTION: https://promotion.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
          ULTRAMODERN_PUBLIC_URL_SYMMY_INTEGRATION: https://symmy-integration.invalid
          ULTRAMODERN_PUBLIC_URL_TAX: https://tax.invalid
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types --target cloudflare
          mise exec -- pnpm cloudflare-output:verify
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_GATEWAY_ISSUER_HYPERDRIVE="$SHELL_GATEWAY_ISSUER_DATABASE_URL"
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_PARTY_REGISTRY_HYPERDRIVE="$PARTY_REGISTRY_DATABASE_URL"
          mise exec -- pnpm cloudflare:ssr-proof

      # The built Workers, run together in workerd against real PostgreSQL and SpiceDB, prove the
      # Cloudflare topology end to end: Hyperdrive across requests, SpiceDB over HTTP, module
      # discovery and API calls over service bindings, and SSR.
      - name: Prove the Worker topology against PostgreSQL and SpiceDB
        if: matrix.proof == 'topology'
        working-directory: app
        timeout-minutes: 10
        run: mise exec -- bash scripts/prove-cloudflare-local-topology.sh

      - name: Remove the Worker topology service containers and volumes
        if: always() && matrix.proof == 'topology'
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # Keep one required check. Selected jobs must succeed and every skipped job must be explicitly planned.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        ci-plan,
        workspace-gate,
        workspace-unit,
        static-contracts,
        format-and-lint,
        service-integration,
        node-artifact-build,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected gates and reject unplanned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash app/scripts/check-ci-gates.sh

  # Each GitHub deployment environment deploys to Zerops when DEPLOY_TARGET is `zerops` or unset.
  # Reject the retired Cloudflare target rather than reporting success without deploying anything.
  # Its OUTBOX_WORKER_MODE variable, required and independent of the target, chooses
  # how the Outbox Workers run on Zerops: `dedicated` (one service per owner, highly available) or `host`
  # (every owner in the one outbox-worker-host process, cheap). There is no default, so an environment
  # never inherits another's mode. Stage is deployed from the demo/sales-crm branch by stage-demo-deploy.yml,
  # so main does not deploy: the whole deploy chain below hangs off this job, which runs only when the
  # repository variable MAIN_DEPLOY_ENABLED is 'true'. It is unset, so pushes and dispatches on main run the
  # gates and nothing else. When enabled, pushes deploy stage and production deploys only on an explicit dispatch.
  # Environment variables and secrets are unreadable in a job-level `if`, so this job reads them
  # without creating a deployment (`deployment: false`). An environment without its Zerops project
  # and token deploys nothing and records nothing.
  deploy-target:
    name: Resolve the deploy target of the deployment environment
    if: vars.MAIN_DEPLOY_ENABLED == 'true' && inputs.force-ci-full != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment || 'stage' }}
      deployment: false
    permissions: {}
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      environment: ${{ steps.target.outputs.environment }}
      outbox-worker-mode: ${{ steps.target.outputs.outbox_worker_mode }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve the deploy target and Outbox Worker mode and check the Zerops project and token
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'stage' }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          target="${DEPLOY_TARGET:-zerops}"
          if [[ "$target" != zerops ]]; then
            echo "::error title=Invalid deploy target::$DEPLOY_ENVIRONMENT DEPLOY_TARGET must be zerops, not '$target'; Cloudflare Workers deployment is retired."
            exit 1
          fi
          if [[ -n "$OUTBOX_WORKER_MODE" && "$OUTBOX_WORKER_MODE" != dedicated && "$OUTBOX_WORKER_MODE" != host ]]; then
            echo "::error title=Invalid Outbox Worker mode::$DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE must be dedicated or host, not '$OUTBOX_WORKER_MODE'."
            exit 1
          fi
          {
            echo "environment=$DEPLOY_ENVIRONMENT"
            echo "outbox_worker_mode=$OUTBOX_WORKER_MODE"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"
          if [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]]; then
            # A configured environment deploys Outbox Workers, so it must have chosen how they run.
            if [[ -z "$OUTBOX_WORKER_MODE" ]]; then
              echo "::error title=Outbox Worker mode not set::Set the $DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE variable to dedicated or host."
              exit 1
            fi
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo "::notice title=Zerops deploy not configured::Set the $DEPLOY_ENVIRONMENT ZEROPS_PROJECT_ID variable and ZEROPS_TOKEN secret to deploy $DEPLOY_ENVIRONMENT."
          fi

  # The deploy plan needs no gate, so it is ready by the time the gates pass or prove skipped. On the Cloudflare
  # target it runs only once the edge deploy that ships the placed units is configured too. edge-deploy-readiness
  # checks only stage, the one environment that can target Cloudflare, so it is skipped for production.
  # It records no deployment: deploy-zerops is the environment's deployment, so a plan or migration that
  # succeeds before a failed deploy never moves the environment's diff base.
  capture-application-baseline:
    name: Capture the exact approved release before selection
    if: >-
      ${{ !cancelled() && needs.deploy-target.outputs.configured == 'true'
      && (needs.deploy-target.outputs.target == 'zerops' || needs.edge-deploy-readiness.outputs.configured == 'true') }}
    needs: [deploy-target, edge-deploy-readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.deploy-target.outputs.target == 'cloudflare' && needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    concurrency:
      group: zerops-${{ needs.deploy-target.outputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.baseline.outputs.revision }}
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # A retry must keep B even when the original attempt has already drained it or published T.
      - name: Recover this run's original captured baseline
        if: github.run_attempt != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline

      - name: Connect the runner to the private Zerops database network
        if: github.run_attempt == '1'
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Capture the approved snapshot or proven first-publication absence
        if: github.run_attempt == '1'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/application-baseline"
          mise exec -- pnpm active-composition:publish capture-approved-snapshot \
            --environment "$DEPLOY_ENVIRONMENT" --allow-absent --baseline-only \
            --snapshot-file "$RUNNER_TEMP/application-baseline/baseline.json"

      - name: Record the captured baseline identity
        id: baseline
        run: |
          revision="$(jq -er 'if . == null then "absent" else .composition.revision end' "$RUNNER_TEMP/application-baseline/baseline.json")"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Preserve the original baseline for selection and recovery
        if: github.run_attempt == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline/baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  deploy-plan:
    name: Plan the environment's deployment after merge to main
    if: >-
      !cancelled()
      && needs.deploy-target.outputs.configured == 'true'
      && needs.capture-application-baseline.result == 'success'
      && (needs.deploy-target.outputs.target == 'zerops' || needs.edge-deploy-readiness.outputs.configured == 'true')
    needs: [deploy-target, edge-deploy-readiness, capture-application-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      any: ${{ steps.units.outputs.any }}
      migrator: ${{ steps.impact.outputs.migrator }}
      providers: ${{ steps.units.outputs.providers }}
      shell: ${{ steps.units.outputs.shell }}
      spicedb: ${{ steps.impact.outputs.spicedb }}
      stopped-workers: ${{ steps.impact.outputs.stopped_workers }}
      worker-drift: ${{ steps.worker-drift.outputs.drift }}
      fresh-units: ${{ steps.selection.outputs.fresh }}
      plan: ${{ steps.impact.outputs.plan }}
    env:
      COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      # `host` runs every Outbox Worker in the one outbox-worker-host service instead of each owner's
      # dedicated worker service; the planner and the composition publisher both read it.
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      - name: Resolve the environment's last successful deployment
        id: base
        if: ${{ !inputs.full }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm deployment-base:resolve --environment "$DEPLOY_ENVIRONMENT"

      # An OUTBOX_WORKER_MODE switch changes no source, so the diff cannot show it. The other mode's workers
      # still running, or this mode's workers not running, is that switch, and the plan then deploys every
      # worker of this mode and stops the other mode's.
      - name: Detect Outbox Workers that do not match the Outbox Worker mode
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-mode-drift

      - name: Generate topology-driven deployment impact plan
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
          FULL_PLAN: ${{ inputs.full }}
          WORKER_DRIFT: ${{ steps.worker-drift.outputs.drift }}
        run: |
          plan_arguments=()
          if [[ "$FULL_PLAN" != 'true' ]]; then
            plan_arguments=(--base "$BASE_SHA")
          fi
          if [[ "$WORKER_DRIFT" == 'true' ]]; then
            plan_arguments+=(--reconcile-workers)
          fi
          mise exec -- pnpm deployment-impact:plan \
            --outbox-worker-mode "$OUTBOX_WORKER_MODE" \
            "${plan_arguments[@]}" \
            --head "$GITHUB_SHA"

      - name: Download this run's original approved baseline
        if: env.DEPLOY_TARGET == 'zerops'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline

      - name: Partition the complete Node release from its build impact
        if: env.DEPLOY_TARGET == 'zerops'
        id: selection
        working-directory: app
        env:
          DEPLOYMENT_PLAN_JSON: ${{ steps.impact.outputs.plan }}
          COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
        run: |
          printf '%s\n' "$DEPLOYMENT_PLAN_JSON" > "$RUNNER_TEMP/deployment-impact-plan.json"
          jq '[.phases[] | select(.kind == "provider" or .kind == "shell") | {id}]' \
            "$RUNNER_TEMP/deployment-impact-plan.json" > "$RUNNER_TEMP/impacted-node-units.json"
          mise exec -- pnpm exec node scripts/immutable-application-release.mts select \
            --target zerops --intent-file "$COMPOSITION_INTENT_FILE" \
            --baseline-file "$RUNNER_TEMP/application-baseline/baseline.json" \
            --impacted-units-file "$RUNNER_TEMP/impacted-node-units.json" \
            --selection-file "$RUNNER_TEMP/application-release-selection.json"
          fresh="$(jq -c '.fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end)' "$RUNNER_TEMP/application-release-selection.json")"
          printf 'fresh=%s\n' "$fresh" >> "$GITHUB_OUTPUT"
          jq -n --arg intentFile "$COMPOSITION_INTENT_FILE" \
            '{intentFile:$intentFile}' > "$RUNNER_TEMP/reviewed-release-input.json"

      - name: Preserve the reviewed Node selection and independent impact plan
        if: env.DEPLOY_TARGET == 'zerops'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-application-release-selection-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-release-selection.json
            ${{ runner.temp }}/deployment-impact-plan.json
            ${{ runner.temp }}/reviewed-release-input.json
          if-no-files-found: error
          retention-days: 90

      - name: Record reviewed deployment impact plan
        env:
          DEPLOYMENT_PLAN_JSON: ${{ steps.impact.outputs.plan }}
        run: |
          {
            echo "## Reviewed deployment impact plan ($DEPLOY_ENVIRONMENT, $DEPLOY_TARGET target, $OUTBOX_WORKER_MODE Outbox Workers)"
            echo '```json'
            jq . <<<"$DEPLOYMENT_PLAN_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan carries both targets. On Zerops every planned provider, outbox worker and the Shell
      # deploy in deploy-zerops. On Cloudflare the placed units ship as Workers in deploy-cloudflare, and only
      # the outbox workers, which drain PostgreSQL outboxes, stay on Zerops beside the infrastructure.
      - name: Select the Zerops units of the deploy target
        id: units
        env:
          MIGRATOR: ${{ steps.impact.outputs.migrator }}
          PROVIDERS_JSON: ${{ steps.impact.outputs.providers }}
          SHELL: ${{ steps.impact.outputs.shell }}
          SPICEDB: ${{ steps.impact.outputs.spicedb }}
          WORKERS_JSON: ${{ steps.impact.outputs.workers }}
          FRESH_UNITS_JSON: ${{ steps.selection.outputs.fresh }}
        run: |
          providers="$WORKERS_JSON"
          shell=false
          if [[ "$DEPLOY_TARGET" == zerops ]]; then
            shell="$(jq -r 'any(.[]; .id == "shell-super-app")' <<< "$FRESH_UNITS_JSON")"
          fi
          any=false
          if [[ "$MIGRATOR" == true || "$SPICEDB" == true || "$providers" != '[]' || "$shell" == true ]]; then
            any=true
          fi
          # Zero-build releases still validate and explicitly publish the complete desired set.
          if [[ "$DEPLOY_TARGET" == zerops ]]; then
            any=true
          fi
          {
            echo "any=$any"
            echo "providers=$providers"
            echo "shell=$shell"
          } >>"$GITHUB_OUTPUT"

  # Node releases still use the existing public-asset gateway. Read its origin independently
  # of the retired Workers readiness job, including stage variables stored only in stage-edge.
  node-asset-config:
    name: Read the Node public-asset origin configuration
    if: needs.deploy-target.outputs.configured == 'true' && needs.deploy-target.outputs.target == 'zerops'
    needs: [deploy-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ${{ needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    permissions: {}
    outputs:
      workers_dev_subdomain: ${{ steps.configuration.outputs.workers_dev_subdomain }}
    steps:
      - name: Read the retained public-asset subdomain
        id: configuration
        env:
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: printf 'workers_dev_subdomain=%s\n' "$CLOUDFLARE_WORKERS_DEV_SUBDOMAIN" >> "$GITHUB_OUTPUT"

  node-release-plan:
    name: Plan the selected Node releases with registered provider origins
    if: ${{ !cancelled() && needs.deploy-target.outputs.target == 'zerops' && needs.deploy-plan.result == 'success' && needs.node-asset-config.result == 'success' }}
    needs: [deploy-target, deploy-plan, node-asset-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    permissions:
      actions: read
      contents: read
    outputs:
      fresh-units: ${{ steps.original-selection.outputs.fresh }}
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the complete reviewed selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-application-release-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-selection

      - name: Locate the original Node plans for a retry
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.[].artifacts[] | select(.name == "node-release-plans" and .expired == false)][0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Recover the original source and origin plans
        if: steps.original.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-release-plans
          path: ${{ runner.temp }}/node-release-plans

      - name: Derive fresh plans from the actual clean checkout
        if: steps.original.outputs.exists != 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          WORKERS_DEV_SUBDOMAIN: ${{ needs.node-asset-config.outputs.workers_dev_subdomain || vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: |
          mkdir -p "$RUNNER_TEMP/node-release-plans"
          cp "$RUNNER_TEMP/application-selection/application-release-selection.json" "$RUNNER_TEMP/node-release-plans/selection.json"
          intent_file="$(jq -er '.intentFile' "$RUNNER_TEMP/application-selection/reviewed-release-input.json")"
          jq -n --arg sourceRevision "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" --arg intentFile "$intent_file" \
            '{sourceRevision:$sourceRevision,environment:$environment,target:"zerops",intentFile:$intentFile}' > "$RUNNER_TEMP/node-release-plans/metadata.json"
          # Only the existing planner orders dependencies; membership and migration scope remain independent.
          GITHUB_OUTPUT="$RUNNER_TEMP/node-order.outputs" mise exec -- pnpm --silent deployment-impact:plan \
            --head "$GITHUB_SHA" --outbox-worker-mode "$OUTBOX_WORKER_MODE" > "$RUNNER_TEMP/node-release-plans/provider-order.json"
          jq --slurpfile selection "$RUNNER_TEMP/node-release-plans/selection.json" \
            '[.phases[] | select(.kind == "provider") | .id] as $order | $selection[0] as $selection |
             [$order[] as $id | $selection.fresh[] | select(.id == $id)] +
             (if $selection.shell.mode == "fresh" then [$selection.shell.unit] else [] end)' \
            "$RUNNER_TEMP/node-release-plans/provider-order.json" > "$RUNNER_TEMP/node-release-plans/deployment-order.json"
          jq -e --slurpfile selection "$RUNNER_TEMP/node-release-plans/selection.json" \
            'map(.id) as $actual | ($selection[0] | .fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end) | map(.id)) as $expected |
             ($actual | sort) == ($expected | sort) and ($actual | unique | length) == ($actual | length)' \
            "$RUNNER_TEMP/node-release-plans/deployment-order.json" >/dev/null
          mapfile -t units < <(jq -r '.fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end) | .[] | [.id,.path] | @tsv' "$RUNNER_TEMP/node-release-plans/selection.json")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id unit_path <<< "$unit"
            setup="$id"
            if [[ "$id" == shell-super-app ]]; then
              setup=shellsuperapp
            fi
            service_id="$(mise exec -- pnpm --silent active-composition:publish stage-service-id --setup "$setup")"
            backend_url="$(mise exec -- pnpm --silent active-composition:publish stage-backend-url --setup "$setup")"
            mise exec -- pnpm exec node scripts/immutable-application-release.mts node-plan \
              --app-directory "$unit_path" --backend-base-url "$backend_url" \
              --project-id "$ZEROPS_PROJECT_ID" --service-id "$service_id" --setup "$setup" \
              --workers-dev-subdomain "$WORKERS_DEV_SUBDOMAIN" \
              --plan-file "$RUNNER_TEMP/node-release-plans/$id.json"
          done

      - name: Preserve the original Node build plans
        if: steps.original.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-release-plans
          path: ${{ runner.temp }}/node-release-plans
          if-no-files-found: error
          retention-days: 90

      - name: Expose the original source selection for every retry
        id: original-selection
        run: |
          jq -e --arg source "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            '.sourceRevision == $source and .environment == $environment and .target == "zerops" and (.intentFile | type == "string")' \
            "$RUNNER_TEMP/node-release-plans/metadata.json" >/dev/null
          fresh="$(jq -c '.fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end)' "$RUNNER_TEMP/node-release-plans/selection.json")"
          printf 'fresh=%s\n' "$fresh" >> "$GITHUB_OUTPUT"

  node-release-build:
    name: Build selected Node release ${{ matrix.unit.id }}
    if: >-
      ${{ !cancelled() && needs.node-release-plan.result == 'success'
      && needs.node-release-plan.outputs.fresh-units != '[]' }}
    needs: [deploy-plan, node-release-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        unit: ${{ fromJSON(needs.node-release-plan.outputs.fresh-units) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the exact planned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the original Node plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-release-plans
          path: ${{ runner.temp }}/node-release-plans

      # This build receives only public origins, never a provider or database credential.
      - name: Build the actual Node artifact with its immutable public origin
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          UNIT_ID: ${{ matrix.unit.id }}
          UNIT_PACKAGE: ${{ matrix.unit.packageName }}
        run: |
          plan="$RUNNER_TEMP/node-release-plans/$UNIT_ID.json"
          source_revision="$(git rev-parse HEAD)"
          [[ "$source_revision" == "$GITHUB_SHA" ]] || exit 1
          [[ "$source_revision" == "$(jq -er '.sourceRevision' "$plan")" ]] || exit 1
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key,.value] | @tsv' "$plan")
          started="$SECONDS"
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm --filter "$UNIT_PACKAGE" run build
          mkdir -p ".codex/reports/releases/$UNIT_ID"
          cp "$plan" ".codex/reports/releases/$UNIT_ID/node-plan.json"
          jq -n --arg appId "$UNIT_ID" --arg sourceRevision "$source_revision" --argjson elapsedSeconds "$((SECONDS-started))" \
            '{appId:$appId,sourceRevision:$sourceRevision,elapsedSeconds:$elapsedSeconds}' \
            > ".codex/reports/releases/$UNIT_ID/node-build-timing.json"

      - name: Pack this Node release's actual build output
        working-directory: app
        env:
          UNIT_PATH: ${{ matrix.unit.path }}
          UNIT_ID: ${{ matrix.unit.id }}
        run: |
          files="$RUNNER_TEMP/node-unit-files"
          git ls-files --others --ignored --exclude-standard --directory -z -- "$UNIT_PATH" \
            | grep -zv '/node_modules/$' > "$files"
          printf '%s\0' ".codex/reports/releases/$UNIT_ID" >> "$files"
          tar --null --files-from="$files" --create --zstd --file "$RUNNER_TEMP/node-release-unit.tar.zst"

      - name: Preserve the actual Node build for provider verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-release-unit-${{ matrix.unit.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-release-unit.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # Incompatible first-cutover migrations require concrete provider quiescence first. Later releases
  # already use the native authority fences; this guard then performs no provider stop or deletion.
  initial-composition-cutover-guard:
    name: Verify first-cutover provider quiescence before migrations
    if: >-
      ${{ !cancelled() && needs.workspace-gates.result == 'success' && needs.deploy-plan.result == 'success'
      && (needs.deploy-target.outputs.target == 'zerops' || needs.edge-plan.result == 'success') }}
    needs: [workspace-gates, deploy-target, deploy-plan, edge-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.deploy-target.outputs.target == 'cloudflare' && needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    concurrency:
      group: zerops-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the initial provider quiescence receipt
        if: vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Require native provider quiescence before the first authority exists
        working-directory: app
        run: mise exec -- pnpm active-composition:publish verify-initial-cutover --environment "$DEPLOY_ENVIRONMENT"

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  prepare-node-composition:
    name: Retain the complete Node candidate before database changes
    if: >-
      ${{ !cancelled() && needs.deploy-target.outputs.target == 'zerops'
      && needs.node-release-plan.result == 'success' && needs.initial-composition-cutover-guard.result == 'success'
      && (needs.node-release-build.result == 'success'
      || (needs.node-release-build.result == 'skipped' && needs.node-release-plan.outputs.fresh-units == '[]')) }}
    needs:
      [
        deploy-target,
        deploy-plan,
        node-release-plan,
        node-release-build,
        initial-composition-cutover-guard,
        capture-application-baseline,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Public artifact uploads use the existing deployment gateway's credentials, never a runtime token.
    environment:
      name: ${{ needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    concurrency:
      group: zerops-${{ needs.deploy-target.outputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the original approved baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline

      - name: Download the original Node plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-release-plans
          path: ${{ runner.temp }}/node-release-plans

      - name: Restore the original selection and reviewed intent
        run: |
          jq -e --arg source "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            '.sourceRevision == $source and .environment == $environment and .target == "zerops"' \
            "$RUNNER_TEMP/node-release-plans/metadata.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/application-selection"
          cp "$RUNNER_TEMP/node-release-plans/selection.json" "$RUNNER_TEMP/application-selection/application-release-selection.json"
          printf 'COMPOSITION_INTENT_FILE=%s\n' "$(jq -er '.intentFile' "$RUNNER_TEMP/node-release-plans/metadata.json")" >> "$GITHUB_ENV"

      - name: Locate the original prepared Node identity
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.[].artifacts[] | select(.name == "prepared-application-release" and .expired == false)][0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            printf 'prepared=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prepared=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Recover the original complete candidate
        if: steps.recovery.outputs.prepared == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Download the actual fresh Node build outputs
        if: steps.recovery.outputs.prepared != 'true' && needs.node-release-plan.outputs.fresh-units != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-release-unit-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-release-builds

      - name: Restore the actual compiled Node artifacts
        if: steps.recovery.outputs.prepared != 'true'
        working-directory: app
        env:
          FRESH_UNITS_JSON: ${{ needs.node-release-plan.outputs.fresh-units }}
        run: |
          while IFS= read -r id; do
            tar --extract --zstd --file "$RUNNER_TEMP/node-release-builds/node-release-unit-$id-$GITHUB_RUN_ATTEMPT/node-release-unit.tar.zst"
          done < <(jq -r '.[].id' <<< "$FRESH_UNITS_JSON")

      - name: Recover original receipts for the exact approved Node baseline
        if: steps.recovery.outputs.prepared != 'true'
        env:
          BASELINE_REVISION: ${{ needs.capture-application-baseline.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-node-receipts"
          if jq -e '.retained == [] and .shell.mode == "fresh"' "$RUNNER_TEMP/application-selection/application-release-selection.json" >/dev/null; then
            exit 0
          fi
          [[ "$BASELINE_REVISION" =~ ^[a-f0-9]{64}$ ]] || exit 1
          artifact_id="$(gh api --paginate --slurp --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="application-release-receipts-$BASELINE_REVISION" -f per_page=100 \
            --jq "[.[].artifacts[] | select(.expired == false and .workflow_run.repository_id == $REPOSITORY_ID and .workflow_run.head_repository_id == $REPOSITORY_ID and .workflow_run.head_branch == \"main\")][0].id // empty")"
          if [[ -z "$artifact_id" ]]; then
            echo 'The exact baseline receipt archive is unavailable. Retained backend evidence cannot be reconstructed; an explicit full build is required.' >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/original-node-receipts.zip"
          python3 - <<'PY'
          import os, pathlib, re, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'original-node-receipts.zip') as archive:
              files = archive.infolist()
              if len(files) > 257 or sum(file.file_size for file in files) > 16 * 1024 * 1024:
                  raise SystemExit('Receipt archive exceeds the bounded membership budget')
              seen = set()
              for file in files:
                  if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*\.json', file.filename) or file.filename in seen:
                      raise SystemExit('Receipt archive contains an unexpected or duplicate path')
                  seen.add(file.filename)
                  (root / 'original-node-receipts' / file.filename).write_bytes(archive.read(file))
          PY

      - name: Connect the runner to the existing publication database
        if: steps.recovery.outputs.prepared != 'true'
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Retain verified public assets without claiming a deployed Node backend
        if: steps.recovery.outputs.prepared != 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          FRESH_UNITS_JSON: ${{ needs.node-release-plan.outputs.fresh-units }}
        run: |
          mkdir -p "$RUNNER_TEMP/prepared-release/asset-receipts" "$RUNNER_TEMP/prepared-release/receipts" "$RUNNER_TEMP/prepared-release/plans"
          mapfile -t units < <(jq -r '.[] | [.id,.path] | @tsv' <<< "$FRESH_UNITS_JSON")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id unit_path <<< "$unit"
            mise exec -- pnpm exec node scripts/immutable-application-release.mts node-assets \
              --app-directory "$unit_path" --plan-file "$RUNNER_TEMP/node-release-plans/$id.json" \
              --assets-receipt-file "$RUNNER_TEMP/prepared-release/asset-receipts/$id.json"
          done
          while IFS= read -r id; do
            cp "$RUNNER_TEMP/original-node-receipts/$id.json" "$RUNNER_TEMP/prepared-release/receipts/$id.json"
          done < <(jq -r '.retained[].id, (if .shell.mode == "retained" then .shell.unit.id else empty end)' "$RUNNER_TEMP/application-selection/application-release-selection.json")
          cp "$RUNNER_TEMP/node-release-plans/"*.json "$RUNNER_TEMP/prepared-release/plans/"

      - name: Assemble and validate the complete predeployment Node identity
        if: steps.recovery.outputs.prepared != 'true'
        working-directory: app
        run: |
          selection="$RUNNER_TEMP/application-selection/application-release-selection.json"
          COMPOSITION_INTENT_FILE="$(jq -er '.intentFile' "$RUNNER_TEMP/application-selection/reviewed-release-input.json")"
          evidence=()
          while IFS= read -r id; do
            evidence+=(--assets-receipt-file "$RUNNER_TEMP/prepared-release/asset-receipts/$id.json")
          done < <(jq -r '.fresh[].id' "$selection")
          while IFS= read -r id; do
            evidence+=(--receipt-file "$RUNNER_TEMP/prepared-release/receipts/$id.json")
          done < <(jq -r '.retained[].id' "$selection")
          shell_directory=receipts
          if jq -e '.shell.mode == "fresh"' "$selection" >/dev/null; then
            shell_directory=asset-receipts
          fi
          evidence+=(--shell-receipt-file "$RUNNER_TEMP/prepared-release/$shell_directory/shell-super-app.json")
          if jq -e '. != null' "$RUNNER_TEMP/application-baseline/baseline.json" >/dev/null; then
            evidence+=(--approved-baseline-file "$RUNNER_TEMP/application-baseline/baseline.json")
          fi
          mise exec -- pnpm exec node scripts/immutable-application-release.mts node-candidate --phase preflight \
            --intent-file "$COMPOSITION_INTENT_FILE" --selection-file "$selection" "${evidence[@]}" \
            --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json"
          mise exec -- pnpm active-composition:publish prepare --environment "$DEPLOY_ENVIRONMENT" \
            --intent-file "$COMPOSITION_INTENT_FILE" --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json" \
            --selection-file "$selection" --expected-composition-file "$RUNNER_TEMP/prepared-release/expected-composition.json"
          cp "$selection" "$RUNNER_TEMP/prepared-release/selection.json"
          cp "$RUNNER_TEMP/application-baseline/baseline.json" "$RUNNER_TEMP/prepared-release/baseline.json"
          source_revision="$(git rev-parse HEAD)"
          [[ "$source_revision" == "$GITHUB_SHA" ]] || exit 1
          jq -n --arg sourceRevision "$source_revision" --arg environment "$DEPLOY_ENVIRONMENT" --arg intentFile "$COMPOSITION_INTENT_FILE" \
            '{sourceRevision:$sourceRevision,environment:$environment,target:"zerops",intentFile:$intentFile}' > "$RUNNER_TEMP/prepared-release/metadata.json"

      - name: Validate the original source and environment after recovery
        env:
          APP_ENV_PATH: /dev/null
        run: |
          jq -e --arg source "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            '.sourceRevision == $source and .environment == $environment and .target == "zerops"' \
            "$RUNNER_TEMP/prepared-release/metadata.json" >/dev/null

      - name: Reobserve original retained Node receipts before retry migrations
        if: steps.recovery.outputs.prepared == 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          release="$RUNNER_TEMP/prepared-release"
          evidence=()
          while IFS= read -r id; do
            evidence+=(--assets-receipt-file "$release/asset-receipts/$id.json")
          done < <(jq -r '.fresh[].id' "$release/selection.json")
          while IFS= read -r id; do
            evidence+=(--receipt-file "$release/receipts/$id.json")
          done < <(jq -r '.retained[].id' "$release/selection.json")
          shell_directory=receipts
          if jq -e '.shell.mode == "fresh"' "$release/selection.json" >/dev/null; then
            shell_directory=asset-receipts
          fi
          evidence+=(--shell-receipt-file "$release/$shell_directory/shell-super-app.json")
          if jq -e '. != null' "$release/baseline.json" >/dev/null; then
            evidence+=(--approved-baseline-file "$release/baseline.json")
          fi
          mise exec -- pnpm exec node scripts/immutable-application-release.mts node-candidate --phase preflight \
            --intent-file "$(jq -er '.intentFile' "$release/metadata.json")" --selection-file "$release/selection.json" \
            "${evidence[@]}" --candidate-file "$RUNNER_TEMP/reobserved-node-candidate.json"
          cmp <(jq -S . "$release/candidate.json") <(jq -S . "$RUNNER_TEMP/reobserved-node-candidate.json")

      - name: Preserve the original complete predeployment identity
        if: steps.recovery.outputs.prepared != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release
          if-no-files-found: error
          retention-days: 90

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  # A schema change drains and seals the old authority before touching its database. The native
  # publisher session lock stays held through verified migration and migrator stop completion.
  deploy-migrations:
    name: Migrate the environment's database and SpiceDB after the gates
    if: >-
      ${{ !cancelled() && needs.workspace-gates.result == 'success' && needs.deploy-plan.result == 'success'
      && needs.initial-composition-cutover-guard.result == 'success'
      && ((needs.deploy-target.outputs.target == 'cloudflare' && needs.deploy-cloudflare.result == 'success')
      || (needs.deploy-target.outputs.target == 'zerops' && needs.prepare-node-composition.result == 'success')) }}
    needs:
      [
        workspace-gates,
        deploy-target,
        deploy-plan,
        initial-composition-cutover-guard,
        deploy-cloudflare,
        prepare-node-composition,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ needs.deploy-target.outputs.target == 'cloudflare' && needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    # Provider quiescence precedes the incompatible initial migration; publication fences govern later releases.
    concurrency:
      group: zerops-migrations-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
      ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SPICEDB_SERVICE_ID: ${{ vars.ZEROPS_SPICEDB_SERVICE_ID }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the original complete candidate and expected identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Prepare private legacy completion evidence
        run: |
          ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY="$RUNNER_TEMP/legacy-completion-evidence"
          install -d -m 700 "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY"
          printf 'ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY=%s\n' "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Download the initial provider retirement receipt for migration
        if: vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Install Zerops CLI
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.3
          mise reshim

      # app/zerops.yaml describes stage. Every push reads a copy that names the deploying environment, so
      # another environment's builds and runtimes never run stage-only behaviour. Production's copy also
      # points every runtime at its TLS SpiceDB endpoint, the production environment variable SPICEDB_ENDPOINT.
      - name: Materialize the environment's zerops.yaml
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      # The owning closure chooses migrate, verify-only or none. It is independent of the build set.
      - name: Run the exact migration prerequisite closure and verifiers
        id: migrator
        working-directory: app
        run: >-
          mise exec -- pnpm active-composition:publish migrate
          --environment "$DEPLOY_ENVIRONMENT"
          --intent-file "$(jq -er '.intentFile' "$RUNNER_TEMP/prepared-release/metadata.json")"
          --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json"
          --selection-file "$RUNNER_TEMP/prepared-release/selection.json"
          --expected-composition-file "$RUNNER_TEMP/prepared-release/expected-composition.json"
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --version-name "$GITHUB_SHA"

      - name: Show bounded migrator logs after failure
        if: failure() && steps.migrator.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Deploy SpiceDB when affected
        if: needs.deploy-plan.outputs.spicedb == 'true'
        id: spicedb
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --setup spicedb
          --version-name "$GITHUB_SHA"

      - name: Show bounded SpiceDB logs after failure
        if: failure() && steps.spicedb.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

      - name: Retain native legacy completion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-completion-evidence-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-completion-evidence
          if-no-files-found: ignore
          retention-days: 30

  deploy-node-backends:
    name: Deploy the original prepared Node release after migrations
    if: >-
      ${{ !cancelled() && needs.deploy-target.outputs.target == 'zerops'
      && needs.deploy-migrations.result == 'success' && needs.prepare-node-composition.result == 'success' }}
    needs: [deploy-target, node-release-plan, prepare-node-composition, deploy-migrations]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment:
      name: ${{ needs.deploy-target.outputs.environment == 'stage' && 'stage-edge' || needs.deploy-target.outputs.environment }}
      deployment: false
    concurrency:
      group: zerops-${{ needs.deploy-target.outputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the original predeployment candidate and evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Locate the original complete deployed Node handoff
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq 'any(.[].artifacts[]; .name == "deployed-node-release" and .expired == false)')"
          revision="$(jq -er '.revision' "$RUNNER_TEMP/prepared-release/expected-composition.json")"
          [[ "$revision" =~ ^[a-f0-9]{64}$ ]] || exit 1
          receipt_archive="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq "any(.[].artifacts[]; .name == \"application-release-receipts-$revision\" and .expired == false)")"
          if [[ "$receipt_archive" == true && "$exists" != true ]]; then
            echo 'The immutable receipt archive exists but its original complete deployed handoff is unavailable; refusing a new backend push.' >&2
            exit 1
          fi
          printf 'complete=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      - name: Recover the original actually deployed release before any retry push
        if: steps.recovery.outputs.complete == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-node-release
          path: ${{ runner.temp }}/deployed-node-release

      - name: Initialize a separate deployed handoff without changing the prepared identity
        if: steps.recovery.outputs.complete != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-node-release/receipts"
          cp -R "$RUNNER_TEMP/prepared-release/." "$RUNNER_TEMP/deployed-node-release/"

      - name: Validate the original source target environment and reviewed intent
        run: |
          jq -e --arg source "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            '.sourceRevision == $source and .environment == $environment and .target == "zerops" and (.intentFile | type == "string")' \
            "$RUNNER_TEMP/deployed-node-release/metadata.json" >/dev/null
          cmp <(jq -S . "$RUNNER_TEMP/prepared-release/metadata.json") <(jq -S . "$RUNNER_TEMP/deployed-node-release/metadata.json")
          cmp "$RUNNER_TEMP/prepared-release/expected-composition.json" "$RUNNER_TEMP/deployed-node-release/expected-composition.json"
          cmp <(jq -S . "$RUNNER_TEMP/prepared-release/selection.json") <(jq -S . "$RUNNER_TEMP/deployed-node-release/selection.json")

      - name: Download this attempt's genuine selected Node build outputs
        if: steps.recovery.outputs.complete != 'true' && needs.node-release-plan.outputs.fresh-units != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-release-unit-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-release-builds

      - name: Unpack the originally selected business units and Shell
        if: steps.recovery.outputs.complete != 'true'
        working-directory: app
        run: |
          while IFS= read -r id; do
            tar --extract --zstd --file "$RUNNER_TEMP/node-release-builds/node-release-unit-$id-$GITHUB_RUN_ATTEMPT/node-release-unit.tar.zst"
          done < <(jq -r '.fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end) | .[].id' "$RUNNER_TEMP/deployed-node-release/selection.json")

      - name: Install Zerops CLI for original fresh deployments
        if: steps.recovery.outputs.complete != 'true' && needs.node-release-plan.outputs.fresh-units != '[]'
        run: |
          npm install --global @zerops/zcli@1.1.3
          mise reshim

      - name: Materialize the original target environment provider configuration
        if: steps.recovery.outputs.complete != 'true' && needs.node-release-plan.outputs.fresh-units != '[]'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${arguments[@]}"
          printf 'ZEROPS_YAML_PATH=%s\n' "$ZEROPS_YAML_PATH" >> "$GITHUB_ENV"

      - name: Connect the runner to the existing publication database
        id: composition-vpn
        if: steps.recovery.outputs.complete != 'true' && needs.node-release-plan.outputs.fresh-units != '[]'
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Witness guarded original business deployments followed by Shell
        if: steps.recovery.outputs.complete != 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          release="$RUNNER_TEMP/deployed-node-release"
          intent_file="$(jq -er '.intentFile' "$release/metadata.json")"
          while IFS=$'\t' read -r id unit_path; do
            mise exec -- pnpm exec node scripts/immutable-application-release.mts node-deploy \
              --app-directory "$unit_path" --assets-receipt-file "$release/asset-receipts/$id.json" \
              --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json" --selection-file "$release/selection.json" \
              --expected-composition-file "$release/expected-composition.json" --intent-file "$intent_file" \
              --zerops-yaml-path "$ZEROPS_YAML_PATH" --receipt-file "$release/receipts/$id.json"
          done < <(jq -r '.[] | [.id,.path] | @tsv' "$release/plans/deployment-order.json")

      - name: Verify every actual receipt against the original complete target
        id: candidate
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          release="$RUNNER_TEMP/deployed-node-release"
          evidence=()
          while IFS= read -r id; do
            evidence+=(--receipt-file "$release/receipts/$id.json")
          done < <(jq -r '.complete[].id' "$release/selection.json")
          evidence+=(--shell-receipt-file "$release/receipts/shell-super-app.json")
          if jq -e '. != null' "$release/baseline.json" >/dev/null; then
            evidence+=(--approved-baseline-file "$release/baseline.json")
          fi
          mise exec -- pnpm exec node scripts/immutable-application-release.mts node-candidate --phase deployed \
            --intent-file "$(jq -er '.intentFile' "$release/metadata.json")" \
            --selection-file "$release/selection.json" "${evidence[@]}" --candidate-file "$release/verified-candidate.json"
          cmp <(jq -S . "$RUNNER_TEMP/prepared-release/candidate.json") <(jq -S . "$release/verified-candidate.json")
          mv "$release/verified-candidate.json" "$release/candidate.json"

      # The complete handoff precedes the archive, so an existing archive always has recoverable original receipts.
      - name: Preserve the original complete deployed Node handoff
        if: steps.recovery.outputs.complete != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-node-release
          path: ${{ runner.temp }}/deployed-node-release
          if-no-files-found: error
          retention-days: 90

      - name: Locate the immutable complete receipt archive by exact Composition R
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(jq -er '.revision' "$RUNNER_TEMP/deployed-node-release/expected-composition.json")"
          [[ "$revision" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          exists="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq "any(.[].artifacts[]; .name == \"application-release-receipts-$revision\" and .expired == false)")"
          printf 'archived=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      - name: Preserve all actual original Node receipts under exact Composition R
        if: steps.identity.outputs.archived != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-release-receipts-${{ steps.identity.outputs.revision }}
          path: ${{ runner.temp }}/deployed-node-release/receipts
          if-no-files-found: error
          retention-days: 90

      - name: Retain this attempt's raw Node deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-deployment-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployed-node-release
          if-no-files-found: ignore
          retention-days: 90

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  # Outbox Workers retain their original environment and mode; publication follows their successful deployment.
  deploy-zerops:
    name: Deploy the environment's Zerops services after merge to main
    if: >-
      ${{ !cancelled() && needs.deploy-migrations.result == 'success'
      && (needs.deploy-target.outputs.target == 'cloudflare' || needs.deploy-node-backends.result == 'success') }}
    needs: [deploy-target, deploy-plan, deploy-migrations, deploy-node-backends]
    runs-on: ubuntu-24.04
    # Each Zerops push builds its unit remotely for about 12 minutes and units deploy one after another in
    # plan order, so a full topology deploy (12 units plus publication) needs about 3 hours.
    timeout-minutes: 240
    environment: ${{ needs.deploy-target.outputs.environment }}
    # Serializes with the scheduled composition refresh so no publication interleaves with a deploy.
    concurrency:
      group: zerops-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SHELL_SERVICE_ID: ${{ vars.ZEROPS_SHELL_SERVICE_ID }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the complete actually deployed Node release
        if: env.DEPLOY_TARGET == 'zerops'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-node-release
          path: ${{ runner.temp }}/deployed-node-release

      - name: Verify the original Node publication source and environment
        if: env.DEPLOY_TARGET == 'zerops'
        run: |
          jq -e --arg source "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            '.sourceRevision == $source and .environment == $environment and .target == "zerops"' \
            "$RUNNER_TEMP/deployed-node-release/metadata.json" >/dev/null

      - name: Prepare private legacy completion evidence
        run: |
          ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY="$RUNNER_TEMP/legacy-completion-evidence"
          install -d -m 700 "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY"
          printf 'ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY=%s\n' "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Download the initial provider quiescence receipt for Node publication
        if: needs.deploy-plan.outputs.any == 'true' && env.DEPLOY_TARGET == 'zerops' && vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Install Zerops CLI
        if: needs.deploy-plan.outputs.any == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.3
          mise reshim

      - name: Materialize the environment's zerops.yaml
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_TARGET" == 'zerops' ]]; then
            export COMPOSITION_INTENT_FILE
            COMPOSITION_INTENT_FILE="$(jq -er '.intentFile' "$RUNNER_TEMP/deployed-node-release/metadata.json")"
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Deploy the selected Outbox Workers
        if: needs.deploy-plan.outputs.providers != '[]'
        env:
          UNITS_JSON: ${{ needs.deploy-plan.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # Every publication stays inside the environment lock; all hosts read the same native KV value.
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        if: needs.deploy-plan.outputs.any == 'true' && env.DEPLOY_TARGET == 'zerops'
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      # Switching OUTBOX_WORKER_MODE leaves the other mode's Outbox Workers running. The plan names them in every
      # run that deploys this mode's workers, so exactly one set of workers delivers the outbox.
      - name: Stop the other Outbox Worker mode's workers
        if: needs.deploy-plan.outputs.stopped-workers != '' && needs.deploy-plan.outputs.stopped-workers != '[]'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          STOPPED_WORKERS_JSON: ${{ needs.deploy-plan.outputs.stopped-workers }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          while IFS= read -r setup; do
            mise exec -- pnpm --silent active-composition:publish stop-service --setup "$setup"
          done < <(jq -r '.[]' <<<"$STOPPED_WORKERS_JSON")

      - name: Publish the complete active Application Composition
        if: needs.deploy-plan.outputs.any == 'true' && env.DEPLOY_TARGET == 'zerops'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: >-
          mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT"
          --intent-file "$(jq -er '.intentFile' "$RUNNER_TEMP/deployed-node-release/metadata.json")"
          --candidate-file "$RUNNER_TEMP/deployed-node-release/candidate.json"
          --selection-file "$RUNNER_TEMP/deployed-node-release/selection.json"
          --expected-composition-file "$RUNNER_TEMP/deployed-node-release/expected-composition.json"

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

      - name: Retain native legacy completion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-completion-evidence-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-completion-evidence
          if-no-files-found: ignore
          retention-days: 30

  # The edge deploy runs only when the repository is configured for Cloudflare: the
  # CLOUDFLARE_ACCOUNT_ID variable, the `stage-edge` CLOUDFLARE_API_TOKEN secret, and a complete
  # reviewed build environment (the Shell origin and every placed Worker's public URL). Environment
  # secrets are unreadable in a job-level `if`, so this job reads them from `stage-edge` without
  # creating a deployment (`deployment: false`); only a real edge deploy enters its history.
  edge-deploy-readiness:
    name: Check the Cloudflare edge deploy configuration
    # Keep the retired Workers deploy chain disabled even if old Cloudflare credentials remain configured.
    if: ${{ false }}
    needs: [deploy-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
      assets-configured: ${{ steps.configuration.outputs.assets_configured }}
      workers_dev_subdomain: ${{ steps.configuration.outputs.workers_dev_subdomain }}
    steps:
      - name: Checkout the edge placement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/topology/cloudflare-placement.json
          sparse-checkout-cone-mode: false

      - name: Check the Cloudflare account, deploy token and edge build environment
        id: configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
          ONTOS_IMMUTABLE_RELEASE_SECRETS: ${{ secrets.ONTOS_IMMUTABLE_RELEASE_SECRETS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          missing=()
          # Node backends reuse this existing public-asset gateway without requiring Worker data bindings.
          printf 'workers_dev_subdomain=%s\n' "$CLOUDFLARE_WORKERS_DEV_SUBDOMAIN" >> "$GITHUB_OUTPUT"
          assets_configured=false
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_WORKERS_DEV_SUBDOMAIN" ]]; then
            assets_configured=true
          fi
          printf 'assets_configured=%s\n' "$assets_configured" >> "$GITHUB_OUTPUT"
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=('the CLOUDFLARE_ACCOUNT_ID variable')
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=('the stage-edge CLOUDFLARE_API_TOKEN secret')
          [[ -n "$CLOUDFLARE_WORKERS_DEV_SUBDOMAIN" ]] || missing+=('the CLOUDFLARE_WORKERS_DEV_SUBDOMAIN variable')
          [[ -n "$ONTOS_IMMUTABLE_RELEASE_SECRETS" ]] || missing+=('the stage-edge ONTOS_IMMUTABLE_RELEASE_SECRETS secret')
          [[ -n "$DATABASE_URL" && -n "$DATABASE_ADMIN_URL" ]] || missing+=('the stage-edge runtime and administrative database secrets')
          [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]] || missing+=('the stage-edge Zerops project and private-network token')
          # The placed units bake the Shell origin into their API CORS allowlist, the output
          # verifier requires every Worker's public URL, and every Worker binds the private data
          # plane: PostgreSQL through its Hyperdrive config, SpiceDB through its Workers VPC service.
          while IFS= read -r key; do
            missing+=("buildEnvironment.$key")
          done < <(jq -r '.buildEnvironment as $environment | (["ULTRAMODERN_MF_DEV_ORIGIN", "ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID", "ULTRAMODERN_CLOUDFLARE_PARTY_REGISTRY_HYPERDRIVE_ID", "ULTRAMODERN_CLOUDFLARE_GATEWAY_ISSUER_HYPERDRIVE_ID", "ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID", "ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID"] + [.units[] | "ULTRAMODERN_PUBLIC_URL_" + (ascii_upcase | gsub("-"; "_"))])[] | select(($environment[.] // "") == "")' app/topology/cloudflare-placement.json)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=false' >>"$GITHUB_OUTPUT"
          joined="$(IFS=','; echo "${missing[*]}")"
          # Without the edge deploy the Cloudflare target would migrate and swap the outbox workers
          # while the old Workers keep serving, so a Cloudflare stage fails before any Zerops change.
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            echo "::error title=Edge deploy not configured::Stage targets Cloudflare but misses ${joined//,/, }; nothing was deployed."
            exit 1
          fi
          echo "::notice title=Edge deploy not configured::Missing ${joined//,/, }; edge units were not deployed."

  # Edge units (topology/cloudflare-placement.json) ship as Cloudflare Workers. edge-plan and edge-build
  # wait only for the deploy target. Retained artifact upload does not change the live Shell.
  # Only successful publication followed by the approved ingress update records stage-edge history,
  # so a failed promotion cannot hide the Shell build still needed by a later recovery.
  edge-plan:
    name: Plan the edge units to deploy
    if: >-
      ${{ !cancelled() && needs.deploy-target.outputs.target == 'cloudflare'
      && needs.edge-deploy-readiness.outputs.configured == 'true' && needs.capture-application-baseline.result == 'success'
      && needs.deploy-plan.result == 'success' }}
    needs: [deploy-target, edge-deploy-readiness, capture-application-baseline, deploy-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      cloudflare: ${{ steps.selection.outputs.cloudflare }}
      workers_dev_subdomain: ${{ needs.edge-deploy-readiness.outputs.workers_dev_subdomain }}
      cloudflare_retirements: ${{ steps.impact.outputs.cloudflare_retirements }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      # A full plan deploys every placed unit but still checks retirements against the last edge
      # deployment; only a first seed has none.
      - name: Resolve the last successful edge deployment
        id: base
        working-directory: app
        env:
          FULL_PLAN: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          optional=()
          if [[ "$FULL_PLAN" == 'true' ]]; then
            optional=(--optional)
          fi
          mise exec -- pnpm deployment-base:resolve --environment stage-edge "${optional[@]}"

      # A full recovery run after rewritten history may name a base no branch reaches any more; the
      # planner needs its placement to check retirements, so fetch that commit by id.
      - name: Fetch the last edge deployment commit
        if: steps.base.outputs.base != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
              fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Plan the impacted edge units
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
          FULL_PLAN: ${{ inputs.full }}
          OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
          WORKER_DRIFT: ${{ needs.deploy-plan.outputs.worker-drift }}
        run: |
          base_arguments=()
          if [[ -n "$BASE_SHA" ]]; then
            base_arguments=(--placement-base "$BASE_SHA")
          fi
          if [[ "$FULL_PLAN" != 'true' ]]; then
            base_arguments+=(--base "$BASE_SHA")
          fi
          if [[ "$WORKER_DRIFT" == 'true' ]]; then
            base_arguments+=(--reconcile-workers)
          fi
          mise exec -- pnpm deployment-impact:plan \
            --outbox-worker-mode "$OUTBOX_WORKER_MODE" \
            "${base_arguments[@]}" \
            --head "$GITHUB_SHA"

      - name: Download this run's original approved baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline

      - name: Partition the complete reviewed release from its build impact
        id: selection
        working-directory: app
        env:
          IMPACTED_UNITS_JSON: ${{ steps.impact.outputs.cloudflare }}
          COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
        run: |
          git ls-files --error-unmatch "$COMPOSITION_INTENT_FILE" >/dev/null
          printf '%s\n' "$IMPACTED_UNITS_JSON" >"$RUNNER_TEMP/impacted-edge-units.json"
          mise exec -- pnpm exec node scripts/immutable-application-release.mts select \
            --intent-file "$COMPOSITION_INTENT_FILE" \
            --baseline-file "$RUNNER_TEMP/application-baseline/baseline.json" \
            --impacted-units-file "$RUNNER_TEMP/impacted-edge-units.json" \
            --selection-file "$RUNNER_TEMP/application-release-selection.json"
          printf 'cloudflare=%s\n' "$(jq -c '.fresh + (if .shell.mode == "fresh" then [.shell.unit] else [] end)' "$RUNNER_TEMP/application-release-selection.json")" >>"$GITHUB_OUTPUT"
          jq -n --arg intentFile "$COMPOSITION_INTENT_FILE" \
            '{intentFile:$intentFile}' > "$RUNNER_TEMP/reviewed-release-input.json"

      - name: Preserve the complete reviewed edge selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-application-release-selection-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-release-selection.json
            ${{ runner.temp }}/reviewed-release-input.json
          if-no-files-found: error
          retention-days: 90

  # Each planned unit builds on its own runner: a build is CPU-bound, and a hosted runner of this
  # private repository has two cores, so builds side by side on one runner take as long as in a row.
  # Building runs dependency code (bundlers, build plugins, the framework CLI), so these jobs get no
  # environment and no Cloudflare token; only deploy-cloudflare's Wrangler steps see it.
  edge-build:
    name: Build edge unit ${{ matrix.unit.id }}
    if: ${{ !cancelled() && needs.edge-plan.result == 'success' && needs.edge-plan.outputs.cloudflare != '[]' }}
    needs: [edge-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        unit: ${{ fromJSON(needs.edge-plan.outputs.cloudflare) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Plan the immutable module artifact origin
        timeout-minutes: 5
        working-directory: app
        env:
          UNIT_ID: ${{ matrix.unit.id }}
          WORKERS_DEV_SUBDOMAIN: ${{ needs.edge-plan.outputs.workers_dev_subdomain }}
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p ".codex/reports/releases/$UNIT_ID"
          if [[ "$UNIT_ID" == shell-super-app ]]; then
            mise exec -- pnpm exec node scripts/immutable-shell-release.mts plan \
              --workers-dev-subdomain "$WORKERS_DEV_SUBDOMAIN" \
              --plan-file ".codex/reports/releases/$UNIT_ID/plan.json"
          else
            mise exec -- pnpm exec node scripts/immutable-application-release.mts plan \
              --vertical "$UNIT_ID" --workers-dev-subdomain "$WORKERS_DEV_SUBDOMAIN" \
              --plan-file ".codex/reports/releases/$UNIT_ID/plan.json"
          fi

      - name: Build and verify the planned edge unit
        timeout-minutes: 25
        working-directory: app
        env:
          UNIT_ID: ${{ matrix.unit.id }}
          UNIT_PACKAGE: ${{ matrix.unit.packageName }}
          UNIT_WORKER: ${{ matrix.unit.workerName }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          # MODERN_ASSET_PREFIX is pinned for every unit. Shell retains its reviewed site/API origin.
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' ".codex/reports/releases/$UNIT_ID/plan.json")
          mise exec -- pnpm --filter "$UNIT_PACKAGE" run cloudflare:build
          mise exec -- pnpm --filter "$UNIT_PACKAGE" exec ultramodern-create ultramodern cloudflare-output-verify --app "$UNIT_ID" --require-public-urls
          if [[ "$UNIT_ID" == shell-super-app ]]; then
            built_worker="$(mise exec -- pnpm --filter "$UNIT_PACKAGE" exec jq -r '.name' .output/wrangler.json)"
            [[ "$built_worker" == "$UNIT_WORKER" ]] || exit 1
          fi

      - name: Pack the edge unit's build output
        working-directory: app
        env:
          UNIT_ID: ${{ matrix.unit.id }}
          UNIT_PACKAGE: ${{ matrix.unit.packageName }}
        run: |
          unit_directory="$(realpath --relative-to=. "$(mise exec -- pnpm --filter "$UNIT_PACKAGE" exec pwd)")"
          files="$RUNNER_TEMP/edge-unit-files"
          git ls-files --others --ignored --exclude-standard --directory -z -- "$unit_directory" \
            | grep -zv '/node_modules/$' >"$files"
          test -f ".codex/reports/releases/$UNIT_ID/plan.json"
          printf '%s\0' ".codex/reports/releases/$UNIT_ID" >>"$files"
          tar --null --files-from="$files" --create --zstd --file "$RUNNER_TEMP/edge-unit.tar.zst"

      - name: Upload the edge unit's build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-unit-${{ matrix.unit.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/edge-unit.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  deploy-cloudflare:
    name: Retain the reviewed Cloudflare release artifacts
    # Results are checked explicitly: a merge-queue-proven run skips the gates, and a skipped ancestor would
    # otherwise skip every job below it through the implicit success().
    # A plan with no units skips edge-build; the artifact job still assembles its complete candidate.
    if: >-
      ${{ !cancelled() && needs.initial-composition-cutover-guard.result == 'success' && needs.edge-plan.result == 'success'
      && (needs.edge-build.result == 'success' || (needs.edge-build.result == 'skipped' && needs.edge-plan.outputs.cloudflare == '[]')) }}
    needs: [deploy-target, initial-composition-cutover-guard, edge-plan, edge-build, capture-application-baseline]
    runs-on: ubuntu-24.04
    # Artifact creation, authority changes, refresh and publication share the environment lock.
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    # Failed releases remain retained. Database or queue changes forbid automatic code rollback.
    timeout-minutes: 90
    environment:
      name: stage-edge
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the complete reviewed selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-application-release-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-selection

      - name: Download the original approved baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-application-composition-baseline
          path: ${{ runner.temp }}/application-baseline

      - name: Locate this run's original prepared release
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.[].artifacts[] | select(.name == "prepared-application-release" and .expired == false)][0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            printf 'prepared=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prepared=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Recover the original prepared identity without another deployment
        if: steps.recovery.outputs.prepared == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Recover original receipts for the exact approved baseline
        if: steps.recovery.outputs.prepared != 'true'
        env:
          BASELINE_REVISION: ${{ needs.capture-application-baseline.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/application-release-receipts"
          if jq -e '.retained == [] and .shell.mode == "fresh"' "$RUNNER_TEMP/application-selection/application-release-selection.json" >/dev/null; then
            exit 0
          fi
          [[ "$BASELINE_REVISION" =~ ^[a-f0-9]{64}$ ]] || exit 1
          archive="application-release-receipts-$BASELINE_REVISION"
          artifact_id="$(gh api --paginate --slurp --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$archive" -f per_page=100 \
            --jq "[.[].artifacts[] | select(.expired == false and .workflow_run.repository_id == $REPOSITORY_ID and .workflow_run.head_repository_id == $REPOSITORY_ID and .workflow_run.head_branch == \"main\")][0].id // empty")"
          if [[ -z "$artifact_id" ]]; then
            echo 'The captured baseline has no original complete receipt archive. Use an explicitly reviewed full build; retained evidence cannot be reconstructed.' >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/original-receipts.zip"
          python3 - <<'PY'
          import os, pathlib, re, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'original-receipts.zip') as archive:
              files = archive.infolist()
              if len(files) > 257 or sum(file.file_size for file in files) > 16 * 1024 * 1024:
                  raise SystemExit('Receipt archive exceeds the bounded membership budget')
              for file in files:
                  if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*\.json', file.filename):
                      raise SystemExit('Receipt archive contains an unexpected path')
                  (root / 'application-release-receipts' / file.filename).write_bytes(archive.read(file))
          PY

      - name: Download the planned edge units' build outputs
        if: steps.recovery.outputs.prepared != 'true' && needs.edge-plan.outputs.cloudflare != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: edge-unit-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/edge-units

      # Only Wrangler sees the account token. Building, verifying and proving a unit runs dependency
      # code, so the builds ran in edge-build without it.
      - name: Unpack the planned edge units' build outputs
        if: steps.recovery.outputs.prepared != 'true'
        working-directory: app
        env:
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
        run: |
          mapfile -t units < <(jq -r '.[] | [.id, .packageName] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id package <<<"$unit"
            tar --extract --zstd --file "$RUNNER_TEMP/edge-units/edge-unit-$id-$GITHUB_RUN_ATTEMPT/edge-unit.tar.zst"
            if ! mise exec -- pnpm --filter "$package" exec test -f .output/wrangler.json; then
              echo "Edge unit $id has no built .output/wrangler.json; no Worker was changed." >&2
              exit 1
            fi
            test -f ".codex/reports/releases/$id/plan.json"
          done

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Deploy the reviewed immutable module releases
        if: steps.recovery.outputs.prepared != 'true'
        id: deploy
        timeout-minutes: 45
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
          ALL_RELEASE_SECRETS: ${{ secrets.ONTOS_IMMUTABLE_RELEASE_SECRETS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/application-release-receipts"
          mapfile -t units < <(jq -r '.[] | select(.id != "shell-super-app") | [.id, .path] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id unit_path <<<"$unit"
            export ONTOS_IMMUTABLE_RELEASE_SECRETS
            ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer --arg app "$id" '.[$app] | select(type == "object")' <<<"$ALL_RELEASE_SECRETS")"
            mise exec -- pnpm exec node scripts/immutable-application-release.mts deploy \
              --app-directory "$unit_path" \
              --plan-file ".codex/reports/releases/$id/plan.json" \
              --receipt-file "$RUNNER_TEMP/application-release-receipts/$id.json"
          done

      - name: Retain the changed Shell frontend artifacts
        if: steps.recovery.outputs.prepared != 'true'
        id: shell-deploy
        timeout-minutes: 20
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
          ALL_RELEASE_SECRETS: ${{ secrets.ONTOS_IMMUTABLE_RELEASE_SECRETS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          # Retained frontend assets are separate from the one public UI/API ingress.
          if jq -e 'any(.[]; .id == "shell-super-app")' <<<"$CLOUDFLARE_UNITS_JSON" >/dev/null; then
            export ONTOS_IMMUTABLE_RELEASE_SECRETS
            ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer '.["shell-super-app"] | select(type == "object")' <<<"$ALL_RELEASE_SECRETS")"
            mise exec -- pnpm exec node scripts/immutable-shell-release.mts deploy \
              --app-directory apps/shell-super-app \
              --plan-file .codex/reports/releases/shell-super-app/plan.json \
              --receipt-file "$RUNNER_TEMP/application-release-receipts/shell-super-app.json"
          fi

      - name: Assemble the complete candidate from retained deployment receipts
        if: steps.recovery.outputs.prepared != 'true'
        id: candidate
        timeout-minutes: 5
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
          COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
          SHELL_SELECTED: ${{ contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app') }}
        run: |
          COMPOSITION_INTENT_FILE="$(jq -er '.intentFile' "$RUNNER_TEMP/application-selection/reviewed-release-input.json")"
          git ls-files --error-unmatch "$COMPOSITION_INTENT_FILE" >/dev/null
          receipts=()
          while IFS= read -r id; do
            receipts+=(--receipt-file "$RUNNER_TEMP/application-release-receipts/$id.json")
          done < <(jq -r '.modules[].appId' "$COMPOSITION_INTENT_FILE")
          if [[ "$SHELL_SELECTED" == 'true' ]]; then
            receipts+=(--shell-receipt-file "$RUNNER_TEMP/application-release-receipts/shell-super-app.json")
          fi
          if jq -e '. != null' "$RUNNER_TEMP/application-baseline/baseline.json" >/dev/null; then
            receipts+=(--approved-baseline-file "$RUNNER_TEMP/application-baseline/baseline.json")
          fi
          mkdir -p "$RUNNER_TEMP/prepared-release/receipts"
          mise exec -- pnpm exec node scripts/immutable-application-release.mts candidate \
            --intent-file "$COMPOSITION_INTENT_FILE" "${receipts[@]}" \
            --selection-file "$RUNNER_TEMP/application-selection/application-release-selection.json" \
            --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json"
          mise exec -- pnpm active-composition:publish prepare --environment stage --observe-backends \
            --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json" \
            --selection-file "$RUNNER_TEMP/application-selection/application-release-selection.json" \
            --intent-file "$COMPOSITION_INTENT_FILE" \
            --expected-composition-file "$RUNNER_TEMP/prepared-release/expected-composition.json"
          cp "$RUNNER_TEMP/application-selection/application-release-selection.json" "$RUNNER_TEMP/prepared-release/selection.json"
          cp "$RUNNER_TEMP/application-baseline/baseline.json" "$RUNNER_TEMP/prepared-release/baseline.json"
          while IFS= read -r id; do
            cp "$RUNNER_TEMP/application-release-receipts/$id.json" "$RUNNER_TEMP/prepared-release/receipts/$id.json"
          done < <(jq -r '.modules[].appId, "shell-super-app"' "$COMPOSITION_INTENT_FILE")
          source_revision="$(git rev-parse HEAD)"
          [[ "$source_revision" == "$GITHUB_SHA" ]] || exit 1
          jq -n --arg sourceRevision "$source_revision" --arg intentFile "$COMPOSITION_INTENT_FILE" \
            '{sourceRevision:$sourceRevision,environment:"stage",target:"cloudflare",intentFile:$intentFile}' > "$RUNNER_TEMP/prepared-release/metadata.json"

      - name: Preserve the original complete release before migration
        if: steps.recovery.outputs.prepared != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release
          if-no-files-found: error
          retention-days: 90

      - name: Validate the recovered source and record the exact receipt archive identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e --arg source "$GITHUB_SHA" \
            '.sourceRevision == $source and .environment == "stage" and .target == "cloudflare"' \
            "$RUNNER_TEMP/prepared-release/metadata.json" >/dev/null
          revision="$(jq -er '.revision' "$RUNNER_TEMP/prepared-release/expected-composition.json")"
          [[ "$revision" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          exists="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq "any(.[].artifacts[]; .name == \"application-release-receipts-$revision\" and .expired == false)")"
          printf 'archived=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      - name: Preserve all original receipts under the exact Composition identity
        if: steps.identity.outputs.archived != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-release-receipts-${{ steps.identity.outputs.revision }}
          path: ${{ runner.temp }}/prepared-release/receipts
          if-no-files-found: error
          retention-days: 90

      - name: Preserve failed release artifacts
        if: failure() || cancelled()
        run: |
          echo 'Immutable release artifacts remain retained. Promotion was not approved; no automatic rollback or release deletion is safe after database or queue changes.'

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  # The complete edge release is published once its artifacts are observable. Publication and
  # readback hold the same stage lock as refresh; there is no detached second KV writer.
  publish-edge-composition:
    name: Publish the complete Application Composition after the edge deploy
    if: >-
      ${{ !cancelled() && needs.deploy-zerops.result == 'success' && needs.deploy-cloudflare.result == 'success'
      && needs.deploy-target.outputs.target == 'cloudflare' }}
    needs: [deploy-target, deploy-zerops, deploy-cloudflare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: stage-edge
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_TARGET: cloudflare
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      COMPOSITION_INTENT_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE || 'topology/application-release-intent.json' }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Prepare private legacy completion evidence
        run: |
          ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY="$RUNNER_TEMP/legacy-completion-evidence"
          install -d -m 700 "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY"
          printf 'ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY=%s\n' "$ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Download this deployment's original complete prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Download the initial provider quiescence receipt
        if: vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Publish the complete observed release without restarting consumers
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: >-
          mise exec -- pnpm active-composition:publish publish --environment stage
          --intent-file "$(jq -er '.intentFile' "$RUNNER_TEMP/prepared-release/metadata.json")"
          --candidate-file "$RUNNER_TEMP/prepared-release/candidate.json"
          --selection-file "$RUNNER_TEMP/prepared-release/selection.json"
          --expected-composition-file "$RUNNER_TEMP/prepared-release/expected-composition.json"

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

      - name: Retain native legacy completion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-completion-evidence-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-completion-evidence
          if-no-files-found: ignore
          retention-days: 30

  # Old durable work finishes before publication. The live Shell changes afterward, while its
  # native publication lock verifies that this exact retained release is still the active choice.
  finalize-edge-deployment:
    name: Activate the approved Shell ingress and record the edge deployment
    if: >-
      ${{ !cancelled() && needs.deploy-target.outputs.target == 'cloudflare'
      && needs.edge-plan.result == 'success' && needs.deploy-cloudflare.result == 'success'
      && needs.publish-edge-composition.result == 'success' }}
    needs: [deploy-target, edge-plan, deploy-cloudflare, publish-edge-composition]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stage-edge
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the approved source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the exact changed Shell build
        if: contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-unit-shell-super-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shell-build

      - name: Download the exact retained Shell receipt
        if: contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-application-release
          path: ${{ runner.temp }}/prepared-release

      - name: Unpack the approved Shell build
        id: shell-unpack
        if: contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app')
        working-directory: app
        run: |
          tar --extract --zstd --file "$RUNNER_TEMP/shell-build/edge-unit.tar.zst"
          test -f apps/shell-super-app/.output/wrangler.json
          test -f .codex/reports/releases/shell-super-app/plan.json

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        if: contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app')
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Activate the currently approved Shell ingress
        id: shell-ingress
        if: contains(fromJSON(needs.edge-plan.outputs.cloudflare).*.id, 'shell-super-app')
        timeout-minutes: 20
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALL_RELEASE_SECRETS: ${{ secrets.ONTOS_IMMUTABLE_RELEASE_SECRETS }}
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          export ONTOS_IMMUTABLE_RELEASE_SECRETS
          ONTOS_IMMUTABLE_RELEASE_SECRETS="$(jq -cer '.["shell-super-app"] | select(type == "object")' <<<"$ALL_RELEASE_SECRETS")"
          mise exec -- pnpm exec node scripts/immutable-shell-release.mts ingress-deploy \
            --app-directory apps/shell-super-app \
            --receipt-file "$RUNNER_TEMP/prepared-release/receipts/shell-super-app.json"

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}
