name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # Always report Workspace gates. The ci-plan job, not workflow path filtering, selects required work.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force-ci-full:
        description: Run every CI gate even if the merge queue already proved this commit.
        type: boolean
        default: false

permissions:
  contents: read

env:
  ONTOS_ACTION_TRANSACTION_IO_GUARD: 'true'

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  queue-proof:
    name: Find the merge queue proof of this commit
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.force-ci-full != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi

  ci-plan:
    name: Select required checks from changed inputs
    needs: [queue-proof]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
      expected: ${{ steps.selection.outputs.expected || steps.changes.outputs.expected }}
      source: ${{ steps.selection.outputs.source || steps.changes.outputs.source }}
      unit: ${{ steps.selection.outputs.unit || steps.changes.outputs.unit }}
      integration: ${{ steps.selection.outputs.integration || steps.changes.outputs.integration }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout the exact comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete diff without app dependencies
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_PROVEN: ${{ needs.queue-proof.outputs.proven }}
          FORCE_FULL: ${{ inputs.force-ci-full }}
        run: bash app/scripts/plan-ci-changes.sh "$RUNNER_TEMP/ci-changed-paths"
      - name: Record the documentation or exact-commit no-op
        if: steps.changes.outputs.mode == 'docs' || steps.changes.outputs.mode == 'proven'
        env:
          REASON: ${{ steps.changes.outputs.reason }}
        run: printf '## CI selection\n\n%s\n\nNo app dependencies, builds or services are needed.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the app workspace for code impact analysis
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        uses: ./.github/actions/install-app
      - name: Resolve affected packages and required matrices
        id: selection
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        working-directory: app
        env:
          BOOTSTRAP_MODE: ${{ steps.changes.outputs.mode }}
          APPLY_AFFECTED: ${{ vars.CI_AFFECTED_ENABLED }}
        run: |
          args=(--paths-file "$RUNNER_TEMP/ci-changed-paths")
          [[ "$BOOTSTRAP_MODE" != full ]] || args+=(--full)
          [[ "$APPLY_AFFECTED" != true ]] || args+=(--apply-affected)
          mise exec -- node scripts/plan-ci-checks.mts "${args[@]}"

  # The only job that saves the caches the gates restore, on main, where every pull request and merge
  # group can read them: the pnpm store, the TS-Go typecheck build, the Playwright Chromium build, and
  # the apt packages of Chromium's system libraries.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'
          save-store: 'true'

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check for the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          lookup-only: true

      - name: Download the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          # The marker keeps the cache saveable on an image that already has every library.
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;
          echo "Cached $(find ~/.cache/playwright-apt-debs -name '*.deb' | wc -l) packages."

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

  # Source checks start immediately after planning; they do not wait for Node artifacts.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.source) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  workspace-unit:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Download the same-run Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      # The finance-billing POHODA export tests validate their generated documents against the
      # official STORMWARE dataPack 2.0 schemas, which the repository does not redistribute. Only the
      # shard that runs finance-billing needs them, so it provisions the pinned set named by
      # verticals/finance-billing/tests/fixtures/pohoda-xsd/version-2.sha256 before it runs.
      - name: Provision the POHODA XML schemas for the finance-billing shard
        if: matrix.name == 'Unit and Component Tests (every other package)'
        working-directory: app
        run: |
          command -v xmllint >/dev/null 2>&1 || sudo apt-get install --yes --no-install-recommends libxml2-utils
          mise exec -- pnpm provision:pohoda-xsd

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  static-contracts:
    name: Static Contracts
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['static-contracts'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Share one install across independent checks and retain a log for each check.
      # Keep the memory-heavy API analyzer and Commerce build outside this group.
      - parallel:
          - name: Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: app/node_modules/.bin/lefthook validate

          - name: Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm skills:check

          - name: Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm database-access:check

          - name: Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm lean-core:check

          - name: Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm contract:check

          - name: Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm check:module-contracts

          - name: Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm action:test:unit

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        env:
          # The whole-workspace analyzer exceeds V8's ~4 GiB default while releasing its graph.
          NODE_OPTIONS: --max-old-space-size=6144
        run: mise exec -- pnpm api:check

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it,
  # over every tracked file. Type-aware lint of the whole tree took over four minutes on one runner, so
  # each shard runs the hook over every other tracked file (`--all-files` is `git ls-files`): together
  # they cover every file once, and the hook's own globs still choose what each tool checks.
  format-and-lint:
    name: Format and Lint through the pre-commit hook (${{ matrix.shard }}/2)
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['format-and-lint'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Format and Lint the shard's files through the pre-commit hook
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          index=0
          git ls-files -z | while IFS= read -r -d '' file; do
            if ((index % SHARDS == SHARD - 1)); then
              printf '%s\0' "$file"
            fi
            index=$((index + 1))
          done >"$RUNNER_TEMP/shard-files"
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/shard-files"
          git diff --exit-code HEAD

  # Suites on fresh services, run side by side: the stage-shaped migrator and Outbox Worker host artifacts
  # followed by the integration tests, and the authenticated browser tests on their own freshly migrated
  # database. The integration tests are split into package shards that each fit the job timeout. Every
  # shard repeats the full service preparation; the root suite and every package that no other shard names
  # run in the first shard, so a new package can never fall out of the gate. A shard that carried several
  # packages' suites always finished last, so the heaviest packages get a job each: a PR waits for the
  # slowest job, not for the sum of the packages a single job used to run one after another.
  #
  # Sharding is set by what a package's own files cost, not by package size. Rstest splits shards by file,
  # so a package with one dominant file cannot be balanced below that file - but more shards still shorten
  # it, because fewer other files ride along in the shard that carries it. Commerce Customer Context has a
  # single 10.3-minute file among 48, so its shards stay under a small share of the rest. Privacy's files
  # are even (its heaviest is 3.7 minutes of a 14.6-minute job), so two shards halve it outright.
  service-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integration) }}
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # Native receiving fixtures and Inventory workers use genuine published owner metadata.
      # Restore this run's outputs instead of rebuilding or substituting synthetic build identities.
      - name: Download the same-run Node artifacts for native owner fixtures
        if: matrix.suite == 'integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts for native owner fixtures
        if: matrix.suite == 'integration'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Materialize the native Customer Context worker artifact
        if: matrix.root-suite == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm zerops:materialize --app commerce-customer-context --package @app/commerce-customer-context --package-dir verticals/commerce-customer-context --worker

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          restore-keys: playwright-apt-debs-

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        background: true
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi
          if [ "$CHROMIUM_CACHED" = true ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright "$@"

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'integration'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- pnpm database-trust:audit

      # Stage-shaped on the Cloudflare target: the host is materialized by its zerops.yaml build command,
      # ships only its deployFiles, polls every hosted owner's outbox against the freshly migrated
      # database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        # The job environment above is the whole configuration. Native fixtures refuse to start unless
        # dotenv discovery is closed, so no workspace .env file can leak into an owned test database.
        env:
          APP_ENV_PATH: /dev/null
          MIGRATION_EQUIVALENCE_TEST_DATABASE_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/postgres
          MIGRATION_EQUIVALENCE_TEST_SANDBOX: owned-postgres18
          SPICEDB_DATABASE_PASSWORD: spicedb
          PACKAGE_FILTERS: ${{ matrix.package-filters }}
          ROOT_SUITE: ${{ matrix.root-suite }}
          RSTEST_SHARD: ${{ matrix.rstest-shard }}
        # Same commands as `pnpm test:integration`, restricted to this shard's packages and, for a package
        # too large for one job, to one Rstest shard of its test files.
        run: |
          if [[ "$ROOT_SUITE" == true ]]; then
            mise exec -- pnpm exec rstest --project integration --pool.maxWorkers 1
          fi
          if [[ -n "$PACKAGE_FILTERS" ]]; then
            # shellcheck disable=SC2086 # PACKAGE_FILTERS is a list of separate pnpm filter arguments.
            mise exec -- pnpm -r --no-sort --workspace-concurrency 1 --if-present $PACKAGE_FILTERS run test:integration --pool.maxWorkers 1 ${RSTEST_SHARD:+--shard "$RSTEST_SHARD"}
          fi

      - name: Prove native preproposal basis and genuine approval through registered owners
        if: matrix.native-preproposal == true
        working-directory: app
        timeout-minutes: 20
        env:
          APP_ENV_PATH: /dev/null
        # Reuse this shard's services; each case migrates its own disposable source database.
        run: mise exec -- pnpm --filter @app/commerce-customer-context run test:integration:native-preproposal

      # `wait` always runs, including on non-browser shards where the install was skipped.
      - name: Wait for the Chromium install
        wait: chromium-install

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Verify browser recovery into a newly published release
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          ONTOS_E2E_RETAINED_PARTY_R2: 'true'
        run: >-
          mise exec -- pnpm --filter @app/shell-super-app exec playwright test
          tests/e2e/login.spec.ts --grep 'reloads failed Contacts into a genuinely published R2'
          --workers 1

      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # Each delivery unit builds from source exports only (scripts/tests/vertical-build-order.test.mts), so
  # the units build in shards on parallel runners, one unit at a time per shard: parallel builds on one
  # runner fight over its cores, and every unit's TS-Go declaration pass then runs several times slower.
  # Each target balances its shards by its own measured build times; a new unit joins one shard of each
  # target (a test checks). A target's lightest shards also prove it, on the runner they already set up:
  # each waits for every other shard of its target, downloads every shard and proves the whole topology,
  # exactly as one build did. The Node shard runs the Node proof; two Cloudflare shards run the two
  # independent Worker proofs side by side (the outputs and their SSR, and the topology on real services).
  node-artifact-build:
    name: Build node artifacts (${{ matrix.shard }}/5)
    needs: [ci-plan]
    # The proving shard reads its siblings' job results.
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        include:
          - {
              shard: 1,
              proof: none,
              units: verticals/catalog verticals/tax verticals/commerce-cart verticals/property-portfolio verticals/property-leasing verticals/legal-agreements verticals/work-tasks,
            }
          - {
              shard: 2,
              proof: none,
              units: verticals/commerce-customer-context verticals/storefront-registry verticals/commerce-order verticals/workforce verticals/tagging verticals/crm verticals/sales-pipeline,
            }
          - {
              shard: 3,
              proof: none,
              units: verticals/assortment apps/shell-super-app verticals/merchandise verticals/facility-operations verticals/sales-insights,
            }
          - {
              shard: 4,
              proof: none,
              units: verticals/party-registry verticals/inventory verticals/availability verticals/finance-billing verticals/crm-activities,
            }
          - {
              shard: 5,
              proof: node,
              units: verticals/commerce-market-catalog verticals/price-group-catalog verticals/pricing verticals/payment-term-catalog verticals/privacy verticals/projects,
            }
    # Only the proving shard starts PostgreSQL; its complete handler layers acquire real pools.
    services:
      proof-postgres:
        image: ${{ matrix.proof == 'node' && 'postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5' || '' }}
        env:
          POSTGRES_DB: ontos_proof
          POSTGRES_PASSWORD: ontos_proof_admin
          POSTGRES_USER: ontos_proof_admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ontos_proof_admin -d ontos_proof"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_proof_admin:ontos_proof_admin@localhost:5433/ontos_proof
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_proof
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_proof
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Node artifacts one unit at a time
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Wait for every other Node build shard to upload its outputs
        if: matrix.proof != 'none'
        working-directory: app
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-build-shards.sh 'Build node artifacts (' 5 'Build node artifacts (${{ matrix.shard }}/5)'

      - name: Download every shard's Node build outputs
        if: matrix.proof == 'node'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Node build outputs of every delivery unit
        if: matrix.proof == 'node'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types and check performance readiness over every unit
        if: matrix.proof == 'node'
        working-directory: app
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Migrate the Node proof database and provision its runtime identities
        if: matrix.proof == 'node'
        working-directory: app
        run: mise exec -- pnpm db:migrate

      - name: Prove Node backend-federation artifacts
        if: matrix.proof == 'node'
        working-directory: app
        run: mise exec -- pnpm node:proof

  # Keep one required check. Selected jobs must succeed and every skipped job must be explicitly planned.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [queue-proof, ci-plan, workspace-gate, workspace-unit, static-contracts, format-and-lint, service-integration, node-artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected gates and reject unplanned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash app/scripts/check-ci-gates.sh
