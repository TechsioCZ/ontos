name: Ultramodern Workspace Gates and Stage Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}

jobs:
  workspace-gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: pnpm format:check
          - name: Lint
            command: pnpm lint
          - name: Action Unit Tests
            command: pnpm action:test:unit
          - name: Typecheck
            command: pnpm typecheck
          - name: Skills
            command: pnpm skills:check
          - name: I18n Boundaries
            command: pnpm i18n:boundaries
          - name: API Boundaries
            command: pnpm api:check
          - name: Database Access
            command: pnpm database-access:check
          - name: Module Entrypoints
            command: pnpm module-entrypoints:check
          - name: Module Contracts
            command: pnpm check:module-contracts
          - name: Contract
            command: pnpm contract:check
          - name: Build
            command: pnpm build
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Install Dependencies
        working-directory: app
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- ${{ matrix.command }}

  deploy-stage:
    name: Deploy stage to Zerops
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    needs: workspace-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stage
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SPICEDB_SERVICE_ID: ${{ vars.ZEROPS_SPICEDB_SERVICE_ID }}
      ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
      ZEROPS_CRM_SERVICE_ID: ${{ vars.ZEROPS_CRM_SERVICE_ID }}
      ZEROPS_SHELL_SERVICE_ID: ${{ vars.ZEROPS_SHELL_SERVICE_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout stage revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      - name: Install Zerops CLI
        run: npm install --global @zerops/zcli@1.1.0

      - name: Authenticate to Zerops
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: zcli login "$ZEROPS_TOKEN"

      - name: Run verified database migrations
        id: migrator
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path app/zerops.yaml
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --setup migrator
          --version-name "$GITHUB_SHA"

      - name: Show migrator runtime logs after failure
        if: failure() && steps.migrator.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Stop migrator after verification
        if: always() && steps.migrator.outcome != 'skipped'
        continue-on-error: true
        run: >-
          zcli service stop
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"

      - name: Deploy SpiceDB
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path app/zerops.yaml
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --setup spicedb
          --version-name "$GITHUB_SHA"

      - name: Deploy CRM
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path app/zerops.yaml
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_CRM_SERVICE_ID"
          --setup crm
          --version-name "$GITHUB_SHA"

      - name: Deploy shell super-app
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path app/zerops.yaml
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SHELL_SERVICE_ID"
          --setup shellsuperapp
          --version-name "$GITHUB_SHA"

      - name: Enable Zerops public subdomain
        run: >-
          zcli service enable-subdomain
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SHELL_SERVICE_ID"
