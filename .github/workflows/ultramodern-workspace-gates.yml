name: Ultramodern Workspace Gates and Production Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # The main ruleset requires the Workspace gates check and the merge queue, so every pull request and
  # merge group reports it, documentation-only ones included: a filtered run would never report it.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main, so its push skips the gates. Nothing deploys on a push:
  # stage deploys from the sales demo branch (stage-demo-deploy.yml), production on an explicit dispatch.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      full:
        description: Deploy the whole topology instead of the diff since the environment's last successful deployment (seeding or rewritten history).
        type: boolean
        default: false
      environment:
        description: GitHub deployment environment to deploy. Only production deploys from main; stage deploys from the sales demo branch.
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The org runs at most 20 jobs at once, and a push to the sales demo branch starts the Stage Demo Deploy and
  # its pull request's gates in the same second: the gates' first wave alone takes 19 runners. Pull request and
  # merge queue gates therefore wait (behind queue-proof, which every gate needs) while a stage demo deploy run
  # still has jobs queued for a runner, its final verification excepted, for at most 20 minutes. It never fails
  # a run: on any error or at the ceiling the gates simply start. Main pushes and dispatches pass at once.
  stage-deploy-yield:
    name: Yield runners to a stage demo deploy
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      actions: read
    steps:
      - name: Wait while a stage demo deploy has jobs queued for a runner
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deploy_runs="repos/$GITHUB_REPOSITORY/actions/workflows/stage-demo-deploy.yml/runs?branch=demo/sales-crm&per_page=20"
          started=$SECONDS
          # A push to the demo branch creates its deploy run in about the same second as this run.
          expect_sha=""
          if [[ "$HEAD_REF" == demo/sales-crm ]]; then expect_sha="$HEAD_SHA"; fi
          busy() {
            local runs id
            runs="$(gh api "$deploy_runs" --jq '[.workflow_runs[] | select(.status != "completed") | {id, status, head_sha}]')" || return 1
            if [[ -n "$expect_sha" ]] && (( SECONDS - started < 90 )) &&
               ! jq -e --arg sha "$expect_sha" 'any(.[]; .head_sha == $sha)' <<<"$runs" >/dev/null; then
              echo "waiting for the deploy run of $expect_sha to appear"
              return 0
            fi
            # A run waiting for its first runner, or one whose plan has not yet created its build jobs.
            if jq -e 'any(.[]; .status == "queued" or .status == "requested")' <<<"$runs" >/dev/null; then
              echo 'a stage demo deploy run is queued'
              return 0
            fi
            for id in $(jq -r '.[] | select(.status == "in_progress") | .id' <<<"$runs"); do
              # shellcheck disable=SC2016 # $jobs is a jq variable.
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '
                  [.jobs[] | select(.name != "Verify stage once")] as $jobs
                  | any($jobs[]; .status == "queued" or .status == "waiting")
                    or any($jobs[]; .name == "Plan the changed units"
                      and (.status != "completed" or ((now - (.completed_at | fromdateiso8601)) < 30)))' |
                 grep -qx true; then
                echo "stage demo deploy run $id still has jobs waiting for a runner"
                return 0
              fi
            done
            return 1
          }
          while (( SECONDS - started < 1200 )) && busy; do
            sleep 15
          done
          if (( SECONDS - started >= 1200 )); then
            echo '::notice title=Gates no longer yield::The stage demo deploy still queues jobs after 20 minutes; the gates start now.'
          fi
          echo "The gates start after $((SECONDS - started)) s."

  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates (and a production dispatch deploys it). Any other commit (pushed before the queue, or by a ruleset
  # bypass) runs them.
  queue-proof:
    name: Find the merge queue proof of this commit
    needs: [stage-deploy-yield]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi

  # The only job that saves the caches the gates restore, on main, where every pull request and merge
  # group can read them: the pnpm store, the TS-Go typecheck build, the Playwright Chromium build, and
  # the apt packages of Chromium's system libraries.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'
          save-store: 'true'

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check for the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          lookup-only: true

      - name: Download the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          # The marker keeps the cache saveable on an image that already has every library.
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;
          echo "Cached $(find ~/.cache/playwright-apt-debs -name '*.deb' | wc -l) packages."

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

  # Each entry runs its commands one after another and reports every one that fails. Entries group a few
  # minutes of checks each, so each runner pays one install for them: the org runs at most 20 jobs at
  # once, and every gate job of the first wave must start at once to finish in time.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck, Effect Rule Implementation, and OntOS API Boundary Rules
            typescript-build: true
            commands: |
              pnpm typecheck
              pnpm typecheck:lint-rules
              pnpm test:lint-rules
              pnpm api:check:ontos
          - name: Repository Tooling, Module Entrypoint, Deployment Impact Planner, and Codesmith Generation Tests
            commands: |
              pnpm shell:ui-candidates:check
              pnpm test:scripts
              pnpm module-entrypoints:check
              pnpm test:deployment-impact
              pnpm test:generation
          # The root `pnpm test:unit` (every package's test:unit, then every package's test:component) in
          # shards of packages balanced by measured test time. The last shard runs every package the others
          # do not name, so a new package is always tested; Repository Tooling Tests check the split.
          - name: Unit and Component Tests (Catalog, Commerce Customer Context, and Inventory)
            commands: |
              pnpm -r --no-sort --if-present --filter ./verticals/catalog --filter ./verticals/commerce-customer-context --filter ./verticals/inventory run test:unit
              pnpm -r --no-sort --if-present --filter ./verticals/catalog --filter ./verticals/commerce-customer-context --filter ./verticals/inventory run test:component
          - name: Unit and Component Tests (every other package)
            # Pricing's issue #890 traceability test compares immutable historical revisions and the
            # branch's latest main integration merge. Keep that bounded history in this shard only.
            fetch_depth: 512
            commands: |
              pnpm -r --no-sort --if-present --filter '!.' --filter '!./verticals/catalog' --filter '!./verticals/commerce-customer-context' --filter '!./verticals/inventory' run test:unit
              pnpm -r --no-sort --if-present --filter '!.' --filter '!./verticals/catalog' --filter '!./verticals/commerce-customer-context' --filter '!./verticals/inventory' run test:component
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  static-contracts:
    name: Static Contracts
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Share one install across independent checks and retain a log for each check.
      # Keep the memory-heavy API analyzer and Commerce build outside this group.
      - name: Start the independent static contract checks
        id: static-contract-checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: |
          mkdir "$RUNNER_TEMP/static-contracts"
          nohup bash -eo pipefail >"$RUNNER_TEMP/static-contracts/runner.log" 2>&1 <<'CHECKS' &
          directory="$RUNNER_TEMP/static-contracts"
          result=1
          trap 'printf "%s\n" "$result" > "$directory/status"' EXIT
          names=(
            'Validate the root lefthook config'
            'Skills'
            'Lean Core Dependencies'
            'Workspace Contract'
            'Module Contract Generation'
            'Action Unit Tests'
          )
          commands=(
            'cd .. && app/node_modules/.bin/lefthook validate'
            'mise exec -- pnpm skills:check'
            'mise exec -- pnpm lean-core:check'
            'mise exec -- pnpm contract:check'
            'mise exec -- pnpm check:module-contracts'
            'mise exec -- pnpm action:test:unit'
          )
          pids=()
          for index in "${!commands[@]}"; do
            bash -eo pipefail -c "${commands[$index]}" >"$directory/$index.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for index in "${!pids[@]}"; do
            if wait "${pids[$index]}"; then
              status=0
            else
              status=$?
              failed=1
            fi
            echo "::group::${names[$index]}"
            cat "$directory/$index.log"
            echo '::endgroup::'
            if [[ "$status" != 0 ]]; then
              echo "::error title=Static contract check failed::${names[$index]} exited $status."
            fi
          done
          result="$failed"
          CHECKS

      - name: Database Access Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm database-access:check

      - name: Wait for every independent static contract check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          STATIC_CHECKS_OUTCOME: ${{ steps.static-contract-checks.outcome }}
        run: |
          if [[ "$STATIC_CHECKS_OUTCOME" != success ]]; then
            echo '::error::The independent static contract checks could not start.'
            exit 1
          fi
          until [[ -f "$RUNNER_TEMP/static-contracts/status" ]]; do
            sleep 1
          done
          cat "$RUNNER_TEMP/static-contracts/runner.log"
          [[ "$(cat "$RUNNER_TEMP/static-contracts/status")" == 0 ]]

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        env:
          # The whole-workspace analyzer exceeds V8's ~4 GiB default while releasing its graph.
          NODE_OPTIONS: --max-old-space-size=6144
        run: mise exec -- pnpm api:check

      # The Commerce Cloudflare build once crashed parsing Catalog's root HttpApi chain because React
      # Compiler also compiled server code. Production imports only the quantity-preparation client;
      # this case keeps the whole Catalog client barrel compiling in the Commerce workerd graph. It is
      # not a delivery artifact, so it runs here, off the build-and-proof path.
      - name: Build Commerce for workerd with the whole Catalog client barrel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_GATEWAY_ISSUER_HYPERDRIVE_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_PARTY_REGISTRY_HYPERDRIVE_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm --filter @app/commerce-customer-context run cloudflare:build:full-catalog-client-guard
          grep -qF '"CatalogApiFoundation"' verticals/commerce-customer-context/dist-cloudflare/worker/__modern_bff_effect.js

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it,
  # over every tracked file. Type-aware lint of the whole tree took over four minutes on one runner, so
  # each shard runs the hook over every other tracked file (`--all-files` is `git ls-files`): together
  # they cover every file once, and the hook's own globs still choose what each tool checks.
  format-and-lint:
    name: Format and Lint through the pre-commit hook (${{ matrix.shard }}/2)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Format and Lint the shard's files through the pre-commit hook
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          index=0
          git ls-files -z | while IFS= read -r -d '' file; do
            if ((index % SHARDS == SHARD - 1)); then
              printf '%s\0' "$file"
            fi
            index=$((index + 1))
          done >"$RUNNER_TEMP/shard-files"
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/shard-files"
          git diff --exit-code HEAD

  # Two suites on fresh services, run side by side: the stage-shaped migrator and Outbox Worker host
  # artifacts followed by the integration tests (as one job ran them), and the authenticated browser tests
  # on their own freshly migrated database.
  service-integration:
    name: ${{ matrix.name }}
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            name: Database, Migration, RLS, Authorization, and Outbox Integration
          - suite: browser
            name: Authenticated Browser Tests
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          restore-keys: playwright-apt-debs-

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          nohup bash -eo pipefail >"$RUNNER_TEMP/chromium-install.log" 2>&1 <<'CHROMIUM' &
          result=1
          trap 'printf "%s\n" "$result" > "$RUNNER_TEMP/chromium-install.status"' EXIT
          if timeout --kill-after=30s 10m bash -eo pipefail <<'INSTALL'; then
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi
          if [ "$CHROMIUM_CACHED" = true ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright "$@"
          INSTALL
            result=0
          else
            result=$?
          fi
          CHROMIUM

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      # Compose seeds only the shared role. Provision every manifest identity in this ephemeral
      # loopback database before either suite's fail-closed reconcile bootstrap.
      - name: Initialize the fresh CI database identities from the grant manifest
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'integration'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- pnpm database-trust:audit

      # Stage-shaped on the Cloudflare target: the host is materialized by its zerops.yaml build command,
      # ships only its deployFiles, polls every hosted owner's outbox against the freshly migrated
      # database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        env:
          MIGRATION_EQUIVALENCE_TEST_DATABASE_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/postgres
          MIGRATION_EQUIVALENCE_TEST_SANDBOX: owned-postgres18
        run: mise exec -- pnpm test:integration

      # `wait` always runs, including on non-browser shards where the install was skipped.
      - name: Wait for the Chromium install
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium-install.outcome }}
        run: |
          if [[ "$CHROMIUM_INSTALL_OUTCOME" == skipped ]]; then
            exit 0
          fi
          if [[ "$CHROMIUM_INSTALL_OUTCOME" != success ]]; then
            echo '::error::The Chromium install could not start.'
            exit 1
          fi
          until [[ -f "$RUNNER_TEMP/chromium-install.status" ]]; do
            sleep 1
          done
          cat "$RUNNER_TEMP/chromium-install.log"
          status="$(cat "$RUNNER_TEMP/chromium-install.status")"
          if [[ "$status" != 0 ]]; then
            echo "::error::The Chromium install exited $status."
            exit 1
          fi

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # Each delivery unit builds from source exports only (scripts/tests/vertical-build-order.test.mts), so
  # the units build in shards on parallel runners, one unit at a time per shard: parallel builds on one
  # runner fight over its cores, and every unit's TS-Go declaration pass then runs several times slower.
  # Each target balances its shards by its own measured build times; a new unit joins one shard of each
  # target (a test checks). A target's lightest shards also prove it, on the runner they already set up:
  # each waits for every other shard of its target, downloads every shard and proves the whole topology,
  # exactly as one build did. The Node shard runs the Node proof; two Cloudflare shards run the two
  # independent Worker proofs side by side (the outputs and their SSR, and the topology on real services).
  node-artifact-build:
    name: Build node artifacts (${{ matrix.shard }}/5)
    needs: [queue-proof]
    # The proving shard reads its siblings' job results.
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        include:
          - {
              shard: 1,
              proof: none,
              units: verticals/catalog verticals/tax verticals/property-portfolio verticals/property-leasing verticals/legal-agreements verticals/work-tasks,
            }
          - {
              shard: 2,
              proof: none,
              units: verticals/commerce-customer-context verticals/storefront-registry verticals/workforce verticals/tagging verticals/crm verticals/sales-pipeline,
            }
          - {
              shard: 3,
              proof: none,
              units: verticals/assortment apps/shell-super-app verticals/merchandise verticals/facility-operations verticals/sales-insights,
            }
          - {
              shard: 4,
              proof: none,
              units: verticals/party-registry verticals/inventory verticals/availability verticals/finance-billing verticals/crm-activities,
            }
          - {
              shard: 5,
              proof: node,
              units: verticals/commerce-market-catalog verticals/price-group-catalog verticals/pricing verticals/payment-term-catalog verticals/privacy verticals/projects,
            }
    # Only the proving shard starts PostgreSQL; its complete handler layers acquire real pools.
    services:
      proof-postgres:
        image: ${{ matrix.proof == 'node' && 'postgres:18.6-alpine' || '' }}
        env:
          POSTGRES_DB: ontos_proof
          POSTGRES_PASSWORD: ontos_proof_admin
          POSTGRES_USER: ontos_proof_admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ontos_proof_admin -d ontos_proof"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_proof_admin:ontos_proof_admin@localhost:5433/ontos_proof
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_proof
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_proof
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Node artifacts one unit at a time
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Wait for every other Node build shard to upload its outputs
        if: matrix.proof != 'none'
        working-directory: app
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-build-shards.sh 'Build node artifacts (' 5 'Build node artifacts (${{ matrix.shard }}/5)'

      - name: Download every shard's Node build outputs
        if: matrix.proof == 'node'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Node build outputs of every delivery unit
        if: matrix.proof == 'node'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types and check performance readiness over every unit
        if: matrix.proof == 'node'
        working-directory: app
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      # The bare PostgreSQL service has no runtime roles. Keep creation outside migration policy.
      - name: Initialize the fresh CI database identities from the grant manifest
        if: matrix.proof == 'node'
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Migrate the Node proof database and provision its runtime identities
        if: matrix.proof == 'node'
        working-directory: app
        run: mise exec -- pnpm db:migrate

      - name: Prove Node backend-federation artifacts
        if: matrix.proof == 'node'
        working-directory: app
        run: mise exec -- pnpm node:proof

      # The deployed publisher derives the snapshot from exactly these artifact kinds; this proves its output
      # decodes with the consumers' ActiveApplicationCompositionSnapshotSchema before stage depends on it.
      - name: Prove the active Application Composition publisher output decodes
        if: matrix.proof == 'node'
        working-directory: app
        run: mise exec -- pnpm active-composition:publish prove-build

  cloudflare-artifact-build:
    name: Build cloudflare artifacts (${{ matrix.shard }}/5)
    needs: [queue-proof]
    # The proving shard reads its siblings' job results.
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        include:
          - {
              shard: 1,
              proof: topology,
              units: verticals/assortment verticals/pricing verticals/property-portfolio verticals/property-leasing verticals/legal-agreements,
            }
          - {
              shard: 2,
              proof: none,
              units: verticals/party-registry verticals/price-group-catalog verticals/availability verticals/work-tasks verticals/workforce verticals/tagging,
            }
          - {
              shard: 3,
              proof: outputs,
              units: verticals/catalog verticals/storefront-registry verticals/crm verticals/sales-pipeline verticals/merchandise,
            }
          - {
              shard: 4,
              proof: none,
              units: verticals/commerce-customer-context apps/shell-super-app verticals/tax verticals/facility-operations verticals/sales-insights verticals/finance-billing,
            }
          - {
              shard: 5,
              proof: none,
              units: verticals/inventory verticals/commerce-market-catalog verticals/payment-term-catalog verticals/privacy verticals/crm-activities verticals/projects,
            }
    env:
      # Placeholder data-plane IDs: locally a Worker's Hyperdrive bindings connect to the proof's
      # PostgreSQL, its SPICEDB binding is served by a local gateway Worker and its composition KV
      # binding is a local namespace.
      ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_GATEWAY_ISSUER_HYPERDRIVE_ID: '00000000000000000000000000000000'
      ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_PARTY_REGISTRY_HYPERDRIVE_ID: '00000000000000000000000000000000'
      ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Cloudflare artifacts one unit at a time
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          SHARD_UNITS: ${{ matrix.units }}
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_AVAILABILITY: https://availability.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_CRM: https://crm.invalid
          ULTRAMODERN_PUBLIC_URL_CRM_ACTIVITIES: https://crm-activities.invalid
          ULTRAMODERN_PUBLIC_URL_FACILITY_OPERATIONS: https://facility-operations.invalid
          ULTRAMODERN_PUBLIC_URL_FINANCE_BILLING: https://finance-billing.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_LEGAL_AGREEMENTS: https://legal-agreements.invalid
          ULTRAMODERN_PUBLIC_URL_MERCHANDISE: https://merchandise.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_PRIVACY: https://privacy.invalid
          ULTRAMODERN_PUBLIC_URL_PROJECTS: https://projects.invalid
          ULTRAMODERN_PUBLIC_URL_PROPERTY_LEASING: https://property-leasing.invalid
          ULTRAMODERN_PUBLIC_URL_PROPERTY_PORTFOLIO: https://property-portfolio.invalid
          ULTRAMODERN_PUBLIC_URL_SALES_INSIGHTS: https://sales-insights.invalid
          ULTRAMODERN_PUBLIC_URL_SALES_PIPELINE: https://sales-pipeline.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
          ULTRAMODERN_PUBLIC_URL_TAGGING: https://tagging.invalid
          ULTRAMODERN_PUBLIC_URL_TAX: https://tax.invalid
          ULTRAMODERN_PUBLIC_URL_WORK_TASKS: https://work-tasks.invalid
          ULTRAMODERN_PUBLIC_URL_WORKFORCE: https://workforce.invalid
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run cloudflare:build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # Development-only service values for the Worker topology proof (as in service-integration). Both
      # proofs see them, but the build above does not.
      - name: Set the development-only service values of the Worker proofs
        if: matrix.proof != 'none'
        env:
          DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
          ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
          PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
          PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
          SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
          POSTGRES_DB: ontos_ci
          POSTGRES_PASSWORD: ontos_ci_admin
          POSTGRES_PORT: '5433'
          POSTGRES_USER: ontos_ci_admin
          SPICEDB_ENDPOINT: localhost:50051
          SPICEDB_GRPC_PORT: '50051'
          SPICEDB_HTTP_PORT: '8443'
          SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
          BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
          BETTER_AUTH_URL: http://localhost:3020
          ONTOS_GATEWAY_ISSUER: http://localhost:3020
          ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
          ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
        run: printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_|PARTY_REGISTRY_DATABASE_URL=|PARTY_REGISTRY_WORKER_DATABASE_URL=|SHELL_GATEWAY_ISSUER_DATABASE_URL=)' >> "$GITHUB_ENV"

      # The topology proof's services start and migrate from source while the other shards still build.
      - name: Create the local SpiceDB TLS certificate
        if: matrix.proof == 'topology'
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services for the Worker topology
        if: matrix.proof == 'topology'
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Initialize the fresh CI database identities from the grant manifest
        if: matrix.proof == 'topology'
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Migrate and initialize the local tenant for the Worker topology
        if: matrix.proof == 'topology'
        working-directory: app
        # The migrations and local initialization read the app .env; write it from this job's
        # development-only service values so every tool sees the same database and SpiceDB.
        run: |
          # SPICEDB_CA_CERT spans lines, so it goes in as one double-quoted dotenv value.
          printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_|PARTY_REGISTRY_DATABASE_URL=|PARTY_REGISTRY_WORKER_DATABASE_URL=|SHELL_GATEWAY_ISSUER_DATABASE_URL=)' | grep -v '^SPICEDB_CA_CERT=' > .env
          awk 'BEGIN { printf "SPICEDB_CA_CERT=\"" } NF { printf "%s\\n", $0 } END { print "\"" }' .spicedb-tls/cert.pem >> .env
          mise exec -- pnpm db:migrate
          mise exec -- pnpm local:initialize

      - name: Wait for every other Cloudflare build shard to upload its outputs
        if: matrix.proof != 'none'
        working-directory: app
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-build-shards.sh 'Build cloudflare artifacts (' 5 'Build cloudflare artifacts (${{ matrix.shard }}/5)'

      - name: Download every shard's Cloudflare build outputs
        if: matrix.proof != 'none'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cloudflare-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Cloudflare build outputs of every delivery unit
        if: matrix.proof != 'none'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types, verify the Worker outputs and prove their SSR
        if: matrix.proof == 'outputs'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_AVAILABILITY: https://availability.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_CRM: https://crm.invalid
          ULTRAMODERN_PUBLIC_URL_CRM_ACTIVITIES: https://crm-activities.invalid
          ULTRAMODERN_PUBLIC_URL_FACILITY_OPERATIONS: https://facility-operations.invalid
          ULTRAMODERN_PUBLIC_URL_FINANCE_BILLING: https://finance-billing.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_LEGAL_AGREEMENTS: https://legal-agreements.invalid
          ULTRAMODERN_PUBLIC_URL_MERCHANDISE: https://merchandise.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_PRIVACY: https://privacy.invalid
          ULTRAMODERN_PUBLIC_URL_PROJECTS: https://projects.invalid
          ULTRAMODERN_PUBLIC_URL_PROPERTY_LEASING: https://property-leasing.invalid
          ULTRAMODERN_PUBLIC_URL_PROPERTY_PORTFOLIO: https://property-portfolio.invalid
          ULTRAMODERN_PUBLIC_URL_SALES_INSIGHTS: https://sales-insights.invalid
          ULTRAMODERN_PUBLIC_URL_SALES_PIPELINE: https://sales-pipeline.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
          ULTRAMODERN_PUBLIC_URL_TAGGING: https://tagging.invalid
          ULTRAMODERN_PUBLIC_URL_TAX: https://tax.invalid
          ULTRAMODERN_PUBLIC_URL_WORK_TASKS: https://work-tasks.invalid
          ULTRAMODERN_PUBLIC_URL_WORKFORCE: https://workforce.invalid
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types --target cloudflare
          mise exec -- pnpm cloudflare-output:verify
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_GATEWAY_ISSUER_HYPERDRIVE="$SHELL_GATEWAY_ISSUER_DATABASE_URL"
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_PARTY_REGISTRY_HYPERDRIVE="$PARTY_REGISTRY_DATABASE_URL"
          mise exec -- pnpm cloudflare:ssr-proof

      # The built Workers, run together in workerd against real PostgreSQL and SpiceDB, prove the
      # Cloudflare topology end to end: Hyperdrive across requests, SpiceDB over HTTP, module
      # discovery and API calls over service bindings, and SSR.
      - name: Prove the Worker topology against PostgreSQL and SpiceDB
        if: matrix.proof == 'topology'
        working-directory: app
        timeout-minutes: 10
        run: mise exec -- bash scripts/prove-cloudflare-local-topology.sh

      - name: Remove the Worker topology service containers and volumes
        if: always() && matrix.proof == 'topology'
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # The one required status check of the main ruleset, so new gate jobs join it here, not the ruleset.
  # It passes when every gate passed, or when the merge queue already proved this commit and the gates were skipped.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        workspace-gate,
        static-contracts,
        format-and-lint,
        service-integration,
        node-artifact-build,
        cloudflare-artifact-build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate, or the merge queue proof of this commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          proof="$(jq -r '.["queue-proof"].result' <<<"$NEEDS_JSON")"
          if [[ "$proof" != success && "$proof" != skipped ]]; then
            echo "::error title=Merge queue proof not checked::The queue-proof job ended $proof."
            exit 1
          fi
          proven="$(jq -r '.["queue-proof"].outputs.proven // ""' <<<"$NEEDS_JSON")"
          expected=success
          if [[ "$proven" == true ]]; then
            expected=skipped
          fi
          failed="$(jq -r --arg expected "$expected" 'to_entries[] | select(.key != "queue-proof" and .value.result != $expected) | "\(.key) \(.value.result)"' <<<"$NEEDS_JSON")"
          if [[ -n "$failed" ]]; then
            echo "::error title=Workspace gates failed::Expected every gate $expected, got: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Every gate is $expected."

  # Only an explicit production dispatch on main deploys; stage deploys from the sales demo branch
  # (stage-demo-deploy.yml), the only path that ships the Cloudflare edge. The environment's DEPLOY_TARGET
  # variable must be `zerops` (also when unset), which deploys the whole topology to Zerops. Its
  # OUTBOX_WORKER_MODE variable, required, chooses how the Outbox Workers run on Zerops: `dedicated` (one
  # service per owner, highly available) or `host` (every owner in the one outbox-worker-host process, cheap).
  # There is no default, so an environment never inherits another's mode.
  # Environment variables and secrets are unreadable in a job-level `if`, so this job reads them
  # without creating a deployment (`deployment: false`). An environment without its Zerops project
  # and token deploys nothing and records nothing.
  deploy-target:
    name: Resolve the deploy target of the deployment environment
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    permissions: {}
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      environment: ${{ steps.target.outputs.environment }}
      outbox-worker-mode: ${{ steps.target.outputs.outbox_worker_mode }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve the deploy target and Outbox Worker mode and check the Zerops project and token
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          target="${DEPLOY_TARGET:-zerops}"
          # The Cloudflare edge deploys only from the sales demo branch (stage-demo-deploy.yml).
          if [[ "$target" != zerops ]]; then
            echo "::error title=Invalid deploy target::$DEPLOY_ENVIRONMENT DEPLOY_TARGET must be zerops, not '$target'."
            exit 1
          fi
          if [[ -n "$OUTBOX_WORKER_MODE" && "$OUTBOX_WORKER_MODE" != dedicated && "$OUTBOX_WORKER_MODE" != host ]]; then
            echo "::error title=Invalid Outbox Worker mode::$DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE must be dedicated or host, not '$OUTBOX_WORKER_MODE'."
            exit 1
          fi
          {
            echo "environment=$DEPLOY_ENVIRONMENT"
            echo "outbox_worker_mode=$OUTBOX_WORKER_MODE"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"
          if [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]]; then
            # A configured environment deploys Outbox Workers, so it must have chosen how they run.
            if [[ -z "$OUTBOX_WORKER_MODE" ]]; then
              echo "::error title=Outbox Worker mode not set::Set the $DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE variable to dedicated or host."
              exit 1
            fi
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo "::notice title=Zerops deploy not configured::Set the $DEPLOY_ENVIRONMENT ZEROPS_PROJECT_ID variable and ZEROPS_TOKEN secret to deploy $DEPLOY_ENVIRONMENT."
          fi

  # The deploy plan needs no gate, so it is ready by the time the gates pass or prove skipped.
  # It records no deployment: deploy-zerops is the environment's deployment, so a plan or migration that
  # succeeds before a failed deploy never moves the environment's diff base.
  deploy-plan:
    name: Plan the environment's deployment after merge to main
    if: ${{ !cancelled() && needs.deploy-target.outputs.configured == 'true' }}
    needs: [deploy-target]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      deployments: read
    outputs:
      any: ${{ steps.units.outputs.any }}
      migrator: ${{ steps.impact.outputs.migrator }}
      providers: ${{ steps.units.outputs.providers }}
      shell: ${{ steps.units.outputs.shell }}
      spicedb: ${{ steps.impact.outputs.spicedb }}
      stopped-workers: ${{ steps.impact.outputs.stopped_workers }}
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      # `host` runs every Outbox Worker in the one outbox-worker-host service instead of each owner's
      # dedicated worker service; the planner and the composition publisher both read it.
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      - name: Resolve the environment's last successful deployment
        id: base
        if: ${{ !inputs.full }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm deployment-base:resolve --environment "$DEPLOY_ENVIRONMENT"

      # An OUTBOX_WORKER_MODE switch changes no source, so the diff cannot show it. The other mode's workers
      # still running, or this mode's workers not running, is that switch, and the plan then deploys every
      # worker of this mode and stops the other mode's.
      - name: Detect Outbox Workers that do not match the Outbox Worker mode
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-mode-drift

      - name: Generate topology-driven deployment impact plan
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          FULL_PLAN: ${{ inputs.full }}
          WORKER_DRIFT: ${{ steps.worker-drift.outputs.drift }}
        run: |
          plan_arguments=()
          if [[ "$FULL_PLAN" != 'true' ]]; then
            plan_arguments=(--base "$BASE_SHA")
          fi
          if [[ "$WORKER_DRIFT" == 'true' ]]; then
            plan_arguments+=(--reconcile-workers)
          fi
          mise exec -- pnpm deployment-impact:plan \
            --authorization-environment "$DEPLOY_ENVIRONMENT" \
            --outbox-worker-mode "$OUTBOX_WORKER_MODE" \
            "${plan_arguments[@]}" \
            --head "$GITHUB_SHA"

      - name: Record reviewed deployment impact plan
        env:
          DEPLOYMENT_PLAN_JSON: ${{ steps.impact.outputs.plan }}
        run: |
          {
            echo "## Reviewed deployment impact plan ($DEPLOY_ENVIRONMENT, $DEPLOY_TARGET target, $OUTBOX_WORKER_MODE Outbox Workers)"
            echo '```json'
            jq . <<<"$DEPLOYMENT_PLAN_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every planned provider, outbox worker and the Shell deploy in deploy-zerops.
      - name: Select the Zerops units of the deploy target
        id: units
        env:
          MIGRATOR: ${{ steps.impact.outputs.migrator }}
          PROVIDERS_JSON: ${{ steps.impact.outputs.providers }}
          SHELL: ${{ steps.impact.outputs.shell }}
          SPICEDB: ${{ steps.impact.outputs.spicedb }}
        run: |
          any=false
          if [[ "$MIGRATOR" == true || "$SPICEDB" == true || "$PROVIDERS_JSON" != '[]' || "$SHELL" == true ]]; then
            any=true
          fi
          {
            echo "any=$any"
            echo "providers=$PROVIDERS_JSON"
            echo "shell=$SHELL"
          } >>"$GITHUB_OUTPUT"

  # Incompatible first-cutover migrations require concrete provider quiescence first. Later releases
  # already use the native authority fences; this guard then performs no provider stop or deletion.
  initial-composition-cutover-guard:
    name: Verify first-cutover provider quiescence before migrations
    if: ${{ !cancelled() && needs.workspace-gates.result == 'success' && needs.deploy-plan.result == 'success' }}
    needs: [workspace-gates, deploy-target, deploy-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    concurrency:
      group: zerops-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the initial provider quiescence receipt
        if: vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Require native provider quiescence before the first authority exists
        working-directory: app
        run: mise exec -- pnpm active-composition:publish verify-initial-cutover --environment "$DEPLOY_ENVIRONMENT"

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  # A schema change drains and seals the old authority before touching its database. The native
  # publisher session lock stays held through verified migration and migrator stop completion.
  deploy-migrations:
    name: Migrate the environment's database and SpiceDB after the gates
    if: ${{ !cancelled() && needs.workspace-gates.result == 'success' && needs.deploy-plan.result == 'success' && needs.initial-composition-cutover-guard.result == 'success' }}
    needs: [workspace-gates, deploy-target, deploy-plan, initial-composition-cutover-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    # Provider quiescence precedes the incompatible initial migration; publication fences govern later releases.
    concurrency:
      group: zerops-migrations-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      INFRASTRUCTURE: ${{ needs.deploy-plan.outputs.migrator == 'true' || needs.deploy-plan.outputs.spicedb == 'true' }}
      ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SPICEDB_SERVICE_ID: ${{ vars.ZEROPS_SPICEDB_SERVICE_ID }}
      ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - name: Harden Runner
        if: env.INFRASTRUCTURE == 'true'
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        if: env.INFRASTRUCTURE == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        if: env.INFRASTRUCTURE == 'true'
        uses: ./.github/actions/install-app

      - name: Download the initial provider retirement receipt for migration
        if: needs.deploy-plan.outputs.migrator == 'true' && vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Install Zerops CLI
        if: env.INFRASTRUCTURE == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      # app/zerops.yaml describes stage. Every push reads a copy that names the deploying environment, so
      # another environment's builds and runtimes never run stage-only behaviour. Production's copy also
      # points every runtime at its TLS SpiceDB endpoint, the production environment variable SPICEDB_ENDPOINT.
      - name: Materialize the environment's zerops.yaml
        if: env.INFRASTRUCTURE == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        if: needs.deploy-plan.outputs.migrator == 'true'
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Run verified database migrations
        if: needs.deploy-plan.outputs.migrator == 'true'
        id: migrator
        working-directory: app
        run: >-
          mise exec -- pnpm active-composition:publish migrate
          --environment "$DEPLOY_ENVIRONMENT"
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --version-name "$GITHUB_SHA"

      - name: Show bounded migrator logs after failure
        if: failure() && steps.migrator.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Deploy SpiceDB when affected
        if: needs.deploy-plan.outputs.spicedb == 'true'
        id: spicedb
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --setup spicedb
          --version-name "$GITHUB_SHA"

      - name: Show bounded SpiceDB logs after failure
        if: failure() && steps.spicedb.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}

  # The Outbox Worker host never builds on Zerops. When the plan deploys it, CI builds its musl artifact once,
  # beside the migrations, under the host digest the artifact must carry, and deploy-zerops only deploys it.
  # It is its own job so the Alpine build's musl files never reach the runner that later runs the workspace.
  build-outbox-host:
    name: Build the Outbox Worker host after merge to main
    if: >-
      ${{ !cancelled() && needs.deploy-plan.result == 'success'
      && contains(needs.deploy-plan.outputs.providers, '"outbox-worker-host"') }}
    needs: [deploy-target, deploy-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup the pinned Node
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: app

      - name: Compute the Outbox Worker host digest
        id: digest
        working-directory: app
        env:
          DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
        run: |
          digest="$(mise exec -- node scripts/ci/deploy-plan.mts host-digest --output "$RUNNER_TEMP/host-inputs.json")"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Outbox Worker host digest::deploy-plan.mts host-digest printed no digest" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          # Main builds every hosted owner at HEAD.
          echo "owner_revisions=$(jq -c .ownerRevisions "$RUNNER_TEMP/host-inputs.json")" >>"$GITHUB_OUTPUT"

      - name: Build the host in Alpine
        env:
          ONTOS_OUTBOX_HOST_DIGEST: ${{ steps.digest.outputs.digest }}
          ONTOS_OUTBOX_HOST_OWNER_REVISIONS: ${{ steps.digest.outputs.owner_revisions }}
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          docker run --rm \
            --env ONTOS_OUTBOX_HOST_DIGEST --env ONTOS_OUTBOX_HOST_OWNER_REVISIONS --env ULTRAMODERN_SOURCE_REVISION \
            --env RUNNER_TEMP=/runner-temp \
            --volume "$GITHUB_WORKSPACE:/src" --volume "$RUNNER_TEMP:/runner-temp" --workdir /src \
            alpine:3.23 sh app/scripts/ci/build-outbox-host.sh
          ls -lh "$RUNNER_TEMP/outbox-host.tar.zst"

      - name: Upload the host artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outbox-host-${{ steps.digest.outputs.digest }}
          path: ${{ runner.temp }}/outbox-host.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The environment's deployment: the providers, outbox workers and Shell that run on Zerops.
  # A planned Outbox Worker host deploys only the artifact build-outbox-host built; a failed build stops the deploy.
  deploy-zerops:
    name: Deploy the environment's Zerops services after merge to main
    if: >-
      ${{ !cancelled() && needs.deploy-migrations.result == 'success'
      && (needs.build-outbox-host.result == 'success' || needs.build-outbox-host.result == 'skipped') }}
    needs: [deploy-target, deploy-plan, deploy-migrations, build-outbox-host]
    runs-on: ubuntu-latest
    # Each Zerops push builds its unit remotely for about 12 minutes and units deploy one after another in
    # plan order, so a full topology deploy (12 units plus publication) needs about 3 hours.
    timeout-minutes: 240
    environment: ${{ needs.deploy-target.outputs.environment }}
    # Serializes with the scheduled composition refresh so no publication interleaves with a deploy.
    concurrency:
      group: zerops-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SHELL_SERVICE_ID: ${{ vars.ZEROPS_SHELL_SERVICE_ID }}
      ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE: ${{ vars.ONTOS_INITIAL_COMPOSITION_EXECUTION_INVENTORY_FILE }}
      ONTOS_INITIAL_COMPOSITION_CUTOVER_RECEIPT_FILE: .initial-composition-cutover/initial-composition-cutover-receipt.json
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the initial provider quiescence receipt for Node publication
        if: needs.deploy-plan.outputs.any == 'true' && vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: initial-composition-cutover-receipt
          path: app/.initial-composition-cutover
          github-token: ${{ github.token }}
          run-id: ${{ vars.ONTOS_INITIAL_COMPOSITION_CUTOVER_RUN_ID }}

      - name: Install Zerops CLI
        if: needs.deploy-plan.outputs.any == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      - name: Materialize the environment's zerops.yaml
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Download the prebuilt Outbox Worker host
        if: needs.build-outbox-host.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: outbox-host-${{ needs.build-outbox-host.outputs.digest }}
          path: ${{ runner.temp }}/outbox-host

      - name: Deploy affected providers
        if: needs.deploy-plan.outputs.providers != '[]'
        env:
          UNITS_JSON: ${{ needs.deploy-plan.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          OUTBOX_HOST_ARTIFACT: ${{ runner.temp }}/outbox-host/outbox-host.tar.zst
          OUTBOX_HOST_DIGEST: ${{ needs.build-outbox-host.outputs.digest }}
        run: app/scripts/push-zerops-units.sh

      - name: Deploy Shell after affected providers
        if: needs.deploy-plan.outputs.shell == 'true'
        id: shell
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          UNITS_JSON: '["shellsuperapp"]'
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # Every publication stays inside the environment lock; all hosts read the same native KV value.
      - name: Connect the runner to the private Zerops database network
        id: composition-vpn
        if: needs.deploy-plan.outputs.any == 'true'
        uses: ./.github/actions/zerops-vpn
        with:
          operation: connect
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-admin-url: ${{ secrets.DATABASE_ADMIN_URL }}

      - name: Publish the complete active Application Composition
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL: ${{ vars.ONTOS_ACTIVE_APPLICATION_COMPOSITION_URL }}
          COMPOSITION_CANDIDATE_FILE: ${{ vars.ONTOS_APPLICATION_COMPOSITION_CANDIDATE_FILE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT" --candidate-file "$COMPOSITION_CANDIDATE_FILE"

      # Switching OUTBOX_WORKER_MODE leaves the other mode's Outbox Workers running. The plan names them in every
      # run that deploys this mode's workers, so exactly one set of workers delivers the outbox.
      - name: Stop the other Outbox Worker mode's workers
        if: needs.deploy-plan.outputs.stopped-workers != '' && needs.deploy-plan.outputs.stopped-workers != '[]'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          STOPPED_WORKERS_JSON: ${{ needs.deploy-plan.outputs.stopped-workers }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          while IFS= read -r setup; do
            mise exec -- pnpm --silent active-composition:publish stop-service --setup "$setup"
          done < <(jq -r '.[]' <<<"$STOPPED_WORKERS_JSON")

      - name: Show bounded Shell logs after failure
        if: failure() && steps.shell.outcome == 'failure'
        continue-on-error: true
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SHELL_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Clear the runner-owned Zerops VPN
        if: always() && steps.composition-vpn.outputs.state-directory != ''
        uses: ./.github/actions/zerops-vpn
        with:
          operation: clear
          project-id: ${{ vars.ZEROPS_PROJECT_ID }}
          token: ${{ secrets.ZEROPS_TOKEN }}
          state-directory: ${{ steps.composition-vpn.outputs.state-directory }}
          cli-path: ${{ steps.composition-vpn.outputs.cli-path }}
