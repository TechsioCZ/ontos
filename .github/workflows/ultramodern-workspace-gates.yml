name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      full:
        description: Deploy the whole topology instead of the diff since the environment's last successful deployment (seeding or rewritten history).
        type: boolean
        default: false
      environment:
        description: GitHub deployment environment to deploy. Its DEPLOY_TARGET variable selects Zerops or Cloudflare; pushes to main deploy stage.
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace-gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Effect Rule Implementation
            command: pnpm typecheck:lint-rules && pnpm test:lint-rules
          - name: Typecheck
            command: pnpm typecheck
          - name: OntOS API Boundary Rules
            command: pnpm api:check:ontos
          - name: Database Access Boundaries
            command: pnpm database-access:check
          - name: Module Entrypoint Contracts
            command: pnpm module-entrypoints:check
          - name: Complete Unit and Component Tests
            command: pnpm test:unit
          - name: Repository Tooling Tests
            command: pnpm test:scripts
          - name: Deployment Impact Planner Tests
            command: pnpm test:deployment-impact
          - name: Codesmith and Generation Tests
            command: pnpm test:generation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- ${{ matrix.command }}

  static-contracts:
    name: Static Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Each check is a step, not a job: they take seconds, so a job each paid the install many times over.
      # Every step runs after a successful install, so one run reports every failing check.
      - name: Validate the root lefthook config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: app/node_modules/.bin/lefthook validate

      # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it.
      - name: Format and Lint through the pre-commit hook on every file
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --all-files --no-auto-install'
          git diff --exit-code HEAD

      - name: Skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm skills:check

      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm api:check

      - name: Lean Core Dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm lean-core:check

      - name: Workspace Contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm contract:check

      - name: Module Contract Generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm check:module-contracts

      - name: Action Unit Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm action:test:unit

  service-integration:
    name: Database, Migration, RLS, Authorization, and Outbox Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: "5433"
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: "50051"
      SPICEDB_HTTP_PORT: "8443"
      SPICEDB_INSECURE: "true"
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          save-store: "true"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: "8080"
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Stage-shaped on the Cloudflare target: the host is materialized by its zerops.yaml build command,
      # ships only its deployFiles, polls every hosted owner's outbox against the freshly migrated
      # database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        working-directory: app
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        working-directory: app
        run: mise exec -- pnpm test:integration

      - name: Install Chromium and its runtime dependencies
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install --with-deps chromium

      - name: Run parallel authenticated browser tests without retries
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  node-runtime:
    name: Node Backend Federation Artifact Proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build Node deployment artifacts
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm build

      - name: Prove Node backend-federation artifacts
        working-directory: app
        env:
          DATABASE_URL: postgresql://ontos_proof:ontos_proof@localhost:5432/ontos_proof
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm node:proof

      # The deployed publisher derives the snapshot from exactly these artifact kinds; this proves its output
      # decodes with the consumers' ActiveApplicationCompositionSnapshotSchema before stage depends on it.
      - name: Prove the active Application Composition publisher output decodes
        working-directory: app
        run: mise exec -- pnpm active-composition:publish prove-build

  cloudflare-runtime:
    name: Cloudflare Workerd Artifact Proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Development-only service values for the Worker topology proof (as in service-integration).
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: "5433"
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: "50051"
      SPICEDB_HTTP_PORT: "8443"
      SPICEDB_INSECURE: "true"
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      # Placeholder data-plane IDs: locally a Worker's HYPERDRIVE binding connects to the proof's
      # PostgreSQL and its SPICEDB binding is served by a local gateway Worker.
      ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build and prove Cloudflare/workerd artifacts
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm cloudflare:build

      # The built Workers, run together in workerd against real PostgreSQL and SpiceDB, prove the
      # Cloudflare topology end to end: Hyperdrive across requests, SpiceDB over HTTP, module
      # discovery and API calls over service bindings, and SSR.
      - name: Start fresh PostgreSQL and SpiceDB services for the Worker topology
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Migrate and initialize the local tenant for the Worker topology
        working-directory: app
        # The migrations and local initialization read the app .env; write it from this job's
        # development-only service values so every tool sees the same database and SpiceDB.
        run: |
          printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_)' > .env
          mise exec -- pnpm db:migrate
          mise exec -- pnpm local:initialize

      - name: Prove the Worker topology against PostgreSQL and SpiceDB
        working-directory: app
        timeout-minutes: 10
        run: mise exec -- bash scripts/prove-cloudflare-local-topology.sh

      - name: Remove the Worker topology service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

      # The Commerce Cloudflare build once crashed parsing Catalog's root HttpApi chain because React
      # Compiler also compiled server code. Production imports only the quantity-preparation client;
      # this case keeps the whole Catalog client barrel compiling in the Commerce workerd graph.
      - name: Build Commerce for workerd with the whole Catalog client barrel
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
        run: |
          mise exec -- pnpm --filter @app/commerce-customer-context run cloudflare:build:full-catalog-client-guard
          grep -qF '"CatalogApiFoundation"' verticals/commerce-customer-context/dist-cloudflare/worker/__modern_bff_effect.js

  # Each GitHub deployment environment chooses where its delivery units run with its DEPLOY_TARGET
  # variable: `zerops` (also when unset) deploys the whole topology to Zerops; `cloudflare` keeps only
  # the migrator, SpiceDB and the outbox workers on Zerops and ships the placed units as Workers in
  # deploy-cloudflare. Pushes to main deploy stage; production deploys only on an explicit dispatch.
  # Environment variables and secrets are unreadable in a job-level `if`, so this job reads them
  # without creating a deployment (`deployment: false`). An environment without its Zerops project
  # and token deploys nothing and records nothing.
  deploy-target:
    name: Resolve the deploy target of the deployment environment
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment || 'stage' }}
      deployment: false
    permissions: {}
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      environment: ${{ steps.target.outputs.environment }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve the deploy target and check the Zerops project and token
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'stage' }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          target="${DEPLOY_TARGET:-zerops}"
          if [[ "$target" != zerops && "$target" != cloudflare ]]; then
            echo "::error title=Invalid deploy target::$DEPLOY_ENVIRONMENT DEPLOY_TARGET must be zerops or cloudflare, not '$target'."
            exit 1
          fi
          # The edge deploy keeps its history in stage-edge and builds from the stage build
          # environment in topology/cloudflare-placement.json, so only stage can target Cloudflare.
          if [[ "$target" == cloudflare && "$DEPLOY_ENVIRONMENT" != stage ]]; then
            echo "::error title=Invalid deploy target::Only stage can target Cloudflare; set $DEPLOY_ENVIRONMENT DEPLOY_TARGET to zerops."
            exit 1
          fi
          {
            echo "environment=$DEPLOY_ENVIRONMENT"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"
          if [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo "::notice title=Zerops deploy not configured::Set the $DEPLOY_ENVIRONMENT ZEROPS_PROJECT_ID variable and ZEROPS_TOKEN secret to deploy $DEPLOY_ENVIRONMENT."
          fi

  # On the Cloudflare target this job migrates the database and swaps the outbox workers for the host, so it
  # runs only once the edge deploy that ships the placed units is configured too. edge-deploy-readiness
  # checks only stage, the one environment that can target Cloudflare, so it is skipped for production.
  deploy-zerops:
    name: Deploy the environment's Zerops services after merge to main
    if: >-
      !cancelled()
      && needs.workspace-gate.result == 'success'
      && needs.static-contracts.result == 'success'
      && needs.service-integration.result == 'success'
      && needs.node-runtime.result == 'success'
      && needs.cloudflare-runtime.result == 'success'
      && needs.deploy-target.outputs.configured == 'true'
      && (needs.deploy-target.outputs.target == 'zerops' || needs.edge-deploy-readiness.outputs.configured == 'true')
    needs:
      [workspace-gate, static-contracts, service-integration, node-runtime, cloudflare-runtime, deploy-target, edge-deploy-readiness]
    runs-on: ubuntu-latest
    # Each Zerops push builds its unit remotely for about 12 minutes and units deploy one after another in
    # plan order, so a full topology deploy (12 units plus migrations and publication) needs about 3 hours.
    timeout-minutes: 240
    environment: ${{ needs.deploy-target.outputs.environment }}
    # Serializes with the scheduled composition refresh so no publication interleaves with a deploy.
    concurrency:
      group: zerops-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      # `cloudflare` runs every Outbox Worker in the one outbox-worker-host service instead of each owner's
      # dedicated worker service; the planner and the composition publisher both read it.
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SHELL_SERVICE_ID: ${{ vars.ZEROPS_SHELL_SERVICE_ID }}
      ZEROPS_SPICEDB_SERVICE_ID: ${{ vars.ZEROPS_SPICEDB_SERVICE_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      - name: Resolve the environment's last successful deployment
        id: base
        if: ${{ !inputs.full }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm deployment-base:resolve --environment "$DEPLOY_ENVIRONMENT"

      # A DEPLOY_TARGET switch changes no source, so the diff cannot show it. The other target's workers
      # still running, or this target's workers not running, is that switch, and the plan then deploys every
      # worker of this target and stops the other target's.
      - name: Detect Outbox Workers that do not match the deploy target
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-target-drift

      - name: Generate topology-driven deployment impact plan
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          FULL_PLAN: ${{ inputs.full }}
          WORKER_DRIFT: ${{ steps.worker-drift.outputs.drift }}
        run: |
          plan_arguments=()
          if [[ "$FULL_PLAN" != 'true' ]]; then
            plan_arguments=(--base "$BASE_SHA")
          fi
          if [[ "$WORKER_DRIFT" == 'true' ]]; then
            plan_arguments+=(--reconcile-workers)
          fi
          mise exec -- pnpm deployment-impact:plan \
            --authorization-environment "$DEPLOY_ENVIRONMENT" \
            --deploy-target "$DEPLOY_TARGET" \
            "${plan_arguments[@]}" \
            --head "$GITHUB_SHA"

      - name: Record reviewed deployment impact plan
        env:
          DEPLOYMENT_PLAN_JSON: ${{ steps.impact.outputs.plan }}
        run: |
          {
            echo "## Reviewed deployment impact plan ($DEPLOY_ENVIRONMENT, $DEPLOY_TARGET target)"
            echo '```json'
            jq . <<<"$DEPLOYMENT_PLAN_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan carries both targets. On Zerops every planned provider, outbox worker and the Shell
      # deploy here. On Cloudflare the placed units ship as Workers in deploy-cloudflare, and only the
      # outbox workers, which drain PostgreSQL outboxes, stay on Zerops beside the infrastructure.
      - name: Select the Zerops units of the deploy target
        id: units
        env:
          MIGRATOR: ${{ steps.impact.outputs.migrator }}
          PROVIDERS_JSON: ${{ steps.impact.outputs.providers }}
          SHELL: ${{ steps.impact.outputs.shell }}
          SPICEDB: ${{ steps.impact.outputs.spicedb }}
          WORKERS_JSON: ${{ steps.impact.outputs.workers }}
        run: |
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            providers="$WORKERS_JSON"
            shell=false
          else
            providers="$PROVIDERS_JSON"
            shell="$SHELL"
          fi
          any=false
          if [[ "$MIGRATOR" == true || "$SPICEDB" == true || "$providers" != '[]' || "$shell" == true ]]; then
            any=true
          fi
          {
            echo "any=$any"
            echo "providers=$providers"
            echo "shell=$shell"
          } >>"$GITHUB_OUTPUT"

      - name: Install Zerops CLI
        if: steps.units.outputs.any == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      - name: Authenticate to Zerops
        if: steps.units.outputs.any == 'true'
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: zcli login "$ZEROPS_TOKEN"

      # app/zerops.yaml describes stage. Every push reads a copy that names the deploying environment, so
      # another environment's builds and runtimes never run stage-only behaviour. Production's copy also
      # points every runtime at its TLS SpiceDB endpoint, the production environment variable SPICEDB_ENDPOINT.
      - name: Materialize the environment's zerops.yaml
        if: steps.units.outputs.any == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Run verified database migrations
        if: steps.impact.outputs.migrator == 'true'
        id: migrator
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --setup migrator
          --version-name "$GITHUB_SHA"

      - name: Show bounded migrator logs after failure
        if: failure() && steps.migrator.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      # zcli waits for the stop process and exits non-zero when it fails, so a migrator left running fails the deploy.
      - name: Stop migrator after any attempted migration
        if: always() && steps.migrator.outcome != 'skipped'
        run: >-
          zcli service stop
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"

      - name: Deploy SpiceDB when affected
        if: steps.impact.outputs.spicedb == 'true'
        id: spicedb
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --setup spicedb
          --version-name "$GITHUB_SHA"

      - name: Show bounded SpiceDB logs after failure
        if: failure() && steps.spicedb.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      - name: Resolve active Application Composition consumers
        id: composition
        if: steps.units.outputs.any == 'true'
        working-directory: app
        run: mise exec -- pnpm --silent active-composition:publish consumers

      - name: Deploy affected providers that do not consume the active composition
        if: steps.units.outputs.providers != '[]'
        env:
          CONSUMERS_JSON: ${{ steps.composition.outputs.consumers }}
          PROVIDERS_JSON: ${{ steps.units.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          UNITS_JSON="$(jq -c --argjson consumers "$CONSUMERS_JSON" '[.[] | select(IN($consumers[]) | not)]' <<<"$PROVIDERS_JSON")"
          export UNITS_JSON
          app/scripts/push-zerops-units.sh

      - name: Deploy Shell after affected providers
        if: steps.units.outputs.shell == 'true'
        id: shell
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          UNITS_JSON: '["shellsuperapp"]'
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # Consumers refuse to start without the snapshot. Publish the observed inventory without the consumers
      # about to be deployed, so they start on a current snapshot, then observe them and publish it complete.
      - name: Publish the active Application Composition before its consumers deploy
        id: planned-consumers
        if: steps.units.outputs.any == 'true'
        working-directory: app
        env:
          CONSUMERS_JSON: ${{ steps.composition.outputs.consumers }}
          PROVIDERS_JSON: ${{ steps.units.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          planned="$(jq -c --argjson consumers "$CONSUMERS_JSON" '[.[] | select(IN($consumers[]))]' <<<"$PROVIDERS_JSON")"
          echo "units=$planned" >> "$GITHUB_OUTPUT"
          if [[ "$planned" == '[]' ]]; then
            echo 'No composition consumer is planned; the complete publication follows.'
            exit 0
          fi
          # On Cloudflare a new or moved Worker is unobservable until deploy-cloudflare ships it, so the
          # consumers start on the current snapshot and publish-edge-composition publishes after the edge deploy.
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            echo 'The Cloudflare target publishes after the edge deploy; consumers start on the current snapshot.'
            exit 0
          fi
          exclusions=()
          while IFS= read -r unit; do
            exclusions+=(--exclude-app "$unit")
          done < <(jq -r '.[]' <<<"$planned")
          mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT" "${exclusions[@]}"

      - name: Deploy affected composition consumers
        if: steps.planned-consumers.outputs.units != '' && steps.planned-consumers.outputs.units != '[]'
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          UNITS_JSON: ${{ steps.planned-consumers.outputs.units }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # On Cloudflare, publish-edge-composition publishes and restarts the consumers after the edge deploy.
      - name: Publish the complete active Application Composition and restart its consumers
        if: steps.units.outputs.any == 'true' && env.DEPLOY_TARGET == 'zerops'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT" --restart-consumers

      # Switching DEPLOY_TARGET leaves the other target's Outbox Workers running. The plan names them in every
      # run that deploys this target's workers, so exactly one set of workers delivers the outbox.
      - name: Stop the other deploy target's Outbox Workers
        if: steps.impact.outputs.stopped_workers != '' && steps.impact.outputs.stopped_workers != '[]'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          STOPPED_WORKERS_JSON: ${{ steps.impact.outputs.stopped_workers }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          while IFS= read -r setup; do
            mise exec -- pnpm --silent active-composition:publish stop-service --setup "$setup"
          done < <(jq -r '.[]' <<<"$STOPPED_WORKERS_JSON")

      - name: Show bounded Shell logs after failure
        if: failure() && steps.shell.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SHELL_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

  # The edge deploy runs only when the repository is configured for Cloudflare: the
  # CLOUDFLARE_ACCOUNT_ID variable, the `stage-edge` CLOUDFLARE_API_TOKEN secret, and a complete
  # reviewed build environment (the Shell origin and every placed Worker's public URL). Environment
  # secrets are unreadable in a job-level `if`, so this job reads them from `stage-edge` without
  # creating a deployment (`deployment: false`); only a real edge deploy enters its history.
  edge-deploy-readiness:
    name: Check the Cloudflare edge deploy configuration
    if: needs.deploy-target.outputs.environment == 'stage'
    needs: [deploy-target]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
    steps:
      - name: Checkout the edge placement
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: app/topology/cloudflare-placement.json
          sparse-checkout-cone-mode: false

      - name: Check the Cloudflare account, deploy token and edge build environment
        id: configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=('the CLOUDFLARE_ACCOUNT_ID variable')
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=('the stage-edge CLOUDFLARE_API_TOKEN secret')
          # The placed units bake the Shell origin into their API CORS allowlist, the output
          # verifier requires every Worker's public URL, and every Worker binds the private data
          # plane: PostgreSQL through its Hyperdrive config, SpiceDB through its Workers VPC service.
          while IFS= read -r key; do
            missing+=("buildEnvironment.$key")
          done < <(jq -r '.buildEnvironment as $environment | (["ULTRAMODERN_MF_DEV_ORIGIN", "ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID", "ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID"] + [.units[] | "ULTRAMODERN_PUBLIC_URL_" + (ascii_upcase | gsub("-"; "_"))])[] | select(($environment[.] // "") == "")' app/topology/cloudflare-placement.json)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=false' >>"$GITHUB_OUTPUT"
          joined="$(IFS=','; echo "${missing[*]}")"
          # Without the edge deploy the Cloudflare target would migrate and swap the outbox workers
          # while the old Workers keep serving, so a Cloudflare stage fails before any Zerops change.
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            echo "::error title=Edge deploy not configured::Stage targets Cloudflare but misses ${joined//,/, }; nothing was deployed."
            exit 1
          fi
          echo "::notice title=Edge deploy not configured::Missing ${joined//,/, }; edge units were not deployed."

  # Edge units (topology/cloudflare-placement.json) ship as Cloudflare Workers after the Zerops
  # deploy has migrated the database, so Worker code never runs against an older schema. The
  # `stage-edge` environment keeps its own deployment history: the job plans against the last
  # successful edge deployment, so a failed or skipped edge deploy is never hidden by a successful
  # Zerops one. Unconfigured repositories skip it, so it records nothing.
  deploy-cloudflare:
    name: Deploy edge units to Cloudflare Workers after the stage migration
    if: needs.edge-deploy-readiness.outputs.configured == 'true'
    needs: [deploy-zerops, edge-deploy-readiness]
    runs-on: ubuntu-latest
    # Step timeouts leave the restore step its own budget inside the job deadline, so a hung
    # deploy or proof still ends with every changed Worker restored.
    timeout-minutes: 90
    environment: stage-edge
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      # A full plan deploys every placed unit but still checks retirements against the last edge
      # deployment; only a first seed has none.
      - name: Resolve the last successful edge deployment
        id: base
        working-directory: app
        env:
          FULL_PLAN: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          optional=()
          if [[ "$FULL_PLAN" == 'true' ]]; then
            optional=(--optional)
          fi
          mise exec -- pnpm deployment-base:resolve --environment stage-edge "${optional[@]}"

      # A full recovery run after rewritten history may name a base no branch reaches any more; the
      # planner needs its placement to check retirements, so fetch that commit by id.
      - name: Fetch the last edge deployment commit
        if: steps.base.outputs.base != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
              fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Plan the impacted edge units
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          FULL_PLAN: ${{ inputs.full }}
        run: |
          base_arguments=()
          if [[ -n "$BASE_SHA" ]]; then
            base_arguments=(--placement-base "$BASE_SHA")
          fi
          if [[ "$FULL_PLAN" != 'true' ]]; then
            base_arguments+=(--base "$BASE_SHA")
          fi
          mise exec -- pnpm deployment-impact:plan \
            --authorization-environment stage \
            "${base_arguments[@]}" \
            --head "$GITHUB_SHA"

      # Only Wrangler sees the account token. Building, verifying and proving a unit runs
      # dependency code (bundlers, build plugins, the framework CLI), so those steps run without
      # it. The build step runs each unit's `cloudflare:deploy` up to, but not including, Wrangler.
      - name: Build and verify planned edge units
        timeout-minutes: 25
        working-directory: app
        env:
          CLOUDFLARE_UNITS_JSON: ${{ steps.impact.outputs.cloudflare }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          # Worker public URLs, binding names and the Shell origin are reviewed edge configuration
          # (topology/cloudflare-placement.json `buildEnvironment`), so changing them replans every
          # placed unit.
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          mapfile -t units < <(jq -r '.[] | [.id, .packageName, .workerName] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id package worker <<<"$unit"
            mise exec -- pnpm --filter "$package" run cloudflare:build
            mise exec -- pnpm --filter "$package" exec ultramodern-create ultramodern cloudflare-output-verify --app "$id" --require-public-urls
            # Wrangler deploys the name in the built config; the run snapshots and restores the
            # planned topology name, so they must be the same Worker.
            built_worker="$(mise exec -- pnpm --filter "$package" exec jq -r '.name' .output/wrangler.json)"
            if [[ "$built_worker" != "$worker" ]]; then
              echo "$id builds Worker $built_worker, but topology places $worker; no Worker was changed." >&2
              exit 1
            fi
          done

      - name: Deploy planned edge units in dependency order
        id: deploy
        timeout-minutes: 15
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_UNITS_JSON: ${{ steps.impact.outputs.cloudflare }}
          EDGE_DEPLOY_STATE: ${{ runner.temp }}/edge-deploy-state.tsv
        run: |
          active_version() {
            mise exec -- pnpm --filter "$1" exec wrangler deployments status --name "$2" --json \
              | jq -er '.versions | map(select(.percentage == 100)) | .[0].version_id'
          }
          # Snapshot every planned Worker's active version before changing any of them. Only
          # Cloudflare's "Worker not found" (API code 10007) means a first deployment without a
          # rollback target; any other failure aborts before anything is deployed.
          mapfile -t units < <(jq -r '.[] | [.packageName, .workerName] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          declare -A previous_versions=()
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r package worker <<<"$unit"
            status_log="$RUNNER_TEMP/deployments-status-$worker.log"
            if previous_version="$(active_version "$package" "$worker" 2>"$status_log")"; then
              previous_versions["$worker"]="$previous_version"
            elif grep -q 'code: 10007' "$status_log"; then
              previous_versions["$worker"]=''
            else
              cat "$status_log" >&2
              echo "Could not read the active version of $worker; no Worker was changed." >&2
              exit 1
            fi
          done
          # Each Worker is recorded with its snapshot before its deploy starts, so the restore step
          # covers a deploy that fails halfway.
          : >"$EDGE_DEPLOY_STATE"
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r package worker <<<"$unit"
            printf '%s\t%s\t%s\n' "$package" "$worker" "${previous_versions[$worker]}" >>"$EDGE_DEPLOY_STATE"
            mise exec -- pnpm --filter "$package" exec wrangler deploy --config .output/wrangler.json
          done

      - name: Prove the deployed edge units on their public URLs
        timeout-minutes: 15
        working-directory: app
        env:
          CLOUDFLARE_UNITS_JSON: ${{ steps.impact.outputs.cloudflare }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          mapfile -t packages < <(jq -r '.[].packageName' <<<"$CLOUDFLARE_UNITS_JSON")
          for package in "${packages[@]}"; do
            mise exec -- pnpm --filter "$package" run cloudflare:proof
          done

      # Retirement is two-phase. The deploy that drops a Worker from placement leaves it running, so
      # a rollback of its dependents still finds it. Once this run has proven the new topology, each
      # retired Worker that still exists is reported for an operator to delete
      # (`wrangler delete`); CI never deletes a Worker. The check is read-only and never fails the run.
      - name: Report retired Workers that still exist
        if: steps.impact.outputs.cloudflare_retirements != '[]'
        timeout-minutes: 5
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RETIREMENTS_JSON: ${{ steps.impact.outputs.cloudflare_retirements }}
        run: |
          mapfile -t retirements < <(jq -r '.[] | [.packageName, .workerName] | @tsv' <<<"$CLOUDFLARE_RETIREMENTS_JSON")
          for retirement in "${retirements[@]}"; do
            IFS=$'\t' read -r package worker <<<"$retirement"
            status_log="$RUNNER_TEMP/retired-status-$worker.log"
            if mise exec -- pnpm --filter "$package" exec wrangler deployments status --name "$worker" --json >/dev/null 2>"$status_log"; then
              echo "::warning title=Retired edge Worker still exists::No placed unit deploys $worker any more; delete it (wrangler delete --name $worker)."
            elif grep -q 'code: 10007' "$status_log"; then
              echo "$worker is retired"
            else
              echo "::warning title=Retired edge Worker not checked::Could not read $worker; check it is deleted."
            fi
          done

      # Worker versions are immutable. After a failed deploy or proof, each Worker this run
      # deployed returns to its snapshotted state: the exact version that was active before, or no
      # Worker at all when this run created it. A Worker counts as restored only once that state is
      # observed; anything left on the candidate is reported. A cancelled run restores too: its
      # deploy may have stopped after some Workers changed.
      - name: Restore the edge Workers this run deployed
        if: (failure() || cancelled()) && steps.deploy.outcome != 'skipped'
        timeout-minutes: 10
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_DEPLOY_STATE: ${{ runner.temp }}/edge-deploy-state.tsv
        run: |
          active_version() {
            mise exec -- pnpm --filter "$1" exec wrangler deployments status --name "$2" --json \
              | jq -er '.versions | map(select(.percentage == 100)) | .[0].version_id'
          }
          absent() {
            local status_log="$RUNNER_TEMP/restore-status-$2.log"
            ! active_version "$1" "$2" >/dev/null 2>"$status_log" && grep -q 'code: 10007' "$status_log"
          }
          deployed=()
          if [[ -f "$EDGE_DEPLOY_STATE" ]]; then
            mapfile -t deployed <"$EDGE_DEPLOY_STATE"
          fi
          unrestored=()
          # Restore in reverse deploy order: a unit that binds another returns to its previous version
          # before its binding target does, so no consumer is left calling an older provider.
          for (( index = ${#deployed[@]} - 1; index >= 0; index-- )); do
            IFS=$'\t' read -r deployed_package deployed_worker previous_version <<<"${deployed[index]}"
            if [[ -z "$previous_version" ]]; then
              if absent "$deployed_package" "$deployed_worker"; then
                echo "$deployed_worker, which this run was creating, does not exist"
              elif mise exec -- pnpm --filter "$deployed_package" exec wrangler delete --name "$deployed_worker" --force \
                && absent "$deployed_package" "$deployed_worker"; then
                echo "Removed $deployed_worker, which this run created"
              else
                unrestored+=("$deployed_worker (created by this run and not removed)")
              fi
              continue
            fi
            if [[ "$(active_version "$deployed_package" "$deployed_worker" 2>/dev/null)" == "$previous_version" ]]; then
              echo "$deployed_worker still serves $previous_version"
            elif mise exec -- pnpm --filter "$deployed_package" exec wrangler rollback "$previous_version" --name "$deployed_worker" --message "Rollback of $GITHUB_SHA after a failed edge deploy" --yes \
              && [[ "$(active_version "$deployed_package" "$deployed_worker")" == "$previous_version" ]]; then
              echo "Restored $deployed_worker to $previous_version"
            else
              unrestored+=("$deployed_worker (expected $previous_version)")
            fi
          done
          for worker_state in "${unrestored[@]}"; do
            echo "::error title=Edge Worker not restored::$worker_state is still serving $GITHUB_SHA"
          done
          [[ ${#unrestored[@]} -eq 0 ]]

  # On the Cloudflare target the snapshot observes the Workers, so it is published again once the edge
  # deploy has replaced them, and the consumers left on Zerops (the outbox workers) restart on it.
  publish-edge-composition:
    name: Publish the active Application Composition after the edge deploy
    if: needs.deploy-target.outputs.target == 'cloudflare'
    needs: [deploy-target, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishing is not a deployment: it must not become the stage deploy's diff base.
    environment:
      name: stage
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      edge-consumers: ${{ steps.edge-consumers.outputs.edge_consumers }}
      snapshot: ${{ steps.publish.outputs.snapshot }}
    env:
      DEPLOY_TARGET: cloudflare
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Publish the observed Workers and restart the Zerops consumers
        id: publish
        working-directory: app
        env:
          SNAPSHOT_FILE: ${{ runner.temp }}/active-application-composition.json
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          mise exec -- pnpm active-composition:publish publish --environment stage --restart-consumers \
            --snapshot-file "$SNAPSHOT_FILE"
          # The encoded snapshot is one JSON line, and it holds no secret.
          echo "snapshot=$(<"$SNAPSHOT_FILE")" >>"$GITHUB_OUTPUT"

      - name: Resolve the placed Workers that consume the snapshot
        id: edge-consumers
        working-directory: app
        run: mise exec -- pnpm --silent active-composition:publish edge-consumers

  # A placed Worker has no Zerops project variable, so each snapshot consumer among them receives the
  # publication as the Worker secret it reads. Only stage-edge holds the Cloudflare token, so this runs
  # there, without creating a deployment. Putting a secret deploys the Worker's current version with it.
  sync-edge-composition:
    name: Hand the published Application Composition to its Worker consumers
    if: needs.publish-edge-composition.outputs.edge-consumers != '' && needs.publish-edge-composition.outputs.edge-consumers != '[]'
    needs: [publish-edge-composition]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Put the snapshot as each consumer Worker's secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_CONSUMERS_JSON: ${{ needs.publish-edge-composition.outputs.edge-consumers }}
          SNAPSHOT_JSON: ${{ needs.publish-edge-composition.outputs.snapshot }}
        run: app/scripts/put-edge-composition-snapshot.sh
