name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # Always report Workspace gates. The ci-plan job, not workflow path filtering, selects required work.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force-ci-full:
        description: Run every CI gate even if the merge queue already proved this commit.
        type: boolean
        default: false
      keep:
        description: On a candidate/* ref, do not let a newer candidate dispatch cancel this run, and cancel none.
        type: boolean
        default: false
      base-ref:
        description: >-
          On a candidate/* ref, the branch to compare with: only owners changed since its merge base, and their
          consumers, are tested; shared, configuration, auth and database changes still run everything.
        type: string
        default: demo/sales-crm

permissions:
  contents: read

env:
  ONTOS_ACTION_TRANSACTION_IO_GUARD: 'true'

defaults:
  run:
    shell: bash

# One candidate at a time: every candidate/* run shares one group, so a newer candidate dispatch cancels the older
# candidate run instead of competing with it for the 20 runners. A run dispatched with `keep` gets a group of its own.
# Every other ref keeps its own group; main is never cancelled.
concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/heads/candidate/')
    && (inputs.keep && format('ultramodern-workspace-kept-{0}', github.run_id) || 'ultramodern-workspace-candidates')
    || format('ultramodern-workspace-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  queue-proof:
    name: Find the merge queue proof of this commit
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.force-ci-full != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi

  ci-plan:
    name: Select required checks from changed inputs
    needs: [queue-proof]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
      expected: ${{ steps.selection.outputs.expected || steps.changes.outputs.expected }}
      source: ${{ steps.selection.outputs.source || steps.changes.outputs.source }}
      unit: ${{ steps.selection.outputs.unit || steps.changes.outputs.unit }}
      unit-artifacts: ${{ steps.selection.outputs.unit-artifacts || steps.changes.outputs.unit-artifacts }}
      integration: ${{ steps.selection.outputs.integration || steps.changes.outputs.integration }}
      seed-key: ${{ steps.seed-key.outputs.key }}
      browser: ${{ steps.selection.outputs.browser || steps.changes.outputs.browser }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout the exact comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A narrow fix round on a candidate ref compares with the merge base of its base branch. A name that is no plain
      # branch, or a branch the checkout does not have, leaves the comparison empty, and the complete suite runs.
      - name: Find the comparison point of a candidate dispatch
        id: candidate
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/') && inputs.force-ci-full != true
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ || "$BASE_REF" == *..* ]]; then
            echo "::warning title=Complete suite::The base ref is no plain branch name; every gate runs."
          elif base="$(git merge-base "refs/remotes/origin/$BASE_REF" HEAD)"; then
            echo "base=$base" >>"$GITHUB_OUTPUT"
            echo "Comparing with $BASE_REF at its merge base $base."
          else
            echo "::warning title=Complete suite::origin/$BASE_REF has no merge base with this commit; every gate runs."
          fi
      # The migrated integration database changes only with these inputs: every Drizzle migration and config, the
      # database identity, role and grant scripts, the stage migrator and its activation and convergence scripts, the
      # verifier and trust audit, the seed tool itself, SpiceDB's bootstrap schema, the topology and authorization
      # catalogue the migrator activates, the PostgreSQL and SpiceDB image digests (docker-compose.yml), and the
      # toolchain and lockfile. A change to any of them names a new seed; nothing else can reuse an old one.
      # Hashed before the install, so no node_modules file is read.
      - name: Name the integration seed cache
        id: seed-key
        run: echo "key=integration-seed-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/**/drizzle*/**', 'app/**/drizzle*.config.ts', 'app/database/**', 'app/scripts/postgres/**', 'app/scripts/run-zerops-migrator.mjs', 'app/scripts/migration-convergence*', 'app/scripts/access-release-activation*', 'app/scripts/run-optional-commerce-portal-auth-db.mts', 'app/scripts/verify-application-db-schema.mts', 'app/scripts/audit-database-trust-boundaries.mts', 'app/scripts/prove-zerops-migrator-artifact.sh', 'app/scripts/ci/integration-seed*.mts', 'app/packages/core-runtime/spicedb/**', 'app/packages/core-runtime/src/install/**', 'app/packages/core-runtime/src/db/**', 'app/topology/**', 'app/docker-compose.yml', 'app/zerops.yaml', 'app/package.json', 'app/pnpm-lock.yaml', 'app/.mise.toml', '!app/**/node_modules/**', '!app/tools/**') }}" >>"$GITHUB_OUTPUT"
      - name: Classify the complete diff without app dependencies
        id: changes
        env:
          BASE_SHA: ${{ steps.candidate.outputs.base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CANDIDATE_DISPATCH: ${{ steps.candidate.outputs.base != '' }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_PROVEN: ${{ needs.queue-proof.outputs.proven }}
          FORCE_FULL: ${{ inputs.force-ci-full }}
        run: bash app/scripts/plan-ci-changes.sh "$RUNNER_TEMP/ci-changed-paths"
      - name: Record the documentation or exact-commit no-op
        if: steps.changes.outputs.mode == 'docs' || steps.changes.outputs.mode == 'proven'
        env:
          REASON: ${{ steps.changes.outputs.reason }}
        run: printf '## CI selection\n\n%s\n\nNo app dependencies, builds or services are needed.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the app workspace for code impact analysis
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        uses: ./.github/actions/install-app
      - name: Resolve affected packages and required matrices
        id: selection
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        working-directory: app
        env:
          BOOTSTRAP_MODE: ${{ steps.changes.outputs.mode }}
          # Candidate dispatches apply affected selection without the repository setting; others follow it.
          APPLY_AFFECTED: ${{ (vars.CI_AFFECTED_ENABLED == 'true' || steps.candidate.outputs.base != '') && 'true' || 'false' }}
        run: |
          args=(--paths-file "$RUNNER_TEMP/ci-changed-paths")
          [[ "$BOOTSTRAP_MODE" != full ]] || args+=(--full)
          [[ "$APPLY_AFFECTED" != true ]] || args+=(--apply-affected)
          mise exec -- node scripts/plan-ci-checks.mts "${args[@]}"

  # The only job that saves the caches the gates restore, on main, where every pull request and merge
  # group can read them: the pnpm store, the TS-Go typecheck build, the Playwright Chromium build, and
  # the apt packages of Chromium's system libraries.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'
          save-store: 'true'

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check for the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          lookup-only: true

      - name: Download the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          # The marker keeps the cache saveable on an image that already has every library.
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;
          echo "Cached $(find ~/.cache/playwright-apt-debs -name '*.deb' | wc -l) packages."

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

  # Each delivery unit builds from source exports only (scripts/tests/vertical-build-order.test.mts), so
  # the units build in shards on parallel runners. A build shard only builds, packs and uploads: test jobs that read
  # built outputs wait for the build shards, never for the proof, and node-artifact-proof proves the whole topology
  # on its own runner. A new unit joins one shard (a test checks).
  #
  # The build mode is the stage deploy's (scripts/zerops/build-app.sh): two unit builds per runner, no build-time
  # TS checker and no server typecheck or server declaration pass, because the typecheck gate proves the types of the
  # whole workspace with TS-Go. The `.output` contract is unchanged: the same `build` script of every unit runs and
  # owner-entry writes dist/zerops-entry.mjs. Unlike the deploy, no public origin is baked in.
  # The Shell builds alone in shard 1; the verticals are balanced by their measured build seconds (about 580 s of
  # one-at-a-time work per shard) and listed heaviest first, so two build lanes finish together.
  # Listed first among the jobs that start after planning, so on a full run the build shards take free runners
  # before the short source checks.
  node-artifact-build:
    name: Build node artifacts (${{ matrix.shard }}/6)
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    runs-on: ubuntu-latest
    # The Shell builds for about 5 minutes since its packaged-dependency completion was rewritten (13 before); it
    # stays alone in its shard until a run confirms that. A vertical shard holds about 300 s of build work per lane.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - { shard: 1, units: apps/shell-super-app }
          - {
              shard: 2,
              units: verticals/commerce-customer-context verticals/facility-operations verticals/tagging verticals/projects verticals/promotion verticals/availability,
            }
          - {
              shard: 3,
              units: verticals/party-registry verticals/crm verticals/sales-insights verticals/assortment verticals/legal-agreements verticals/price-group-catalog,
            }
          - {
              shard: 4,
              units: verticals/inventory verticals/catalog verticals/commerce-order verticals/pricing verticals/storefront-registry verticals/payment-term-catalog,
            }
          - {
              shard: 5,
              units: verticals/merchandise verticals/workforce verticals/crm-activities verticals/commerce-market-catalog verticals/payment verticals/property-leasing verticals/commerce-cart,
            }
          - {
              shard: 6,
              units: verticals/symmy-integration verticals/finance-billing verticals/sales-pipeline verticals/privacy verticals/work-tasks verticals/property-portfolio verticals/tax,
            }
    env:
      BUILD_JOBS: '2'
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_DISABLE_BUILD_TS_CHECKER: '1'
      ULTRAMODERN_SKIP_SERVER_TYPECHECK: '1'
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # Per-unit output cache (scripts/ci/unit-output-cache.mts). The Actions key only locates a candidate archive:
      # `plan` keeps a restored unit only when its recorded input digest matches this checkout, and `verify` checks
      # the complete shard before anything is saved or packed.
      # Cache scope: a run reads caches of its own ref and of the default branch (main), plus the base branch of a
      # pull request. The demo trunk is not the default branch, so its caches are invisible to candidate/* refs (and
      # this workflow does not run on trunk pushes at all). A fix round therefore reuses its own earlier runs only
      # when it keeps dispatching on the same candidate/<name> ref. The key names the shard, so rebalancing the
      # shards makes the next run cold.
      - name: Name the shard's cached output paths
        id: unit-cache-paths
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          {
            echo 'paths<<UNIT_CACHE_PATHS'
            for unit in $SHARD_UNITS; do
              printf 'app/%s/dist\napp/%s/.output\n' "$unit" "$unit"
            done
            echo 'UNIT_CACHE_PATHS'
          } >>"$GITHUB_OUTPUT"

      - name: Restore the shard's unit outputs from earlier runs
        id: unit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.unit-cache-paths.outputs.paths }}
          key: gates-units-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gates-units-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-

      - name: Keep the restored units whose inputs are unchanged
        id: cached-plan
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: mise exec -- node scripts/ci/unit-output-cache.mts plan --units "$SHARD_UNITS" >>"$GITHUB_OUTPUT"

      - name: Build the shard's changed units two at a time
        working-directory: app
        env:
          BUILD_UNITS: ${{ steps.cached-plan.outputs.build }}
        run: |
          read -ra ids <<<"$BUILD_UNITS"
          if [ "${#ids[@]}" -eq 0 ]; then
            echo 'Every unit of this shard was kept from the unit output cache.'
            exit 0
          fi
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          logs="$RUNNER_TEMP/unit-build-logs"
          mkdir -p "$logs"
          export logs
          # The app host serves the Shell and every released module from the unit's dist/zerops-entry.mjs, which
          # scripts/zerops/build-app.sh writes after the build; the native hosted-owner fixtures start them so too.
          served="$(mise exec -- node -e '
            const intent = require("./topology/application-release-intent.json");
            for (const { appId } of intent.modules) console.log(appId);
            console.log("shell-super-app");
          ')"
          export served
          # xargs bounds the parallel builds; each unit runs its own package `build` script, as pnpm -r run build does,
          # from clean outputs, then gets its app host entry when served and its cache receipt.
          status=0
          printf '%s\n' "${ids[@]}" | mise exec -- xargs -P "$BUILD_JOBS" -n 1 bash -c '
            id="$1"
            unit="verticals/$id"
            [ "$id" != shell-super-app ] || unit=apps/shell-super-app
            log="$logs/$id.log"
            started="$SECONDS"
            if {
              rm -rf -- "$unit/dist" "$unit/.output" &&
                pnpm --filter "./$unit" run build &&
                { ! grep -qxF "$id" <<<"$served" || node scripts/zerops/owner-entry.mts "$unit"; } &&
                node scripts/ci/unit-output-cache.mts stamp --unit "$id"
            } >"$log" 2>&1; then
              echo "built $unit in $((SECONDS - started))s"
            else
              tail -80 "$log"
              echo "::error title=Unit build failed::$unit"
              exit 1
            fi
          ' _ || status=$?
          for log in "$logs"/*.log; do
            echo "::group::$(basename "$log" .log)"
            cat "$log"
            echo '::endgroup::'
          done
          [ "$status" -eq 0 ]

      - name: Verify every unit output of the shard
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: mise exec -- node scripts/ci/unit-output-cache.mts verify --units "$SHARD_UNITS"

      # Saved only after verify, under this run's own ref scope; a failed shard saves nothing.
      - name: Save the shard's unit outputs for later runs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.unit-cache-paths.outputs.paths }}
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Rows that prepare their services before they need the build outputs start after this lease, not after the
  # builds. The lease ends once every build shard has a runner, so waiting rows can never hold all 20 runners while
  # a shard is still queued. It proves nothing and only gates the start of those rows.
  build-lease:
    name: Wait until every build shard has a runner
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the wait script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: app/scripts/wait-for-build-shards.sh
          sparse-checkout-cone-mode: false

      - name: Wait until every build shard started
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_FOR_BUILD_SHARDS_INTERVAL: '5'
        run: bash app/scripts/wait-for-build-shards.sh started 'Build node artifacts (' 6

  # Source checks start immediately after planning; they do not wait for Node artifacts.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.source) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  # Unit rows whose suites read no build output start right after planning, beside the build shards.
  workspace-unit:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      # The finance-billing POHODA export tests validate their generated documents against the
      # official STORMWARE dataPack 2.0 schemas, which the repository does not redistribute. Only the
      # shard that runs finance-billing needs them, so it provisions the pinned set named by
      # verticals/finance-billing/tests/fixtures/pohoda-xsd/version-2.sha256 before it runs.
      - name: Provision the POHODA XML schemas for the finance-billing shard
        if: matrix.name == 'Unit and Component Tests (every other package)'
        working-directory: app
        run: |
          command -v xmllint >/dev/null 2>&1 || sudo apt-get install --yes --no-install-recommends libxml2-utils
          mise exec -- pnpm provision:pohoda-xsd

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  # Unit rows that execute public contract fixtures over this run's built outputs wait for the build shards only,
  # never for the Node proof.
  workspace-unit-artifacts:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit-artifacts'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit-artifacts) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Download the same-run Node artifacts for unit contract fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      # A row names the units whose outputs its fixtures read in `artifact-units`; without it every unit is required.
      - name: Unpack the Node artifacts for unit contract fixtures
        working-directory: app
        env:
          REQUIRED_UNITS: ${{ matrix.artifact-units }}
        # shellcheck disable=SC2086 # REQUIRED_UNITS is a list of separate unit paths.
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output $REQUIRED_UNITS

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  static-contracts:
    name: Static Contracts
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['static-contracts'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Share one install across independent checks and retain a log for each check.
      # Keep the memory-heavy API analyzer and Commerce build outside this group.
      - parallel:
          - name: Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: app/node_modules/.bin/lefthook validate

          - name: Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm skills:check

          - name: Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            env:
              # The whole-workspace prover peaks at about 5.7 GiB footprint (5.2 GiB resident) and ran out of
              # memory under an 8 GiB heap limit, so it gets 10 GiB.
              NODE_OPTIONS: --max-old-space-size=10240
            run: mise exec -- pnpm database-access:check

          - name: Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm lean-core:check

          - name: Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm contract:check

          - name: Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm check:module-contracts

          - name: Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            working-directory: app
            run: mise exec -- pnpm action:test:unit

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        env:
          # The whole-workspace analyzer exceeds V8's ~4 GiB default while releasing its graph.
          NODE_OPTIONS: --max-old-space-size=6144
        run: mise exec -- pnpm api:check

      # The reviewed authorization catalogue and what is generated from it (which modules get a module credential)
      # must match the declarations in source; a stale artefact would key the wrong modules.
      - name: Authorization catalogue artefact
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm authorization:catalog:artifact:check

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it,
  # over every tracked file (`--all-files` is `git ls-files`); the hook's own globs choose what each tool checks.
  # Since tsrs 0.23 a type-aware lint run checks the whole program of every tsconfig its files touch, so two
  # shards paid that check twice; one job pays it once. TSRS_FAST=1 is tsrs' fast whole-program mode, which still
  # reports type errors; the separate Typecheck gate keeps the authoritative TS-Go check of the whole workspace.
  # Every diagnostic class still runs: formatting, every lint rule including the type-aware ones, and the Shell UI
  # candidate check, over every file.
  format-and-lint:
    name: Format and Lint through the pre-commit hook (${{ matrix.shard }}/1)
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['format-and-lint'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Format and Lint the shard's files through the pre-commit hook
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 1
          TSRS_FAST: '1'
        run: |
          index=0
          git ls-files -z | while IFS= read -r -d '' file; do
            if ((index % SHARDS == SHARD - 1)); then
              printf '%s\0' "$file"
            fi
            index=$((index + 1))
          done >"$RUNNER_TEMP/shard-files"
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/shard-files"
          git diff --exit-code HEAD

  # Suites on fresh services, run side by side: the stage-shaped migrator and Outbox Worker host artifacts
  # followed by the integration tests. The authenticated browser tests run in browser-integration on their own
  # freshly migrated database; they read no build output, so they start right after planning.
  # The integration tests are split into package shards that each fit the job timeout. Every
  # shard repeats the full service preparation; every package that no other shard names runs in the
  # Database catch-all shard, so a new package can never fall out of the gate. A shard that carried several
  # packages' suites always finished last, so the heaviest packages get a job each: a PR waits for the
  # slowest job, not for the sum of the packages a single job used to run one after another.
  #
  # Seeding is decided by file, not by job: the files that migrate or recover their own job database from empty
  # (ci-matrices.json "fresh-database-tests", the seed model's inventory) run only in the Fresh Database rows, from
  # the complete fresh preparation; the seeded Root, Core Runtime, Party Registry and Customer Context rows leave them
  # out. Every other integration test uses the job database as it is or derives its own databases from it (a
  # schema-only clone or an empty database it migrates itself), so the restored seed serves it identically.
  #
  # Sharding is set by what a package's own files cost, not by package size, aiming at about 6 minutes of tests
  # per row. Weighted shards deal files by the measured seconds in ci-matrices.json "test-weights", so the parts of
  # a split giant file spread over the shards; an unsplit file cannot be balanced below its own length. The rows
  # are listed heaviest first, so on a full run the longest jobs take the first free runners.
  service-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan, build-lease]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.build-lease.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    # The build wait reads this run's job results.
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integration) }}
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      # The seed tool connects the Commerce portal realm's runtime role with this local development-only password;
      # the seed itself carries no credentials.
      INTEGRATION_SEED_COMMERCE_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      # An eligible row (`seed: true`) restores the cached seed: the database exactly as the complete fresh preparation
      # left it, roles, grants, owners and journals included, checked against its fingerprints and then by db:verify
      # against this checkout's migrations. Before restoring, the seed model checks the row's name and every test file
      # the row will run. A miss falls back to the complete fresh preparation below; no row ever waits for a producer.
      - name: Restore the cached integration seed
        id: seed-cache
        if: matrix.seed == true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-seed
          key: ${{ needs.ci-plan.outputs.seed-key }}

      - name: Restore the proven seed databases
        if: steps.seed-cache.outputs.cache-hit == 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          CI_MATRIX_NAME: ${{ matrix.name }}
          FRESH_DATABASE_TESTS: ${{ matrix.fresh-database-tests }}
          PACKAGE_FILTERS: ${{ matrix.package-filters }}
          ROOT_RSTEST_SHARD: ${{ matrix.root-rstest-shard }}
          ROOT_SUITE: ${{ matrix.root-suite || false }}
          RSTEST_PROJECTS: ${{ matrix.rstest-projects || 'integration' }}
          RSTEST_SHARD: ${{ matrix.rstest-shard }}
          SPICEDB_DATABASE_PASSWORD: spicedb
        run: |
          # Exactly the files this row runs: a weighted shard lists its own deal; a whole package lists its tracked
          # integration test files. A failed listing fails the step instead of passing an empty list.
          listed=''
          if [[ "$ROOT_SUITE" == true ]]; then
            listed+="$(RSTEST_WEIGHTED_SHARD_LIST_ONLY=1 mise exec -- bash scripts/ci/rstest-weighted-shard.sh "${ROOT_RSTEST_SHARD:-1/1}" integration)"$'\n'
          fi
          for directory in $(sed -E 's/--filter +//g; s#\./##g' <<<"$PACKAGE_FILTERS"); do
            if [[ -n "$RSTEST_SHARD" ]]; then
              for project in $RSTEST_PROJECTS; do
                listed+="$(cd "$directory" && RSTEST_WEIGHTED_SHARD_LIST_ONLY=1 mise exec -- bash "$GITHUB_WORKSPACE/app/scripts/ci/rstest-weighted-shard.sh" "$RSTEST_SHARD" "$project")"$'\n'
              done
            else
              listed+="$(git ls-files -- "$directory/tests/integration" | grep -E '\.test\.[cm]?[jt]sx?$' || true)"$'\n'
            fi
          done
          CI_TEST_FILES="$(grep -v '^$' <<<"$listed" | paste -sd, - || true)"
          echo "Seed check over $(grep -c . <<<"$listed" || true) test files."
          mise exec -- node scripts/ci/integration-seed.mts restore --directory "$RUNNER_TEMP/integration-seed" \
            --disposable --purpose ordinary-tests --job-name "$CI_MATRIX_NAME" --root-suite "$ROOT_SUITE" \
            --test-files "$CI_TEST_FILES" --jobs 4
          mise exec -- pnpm db:verify

      - name: Initialize fresh local database login identities
        if: steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'integration' && steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'integration' && steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        if: steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'integration' && steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm database-trust:audit

      # The services and the fresh database are ready before the build outputs are needed: this row started right after
      # planning (via build-lease), so its preparation ran while the build shards built. It now needs those outputs.
      - name: Wait for this run's Node build shards
        working-directory: app
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-build-shards.sh finished 'Build node artifacts (' 6

      # Native receiving fixtures and Inventory workers use genuine published owner metadata.
      # Restore this run's outputs instead of rebuilding or substituting synthetic build identities.
      - name: Download the same-run Node artifacts for native owner fixtures
        if: matrix.suite == 'integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      # The stage migrator, the Outbox Worker host and the derived Composition read every unit, so a row names a
      # smaller `artifact-units` set only when none of those run on it; without it every unit is required.
      - name: Unpack the Node artifacts for native owner fixtures
        if: matrix.suite == 'integration'
        working-directory: app
        env:
          REQUIRED_UNITS: ${{ matrix.artifact-units }}
        # shellcheck disable=SC2086 # REQUIRED_UNITS is a list of separate unit paths.
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output $REQUIRED_UNITS

      # The native owner fixtures (Inventory's confirmation-protection suite) read the Composition these exact built
      # artifacts form; the path is exported only after the derivation decoded it as consumers decode it.
      - name: Derive the fresh built Composition for native owner fixtures
        if: matrix.native-composition == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: |
          mise exec -- node scripts/derive-built-application-composition.mts --snapshot-output "$RUNNER_TEMP/native-composition-snapshot.json"
          echo "NATIVE_1290_COMPOSITION_SNAPSHOT_PATH=$RUNNER_TEMP/native-composition-snapshot.json" >> "$GITHUB_ENV"

      - name: Materialize the native combined Outbox Worker host artifact
        if: matrix.root-suite == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm zerops:materialize --app outbox-worker-host --package app --package-dir . --worker

      # Stage-shaped on the Cloudflare target: the host is materialized by its zerops.yaml build command,
      # ships only its deployFiles, polls every hosted owner's outbox against the freshly migrated
      # database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'integration' && steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        # The job environment above is the whole configuration. Native fixtures refuse to start unless
        # dotenv discovery is closed, so no workspace .env file can leak into an owned test database.
        env:
          APP_ENV_PATH: /dev/null
          MIGRATION_EQUIVALENCE_TEST_DATABASE_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/postgres
          MIGRATION_EQUIVALENCE_TEST_SANDBOX: owned-postgres18
          SPICEDB_DATABASE_PASSWORD: spicedb
          PACKAGE_FILTERS: ${{ matrix.package-filters }}
          ROOT_RSTEST_SHARD: ${{ matrix.root-rstest-shard }}
          ROOT_SUITE: ${{ matrix.root-suite }}
          RSTEST_SHARD: ${{ matrix.rstest-shard }}
          # Two Rstest file workers only on rows whose suites were reviewed safe in parallel; every other row runs one.
          RSTEST_WORKERS: ${{ matrix.rstest-workers || 1 }}
          RSTEST_PROJECTS: ${{ matrix.rstest-projects || 'integration' }}
          # skip on seeded weighted rows, only on the Fresh Database rows (scripts/ci/rstest-weighted-shard.sh).
          FRESH_DATABASE_TESTS: ${{ matrix.fresh-database-tests }}
        # Same commands as `pnpm test:integration`. The root suite and a large package (one package per row, whose
        # test:integration script is exactly `rstest --project integration`) run as duration-weighted shards that deal
        # the files of a split giant test family across the shards (scripts/ci/rstest-weighted-shard.sh).
        # Every suite runs even when an earlier one fails (--no-bail; the root suite's failure is kept, not fatal), so
        # one package's failure never hides another's; the step fails at the end if any of them failed.
        run: |
          status=0
          if [[ "$ROOT_SUITE" == true && -n "$ROOT_RSTEST_SHARD" ]]; then
            mise exec -- bash scripts/ci/rstest-weighted-shard.sh "$ROOT_RSTEST_SHARD" integration --pool.maxWorkers 1 || status=$?
          elif [[ "$ROOT_SUITE" == true ]]; then
            mise exec -- pnpm exec rstest --project integration --pool.maxWorkers 1 || status=$?
          fi
          if [[ -n "$PACKAGE_FILTERS" && -n "$RSTEST_SHARD" ]]; then
            # One package after another, each project after the other (Party Registry's two projects share one database).
            for project in $RSTEST_PROJECTS; do
              # shellcheck disable=SC2086 # PACKAGE_FILTERS is a list of separate pnpm filter arguments.
              mise exec -- pnpm -r --no-bail --no-sort --workspace-concurrency 1 $PACKAGE_FILTERS exec bash "$PWD/scripts/ci/rstest-weighted-shard.sh" "$RSTEST_SHARD" "$project" --pool.maxWorkers "$RSTEST_WORKERS" || status=$?
            done
          elif [[ -n "$PACKAGE_FILTERS" ]]; then
            # shellcheck disable=SC2086 # PACKAGE_FILTERS is a list of separate pnpm filter arguments.
            mise exec -- pnpm -r --no-bail --no-sort --workspace-concurrency 1 --if-present $PACKAGE_FILTERS run test:integration --pool.maxWorkers 1 || status=$?
          fi
          exit "$status"

      - name: Prove native preproposal basis and genuine approval through registered owners
        if: matrix.native-preproposal == true
        working-directory: app
        timeout-minutes: 20
        env:
          APP_ENV_PATH: /dev/null
        # Reuse this shard's services; each case migrates its own disposable source database.
        run: mise exec -- pnpm --filter @app/commerce-customer-context run test:integration:native-preproposal

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # The seed producer. It never gates a row: rows restore the cached seed when it exists and prepare their own
  # database otherwise, so no row waits for this job.
  # INVARIANT: every full run runs the complete fresh-database proof here (login initialization, the removed runtime
  # role, the assembled stage migrator, migrations and verification, the grant audit and the Outbox Worker host
  # build-and-run proof), whatever the cache holds. A narrow round with a cached seed skips only the fresh-migration
  # part, and only while the seed's inputs (ci-plan's seed-key) are unchanged: a change to any migration input names
  # a new key, misses, and runs the full proof here. It always proves the worker host on the restored seed.
  # Saves the seed only on a miss, under this run's ref scope: a candidate/* run reads its own ref's and main's
  # saves, so a fix round that keeps one candidate ref reuses the seed its first run saved.
  integration-seed-proof:
    name: Prove and cache the integration seed database
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['integration-seed-proof'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      APP_ENV_PATH: /dev/null
      SPICEDB_DATABASE_PASSWORD: spicedb
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      # The seed producer and its consumers connect the Commerce portal realm's runtime role with this local
      # development-only password; the seed itself carries no credentials.
      INTEGRATION_SEED_COMMERCE_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Restore the cached integration seed
        id: seed-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-seed
          key: ${{ needs.ci-plan.outputs.seed-key }}

      - name: Download the same-run Node artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts of every delivery unit
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Prove the fresh-database preparation and dump the seed
        if: needs.ci-plan.outputs.mode == 'full' || steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- node scripts/ci/integration-seed.mts produce --directory "$RUNNER_TEMP/integration-seed-fresh" --disposable

      - name: Prove the Outbox Worker host on the cached seed
        if: needs.ci-plan.outputs.mode != 'full' && steps.seed-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          mise exec -- node scripts/ci/integration-seed.mts restore --directory "$RUNNER_TEMP/integration-seed" \
            --disposable --purpose ordinary-tests --job-name 'Prove and cache the integration seed database' \
            --root-suite false --test-files '' --jobs 4
          mise exec -- pnpm db:verify
          mise exec -- pnpm database-trust:audit
          mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      # The proof directory holds logs and is never cached.
      - name: Move the new seed to the cached path
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: mv "$RUNNER_TEMP/integration-seed-fresh" "$RUNNER_TEMP/integration-seed"

      - name: Cache the new seed for later rows and runs
        if: steps.seed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-seed
          key: ${{ needs.ci-plan.outputs.seed-key }}

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # The authenticated browser tests and the recovery into a newly published release, on fresh services. They read no
  # build output, so they need only the plan.
  browser-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['browser-integration'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.browser) }}
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      INTEGRATION_SEED_COMMERCE_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          restore-keys: playwright-apt-debs-

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        background: true
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi
          if [ "$CHROMIUM_CACHED" = true ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright "$@"

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      # The browser suite restores the cached seed like an eligible integration row and migrates its own database on a
      # miss; it never waits for the seed producer.
      - name: Restore the cached integration seed
        id: seed-cache
        if: matrix.seed == true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/integration-seed
          key: ${{ needs.ci-plan.outputs.seed-key }}

      - name: Restore the proven seed databases
        if: steps.seed-cache.outputs.cache-hit == 'true'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          CI_MATRIX_NAME: ${{ matrix.name }}
          SPICEDB_DATABASE_PASSWORD: spicedb
        run: |
          mise exec -- node scripts/ci/integration-seed.mts restore --directory "$RUNNER_TEMP/integration-seed" \
            --disposable --purpose ordinary-tests --job-name "$CI_MATRIX_NAME" --root-suite false --test-files '' --jobs 4
          mise exec -- pnpm db:verify

      - name: Initialize fresh local database login identities
        if: steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        if: steps.seed-cache.outputs.cache-hit != 'true'
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      - name: Wait for the Chromium install
        wait: chromium-install

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Verify browser recovery into a newly published release
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          ONTOS_E2E_RETAINED_PARTY_R2: 'true'
        run: >-
          mise exec -- pnpm --filter @app/shell-super-app exec playwright test
          tests/e2e/login.spec.ts --grep 'reloads failed Contacts into a genuinely published R2'
          --workers 1

      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # The global Node proof: every shard's outputs together, federated types, performance readiness and the
  # backend-federation proof on a migrated PostgreSQL. No test waits for it; Workspace gates requires it.
  node-artifact-proof:
    name: Prove Node backend-federation artifacts
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-proof'] == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its complete handler layers acquire real pools.
    services:
      proof-postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: ontos_proof
          POSTGRES_PASSWORD: ontos_proof_admin
          POSTGRES_USER: ontos_proof_admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ontos_proof_admin -d ontos_proof"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_proof_admin:ontos_proof_admin@localhost:5433/ontos_proof
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_proof
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_proof
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_proof
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download every shard's Node build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/units

      # The proof is the one consumer that requires every delivery unit of the topology to be built.
      - name: Unpack the Node build outputs of every delivery unit
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types and check performance readiness over every unit
        working-directory: app
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Initialize the fresh Node proof database login identities
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      - name: Migrate the Node proof database and provision its runtime identities
        working-directory: app
        run: mise exec -- pnpm db:migrate

      - name: Prove Node backend-federation artifacts
        working-directory: app
        run: mise exec -- pnpm node:proof

  # Keep one required check. Selected jobs must succeed and every skipped job must be explicitly planned.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        ci-plan,
        workspace-gate,
        workspace-unit,
        workspace-unit-artifacts,
        static-contracts,
        format-and-lint,
        service-integration,
        integration-seed-proof,
        browser-integration,
        node-artifact-build,
        node-artifact-proof,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected gates and reject unplanned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash app/scripts/check-ci-gates.sh
