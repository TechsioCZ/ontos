name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
      # The demo trunk runs the same gates on every push, so it needs no pull request toward main to be checked.
      - demo/sales-crm
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # Always report Workspace gates. The ci-plan job, not workflow path filtering, selects required work.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force-ci-full:
        description: Run every CI gate even if the merge queue already proved this commit.
        type: boolean
        default: false
      keep:
        description: On a candidate/* ref, do not let a newer candidate dispatch cancel this run, and cancel none.
        type: boolean
        default: false
      base-ref:
        description: >-
          On a candidate/* ref, the branch to compare with: only owners changed since its merge base, and their
          consumers, are tested; shared, configuration, auth and database changes still run everything.
        type: string
        default: demo/sales-crm

permissions:
  contents: read

env:
  ONTOS_ACTION_TRANSACTION_IO_GUARD: 'true'
  # The demo trunk's rows, scopes, weights and build origins on top of the shared matrices (scripts/ci/ci-matrices.mts).
  CI_MATRICES_OVERLAY: scripts/ci-matrices.demo.json
  # Native fixtures, migration tools and test workers start many short-lived Node processes over the same files.
  # V8 reuses their compiled code within this runner, never database state or test results. A literal path: the
  # runner context is unavailable at workflow level, where `runner.temp` would name no directory.
  NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache

defaults:
  run:
    shell: bash

# One candidate at a time: every candidate/* run shares one group, so a newer candidate dispatch cancels the older
# candidate run instead of competing with it for the 20 runners. A run dispatched with `keep` gets a group of its own.
# Every other ref keeps its own group. The trunks are never cancelled: a newer push waits as the group's one pending
# run (GitHub replaces an older pending run with it), so every run ends with a verdict and runs never pile up. On the
# demo trunk, where a push came every 3 to 25 minutes, cancelling left the pushes from 12:20 to 21:04 UTC on 17 Nov
# without one green run; the pending push run compares with the newest green push (ci-plan), so it covers every
# unproven commit.
concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/heads/candidate/')
    && (inputs.keep && format('ultramodern-workspace-kept-{0}', github.run_id) || 'ultramodern-workspace-candidates')
    || format('ultramodern-workspace-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/demo/sales-crm' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  # The demo trunk has no merge queue: a push to it skips its gates when a candidate/* dispatch of this workflow
  # passed on the same commit, compared with the green commit the push starts from (scripts/ci/commit-proof.sh).
  queue-proof:
    name: Find an earlier proof of this commit
    if: >-
      inputs.force-ci-full != true && (
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' ||
      github.event_name == 'push' && github.ref == 'refs/heads/demo/sales-crm')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      proven: ${{ steps.proof.outputs.proven || steps.candidate-proof.outputs.proven }}
      run: ${{ steps.proof.outputs.run || steps.candidate-proof.outputs.run }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
            echo "run=$(jq -r '.[0]' <<<"$runs")" >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi
      # A proof only saves work: a checkout or lookup that fails or stalls leaves no proof and the gates run, it
      # never fails the push (Workspace gates fails on a failed queue-proof job). Both steps together end well
      # inside the job's five minutes.
      - name: Checkout the candidate proof finder
        if: github.ref == 'refs/heads/demo/sales-crm'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/scripts/ci/commit-proof.sh
          sparse-checkout-cone-mode: false
      - name: Look up a successful candidate run of this workflow on this commit
        id: candidate-proof
        if: github.ref == 'refs/heads/demo/sales-crm'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash app/scripts/ci/commit-proof.sh find

  ci-plan:
    name: Select required checks from changed inputs
    needs: [queue-proof]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: read finds the newest green push run of a branch without a merge queue (plan-ci-changes.sh) and the run
    # whose unit outputs the build shards start from (scripts/ci/seed-units.sh).
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
      expected: ${{ steps.selection.outputs.expected || steps.changes.outputs.expected }}
      source: ${{ steps.selection.outputs.source || steps.changes.outputs.source }}
      unit: ${{ steps.selection.outputs.unit || steps.changes.outputs.unit }}
      unit-artifacts: ${{ steps.selection.outputs.unit-artifacts || steps.changes.outputs.unit-artifacts }}
      integration: ${{ steps.selection.outputs.integration || steps.changes.outputs.integration }}
      integrationBrowser: ${{ steps.selection.outputs.integrationBrowser || steps.changes.outputs.integrationBrowser }}
      integrationOwners: ${{ steps.selection.outputs.integrationOwners || steps.changes.outputs.integrationOwners }}
      integrationTopology: ${{ steps.selection.outputs.integrationTopology || steps.changes.outputs.integrationTopology }}
      lint-shards: ${{ steps.lint-shards.outputs.shards || '[1,2,3]' }}
      seed-run: ${{ steps.seed.outputs.run }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout the exact comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A narrow fix round on a candidate ref compares with the merge base of its base branch. A name that is no plain
      # branch, or a branch the checkout does not have, leaves the comparison empty, and the complete suite runs.
      - name: Find the comparison point of a candidate dispatch
        id: candidate
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/') && inputs.force-ci-full != true
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ || "$BASE_REF" == *..* ]]; then
            echo "::warning title=Complete suite::The base ref is no plain branch name; every gate runs."
          elif base="$(git merge-base "refs/remotes/origin/$BASE_REF" HEAD)"; then
            echo "base=$base" >>"$GITHUB_OUTPUT"
            echo "Comparing with $BASE_REF at its merge base $base."
          else
            echo "::warning title=Complete suite::origin/$BASE_REF has no merge base with this commit; every gate runs."
          fi
      - name: Classify the complete diff without app dependencies
        id: changes
        env:
          # A push to a branch without a merge queue (the demo trunk) replaces github.event.before with its newest green push.
          BASE_SHA: ${{ steps.candidate.outputs.base || github.event.merge_group.base_sha || github.event.before }}
          CANDIDATE_DISPATCH: ${{ steps.candidate.outputs.base != '' }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_PROVEN: ${{ needs.queue-proof.outputs.proven }}
          PROOF_RUN: ${{ needs.queue-proof.outputs.run }}
          # Every push branch but main has no merge queue: the script looks up its newest green push.
          NEWEST_GREEN_BASE: ${{ github.ref != 'refs/heads/main' }}
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force-ci-full }}
        run: bash app/scripts/plan-ci-changes.sh "$RUNNER_TEMP/ci-changed-paths"
      # The build shards start from the unit outputs of the run that proved the commit this plan compares with, so they
      # build only the units whose inputs changed since. Only a successful trunk push or candidate/* dispatch of this
      # workflow on that commit, or one of its nearest ancestors, of the trunk's history counts; why that is the only
      # trustworthy seed is written at the lookup. No such run leaves the output empty and every unit builds.
      - name: Find the run whose unit outputs the build shards start from
        id: seed
        if: steps.changes.outputs.base != '' && steps.changes.outputs.mode != 'docs' && (steps.candidate.outputs.base != '' || (github.event_name == 'push' && github.ref == 'refs/heads/demo/sales-crm'))
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: bash app/scripts/ci/seed-units.sh find
      - name: Record the documentation or exact-commit no-op
        if: steps.changes.outputs.mode == 'docs' || steps.changes.outputs.mode == 'proven'
        env:
          REASON: ${{ steps.changes.outputs.reason }}
        run: printf '## CI selection\n\n%s\n\nNo app dependencies, builds or services are needed.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      # $RUNNER_TEMP is job-local and format-and-lint checks out at depth 1, so it can neither read this list nor
      # recompute the diff. The list is empty whenever the comparison is unavailable (full, docs and proven modes),
      # so an empty file is a valid result. The planning steps after it can fail, so a re-run of this job replaces its
      # own earlier upload instead of failing on the existing name.
      - name: Publish the exact changed-path list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-changed-paths
          if-no-files-found: warn
          overwrite: true
          retention-days: 1
      # The planner reads authored JSON and imports nothing outside the repository, so it runs on the runner image's
      # own Node, which strips its types, before anything is installed (scripts/plan-ci-without-install.sh).
      - name: Select the preinstalled Node runtime for dependency-free planning
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Resolve affected packages and required matrices
        id: selection
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        working-directory: app
        env:
          BOOTSTRAP_MODE: ${{ steps.changes.outputs.mode }}
          # A candidate/* dispatch without force-ci-full and a push to the demo trunk narrow the gates to the changed
          # owners and their consumers, or to the rows of the scopes the diff stays inside (scripts/ci-matrices.json).
          # Pull requests, merge groups and pushes to main still run the complete suite.
          APPLY_AFFECTED: ${{ (steps.candidate.outputs.base != '' || (github.event_name == 'push' && github.ref == 'refs/heads/demo/sales-crm')) && 'true' || 'false' }}
        run: |
          args=(--paths-file "$RUNNER_TEMP/ci-changed-paths")
          [[ "$BOOTSTRAP_MODE" != full ]] || args+=(--full)
          [[ "$APPLY_AFFECTED" != true ]] || args+=(--apply-affected)
          bash scripts/plan-ci-without-install.sh "${args[@]}"
      # A narrowed (affected or scoped) run lints only its changed files, on one runner (shard 0), through the same
      # hook. The one real failure a changed-file run would miss is a changed formatter, linter, hook, type-program or dependency
      # configuration, which changes the result for files nobody touched: such a change, an empty or oversized list and
      # every complete run keep the three whole-tree shards.
      - name: Choose the format and lint shards
        id: lint-shards
        if: steps.selection.outputs.mode != ''
        env:
          CHANGED_PATHS: ${{ runner.temp }}/ci-changed-paths
          PLAN_MODE: ${{ steps.selection.outputs.mode }}
        run: |
          shards='[1,2,3]'
          if [[ "$PLAN_MODE" =~ ^(affected|scoped)$ && -s "$CHANGED_PATHS" ]]; then
            shards='[0]'
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              if [[ "$path" =~ (^|/)[^/]*(prettier|oxlint|oxfmt|lefthook|tsgolint)[^/]*$ ||
                "$path" =~ (^|/)tsconfig[^/]*\.json$ || "$path" == app/tools/oxlint/* || "$path" == app/patches/* ||
                "$path" == app/package.json || "$path" == app/pnpm-lock.yaml || "$path" == app/pnpm-workspace.yaml ||
                "$path" == app/.mise.toml ]]; then
                echo "::notice title=Tool configuration changed::$path changes how unchanged files lint; every tracked file is linted."
                shards='[1,2,3]'
                break
              fi
            done <"$CHANGED_PATHS"
            if ((count > 2000)); then
              shards='[1,2,3]'
            fi
          fi
          echo "shards=$shards" >>"$GITHUB_OUTPUT"
      # A later push of this exact commit to the base branch skips its gates only when this run compared with the
      # commit that push starts from (scripts/ci/commit-proof.sh). The runs API keeps no dispatch inputs and no job
      # outputs, so the record is an artifact of this run, which only this run's jobs can write.
      - name: Record what this candidate plan compared with
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/')
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          PLAN_MODE: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
        run: bash app/scripts/ci/commit-proof.sh record "$RUNNER_TEMP/ci-comparison/comparison.json"
      - name: Publish what this candidate plan compared with
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-comparison
          path: ${{ runner.temp }}/ci-comparison/comparison.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # Each delivery unit builds from source exports only (scripts/tests/vertical-build-order.test.mts), so
  # the units build in shards on parallel runners. A build shard only builds, packs and uploads: test jobs that read
  # built outputs wait for the build shards, never for the proof, and the bootstrap row of node-topology-proof proves
  # the whole topology beside the owner rows. A new unit joins one shard (a test checks).
  #
  # The build mode is main's CI build, not the stage deploy's (scripts/zerops/build-app.sh): two unit builds per
  # runner, no build-time TS checker and no server typecheck or server declaration pass, because the typecheck gate
  # proves the types of the whole workspace with TS-Go. The `.output` contract is unchanged: the same `build` script of
  # every unit runs and owner-entry writes dist/zerops-entry.mjs. Unlike the deploy, no public origin is baked in and
  # no JavaScript source map is written, so these artifacts are never the ones shipped. A failure only the deploy's
  # build can hit (writing maps or origins) fails the stage deploy's own build: the runner build matrix, which runs
  # before deliver_app marks a deployment attempt, or the Zerops build, which deploys nothing when it fails.
  # The units are dealt over the shards by the build seconds they take two at a time beside a real neighbour (the mean
  # of runs 44495231205 and 44498704633, which built every unit) and listed heaviest first, so the two build lanes of a
  # shard finish together: 209 to 218 s of build per shard on top of about 100 s of setup, pack and upload. The Shell
  # takes every core: 78 s alone, 167 s beside Privacy, so its shard builds it alone first (scripts/ci/build-units.sh) and gets fewer units. More shards do not shorten a
  # full run: the jobs that start after planning already fill the 20 shared runners (scripts/tests/ci-workflows.test.mts),
  # so a seventh shard would wait; five shards replay 44 to 60 s slower.
  node-artifact-build:
    name: Build node artifacts (${{ matrix.shard }}/6)
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: read downloads the shard's unit outputs from the seed run, another run of this workflow.
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - { shard: 1, units: apps/shell-super-app verticals/commerce-customer-context verticals/catalog }
          - {
              shard: 2,
              units: verticals/legal-agreements verticals/sales-insights verticals/tagging verticals/merchandise verticals/payment-term-catalog verticals/availability,
            }
          - {
              shard: 3,
              units: verticals/pricing verticals/crm-activities verticals/facility-operations verticals/sales-pipeline verticals/projects verticals/payment,
            }
          - {
              shard: 4,
              units: verticals/crm verticals/workforce verticals/commerce-market-catalog verticals/inventory verticals/tax verticals/price-group-catalog,
            }
          - {
              shard: 5,
              units: verticals/party-registry verticals/property-leasing verticals/finance-billing verticals/property-portfolio verticals/commerce-cart verticals/promotion,
            }
          - {
              shard: 6,
              units: verticals/work-tasks verticals/commerce-order verticals/privacy verticals/symmy-integration verticals/assortment verticals/storefront-registry,
            }
    env:
      BUILD_JOBS: '2'
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      # As on main: the typecheck gate proves the types, so the build runs no TS checker and no server typecheck or
      # declaration pass, and writes no JavaScript source maps, which no gate reads (shared-contracts modern-config.ts).
      # With maps a unit was about 54 MB against 18 MB on main, and every artifact consumer downloads every unit.
      ONTOS_CI_TYPECHECK_SEPARATE: '1'
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
      # The app host serves the Shell and every released module from the unit's dist/zerops-entry.mjs, which
      # owner-entry writes after the build, as the stage build does; the native hosted-owner fixtures start them so too.
      UNIT_POST_BUILD: scripts/zerops/owner-entry.mts
      UNIT_SERVED_ENTRY: dist/zerops-entry.mjs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The first shard publishes its lockfile check to the jobs that need this one (install-app lockfile-verdict).
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ strategy.job-index == 0 && 'publish' || '' }}

      # Per-unit outputs (scripts/ci/unit-output-cache.mts): the shard starts from what the seed run that ci-plan
      # found built for this shard, its node-units-<shard> artifact. Its receipts are self-declared, so only a run of
      # trunk code may be the seed (scripts/ci/seed-units.sh); `plan` keeps a unit only when its recorded input digest
      # matches this checkout, and `verify` checks the complete shard before anything is packed. An expired or missing
      # artifact fails only this download, an archive that does not unpack leaves nothing behind, and a seed of another
      # shard deal holds only some of this shard's units: in each case the rest builds as without a seed.
      - name: Download the shard's unit outputs from the seed run
        id: seed-download
        if: needs.ci-plan.outputs.seed-run != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/seed-units
          run-id: ${{ needs.ci-plan.outputs.seed-run }}
          github-token: ${{ github.token }}

      - name: Unpack the seed's whole unit outputs
        if: steps.seed-download.outcome == 'success'
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: bash scripts/ci/seed-units.sh unpack "$RUNNER_TEMP/seed-units/units.tar.zst"

      - name: Keep the seed's units whose inputs are unchanged
        id: cached-plan
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: >-
          mise exec -- node scripts/ci/unit-output-cache.mts plan --units "$SHARD_UNITS"
          --served-entry "$UNIT_SERVED_ENTRY" --post-build "$UNIT_POST_BUILD" >>"$GITHUB_OUTPUT"

      - name: Build the shard's changed units two at a time
        working-directory: app
        env:
          BUILD_UNITS: ${{ steps.cached-plan.outputs.build }}
        run: mise exec -- bash scripts/ci/build-units.sh

      - name: Verify every unit output of the shard
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: >-
          mise exec -- node scripts/ci/unit-output-cache.mts verify --units "$SHARD_UNITS"
          --served-entry "$UNIT_SERVED_ENTRY" --post-build "$UNIT_POST_BUILD"

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      # A re-run of the run's jobs replaces the shard's earlier upload instead of failing on the existing name.
      # Kept 4 days because later runs start from it: a trunk commit proven on Friday morning is still a seed all of
      # Monday. A run that builds stores about 0.9 GB over its six shards (85 to 178 MB each, run 44581423294); the 26
      # such runs of 2026-11-18 stored 13.7 GB and the 61 of 2026-11-19 38.7 GB, so 4 days hold about 55 to 155 GB.
      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 4

  # Source checks start immediately after planning; they do not wait for Node artifacts.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.source) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      # The typecheck row, the one source row with typescript-build, saves a missed installed workspace, right after its
      # install, in its run's branch scope: it ends long before the last build shard, so every job that waits for the
      # shards (owner, bootstrap and artifact unit rows) restores it instead of installing. A candidate branch cannot
      # read the demo trunk's caches, so this is the entry its second wave uses. On the trunks the same install saves a
      # missed pnpm store; no other job saves one, so no two jobs race to save it.
      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}
          save-node-modules: ${{ matrix.typescript-build == true }}
          save-store: ${{ matrix.typescript-build == true }}

      # Use the same listing, weights and dealer as the tooling command; new files may move the probe to another shard.
      - name: Find the tooling shard that runs the checkout browser proof
        if: startsWith(matrix.name, 'Repository Tooling Tests (')
        id: checkout-browser
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
        run: |
          [[ "$COMMANDS" =~ \ ([1-9][0-9]*)/([1-9][0-9]*)\ scripts\  ]]
          index="${BASH_REMATCH[1]}"
          count="${BASH_REMATCH[2]}"
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          mise exec -- pnpm exec rstest list --project scripts --filesOnly --json "$listing"
          matrices=(scripts/ci-matrices.json)
          [ -z "${CI_MATRICES_OVERLAY:-}" ] || matrices+=("$CI_MATRICES_OVERLAY")
          weights="$(jq -cs 'map(."test-weights" // {}) | add' "${matrices[@]}")"
          files="$(jq -r --argjson weights "$weights" --argjson count "$count" --argjson index "$index" \
            --argjson fallback "${CI_DEFAULT_TEST_SECONDS:-20}" -f scripts/ci/rstest-weighted-shard.jq "$listing")"
          if grep -Eq '(^|/)scripts/tests/stage-n1-checkout\.test\.mts$' <<<"$files"; then
            echo 'required=true' >>"$GITHUB_OUTPUT"
          fi

      - name: Restore the checkout proof's pinned Chromium and system-library packages
        if: steps.checkout-browser.outputs.required == 'true'
        id: checkout-chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt-debs
          key: playwright-checkout-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # The probe and stage-proofs.sh resolve Shell's @playwright/test, not the root playwright-core used by N1.
      - name: Install the checkout proof's pinned Chromium and system libraries
        if: steps.checkout-browser.outputs.required == 'true'
        working-directory: app
        run: |
          if [[ -d ~/.cache/playwright-apt-debs ]]; then
            find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec sudo cp {} /var/cache/apt/archives/ \;
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install --with-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;

      - name: Save the checkout proof's pinned Chromium and system-library packages
        if: >-
          success() && steps.checkout-browser.outputs.required == 'true' &&
          steps.checkout-chromium-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/demo/sales-crm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt-debs
          key: ${{ steps.checkout-chromium-cache.outputs.cache-primary-key }}

      # N1's native-control unit test uses the root playwright-core pin, not Shell's @playwright/test pin.
      # Cache downloaded browsers and apt archives only; the setup still validates Chromium and its OS libraries.
      - name: Restore N1's pinned Chromium and system-library packages
        if: contains(matrix.commands, 'pnpm --filter ./n1-storefront run test run')
        id: n1-chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt-debs
          key: playwright-core-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Seed apt with N1's cached Chromium system-library packages
        if: contains(matrix.commands, 'pnpm --filter ./n1-storefront run test run')
        run: |
          if [[ -d ~/.cache/playwright-apt-debs ]]; then
            find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec sudo cp {} /var/cache/apt/archives/ \;
          fi

      - name: Install N1's pinned Chromium and system libraries
        if: contains(matrix.commands, 'pnpm --filter ./n1-storefront run test run')
        working-directory: app
        run: mise exec -- pnpm exec playwright-core install --with-deps chromium

      - name: Collect N1's Chromium system-library packages
        if: contains(matrix.commands, 'pnpm --filter ./n1-storefront run test run')
        run: |
          mkdir -p ~/.cache/playwright-apt-debs
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;

      - name: Save N1's pinned Chromium and system-library packages
        if: >-
          success() && contains(matrix.commands, 'pnpm --filter ./n1-storefront run test run') && steps.n1-chromium-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/demo/sales-crm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt-debs
          key: ${{ steps.n1-chromium-cache.outputs.cache-primary-key }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            started=$SECONDS
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            printf 'Command wall time: %ss — %s\n' "$((SECONDS - started))" "$command"
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

      # The trunk's own TS-Go typecheck build, which the next runs on this branch restore by prefix. A cache is readable
      # from its own ref and the default branch only, so main's warmed build never matches the demo lockfile. Saved only
      # after the row passed, under this commit's key, which no other job writes.
      - name: Save the TS-Go typecheck build of the demo trunk
        if: success() && matrix.typescript-build == true && github.ref == 'refs/heads/demo/sales-crm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

  # Unit rows whose suites read no build output start right after planning, beside the build shards.
  workspace-unit:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      # A row may need system tools or provisioned fixtures before its tests run (the matrices' `setup`).
      - name: Run the row's package setup
        if: matrix.setup
        working-directory: app
        env:
          SETUP: ${{ matrix.setup }}
        run: bash -eo pipefail -c "$SETUP"

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            started=$SECONDS
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            printf 'Command wall time: %ss — %s\n' "$((SECONDS - started))" "$command"
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  # Unit rows that execute public contract fixtures over this run's built outputs wait for the build shards only,
  # never for the Node proof.
  workspace-unit-artifacts:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit-artifacts'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit-artifacts) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      # Reuses the lockfile check of the first build shard (install-app lockfile-verdict); only a job that needs
      # the build job reads it, and a job without that need, or whose build job did not succeed, checks freshly.
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ needs.node-artifact-build.result == 'success' && 'reuse' || '' }}
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Download the same-run Node artifacts for unit contract fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      # A row names the units whose outputs its fixtures read in `artifact-units`; without it every unit is required.
      - name: Unpack the Node artifacts for unit contract fixtures
        working-directory: app
        env:
          REQUIRED_UNITS: ${{ matrix.artifact-units }}
        # shellcheck disable=SC2086 # REQUIRED_UNITS is a list of separate unit paths.
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output $REQUIRED_UNITS

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: ${{ matrix.typescript-build && '4GiB' || '' }}
          ULTRAMODERN_TSGO_BUILDERS: ${{ matrix.typescript-build && '1' || '' }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            started=$SECONDS
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            printf 'Command wall time: %ss — %s\n' "$((SECONDS - started))" "$command"
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  static-contracts:
    name: Static Contracts (${{ matrix.group }})
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['static-contracts'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [database, contracts]
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Separate the two memory-heavy analyzers instead of serializing them on one runner.
      # The remaining independent checks share the contracts runner and retain individual logs.
      - parallel:
          - name: Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            run: app/node_modules/.bin/lefthook validate

          - name: Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm skills:check

          - name: Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'database' }}
            working-directory: app
            env:
              # The whole-workspace prover peaks at about 5.7 GiB footprint (5.2 GiB resident) and ran out of
              # memory under an 8 GiB heap limit, so it gets 10 GiB.
              NODE_OPTIONS: --max-old-space-size=10240
            run: mise exec -- pnpm database-access:check

          - name: Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm lean-core:check

          - name: Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm contract:check

          - name: Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm check:module-contracts

          - name: Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm action:test:unit

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
        working-directory: app
        env:
          # The whole-workspace analyzer exceeds V8's ~4 GiB default while releasing its graph.
          NODE_OPTIONS: --max-old-space-size=6144
        run: mise exec -- pnpm api:check

      # The reviewed authorization catalogue and what is generated from it (which modules get a module credential)
      # must match the declarations in source; a stale artefact would key the wrong modules.
      - name: Authorization catalogue artefact
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.group == 'contracts' }}
        working-directory: app
        run: mise exec -- pnpm authorization:catalog:artifact:check

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it,
  # over every tracked file (`--all-files` is `git ls-files`); the hook's own globs choose what each tool checks.
  # The type-aware rules and the lint type check run on Effect's patched tsgolint, which reports type errors of the
  # files the hook lists, each under its own tsconfig. tsrs-lint (0.23 and later) reports every file of every program
  # those files touch, once, under whichever program reaches it first: a vertical test importing a script checked the
  # script under the vertical's options, and a script importing vertical source checked that source under the script
  # options, so the result depended on which files a run listed. Interleaved shards would each load nearly every program,
  # so each shard takes one contiguous slice of the tracked files that starts at a package root: a slice loads only the
  # programs of the packages in it, and lefthook still cuts a slice into command lines that each fit a runner (one run
  # over all verticals did not). The slices are cut by measured lint seconds, not file counts: a scripts file costs about
  # 0.13 s, a Shell or Core Runtime file 0.07 s and a vertical file 0.04 to 0.08 s (the 24 lint command lines of runs
  # 44523282275, 44508998551 and 44498704633). Shard 1 holds the Shell, Core Runtime and the contracts packages and runs
  # the lint rule tests and the repository policy (37 to 56 s); shard 2 the scripts, the lint rules and the verticals up
  # to Finance Billing; shard 3 Inventory and the verticals after it. Replayed, the slowest shard of those runs falls from
  # 359, 410 and 287 s to 357, 358 and 302 s: the whole programs of the scripts and of the large verticals are the limit. The
  # separate Typecheck gate keeps the authoritative TS-Go check of the whole workspace,
  # and runs the Effect diagnostics, which tsgolint's type check does not emit, for the test and tooling tsconfigs
  # outside its project graph (`pnpm lint:effect-diagnostics`).
  # Every diagnostic class still runs: formatting, every lint rule including the type-aware ones, and the Shell UI
  # candidate check, over every file.
  # The first shard (0 on a narrowed run, 1 otherwise) also typechecks and tests the Effect lint rules and runs the
  # repository policy, as main's lint job does. The policy lints the whole app tree, the storefronts and every script
  # included, which the hook's lint globs leave out or check with milder rules, and the rule tests lint real storefront
  # files, so they belong to this row that every plan runs: a scoped plan skips the Typecheck row.
  format-and-lint:
    name: Format and Lint through the pre-commit hook (${{ matrix.shard == 0 && 'changed files' || format('{0}/3', matrix.shard) }})
    # Lint needs source only; it never holds a runner waiting for build jobs.
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['format-and-lint'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # [0] on a narrowed run without tool configuration changes: the changed files only. [1, 2, 3] otherwise.
        shard: ${{ fromJSON(needs.ci-plan.outputs.lint-shards) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      - name: Format and Lint the shard's files through the pre-commit hook
        if: matrix.shard != 0
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          # Shard k takes the tracked files from the (k-1)-th start up to the k-th, in `git ls-files` byte order.
          starts=(app/scripts/ app/verticals/inventory/)
          if ((${#starts[@]} + 1 != SHARDS)); then
            echo "::error title=Lint shards::SHARDS is $SHARDS, but the slice starts make $((${#starts[@]} + 1)) shards."
            exit 1
          fi
          (
            export LC_ALL=C
            shard=1
            git ls-files -z | while IFS= read -r -d '' file; do
              while ((shard < SHARDS)) && [[ ! "$file" < "${starts[shard - 1]}" ]]; do
                shard=$((shard + 1))
              done
              if ((shard == SHARD)); then
                printf '%s\0' "$file"
              fi
            done
          ) >"$RUNNER_TEMP/shard-files"
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/shard-files"
          git diff --exit-code HEAD

      # A missing artifact fails this step, which is the point: without the list this row proves nothing.
      - name: Download the exact changed-path list
        if: matrix.shard == 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-plan

      # ci-plan chose this row only for a narrowed run whose non-empty list changes no tool configuration.
      - name: Format and Lint the run's changed files through the pre-commit hook
        if: matrix.shard == 0
        run: |
          changed="$RUNNER_TEMP/ci-plan/ci-changed-paths"
          # A changed path is a literal file name, never a pathspec pattern.
          export GIT_LITERAL_PATHSPECS=1
          if [[ ! -s "$changed" ]]; then
            echo "::error title=No changed-path list::The changed-files row has no changed paths, so it would prove nothing."
            exit 1
          fi
          paths=()
          while IFS= read -r -d '' path; do
            paths+=("$path")
          done <"$changed"
          # A path the diff deleted has nothing to check.
          git ls-files -z -- "${paths[@]}" >"$RUNNER_TEMP/changed-files"
          echo "Linting $(tr -cd '\0' <"$RUNNER_TEMP/changed-files" | wc -c) changed tracked files."
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/changed-files"
          git diff --exit-code HEAD

      # Once per run, whatever the hook found.
      - name: Typecheck the Effect lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard <= 1 }}
        working-directory: app
        run: mise exec -- pnpm typecheck:lint-rules

      - name: Test the Effect lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard <= 1 }}
        working-directory: app
        run: mise exec -- pnpm test:lint-rules

      - name: Repository policy over the whole app tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard <= 1 }}
        working-directory: app
        run: mise exec -- pnpm lint:repository-policy

  # The integration work of a run, in four jobs that share one environment and one step list; each runs only the
  # steps of its row's suite.
  # - service-integration ("Prepare integration database") migrates and verifies one database on fresh services,
  #   exports it and uploads it as this run's archive. It starts with the run, beside the build shards.
  # - owner-integration rows restore that archive into one PostgreSQL cluster and SpiceDB datastore per lane and run
  #   their tasks two at a time (scripts/ci/run-integration-suites.sh); every task starts from a fresh copy of the
  #   restored baseline. They need the build shards and the database producer, so no row repeats the preparation.
  # - node-topology-proof runs the deployment bootstrap once: the assembled stage migrator against a scratch
  #   cluster, the grant audit, the Outbox Worker host, migration equivalence on the cluster it owns, and the
  #   whole-topology Node proof.
  # - browser-integration migrates its own database and reads no build output, so it starts right after planning.
  # The rows of scripts/ci-matrices.json name every task once; their lanes are balanced by measured seconds.
  node-topology-proof:
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: read
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && needs.ci-plan.outputs.integrationTopology != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationTopology) }}
    env: &integration-environment
      RAYON_NUM_THREADS: '1'
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps: &integration-steps
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A slow cluster start, restore or test is read against measured CPU, iowait, steal and write-back of
      # this runner; the runner ends the sampler with the job and the samples print after the tests.
      - name: Sample runner pressure until the job ends
        working-directory: app
        run: &sample-runner-pressure nohup bash scripts/ci/sample-runner-pressure.sh "$RUNNER_TEMP/runner-pressure.txt" >/dev/null 2>&1 &

      # Both producers have finished through needs. Hosted Node, gh, tar and zstd need no workspace install;
      # unpack writes unit build outputs, while install-app restores only node_modules. The bootstrap row unpacks
      # too: the demo trunk's app artifact ships the Outbox Worker host materialized from the built units
      # (scripts/zerops/app-runtime-paths.txt), so its migrator proof reads them.
      - name: Download and unpack the same-run Node artifacts for native owner fixtures
        id: native-artifacts
        if: matrix.suite == 'bootstrap' || matrix.suite == 'integration'
        background: true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'node-units-*' --dir "$RUNNER_TEMP/native-composition-units"
          bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Pull integration service images
        id: integration-images
        background: true
        working-directory: app
        run: docker compose pull

      # Reuses the lockfile check of the first build shard (install-app lockfile-verdict) in the bootstrap and owner
      # rows, which need the build job; the database producer and the browser checks share these steps without that
      # need, read a missing needs entry and check freshly.
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ needs.node-artifact-build.result == 'success' && 'reuse' || '' }}

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # main's cache warmer saves it for main's lockfile; the demo trunk saves its own below, from its one browser row.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached by image OS and Playwright version, as in stage delivery. apt validates against its index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        working-directory: app
        run: |
          version="$(mise exec -- pnpm --filter @app/shell-super-app exec playwright --version)"
          echo "key=playwright-apt-debs-$ImageOS-${version// /-}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        id: chromium-debs-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        background: true
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: bash scripts/ci/install-chromium-with-diagnostics.sh

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      # TLS generation uses installed Effect packages; image pulls and artifact unpacking do not.
      # Native wait steps fail with the background step's exit code and retain its log.
      - name: Wait for integration service images
        wait: integration-images

      # An owner row starts its empty worker clusters first; only the restore below reads this run's archive.
      - name: Start each integration worker's own empty PostgreSQL cluster and SpiceDB datastore
        if: matrix.suite == 'integration'
        working-directory: app
        env:
          ONTOS_CI_ISOLATED_WORKERS: '2'
        run: bash scripts/ci/start-integration-workers.sh

      # The owner rows need the database producer, so this run's archive exists when they start. The restore
      # downloads it and loads it into every worker cluster while the Node artifacts transfer and
      # unpack; the tests wait for both.
      - name: Restore this run's migrated database into every worker cluster
        id: integration-workers
        if: matrix.suite == 'integration'
        background: true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ONTOS_CI_ISOLATED_WORKERS: '2'
          INTEGRATION_DATABASE_ARCHIVE: ${{ runner.temp }}/integration-database
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name integration-database --dir "$INTEGRATION_DATABASE_ARCHIVE"
          bash scripts/ci/restore-integration-workers.sh

      - name: Start fresh PostgreSQL and SpiceDB services
        if: matrix.suite == 'bootstrap' || matrix.suite == 'browser' || matrix.suite == 'database'
        working-directory: app
        run: |
          # Disposable CI pages do not need the hosted runner's slow persistent disk.
          # Keep the native WAL, fsync and synchronous-commit behavior intact.
          cat > "$RUNNER_TEMP/integration-compose.yml" <<'YAML'
          services:
            ontos-db:
              volumes:
                - type: tmpfs
                  target: /var/lib/postgresql
                  tmpfs:
                    size: 2147483648
          YAML
          export COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/integration-compose.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120
          docker inspect ontos-db --format '{{json .Mounts}}' |
            jq -e 'any(.[]; .Destination == "/var/lib/postgresql" and .Type == "tmpfs")'
          durability="$(docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align \
            --command "SELECT current_setting('fsync') || ':' || current_setting('synchronous_commit') || ':' || current_setting('full_page_writes')")"
          [[ "$durability" == on:on:on ]]

      # The demo trunk's login roles are initialized for local development before anything migrates
      # (scripts/postgres/bootstrap-runtime-role.mts); every row that starts its own services does it once.
      - name: Initialize fresh local database login identities
        if: matrix.suite == 'bootstrap' || matrix.suite == 'browser' || matrix.suite == 'database'
        working-directory: app
        env:
          DATABASE_LOGIN_ROLE_POLICY: initialize-local
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: development
        run: mise exec -- pnpm db:bootstrap-runtime-role

      # Only the bootstrap row removes the pre-seeded runtime role: it is what makes the migrator prove
      # deployment bootstrap ordering against a scratch cluster. A row that dropped it and then restored
      # nothing would have no runtime login for its own suites.
      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'bootstrap'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      # Every backend row consumes these exact outputs; a missing archive or incomplete topology
      # fails this join, not a later test. The download and unpack log stays with native-artifacts.
      - name: Wait for the same-run Node artifacts for native owner fixtures
        wait: native-artifacts

      # The app artifact ships an explicit runtime list (scripts/zerops/app-runtime-paths.txt), including the Outbox
      # Worker host runtime and Bun, which the Zerops build creates. The assembled-artifact proof copies every listed
      # path, so the bootstrap row provisions the same two before it, from the unpacked build outputs: the materialized
      # worker host and the pinned Bun (its glibc build here; Zerops runs the musl build).
      - name: Provision the worker host runtime and Bun that the app artifact ships
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: |
          if [ ! -f .zerops/runtime/outbox-worker-host/worker.mjs ]; then
            mise exec -- pnpm zerops:materialize --app outbox-worker-host --package app --package-dir . --worker
          fi
          sh scripts/install-zerops-bun.sh 1.4.4 glibc
          mkdir -p .zerops/bun && cp -a "$HOME/.local/bun-1.4.4/bin" .zerops/bun/
          mkdir -p .zerops/state && printf '[]' >.zerops/state/module-credential-boots.json

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        # Stage-shaped: the migrator ships only the app's runtime paths, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          # Closed dotenv discovery: no workspace .env file may leak into the cluster this proves.
          APP_ENV_PATH: /dev/null
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      # Bootstrap already migrated and verified every owner through its assembled stage entry point. The
      # database producer migrates once for every owner row, whose isolated workers restore its archive; the
      # browser checks migrate their own database and need nobody.
      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        if: matrix.suite == 'browser' || matrix.suite == 'database'
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it. The
      # migrator directly above provisions the identities this audits, and it reads no matrix input, so
      # one row covers the run.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm database-trust:audit

      - name: Export the migrated integration database
        if: matrix.suite == 'database'
        working-directory: app
        run: bash scripts/ci/export-integration-database.sh

      # The database producer ends with this upload; a re-run of it replaces its own archive.
      - name: Upload the migrated integration database
        if: matrix.suite == 'database'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-database
          path: ${{ runner.temp }}/integration-database
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # Stage-shaped: the host is materialized as the app build does, ships only its runtime, polls every hosted
      # owner's outbox against the freshly migrated database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      # Migration equivalence creates its own databases and fixture roles on a disposable PostgreSQL 18 cluster that
      # its job owns: this row's, which no other job or lane shares (the owned-cluster project of rstest.config.ts).
      - name: Prove migration equivalence on the cluster this row migrated
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          MIGRATION_EQUIVALENCE_TEST_DATABASE_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/postgres
          MIGRATION_EQUIVALENCE_TEST_SANDBOX: owned-postgres18
        run: mise exec -- pnpm exec rstest --project owned-cluster --pool.maxWorkers 1

      - name: Wait for the restored worker clusters
        wait: integration-workers

      # The native owner fixtures read the Composition these exact built artifacts form; the path is exported only
      # after the derivation decoded it as consumers decode it.
      - name: Derive the fresh built Composition for native owner fixtures
        if: matrix.native-composition == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: |
          mise exec -- node scripts/derive-built-application-composition.mts --snapshot-output "$RUNNER_TEMP/native-composition-snapshot.json"
          echo "NATIVE_1290_COMPOSITION_SNAPSHOT_PATH=$RUNNER_TEMP/native-composition-snapshot.json" >> "$GITHUB_ENV"

      # The whole-topology Node artifact proof needs every build shard's outputs. As the bootstrap row it starts
      # with the owner rows, on the PostgreSQL this job already migrated, and it still blocks the required check
      # through the integration gate.
      - name: Generate federated types and check performance readiness over every unit
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Prove Node backend-federation artifacts
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm node:proof

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        # The job environment above is the whole configuration. Native fixtures refuse to start unless
        # dotenv discovery is closed, so no workspace .env file can leak into an owned test database.
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
          INTEGRATION_TASKS: ${{ toJSON(matrix.tasks) }}
          ONTOS_CI_ISOLATED_WORKERS: '2'
          INTEGRATION_LANES: ${{ matrix.lanes }}
        # Same commands as `pnpm test:integration`, with separate Rstest shards for the root and large packages.
        run: bash scripts/ci/run-integration-suites.sh

      # `wait` always runs, including on non-browser rows where the install was skipped.
      - name: Wait for the Chromium install
        wait: chromium-install

      # A cache is readable from its own ref and the default branch only, and main's entry is keyed by main's lockfile,
      # so the demo trunk keeps its own Chromium build. Saved once installed, before the tests can fail.
      - name: Save the Playwright Chromium build of the demo trunk
        if: >-
          success() && matrix.suite == 'browser' && steps.playwright-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/demo/sales-crm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Save the Chromium system-library packages of the demo trunk
        if: >-
          success() && matrix.suite == 'browser' && steps.chromium-debs-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/demo/sales-crm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Verify browser recovery into a newly published release
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          ONTOS_E2E_RETAINED_PARTY_R2: 'true'
        run: >-
          mise exec -- pnpm --filter @app/shell-super-app exec playwright test
          tests/e2e/login.spec.ts --grep 'reloads failed Contacts into a genuinely published R2'
          --workers 1

      # Diagnostics are named per attempt: a re-run that fails again keeps both failures' evidence, and an
      # upload under a name the run already holds would fail instead of keeping either.
      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-browser-failure-diagnostics-${{ github.run_attempt }}
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      # The company ICO conformance proof writes each native owner's own output here when it fails; without it
      # a 503 from an owner cannot be traced to the owner's cause. Four jobs share these steps and each
      # numbers its rows from 0, so the name carries the job, the row and the attempt.
      - name: Upload closed native startup and owner HTTP diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-startup-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            app/verticals/commerce-market-catalog/.cache/ontos-1250/startup-diagnostic-*.json
            /tmp/commerce-org-http-*.diag.log
            /tmp/preproposal-http-*.diag.log
            ${{ runner.temp }}/shell-hang-*.diag.log
            ${{ runner.temp }}/chromium-install
          if-no-files-found: ignore
          retention-days: 1

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200
          # SpiceDB writes thousands of info lines a second, so the tail above covered 13 ms of a failed
          # browser run and nothing from the second of the failure. Keep its warnings and errors of the whole job.
          docker compose logs --no-color --timestamps ontos-spicedb | awk '!/"level":"info"/' | tail --lines 400

      - name: Print the runner pressure samples
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/runner-pressure.txt" ]]; then
            cat "$RUNNER_TEMP/runner-pressure.txt"
          fi

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: |
          workers="$(docker ps --all --quiet --filter label=ontos-ci-worker)"
          if [[ -n "$workers" ]]; then
            docker rm --force --volumes $workers
          fi
          docker compose down --volumes --remove-orphans

  # The database producer and the gate job of the integration check: it runs whenever an owner row is selected,
  # so it never expands an empty matrix. It migrates, verifies, exports and uploads this run's database, and
  # ends; the owner rows need it.
  service-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integration) }}
    env: *integration-environment
    steps: *integration-steps

  # The authenticated browser checks migrate their own database and need no other job, so they start with
  # the run. An affected plan that leaves the Shell alone selects none.
  browser-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.ci-plan.outputs.integrationBrowser != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationBrowser) }}
    env: *integration-environment
    steps: *integration-steps

  # Owner rows restore this run's database archive and Node artifacts, so they need both producers and
  # start only once every build shard and the database producer uploaded. `gh run download` reads the
  # archive of this run by its id, which needs `actions: read`.
  owner-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, service-integration]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && needs.service-integration.result == 'success' && needs.ci-plan.outputs.integrationOwners != '[]' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationOwners) }}
    env: *integration-environment
    steps: *integration-steps

  # Keep one required check. Selected jobs must succeed and every skipped job must be explicitly planned.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        ci-plan,
        workspace-gate,
        workspace-unit,
        workspace-unit-artifacts,
        static-contracts,
        format-and-lint,
        service-integration,
        browser-integration,
        owner-integration,
        node-artifact-build,
        node-topology-proof,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected gates and reject unplanned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash app/scripts/check-ci-gates.sh
