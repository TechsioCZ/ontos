name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # The main ruleset requires the Workspace gates check and the merge queue, so every pull request and
  # merge group reports it, documentation-only ones included: a filtered run would never report it.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      full:
        description: Deploy the whole topology instead of the diff since the environment's last successful deployment (seeding or rewritten history).
        type: boolean
        default: false
      environment:
        description: GitHub deployment environment to deploy. Its DEPLOY_TARGET variable selects Zerops or Cloudflare; pushes to main deploy stage.
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  queue-proof:
    name: Find the merge queue proof of this commit
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            echo 'proven=true' >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi

  # The only job that saves the caches the gates restore, on main, where every pull request and merge
  # group can read them: the pnpm store, the TS-Go typecheck build, and the Playwright Chromium build.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: "true"
          save-store: "true"

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  # Each entry runs its commands one after another and reports every one that fails. Entries group a few
  # minutes of checks each, so each runner pays one install for them: the org runs at most 20 jobs at
  # once, and every gate job of the first wave must start at once to finish in time.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck, Effect Rule Implementation, and OntOS API Boundary Rules
            typescript-build: true
            commands: |
              pnpm typecheck
              pnpm typecheck:lint-rules
              pnpm test:lint-rules
              pnpm api:check:ontos
          - name: Repository Tooling, Module Entrypoint, Deployment Impact Planner, and Codesmith Generation Tests
            commands: |
              pnpm test:scripts
              pnpm module-entrypoints:check
              pnpm test:deployment-impact
              pnpm test:generation
          # The root `pnpm test:unit` (every package's test:unit, then every package's test:component) in
          # shards of packages balanced by measured test time. The last shard runs every package the others
          # do not name, so a new package is always tested; Repository Tooling Tests check the split.
          - name: Unit and Component Tests (Catalog)
            commands: |
              pnpm -r --if-present --filter ./verticals/catalog run test:unit
              pnpm -r --if-present --filter ./verticals/catalog run test:component
          - name: Unit and Component Tests (Commerce Customer Context and Inventory)
            commands: |
              pnpm -r --if-present --filter ./verticals/commerce-customer-context --filter ./verticals/inventory run test:unit
              pnpm -r --if-present --filter ./verticals/commerce-customer-context --filter ./verticals/inventory run test:component
          - name: Unit and Component Tests (every other package)
            commands: |
              pnpm -r --if-present --filter '!.' --filter '!./verticals/catalog' --filter '!./verticals/commerce-customer-context' --filter '!./verticals/inventory' run test:unit
              pnpm -r --if-present --filter '!.' --filter '!./verticals/catalog' --filter '!./verticals/commerce-customer-context' --filter '!./verticals/inventory' run test:component
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: ${{ matrix.typescript-build == true }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  static-contracts:
    name: Static Contracts
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # Each check is a step, not a job: they take seconds, so a job each paid the install many times over.
      # Every step runs after a successful install, so one run reports every failing check.
      - name: Validate the root lefthook config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: app/node_modules/.bin/lefthook validate

      - name: Skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm skills:check

      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries

      - name: API Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm api:check

      - name: Database Access Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm database-access:check

      - name: Lean Core Dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm lean-core:check

      - name: Workspace Contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm contract:check

      - name: Module Contract Generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm check:module-contracts

      - name: Action Unit Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        run: mise exec -- pnpm action:test:unit

      # The Commerce Cloudflare build once crashed parsing Catalog's root HttpApi chain because React
      # Compiler also compiled server code. Production imports only the quantity-preparation client;
      # this case keeps the whole Catalog client barrel compiling in the Commerce workerd graph. It is
      # not a delivery artifact, so it runs here, off the build-and-proof path.
      - name: Build Commerce for workerd with the whole Catalog client barrel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm --filter @app/commerce-customer-context run cloudflare:build:full-catalog-client-guard
          grep -qF '"CatalogApiFoundation"' verticals/commerce-customer-context/dist-cloudflare/worker/__modern_bff_effect.js

  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it,
  # over every tracked file. Type-aware lint of the whole tree took over four minutes on one runner, so
  # each shard runs the hook over every other tracked file (`--all-files` is `git ls-files`): together
  # they cover every file once, and the hook's own globs still choose what each tool checks.
  format-and-lint:
    name: Format and Lint through the pre-commit hook (${{ matrix.shard }}/2)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Format and Lint the shard's files through the pre-commit hook
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          index=0
          git ls-files -z | while IFS= read -r -d '' file; do
            if ((index % SHARDS == SHARD - 1)); then
              printf '%s\0' "$file"
            fi
            index=$((index + 1))
          done >"$RUNNER_TEMP/shard-files"
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$RUNNER_TEMP/shard-files"
          git diff --exit-code HEAD

  # Two suites on fresh services, run side by side: the stage-shaped migrator and Outbox Worker host
  # artifacts followed by the integration tests (as one job ran them), and the authenticated browser tests
  # on their own freshly migrated database.
  service-integration:
    name: ${{ matrix.name }}
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            name: Database, Migration, RLS, Authorization, and Outbox Integration
          - suite: browser
            name: Authenticated Browser Tests
    env:
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: "5433"
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: "50051"
      SPICEDB_HTTP_PORT: "8443"
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Install Chromium and its runtime dependencies
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CHROMIUM_CACHED" = true ]; then
            mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          else
            mise exec -- pnpm --filter @app/shell-super-app exec playwright install --with-deps chromium
          fi

      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'integration'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: "8080"
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Stage-shaped on the Cloudflare target: the host is materialized by its zerops.yaml build command,
      # ships only its deployFiles, polls every hosted owner's outbox against the freshly migrated
      # database until /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        run: mise exec -- pnpm test:integration

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-browser-failure-diagnostics
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # Each delivery unit builds from source exports only (scripts/tests/vertical-build-order.test.mts), so
  # the units build in shards on parallel runners, one unit at a time per shard: parallel builds on one
  # runner fight over its cores, and every unit's TS-Go declaration pass then runs several times slower.
  # The proof jobs below download every shard and prove the whole topology, exactly as one build did.
  # A new unit joins one shard of each target (a test checks).
  artifact-build:
    name: Build ${{ matrix.target }} artifacts (${{ matrix.shard }}/5)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
        shard: [1, 2, 3, 4, 5]
        # Each target's units in five shards, balanced by that target's measured build time.
        include:
          - { target: node, shard: 1, units: verticals/catalog }
          - { target: node, shard: 2, units: verticals/commerce-customer-context verticals/storefront-registry }
          - { target: node, shard: 3, units: verticals/assortment apps/shell-super-app }
          - { target: node, shard: 4, units: verticals/party-registry verticals/inventory }
          - target: node
            shard: 5
            units: >-
              verticals/commerce-market-catalog verticals/price-group-catalog verticals/pricing
              verticals/payment-term-catalog
          - { target: cloudflare, shard: 1, units: verticals/assortment verticals/pricing }
          - { target: cloudflare, shard: 2, units: verticals/party-registry verticals/price-group-catalog }
          - { target: cloudflare, shard: 3, units: verticals/catalog verticals/storefront-registry }
          - { target: cloudflare, shard: 4, units: verticals/commerce-customer-context apps/shell-super-app }
          - target: cloudflare
            shard: 5
            units: verticals/inventory verticals/commerce-market-catalog verticals/payment-term-catalog
          - target: node
            script: build
            public-site-url: http://localhost:8080
          - target: cloudflare
            script: cloudflare:build
            public-site-url: https://shell-super-app.invalid
    env:
      MODERN_PUBLIC_SITE_URL: ${{ matrix.public-site-url }}
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Build the shard's Node artifacts one unit at a time
        if: matrix.target == 'node'
        working-directory: app
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run "$BUILD_SCRIPT"

      - name: Build the shard's Cloudflare artifacts one unit at a time
        if: matrix.target == 'cloudflare'
        working-directory: app
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          SHARD_UNITS: ${{ matrix.units }}
          # Placeholder data-plane IDs the Cloudflare build requires in each Worker's bindings, as in cloudflare-runtime.
          ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
          ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm -r --no-sort --workspace-concurrency=1 "${filters[@]}" run "$BUILD_SCRIPT"

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  node-runtime:
    name: Node Backend Federation Artifact Proof
    needs: [queue-proof, artifact-build]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' && needs.artifact-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download every shard's Node build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Node build outputs of every delivery unit
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types and check performance readiness over every unit
        working-directory: app
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Prove Node backend-federation artifacts
        working-directory: app
        env:
          DATABASE_URL: postgresql://ontos_proof:ontos_proof@localhost:5432/ontos_proof
        run: mise exec -- pnpm node:proof

      # The deployed publisher derives the snapshot from exactly these artifact kinds; this proves its output
      # decodes with the consumers' ActiveApplicationCompositionSnapshotSchema before stage depends on it.
      - name: Prove the active Application Composition publisher output decodes
        working-directory: app
        run: mise exec -- pnpm active-composition:publish prove-build

  # Two independent halves over the same downloaded Worker outputs, run side by side: the outputs and
  # their SSR, and the whole Worker topology against real services, which reads only the built outputs.
  cloudflare-runtime:
    name: Cloudflare Workerd Artifact Proof (${{ matrix.part }})
    needs: [queue-proof, artifact-build]
    if: ${{ !cancelled() && needs.queue-proof.outputs.proven != 'true' && needs.artifact-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [outputs, topology]
    # Development-only service values for the Worker topology proof (as in service-integration).
    env:
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: "5433"
      POSTGRES_USER: ontos_ci_admin
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: "50051"
      SPICEDB_HTTP_PORT: "8443"
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      # Placeholder data-plane IDs: locally a Worker's HYPERDRIVE binding connects to the proof's
      # PostgreSQL, its SPICEDB binding is served by a local gateway Worker and its composition KV
      # binding is a local namespace.
      ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
      ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download every shard's Cloudflare build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cloudflare-units-*
          path: ${{ runner.temp }}/units

      - name: Unpack the Cloudflare build outputs of every delivery unit
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/units" .output

      - name: Generate federated types, verify the Worker outputs and prove their SSR
        if: matrix.part == 'outputs'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_ASSORTMENT: https://assortment.invalid
          ULTRAMODERN_PUBLIC_URL_CATALOG: https://catalog.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_CUSTOMER_CONTEXT: https://commerce-customer-context.invalid
          ULTRAMODERN_PUBLIC_URL_COMMERCE_MARKET_CATALOG: https://commerce-market-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_INVENTORY: https://inventory.invalid
          ULTRAMODERN_PUBLIC_URL_PARTY_REGISTRY: https://party-registry.invalid
          ULTRAMODERN_PUBLIC_URL_PAYMENT_TERM_CATALOG: https://payment-term-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICE_GROUP_CATALOG: https://price-group-catalog.invalid
          ULTRAMODERN_PUBLIC_URL_PRICING: https://pricing.invalid
          ULTRAMODERN_PUBLIC_URL_SHELL_SUPER_APP: https://shell-super-app.invalid
          ULTRAMODERN_PUBLIC_URL_STOREFRONT_REGISTRY: https://storefront-registry.invalid
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types --target cloudflare
          mise exec -- pnpm cloudflare-output:verify
          mise exec -- pnpm cloudflare:ssr-proof

      # The built Workers, run together in workerd against real PostgreSQL and SpiceDB, prove the
      # Cloudflare topology end to end: Hyperdrive across requests, SpiceDB over HTTP, module
      # discovery and API calls over service bindings, and SSR.
      - name: Create the local SpiceDB TLS certificate
        if: matrix.part == 'topology'
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      - name: Start fresh PostgreSQL and SpiceDB services for the Worker topology
        if: matrix.part == 'topology'
        working-directory: app
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120

      - name: Migrate and initialize the local tenant for the Worker topology
        if: matrix.part == 'topology'
        working-directory: app
        # The migrations and local initialization read the app .env; write it from this job's
        # development-only service values so every tool sees the same database and SpiceDB.
        run: |
          # SPICEDB_CA_CERT spans lines, so it goes in as one double-quoted dotenv value.
          printenv | grep -E '^(BETTER_AUTH_|DATABASE_|ONTOS_|POSTGRES_|SPICEDB_)' | grep -v '^SPICEDB_CA_CERT=' > .env
          awk 'BEGIN { printf "SPICEDB_CA_CERT=\"" } NF { printf "%s\\n", $0 } END { print "\"" }' .spicedb-tls/cert.pem >> .env
          mise exec -- pnpm db:migrate
          mise exec -- pnpm local:initialize

      - name: Prove the Worker topology against PostgreSQL and SpiceDB
        if: matrix.part == 'topology'
        working-directory: app
        timeout-minutes: 10
        run: mise exec -- bash scripts/prove-cloudflare-local-topology.sh

      - name: Remove the Worker topology service containers and volumes
        if: always() && matrix.part == 'topology'
        working-directory: app
        run: docker compose down --volumes --remove-orphans

  # The one required status check of the main ruleset, so new gate jobs join it here, not the ruleset.
  # It passes when every gate passed, or when the merge queue already proved this commit and the gates were skipped.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        workspace-gate,
        static-contracts,
        format-and-lint,
        service-integration,
        artifact-build,
        node-runtime,
        cloudflare-runtime,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate, or the merge queue proof of this commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          proof="$(jq -r '.["queue-proof"].result' <<<"$NEEDS_JSON")"
          if [[ "$proof" != success && "$proof" != skipped ]]; then
            echo "::error title=Merge queue proof not checked::The queue-proof job ended $proof."
            exit 1
          fi
          proven="$(jq -r '.["queue-proof"].outputs.proven // ""' <<<"$NEEDS_JSON")"
          expected=success
          if [[ "$proven" == true ]]; then
            expected=skipped
          fi
          failed="$(jq -r --arg expected "$expected" 'to_entries[] | select(.key != "queue-proof" and .value.result != $expected) | "\(.key) \(.value.result)"' <<<"$NEEDS_JSON")"
          if [[ -n "$failed" ]]; then
            echo "::error title=Workspace gates failed::Expected every gate $expected, got: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Every gate is $expected."

  # Each GitHub deployment environment chooses where its delivery units run with its DEPLOY_TARGET
  # variable: `zerops` (also when unset) deploys the whole topology to Zerops; `cloudflare` keeps only
  # the migrator, SpiceDB and the outbox workers on Zerops and ships the placed units as Workers in
  # deploy-cloudflare. Its OUTBOX_WORKER_MODE variable, required and independent of the target, chooses
  # how the Outbox Workers run on Zerops: `dedicated` (one service per owner, highly available) or `host`
  # (every owner in the one outbox-worker-host process, cheap). There is no default, so an environment
  # never inherits another's mode. Pushes to main deploy stage; production deploys only on an explicit dispatch.
  # Environment variables and secrets are unreadable in a job-level `if`, so this job reads them
  # without creating a deployment (`deployment: false`). An environment without its Zerops project
  # and token deploys nothing and records nothing.
  deploy-target:
    name: Resolve the deploy target of the deployment environment
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment || 'stage' }}
      deployment: false
    permissions: {}
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      environment: ${{ steps.target.outputs.environment }}
      outbox-worker-mode: ${{ steps.target.outputs.outbox_worker_mode }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve the deploy target and Outbox Worker mode and check the Zerops project and token
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'stage' }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          OUTBOX_WORKER_MODE: ${{ vars.OUTBOX_WORKER_MODE }}
          ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          target="${DEPLOY_TARGET:-zerops}"
          if [[ "$target" != zerops && "$target" != cloudflare ]]; then
            echo "::error title=Invalid deploy target::$DEPLOY_ENVIRONMENT DEPLOY_TARGET must be zerops or cloudflare, not '$target'."
            exit 1
          fi
          if [[ -n "$OUTBOX_WORKER_MODE" && "$OUTBOX_WORKER_MODE" != dedicated && "$OUTBOX_WORKER_MODE" != host ]]; then
            echo "::error title=Invalid Outbox Worker mode::$DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE must be dedicated or host, not '$OUTBOX_WORKER_MODE'."
            exit 1
          fi
          # The edge deploy keeps its history in stage-edge and builds from the stage build
          # environment in topology/cloudflare-placement.json, so only stage can target Cloudflare.
          if [[ "$target" == cloudflare && "$DEPLOY_ENVIRONMENT" != stage ]]; then
            echo "::error title=Invalid deploy target::Only stage can target Cloudflare; set $DEPLOY_ENVIRONMENT DEPLOY_TARGET to zerops."
            exit 1
          fi
          {
            echo "environment=$DEPLOY_ENVIRONMENT"
            echo "outbox_worker_mode=$OUTBOX_WORKER_MODE"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"
          if [[ -n "$ZEROPS_PROJECT_ID" && -n "$ZEROPS_TOKEN" ]]; then
            # A configured environment deploys Outbox Workers, so it must have chosen how they run.
            if [[ -z "$OUTBOX_WORKER_MODE" ]]; then
              echo "::error title=Outbox Worker mode not set::Set the $DEPLOY_ENVIRONMENT OUTBOX_WORKER_MODE variable to dedicated or host."
              exit 1
            fi
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo "::notice title=Zerops deploy not configured::Set the $DEPLOY_ENVIRONMENT ZEROPS_PROJECT_ID variable and ZEROPS_TOKEN secret to deploy $DEPLOY_ENVIRONMENT."
          fi

  # The deploy plan needs no gate, so it is ready by the time the gates pass or prove skipped. On the Cloudflare
  # target it runs only once the edge deploy that ships the placed units is configured too. edge-deploy-readiness
  # checks only stage, the one environment that can target Cloudflare, so it is skipped for production.
  # It records no deployment: deploy-zerops is the environment's deployment, so a plan or migration that
  # succeeds before a failed deploy never moves the environment's diff base.
  deploy-plan:
    name: Plan the environment's deployment after merge to main
    if: >-
      !cancelled()
      && needs.deploy-target.outputs.configured == 'true'
      && (needs.deploy-target.outputs.target == 'zerops' || needs.edge-deploy-readiness.outputs.configured == 'true')
    needs: [deploy-target, edge-deploy-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      deployments: read
    outputs:
      any: ${{ steps.units.outputs.any }}
      migrator: ${{ steps.impact.outputs.migrator }}
      providers: ${{ steps.units.outputs.providers }}
      shell: ${{ steps.units.outputs.shell }}
      spicedb: ${{ steps.impact.outputs.spicedb }}
      stopped-workers: ${{ steps.impact.outputs.stopped_workers }}
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      # `host` runs every Outbox Worker in the one outbox-worker-host service instead of each owner's
      # dedicated worker service; the planner and the composition publisher both read it.
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      - name: Resolve the environment's last successful deployment
        id: base
        if: ${{ !inputs.full }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- pnpm deployment-base:resolve --environment "$DEPLOY_ENVIRONMENT"

      # An OUTBOX_WORKER_MODE switch changes no source, so the diff cannot show it. The other mode's workers
      # still running, or this mode's workers not running, is that switch, and the plan then deploys every
      # worker of this mode and stops the other mode's.
      - name: Detect Outbox Workers that do not match the Outbox Worker mode
        id: worker-drift
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm --silent active-composition:publish worker-mode-drift

      - name: Generate topology-driven deployment impact plan
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          FULL_PLAN: ${{ inputs.full }}
          WORKER_DRIFT: ${{ steps.worker-drift.outputs.drift }}
        run: |
          plan_arguments=()
          if [[ "$FULL_PLAN" != 'true' ]]; then
            plan_arguments=(--base "$BASE_SHA")
          fi
          if [[ "$WORKER_DRIFT" == 'true' ]]; then
            plan_arguments+=(--reconcile-workers)
          fi
          mise exec -- pnpm deployment-impact:plan \
            --authorization-environment "$DEPLOY_ENVIRONMENT" \
            --outbox-worker-mode "$OUTBOX_WORKER_MODE" \
            "${plan_arguments[@]}" \
            --head "$GITHUB_SHA"

      - name: Record reviewed deployment impact plan
        env:
          DEPLOYMENT_PLAN_JSON: ${{ steps.impact.outputs.plan }}
        run: |
          {
            echo "## Reviewed deployment impact plan ($DEPLOY_ENVIRONMENT, $DEPLOY_TARGET target, $OUTBOX_WORKER_MODE Outbox Workers)"
            echo '```json'
            jq . <<<"$DEPLOYMENT_PLAN_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan carries both targets. On Zerops every planned provider, outbox worker and the Shell
      # deploy in deploy-zerops. On Cloudflare the placed units ship as Workers in deploy-cloudflare, and only
      # the outbox workers, which drain PostgreSQL outboxes, stay on Zerops beside the infrastructure.
      - name: Select the Zerops units of the deploy target
        id: units
        env:
          MIGRATOR: ${{ steps.impact.outputs.migrator }}
          PROVIDERS_JSON: ${{ steps.impact.outputs.providers }}
          SHELL: ${{ steps.impact.outputs.shell }}
          SPICEDB: ${{ steps.impact.outputs.spicedb }}
          WORKERS_JSON: ${{ steps.impact.outputs.workers }}
        run: |
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            providers="$WORKERS_JSON"
            shell=false
          else
            providers="$PROVIDERS_JSON"
            shell="$SHELL"
          fi
          any=false
          if [[ "$MIGRATOR" == true || "$SPICEDB" == true || "$providers" != '[]' || "$shell" == true ]]; then
            any=true
          fi
          {
            echo "any=$any"
            echo "providers=$providers"
            echo "shell=$shell"
          } >>"$GITHUB_OUTPUT"

  # Migrations and SpiceDB go first and alone: the edge deploy and the Zerops units both wait only for this job,
  # then run side by side. A plan without either finishes this job in seconds. Like the plan, it records no deployment.
  deploy-migrations:
    name: Migrate the environment's database and SpiceDB after the gates
    if: ${{ !cancelled() && needs.workspace-gates.result == 'success' && needs.deploy-plan.result == 'success' }}
    needs: [workspace-gates, deploy-target, deploy-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ needs.deploy-target.outputs.environment }}
      deployment: false
    # Migrations publish nothing, so they take their own lock, not the zerops group the composition refresh
    # waits on: the publication guarantee lives entirely in deploy-zerops, which holds that group. Migrations
    # stay backward compatible, so a refresh that runs after them still serves the previous deployment.
    concurrency:
      group: zerops-migrations-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      INFRASTRUCTURE: ${{ needs.deploy-plan.outputs.migrator == 'true' || needs.deploy-plan.outputs.spicedb == 'true' }}
      ZEROPS_MIGRATOR_SERVICE_ID: ${{ vars.ZEROPS_MIGRATOR_SERVICE_ID }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SPICEDB_SERVICE_ID: ${{ vars.ZEROPS_SPICEDB_SERVICE_ID }}
    steps:
      - name: Harden Runner
        if: env.INFRASTRUCTURE == 'true'
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        if: env.INFRASTRUCTURE == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        if: env.INFRASTRUCTURE == 'true'
        uses: ./.github/actions/install-app

      - name: Install Zerops CLI
        if: env.INFRASTRUCTURE == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      - name: Authenticate to Zerops
        if: env.INFRASTRUCTURE == 'true'
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: zcli login "$ZEROPS_TOKEN"

      # app/zerops.yaml describes stage. Every push reads a copy that names the deploying environment, so
      # another environment's builds and runtimes never run stage-only behaviour. Production's copy also
      # points every runtime at its TLS SpiceDB endpoint, the production environment variable SPICEDB_ENDPOINT.
      - name: Materialize the environment's zerops.yaml
        if: env.INFRASTRUCTURE == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Run verified database migrations
        if: needs.deploy-plan.outputs.migrator == 'true'
        id: migrator
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --setup migrator
          --version-name "$GITHUB_SHA"

      - name: Show bounded migrator logs after failure
        if: failure() && steps.migrator.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

      # zcli waits for the stop process and exits non-zero when it fails, so a migrator left running fails the deploy.
      - name: Stop migrator after any attempted migration
        if: always() && steps.migrator.outcome != 'skipped'
        run: >-
          zcli service stop
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_MIGRATOR_SERVICE_ID"

      - name: Deploy SpiceDB when affected
        if: needs.deploy-plan.outputs.spicedb == 'true'
        id: spicedb
        run: >-
          zcli push
          --working-dir .
          --zerops-yaml-path "$ZEROPS_YAML_PATH"
          --workspace-state clean
          --deploy-git-folder
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --setup spicedb
          --version-name "$GITHUB_SHA"

      - name: Show bounded SpiceDB logs after failure
        if: failure() && steps.spicedb.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SPICEDB_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

  # The environment's deployment: the providers, outbox workers and Shell that run on Zerops, beside the edge deploy.
  deploy-zerops:
    name: Deploy the environment's Zerops services after merge to main
    if: ${{ !cancelled() && needs.deploy-migrations.result == 'success' }}
    needs: [deploy-target, deploy-plan, deploy-migrations]
    runs-on: ubuntu-latest
    # Each Zerops push builds its unit remotely for about 12 minutes and units deploy one after another in
    # plan order, so a full topology deploy (12 units plus publication) needs about 3 hours.
    timeout-minutes: 240
    environment: ${{ needs.deploy-target.outputs.environment }}
    # Serializes with the scheduled composition refresh so no publication interleaves with a deploy.
    concurrency:
      group: zerops-${{ inputs.environment || 'stage' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deploy-target.outputs.environment }}
      DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_SHELL_SERVICE_ID: ${{ vars.ZEROPS_SHELL_SERVICE_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Install Zerops CLI
        if: needs.deploy-plan.outputs.any == 'true'
        # mise owns Node, so its shims must learn the globally installed zcli binary.
        run: |
          npm install --global @zerops/zcli@1.1.0
          mise reshim

      - name: Authenticate to Zerops
        if: needs.deploy-plan.outputs.any == 'true'
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: zcli login "$ZEROPS_TOKEN"

      - name: Materialize the environment's zerops.yaml
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        env:
          PRODUCTION_SPICEDB_ENDPOINT: ${{ vars.SPICEDB_ENDPOINT }}
          ZEROPS_YAML_PATH: ${{ runner.temp }}/zerops.yaml
        run: |
          materialize_arguments=(--environment "$DEPLOY_ENVIRONMENT" --input zerops.yaml --output "$ZEROPS_YAML_PATH")
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
            materialize_arguments+=(--spicedb-endpoint "$PRODUCTION_SPICEDB_ENDPOINT")
          fi
          mise exec -- pnpm --silent zerops:materialize-environment "${materialize_arguments[@]}"
          echo "ZEROPS_YAML_PATH=$ZEROPS_YAML_PATH" >>"$GITHUB_ENV"

      - name: Resolve active Application Composition consumers
        id: composition
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        run: mise exec -- pnpm --silent active-composition:publish consumers

      - name: Deploy affected providers that do not consume the active composition
        if: needs.deploy-plan.outputs.providers != '[]'
        env:
          CONSUMERS_JSON: ${{ steps.composition.outputs.consumers }}
          PROVIDERS_JSON: ${{ needs.deploy-plan.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          UNITS_JSON="$(jq -c --argjson consumers "$CONSUMERS_JSON" '[.[] | select(IN($consumers[]) | not)]' <<<"$PROVIDERS_JSON")"
          export UNITS_JSON
          app/scripts/push-zerops-units.sh

      - name: Deploy Shell after affected providers
        if: needs.deploy-plan.outputs.shell == 'true'
        id: shell
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          UNITS_JSON: '["shellsuperapp"]'
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # Consumers refuse to start without the snapshot. Publish the observed inventory without the consumers
      # about to be deployed, so they start on a current snapshot, then observe them and publish it complete.
      - name: Publish the active Application Composition before its consumers deploy
        id: planned-consumers
        if: needs.deploy-plan.outputs.any == 'true'
        working-directory: app
        env:
          CONSUMERS_JSON: ${{ steps.composition.outputs.consumers }}
          PROVIDERS_JSON: ${{ needs.deploy-plan.outputs.providers }}
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          planned="$(jq -c --argjson consumers "$CONSUMERS_JSON" '[.[] | select(IN($consumers[]))]' <<<"$PROVIDERS_JSON")"
          echo "units=$planned" >> "$GITHUB_OUTPUT"
          if [[ "$planned" == '[]' ]]; then
            echo 'No composition consumer is planned; the complete publication follows.'
            exit 0
          fi
          # On Cloudflare a new or moved Worker is unobservable until deploy-cloudflare ships it, so the
          # consumers start on the current snapshot and publish-edge-composition publishes after the edge deploy.
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            echo 'The Cloudflare target publishes after the edge deploy; consumers start on the current snapshot.'
            exit 0
          fi
          exclusions=()
          while IFS= read -r unit; do
            exclusions+=(--exclude-app "$unit")
          done < <(jq -r '.[]' <<<"$planned")
          mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT" "${exclusions[@]}"

      - name: Deploy affected composition consumers
        if: steps.planned-consumers.outputs.units != '' && steps.planned-consumers.outputs.units != '[]'
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          UNITS_JSON: ${{ steps.planned-consumers.outputs.units }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: app/scripts/push-zerops-units.sh

      # On Cloudflare, publish-edge-composition publishes and restarts the consumers after the edge deploy.
      - name: Publish the complete active Application Composition and restart its consumers
        if: needs.deploy-plan.outputs.any == 'true' && env.DEPLOY_TARGET == 'zerops'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: mise exec -- pnpm active-composition:publish publish --environment "$DEPLOY_ENVIRONMENT" --restart-consumers

      # Switching OUTBOX_WORKER_MODE leaves the other mode's Outbox Workers running. The plan names them in every
      # run that deploys this mode's workers, so exactly one set of workers delivers the outbox.
      - name: Stop the other Outbox Worker mode's workers
        if: needs.deploy-plan.outputs.stopped-workers != '' && needs.deploy-plan.outputs.stopped-workers != '[]'
        working-directory: app
        env:
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          STOPPED_WORKERS_JSON: ${{ needs.deploy-plan.outputs.stopped-workers }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          while IFS= read -r setup; do
            mise exec -- pnpm --silent active-composition:publish stop-service --setup "$setup"
          done < <(jq -r '.[]' <<<"$STOPPED_WORKERS_JSON")

      - name: Show bounded Shell logs after failure
        if: failure() && steps.shell.outcome == 'failure'
        continue-on-error: true
        run: >-
          zcli service log
          --project-id "$ZEROPS_PROJECT_ID"
          --service-id "$ZEROPS_SHELL_SERVICE_ID"
          --limit 200
          --minimum-severity DEBUG

  # The edge deploy runs only when the repository is configured for Cloudflare: the
  # CLOUDFLARE_ACCOUNT_ID variable, the `stage-edge` CLOUDFLARE_API_TOKEN secret, and a complete
  # reviewed build environment (the Shell origin and every placed Worker's public URL). Environment
  # secrets are unreadable in a job-level `if`, so this job reads them from `stage-edge` without
  # creating a deployment (`deployment: false`); only a real edge deploy enters its history.
  edge-deploy-readiness:
    name: Check the Cloudflare edge deploy configuration
    if: needs.deploy-target.outputs.environment == 'stage'
    needs: [deploy-target]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
    steps:
      - name: Checkout the edge placement
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: app/topology/cloudflare-placement.json
          sparse-checkout-cone-mode: false

      - name: Check the Cloudflare account, deploy token and edge build environment
        id: configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ needs.deploy-target.outputs.target }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=('the CLOUDFLARE_ACCOUNT_ID variable')
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=('the stage-edge CLOUDFLARE_API_TOKEN secret')
          # The placed units bake the Shell origin into their API CORS allowlist, the output
          # verifier requires every Worker's public URL, and every Worker binds the private data
          # plane: PostgreSQL through its Hyperdrive config, SpiceDB through its Workers VPC service.
          while IFS= read -r key; do
            missing+=("buildEnvironment.$key")
          done < <(jq -r '.buildEnvironment as $environment | (["ULTRAMODERN_MF_DEV_ORIGIN", "ULTRAMODERN_CLOUDFLARE_HYPERDRIVE_ID", "ULTRAMODERN_CLOUDFLARE_SPICEDB_VPC_SERVICE_ID", "ULTRAMODERN_CLOUDFLARE_COMPOSITION_KV_ID"] + [.units[] | "ULTRAMODERN_PUBLIC_URL_" + (ascii_upcase | gsub("-"; "_"))])[] | select(($environment[.] // "") == "")' app/topology/cloudflare-placement.json)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=false' >>"$GITHUB_OUTPUT"
          joined="$(IFS=','; echo "${missing[*]}")"
          # Without the edge deploy the Cloudflare target would migrate and swap the outbox workers
          # while the old Workers keep serving, so a Cloudflare stage fails before any Zerops change.
          if [[ "$DEPLOY_TARGET" == cloudflare ]]; then
            echo "::error title=Edge deploy not configured::Stage targets Cloudflare but misses ${joined//,/, }; nothing was deployed."
            exit 1
          fi
          echo "::notice title=Edge deploy not configured::Missing ${joined//,/, }; edge units were not deployed."

  # Edge units (topology/cloudflare-placement.json) ship as Cloudflare Workers. edge-plan and edge-build
  # wait only for the deploy target, so they run beside the migrations; deploy-cloudflare changes Workers
  # only once deploy-migrations has migrated the database and SpiceDB, so Worker code never runs
  # against an older schema. The Zerops units deploy beside them. The `stage-edge` environment keeps
  # its own deployment history: edge-plan plans against the last successful edge deployment, so a
  # failed or skipped edge deploy is never hidden by a successful Zerops one. Unconfigured
  # repositories skip all three, so they record nothing.
  edge-plan:
    name: Plan the edge units to deploy
    if: ${{ !cancelled() && needs.edge-deploy-readiness.outputs.configured == 'true' }}
    needs: [deploy-target, edge-deploy-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      cloudflare: ${{ steps.impact.outputs.cloudflare }}
      cloudflare_retirements: ${{ steps.impact.outputs.cloudflare_retirements }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Derive exact-build authorization inventory
        working-directory: app
        env:
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm authorization:inventory:check

      # A full plan deploys every placed unit but still checks retirements against the last edge
      # deployment; only a first seed has none.
      - name: Resolve the last successful edge deployment
        id: base
        working-directory: app
        env:
          FULL_PLAN: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          optional=()
          if [[ "$FULL_PLAN" == 'true' ]]; then
            optional=(--optional)
          fi
          mise exec -- pnpm deployment-base:resolve --environment stage-edge "${optional[@]}"

      # A full recovery run after rewritten history may name a base no branch reaches any more; the
      # planner needs its placement to check retirements, so fetch that commit by id.
      - name: Fetch the last edge deployment commit
        if: steps.base.outputs.base != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
              fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Plan the impacted edge units
        id: impact
        working-directory: app
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          FULL_PLAN: ${{ inputs.full }}
          OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
        run: |
          base_arguments=()
          if [[ -n "$BASE_SHA" ]]; then
            base_arguments=(--placement-base "$BASE_SHA")
          fi
          if [[ "$FULL_PLAN" != 'true' ]]; then
            base_arguments+=(--base "$BASE_SHA")
          fi
          mise exec -- pnpm deployment-impact:plan \
            --authorization-environment stage \
            --outbox-worker-mode "$OUTBOX_WORKER_MODE" \
            "${base_arguments[@]}" \
            --head "$GITHUB_SHA"

  # Each planned unit builds on its own runner: a build is CPU-bound, and a hosted runner of this
  # private repository has two cores, so builds side by side on one runner take as long as in a row.
  # Building runs dependency code (bundlers, build plugins, the framework CLI), so these jobs get no
  # environment and no Cloudflare token; only deploy-cloudflare's Wrangler steps see it.
  edge-build:
    name: Build edge unit ${{ matrix.unit.id }}
    if: ${{ !cancelled() && needs.edge-plan.result == 'success' && needs.edge-plan.outputs.cloudflare != '[]' }}
    needs: [edge-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        unit: ${{ fromJSON(needs.edge-plan.outputs.cloudflare) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # The build step runs the unit's `cloudflare:deploy` up to, but not including, Wrangler.
      - name: Build and verify the planned edge unit
        timeout-minutes: 25
        working-directory: app
        env:
          UNIT_ID: ${{ matrix.unit.id }}
          UNIT_PACKAGE: ${{ matrix.unit.packageName }}
          UNIT_WORKER: ${{ matrix.unit.workerName }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          # Worker public URLs, binding names and the Shell origin are reviewed edge configuration
          # (topology/cloudflare-placement.json `buildEnvironment`), so changing them replans every
          # placed unit.
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          mise exec -- pnpm --filter "$UNIT_PACKAGE" run cloudflare:build
          mise exec -- pnpm --filter "$UNIT_PACKAGE" exec ultramodern-create ultramodern cloudflare-output-verify --app "$UNIT_ID" --require-public-urls
          # Wrangler deploys the name in the built config; the deploy snapshots and restores the
          # planned topology name, so they must be the same Worker.
          built_worker="$(mise exec -- pnpm --filter "$UNIT_PACKAGE" exec jq -r '.name' .output/wrangler.json)"
          if [[ "$built_worker" != "$UNIT_WORKER" ]]; then
            echo "$UNIT_ID builds Worker $built_worker, but topology places $UNIT_WORKER; no Worker was changed." >&2
            exit 1
          fi

      # Everything the build wrote inside the unit is ignored by git; node_modules is the install.
      - name: Pack the edge unit's build output
        working-directory: app
        env:
          UNIT_PACKAGE: ${{ matrix.unit.packageName }}
        run: |
          unit_directory="$(realpath --relative-to=. "$(mise exec -- pnpm --filter "$UNIT_PACKAGE" exec pwd)")"
          git ls-files --others --ignored --exclude-standard --directory -z -- "$unit_directory" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/edge-unit.tar.zst"

      - name: Upload the edge unit's build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-unit-${{ matrix.unit.id }}
          path: ${{ runner.temp }}/edge-unit.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  deploy-cloudflare:
    name: Deploy edge units to Cloudflare Workers after the stage migration
    # Results are checked explicitly: a merge-queue-proven run skips the gates, and a skipped ancestor would
    # otherwise skip every job below it through the implicit success().
    # A plan with no units skips edge-build; the deploy still runs, so its deployment records the revision.
    if: >-
      ${{ !cancelled() && needs.deploy-migrations.result == 'success' && needs.edge-plan.result == 'success'
      && (needs.edge-build.result == 'success' || (needs.edge-build.result == 'skipped' && needs.edge-plan.outputs.cloudflare == '[]')) }}
    needs: [deploy-target, deploy-migrations, edge-plan, edge-build]
    runs-on: ubuntu-latest
    # One edge deploy at a time; a newer pending run replaces an older one, and it plans from the last
    # successful edge deployment, so it ships the skipped run's changes too.
    concurrency:
      group: edge-stage
      cancel-in-progress: false
    # Step timeouts leave the restore step its own budget inside the job deadline, so a hung
    # deploy or proof still ends with every changed Worker restored.
    timeout-minutes: 90
    environment: stage-edge
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Download the planned edge units' build outputs
        if: needs.edge-plan.outputs.cloudflare != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edge-unit-*
          path: ${{ runner.temp }}/edge-units

      # Only Wrangler sees the account token. Building, verifying and proving a unit runs dependency
      # code, so the builds ran in edge-build without it.
      - name: Unpack the planned edge units' build outputs
        working-directory: app
        env:
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
        run: |
          mapfile -t units < <(jq -r '.[] | [.id, .packageName] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r id package <<<"$unit"
            tar --extract --zstd --file "$RUNNER_TEMP/edge-units/edge-unit-$id/edge-unit.tar.zst"
            if ! mise exec -- pnpm --filter "$package" exec test -f .output/wrangler.json; then
              echo "Edge unit $id has no built .output/wrangler.json; no Worker was changed." >&2
              exit 1
            fi
          done

      - name: Deploy planned edge units in dependency order
        id: deploy
        timeout-minutes: 15
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
          EDGE_DEPLOY_STATE: ${{ runner.temp }}/edge-deploy-state.tsv
          EDGE_DEPLOYED_VERSIONS: ${{ runner.temp }}/edge-deployed-versions.tsv
          EDGE_PROVEN_MARKER: 'Proven by cloudflare:proof at '
        run: |
          # Snapshot every planned Worker's rollback target before changing any of them: the version
          # of its latest deployment recorded as proven (see "Record the proven edge Worker
          # versions"). The active version is no target by itself: a secret change or a manual deploy
          # makes a new version nobody proved. A Worker with history but no proven deployment is
          # recorded as `unproven` and is never rolled back. Only Cloudflare's "Worker not found"
          # (API code 10007) means a first deployment; any other failure aborts before anything is
          # deployed.
          mapfile -t units < <(jq -r '.[] | [.packageName, .workerName] | @tsv' <<<"$CLOUDFLARE_UNITS_JSON")
          declare -A previous_versions=()
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r package worker <<<"$unit"
            history="$RUNNER_TEMP/deployments-list-$worker.json"
            status_log="$RUNNER_TEMP/deployments-list-$worker.log"
            if mise exec -- pnpm --filter "$package" exec wrangler deployments list --name "$worker" --json >"$history" 2>"$status_log"; then
              previous_version="$(jq -er --arg marker "$EDGE_PROVEN_MARKER" '
                [.[] | select((.annotations["workers/message"] // "") | startswith($marker))]
                | sort_by(.created_on) | last
                | if . == null then "unproven" else .versions | map(select(.percentage == 100)) | .[0].version_id end
              ' "$history")"
              previous_versions["$worker"]="$previous_version"
            elif grep -q 'code: 10007' "$status_log"; then
              previous_versions["$worker"]=''
            else
              cat "$status_log" >&2
              echo "Could not read the deployments of $worker; no Worker was changed." >&2
              exit 1
            fi
          done
          # Each Worker is recorded with its snapshot before its deploy starts, so the restore step
          # covers a deploy that fails halfway.
          # The version each deploy creates is read from Wrangler's output file, so the proof marks
          # exactly the versions this run deployed.
          : >"$EDGE_DEPLOY_STATE"
          : >"$EDGE_DEPLOYED_VERSIONS"
          for unit in "${units[@]}"; do
            IFS=$'\t' read -r package worker <<<"$unit"
            printf '%s\t%s\t%s\n' "$package" "$worker" "${previous_versions[$worker]}" >>"$EDGE_DEPLOY_STATE"
            deploy_output="$RUNNER_TEMP/wrangler-deploy-$worker.ndjson"
            WRANGLER_OUTPUT_FILE_PATH="$deploy_output" mise exec -- pnpm --filter "$package" exec wrangler deploy --config .output/wrangler.json
            deployed_version="$(jq -ser 'map(select(.type == "deploy")) | last | .version_id' "$deploy_output")"
            printf '%s\t%s\t%s\n' "$package" "$worker" "$deployed_version" >>"$EDGE_DEPLOYED_VERSIONS"
          done

      - name: Prove the deployed edge units on their public URLs
        timeout-minutes: 15
        working-directory: app
        env:
          # The Access service token, so the proof passes once stage sits behind Cloudflare Access.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_UNITS_JSON: ${{ needs.edge-plan.outputs.cloudflare }}
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(jq -r '.buildEnvironment | to_entries[] | [.key, .value] | @tsv' topology/cloudflare-placement.json)
          # Every unit is deployed by now, so their proofs only read public URLs and run side by side.
          mapfile -t packages < <(jq -r '.[].packageName' <<<"$CLOUDFLARE_UNITS_JSON")
          declare -A proofs=()
          for package in "${packages[@]}"; do
            mise exec -- pnpm --filter "$package" run cloudflare:proof >"$RUNNER_TEMP/edge-proof-${package//[@\/]/_}.log" 2>&1 &
            proofs[$!]="$package"
          done
          failed=()
          for pid in "${!proofs[@]}"; do
            package="${proofs[$pid]}"
            status=0
            wait "$pid" || status=$?
            echo "::group::Proof $package (exit $status)"
            cat "$RUNNER_TEMP/edge-proof-${package//[@\/]/_}.log"
            echo '::endgroup::'
            if [[ $status -ne 0 ]]; then
              failed+=("$package")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error title=Edge proof failed::${failed[*]} failed its proof on the public URL."
            exit 1
          fi

      # Each version this run deployed is recorded as proven once its proof passed, by redeploying it
      # at 100% with the proven marker as the deployment message. It must still be the active
      # version: anything that replaced it since the proof was never proven. Traffic does not
      # change; a later failed run rolls back to the newest version recorded this way.
      - name: Record the proven edge Worker versions
        timeout-minutes: 5
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_DEPLOYED_VERSIONS: ${{ runner.temp }}/edge-deployed-versions.tsv
          EDGE_PROVEN_MARKER: 'Proven by cloudflare:proof at '
        run: |
          mapfile -t deployed <"$EDGE_DEPLOYED_VERSIONS"
          for unit in "${deployed[@]}"; do
            IFS=$'\t' read -r package worker proven_version <<<"$unit"
            active="$(mise exec -- pnpm --filter "$package" exec wrangler deployments status --name "$worker" --json \
              | jq -er '.versions | map(select(.percentage == 100)) | .[0].version_id')"
            if [[ "$active" != "$proven_version" ]]; then
              echo "$worker serves $active, not the proven $proven_version; it is not recorded as proven." >&2
              exit 1
            fi
            mise exec -- pnpm --filter "$package" exec wrangler versions deploy "$proven_version@100" --name "$worker" --message "$EDGE_PROVEN_MARKER$GITHUB_SHA" --yes
          done

      # Retirement is two-phase. The deploy that drops a Worker from placement leaves it running, so
      # a rollback of its dependents still finds it. Once this run has proven the new topology, each
      # retired Worker that still exists is reported for an operator to delete
      # (`wrangler delete`); CI never deletes a Worker. The check is read-only and never fails the run.
      - name: Report retired Workers that still exist
        if: needs.edge-plan.outputs.cloudflare_retirements != '[]'
        timeout-minutes: 5
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RETIREMENTS_JSON: ${{ needs.edge-plan.outputs.cloudflare_retirements }}
        run: |
          mapfile -t retirements < <(jq -r '.[] | [.packageName, .workerName] | @tsv' <<<"$CLOUDFLARE_RETIREMENTS_JSON")
          for retirement in "${retirements[@]}"; do
            IFS=$'\t' read -r package worker <<<"$retirement"
            status_log="$RUNNER_TEMP/retired-status-$worker.log"
            if mise exec -- pnpm --filter "$package" exec wrangler deployments status --name "$worker" --json >/dev/null 2>"$status_log"; then
              echo "::warning title=Retired edge Worker still exists::No placed unit deploys $worker any more; delete it (wrangler delete --name $worker)."
            elif grep -q 'code: 10007' "$status_log"; then
              echo "$worker is retired"
            else
              echo "::warning title=Retired edge Worker not checked::Could not read $worker; check it is deleted."
            fi
          done

      # Worker versions are immutable. After a failed deploy or proof, each Worker this run
      # deployed returns to its snapshotted state: its newest proven version, or no Worker at all
      # when this run created it. A Worker with no proven version is not rolled back and is
      # reported. A Worker counts as restored only once that state is
      # observed; anything left on the candidate is reported. A cancelled run restores too: its
      # deploy may have stopped after some Workers changed.
      - name: Restore the edge Workers this run deployed
        if: (failure() || cancelled()) && steps.deploy.outcome != 'skipped'
        timeout-minutes: 10
        working-directory: app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_DEPLOY_STATE: ${{ runner.temp }}/edge-deploy-state.tsv
          EDGE_PROVEN_MARKER: 'Proven by cloudflare:proof at '
        run: |
          # A restore deploys a proven version, so its deployment carries the proven marker too:
          # failed runs never push the newest proven deployment out of the listed history.
          active_version() {
            mise exec -- pnpm --filter "$1" exec wrangler deployments status --name "$2" --json \
              | jq -er '.versions | map(select(.percentage == 100)) | .[0].version_id'
          }
          absent() {
            local status_log="$RUNNER_TEMP/restore-status-$2.log"
            ! active_version "$1" "$2" >/dev/null 2>"$status_log" && grep -q 'code: 10007' "$status_log"
          }
          deployed=()
          if [[ -f "$EDGE_DEPLOY_STATE" ]]; then
            mapfile -t deployed <"$EDGE_DEPLOY_STATE"
          fi
          unrestored=()
          # Restore in reverse deploy order: a unit that binds another returns to its previous version
          # before its binding target does, so no consumer is left calling an older provider.
          for (( index = ${#deployed[@]} - 1; index >= 0; index-- )); do
            IFS=$'\t' read -r deployed_package deployed_worker previous_version <<<"${deployed[index]}"
            if [[ "$previous_version" == unproven ]]; then
              # No version of this Worker ever passed its proof, so none is known to work. It is not
              # rolled back to a version that may lack its bindings, and the run fails.
              unrestored+=("$deployed_worker (no proven version to restore; not rolled back)")
              continue
            fi
            if [[ -z "$previous_version" ]]; then
              if absent "$deployed_package" "$deployed_worker"; then
                echo "$deployed_worker, which this run was creating, does not exist"
              elif mise exec -- pnpm --filter "$deployed_package" exec wrangler delete --name "$deployed_worker" --force \
                && absent "$deployed_package" "$deployed_worker"; then
                echo "Removed $deployed_worker, which this run created"
              else
                unrestored+=("$deployed_worker (created by this run and not removed)")
              fi
              continue
            fi
            if [[ "$(active_version "$deployed_package" "$deployed_worker" 2>/dev/null)" == "$previous_version" ]]; then
              echo "$deployed_worker still serves $previous_version"
            elif mise exec -- pnpm --filter "$deployed_package" exec wrangler rollback "$previous_version" --name "$deployed_worker" --message "${EDGE_PROVEN_MARKER}an earlier run; restored after $GITHUB_SHA failed" --yes \
              && [[ "$(active_version "$deployed_package" "$deployed_worker")" == "$previous_version" ]]; then
              echo "Restored $deployed_worker to $previous_version"
            else
              unrestored+=("$deployed_worker (expected $previous_version)")
            fi
          done
          for worker_state in "${unrestored[@]}"; do
            echo "::error title=Edge Worker not restored::$worker_state is still serving $GITHUB_SHA"
          done
          [[ ${#unrestored[@]} -eq 0 ]]

  # On the Cloudflare target the snapshot observes the Workers, so it is published again once the edge
  # deploy has replaced them, and the consumers left on Zerops (the outbox workers) restart on it.
  publish-edge-composition:
    name: Publish the active Application Composition after the edge deploy
    if: >-
      ${{ !cancelled() && needs.deploy-zerops.result == 'success' && needs.deploy-cloudflare.result == 'success'
      && needs.deploy-target.outputs.target == 'cloudflare' }}
    # It restarts the Zerops consumers, so it also waits for deploy-zerops to finish deploying them.
    needs: [deploy-target, deploy-zerops, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishing is not a deployment: it must not become the stage deploy's diff base.
    environment:
      name: stage
      deployment: false
    concurrency:
      group: zerops-stage
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      edge-consumers: ${{ steps.edge-consumers.outputs.edge_consumers }}
      snapshot: ${{ steps.publish.outputs.snapshot }}
    env:
      DEPLOY_TARGET: cloudflare
      OUTBOX_WORKER_MODE: ${{ needs.deploy-target.outputs.outbox-worker-mode }}
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Publish the observed Workers and restart the Zerops consumers
        id: publish
        working-directory: app
        env:
          SNAPSHOT_FILE: ${{ runner.temp }}/active-application-composition.json
          STAGE_VARIABLES_JSON: ${{ toJSON(vars) }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          mise exec -- pnpm active-composition:publish publish --environment stage --restart-consumers \
            --snapshot-file "$SNAPSHOT_FILE"
          # The encoded snapshot is one JSON line, and it holds no secret.
          echo "snapshot=$(<"$SNAPSHOT_FILE")" >>"$GITHUB_OUTPUT"

      - name: Resolve the placed Workers that consume the snapshot
        id: edge-consumers
        working-directory: app
        run: mise exec -- pnpm --silent active-composition:publish edge-consumers

  # A placed Worker has no Zerops project variable, and the snapshot outgrows a Worker secret, so the
  # placed consumers read the publication from the stage composition KV namespace. Only stage-edge holds
  # the Cloudflare token, so this runs there, without creating a deployment. Writing the key deploys nothing.
  sync-edge-composition:
    name: Hand the published Application Composition to its Worker consumers
    if: >-
      ${{ !cancelled() && needs.publish-edge-composition.result == 'success'
      && needs.publish-edge-composition.outputs.edge-consumers != '' && needs.publish-edge-composition.outputs.edge-consumers != '[]' }}
    needs: [publish-edge-composition]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stage-edge
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Write the snapshot to the composition KV namespace the consumer Workers read
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.publish-edge-composition.outputs.snapshot }}
        run: app/scripts/put-edge-composition-snapshot.sh
