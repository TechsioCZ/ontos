name: Ultramodern Workspace Gates and Main-to-Stage Deploy

# Repository-root documentation feeds no app check (app/ tools read app/AGENTS.md, not the root one), so it deploys nothing.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - CONTEXT-MAP.md
      - README.md
      - AGENTS.md
  # Always report Workspace gates. The ci-plan job, not workflow path filtering, selects required work.
  pull_request:
    branches:
      - main
  # The merge queue proves the exact commit that lands on main. Its push then deploys without re-running the gates.
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force-ci-full:
        description: Run every CI gate even if the merge queue already proved this commit.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ultramodern-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to main or a dispatch on main carries a commit the merge queue may already have proven: its
  # merge_group run of this workflow ran every gate on this exact commit and succeeded. Such a commit skips
  # the gates and deploys. Any other commit (pushed before the queue, or by a ruleset bypass) runs them.
  # A merge queue entry of one pull request carries the tree that pull request's own run may already have
  # tested on the same base (app/scripts/ci/pull-request-proof.sh). Such an entry skips the gates, and its
  # Workspace gates names that run; any other entry runs them.
  queue-proof:
    name: Find the run that already proved this commit
    if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.force-ci-full != true) || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: read fetches the pull request head a merge queue entry is checked against.
    permissions:
      actions: read
      contents: read
    outputs:
      proven: ${{ steps.proof.outputs.proven || steps.pull-request-proof.outputs.proven }}
      run: ${{ steps.proof.outputs.run || steps.pull-request-proof.outputs.run }}
    steps:
      - name: Look up a successful merge group run of this workflow on this commit
        id: proof
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" \
            --jq '[.workflow_runs[].html_url]')"
          if [[ "$(jq 'length' <<<"$runs")" -gt 0 ]]; then
            echo "The merge queue proved $GITHUB_SHA in $(jq -r '.[0]' <<<"$runs"); the gates are skipped."
            printf 'proven=true\nrun=%s\n' "$(jq -r '.[0]' <<<"$runs")" >>"$GITHUB_OUTPUT"
          else
            echo "No merge group run proved $GITHUB_SHA; the gates run before the deploy."
            echo 'proven=false' >>"$GITHUB_OUTPUT"
          fi
      # The whole history without file contents holds the queue's base; the merge of the pull request head
      # fetches only the blobs both sides changed. The proof reads one script, so only its directory is checked out.
      - name: Checkout the queue entry's history without file contents
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: app/scripts/ci
          persist-credentials: false
      - name: Look up the pull request run that tested this exact tree on this base
        id: pull-request-proof
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: bash app/scripts/ci/pull-request-proof.sh find

  # The merge queue tests each entry on its own ref, gh-readonly-queue/<base>/pr-<number>-<base commit>, and
  # builds an entry again on a new ref whenever an entry ahead of it leaves the queue. GitHub does not cancel
  # the run of the replaced entry, and the workflow's concurrency group cannot cut the pull request number
  # out of the ref (expressions have no substring), so that run kept the shared runners from the entries
  # that can still merge: three of them used 146 runner-minutes after the 07:12 UTC rebuild on 18 Nov. The
  # queue holds one live entry per pull request, so every older merge group run of the same pull request on
  # the same base branch belongs to a replaced entry. An entry that leaves without a rebuild fires no event,
  # so its run ends by itself. Nothing waits for this job and it runs no repository code.
  cancel-replaced-queue-runs:
    name: Cancel the runs of this pull request's replaced queue entries
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the older merge group runs of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/(gh-readonly-queue/.+/pr-[0-9]+-)[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a queue entry ref::$GITHUB_REF names no pull request's merge queue entry."
            exit 1
          fi
          # The trailing dash keeps pr-14 apart from pr-149; the exact suffix keeps every other branch out.
          prefix="${BASH_REMATCH[1]}"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          replaced=''
          for status in queued in_progress waiting requested pending; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?event=merge_group&status=$status&per_page=100")"
            replaced+="$(jq -r --arg prefix "$prefix" --argjson run "$GITHUB_RUN_ID" '.workflow_runs[]
              | select(.id < $run and ((.head_branch // "") | startswith($prefix) and (.[($prefix | length):] | test("^[0-9a-f]{40}$"))))
              | .id' <<<"$runs")"$'\n'
          done
          printf '## Replaced queue entries of %s\n\n' "${prefix%-}" >>"$GITHUB_STEP_SUMMARY"
          cancelled=0
          for id in $(sort -nu <<<"$replaced"); do
            # 409: the run ended between the listing and the cancel, which is what the cancel is for.
            if ! response="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" 2>&1)"; then
              if [[ "$response" != *'(HTTP 409)'* ]]; then
                echo "::error title=Replaced queue run not cancelled::Run $id: $response"
                exit 1
              fi
              echo "Run $id ended before its cancel."
              continue
            fi
            echo "Cancelled $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            echo "- Cancelled $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >>"$GITHUB_STEP_SUMMARY"
            cancelled=$((cancelled + 1))
          done
          echo "Cancelled $cancelled run(s) of replaced entries of ${prefix%-}."
          if [[ "$cancelled" -eq 0 ]]; then
            echo 'No older run of this pull request was still running.' >>"$GITHUB_STEP_SUMMARY"
          fi

  # A merge queue entry with a red check can never merge, yet the queue removes it only once Workspace gates
  # reports, after every job it needs has ended: 44260932910 failed lint at 07:48:53 on 18 Nov and left the
  # queue at 08:00:52, 85 runner-minutes later, and 44253133070 ran 35 minutes past its red lint. Each check
  # that ends while the owner rows still run gets a job that cancels its merge group run as soon as that check
  # fails. A cancelled run's Workspace gates still runs (if: always()) and fails within seconds (44255882801,
  # 44256527279, 44257056977, 44257059192), so the queue removes the entry at once. A job starts through
  # needs, so it holds no runner while it waits, and it runs no repository code. The owner rows have no such
  # job: a matrix need waits for every row, by when the run is done. Pull request, push and scheduled runs
  # still run every job, so a red pull request shows every failure.
  stop-red-queue-run-after-lint:
    name: Stop this red merge queue run (Format and Lint)
    needs: [format-and-lint]
    if: ${{ !cancelled() && needs.format-and-lint.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: &stop-red-queue-run-permissions
      actions: write
    steps: &stop-red-queue-run-steps
      - name: Cancel this merge group run, whose entry can no longer merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 409: another stop job cancelled the run first.
          if ! response="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" 2>&1)"; then
            if [[ "$response" != *'(HTTP 409)'* ]]; then
              echo "::error title=Red queue run not stopped::$response"
              exit 1
            fi
          fi
          echo 'Cancelled this red merge group run; Workspace gates reports it and the queue removes the entry.'

  stop-red-queue-run-after-tooling:
    name: Stop this red merge queue run (Repository Tooling Tests)
    needs: [workspace-gate]
    if: ${{ !cancelled() && needs.workspace-gate.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-source-contracts:
    name: Stop this red merge queue run (Source, Generation, and Deployment Contracts)
    needs: [workspace-source-contracts]
    if: ${{ !cancelled() && needs.workspace-source-contracts.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-static-contracts:
    name: Stop this red merge queue run (Static Contracts)
    needs: [static-contracts]
    if: ${{ !cancelled() && needs.static-contracts.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-build:
    name: Stop this red merge queue run (Build node artifacts)
    needs: [node-artifact-build]
    if: ${{ !cancelled() && needs.node-artifact-build.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-database:
    name: Stop this red merge queue run (Prepare integration database)
    needs: [service-integration]
    if: ${{ !cancelled() && needs.service-integration.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-browser:
    name: Stop this red merge queue run (Authenticated browser checks)
    needs: [browser-integration]
    if: ${{ !cancelled() && needs.browser-integration.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-bootstrap:
    name: Stop this red merge queue run (Deployment Bootstrap and Node Federation Proof)
    needs: [node-topology-proof]
    if: ${{ !cancelled() && needs.node-topology-proof.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  stop-red-queue-run-after-deferred-browser:
    name: Stop this red merge queue run (Deferred authenticated browser checks)
    needs: [browser-integration-after-static]
    if: ${{ !cancelled() && needs.browser-integration-after-static.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *stop-red-queue-run-permissions
    steps: *stop-red-queue-run-steps

  ci-plan:
    name: Select required checks from changed inputs
    needs: [queue-proof]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read finds the newest green push run of a branch without a merge queue.
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
      lintSweep: ${{ steps.changes.outputs.lintSweep }}
      lint: ${{ steps.selection.outputs.lint || steps.changes.outputs.lint }}
      expected: ${{ steps.selection.outputs.expected || steps.changes.outputs.expected }}
      source: ${{ steps.selection.outputs.source || steps.changes.outputs.source }}
      unit: ${{ steps.selection.outputs.unit || steps.changes.outputs.unit }}
      unitAfterLint: ${{ steps.selection.outputs.unitAfterLint || steps.changes.outputs.unitAfterLint }}
      unitAfterStatic: ${{ steps.selection.outputs.unitAfterStatic || steps.changes.outputs.unitAfterStatic }}
      unitAfterTooling: ${{ steps.selection.outputs.unitAfterTooling || steps.changes.outputs.unitAfterTooling }}
      integration: ${{ steps.selection.outputs.integration || steps.changes.outputs.integration }}
      integrationBrowser: ${{ steps.selection.outputs.integrationBrowser || steps.changes.outputs.integrationBrowser }}
      integrationBrowserAfterStatic: ${{ steps.selection.outputs.integrationBrowserAfterStatic || steps.changes.outputs.integrationBrowserAfterStatic }}
      integrationBuild: ${{ steps.selection.outputs.integrationBuild || steps.changes.outputs.integrationBuild }}
      integrationOwners: ${{ steps.selection.outputs.integrationOwners || steps.changes.outputs.integrationOwners }}
      integrationTopology: ${{ steps.selection.outputs.integrationTopology || steps.changes.outputs.integrationTopology }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # A pull request's merge commit has its base as first parent, so two commits compare it exactly. A merge
      # group rebases every queued commit onto its base, so only the whole history reaches that base; without
      # file contents that history stays small. An unreachable base would force the complete suite and a
      # whole-tree lint on every multi-commit pull request in the queue. A push the queue-proof job skipped (a
      # branch without a merge queue) compares with its newest green push, any number of commits back.
      - name: Checkout the exact comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'merge_group' && (github.event_name != 'push' || needs.queue-proof.result != 'skipped') && 2 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Classify the complete diff without app dependencies
        id: changes
        env:
          # A pull request compares with the first parent of its merge commit; the script reads it from Git.
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_PROVEN: ${{ needs.queue-proof.outputs.proven }}
          QUEUE_PROOF_RUN: ${{ needs.queue-proof.outputs.run }}
          # skipped on a push names a branch without a merge queue: the script looks up its newest green push.
          QUEUE_PROOF: ${{ needs.queue-proof.result }}
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force-ci-full }}
        run: bash app/scripts/plan-ci-changes.sh "$RUNNER_TEMP/ci-changed-paths"
      - name: Record the documentation or exact-commit no-op
        if: steps.changes.outputs.mode == 'docs' || steps.changes.outputs.mode == 'proven'
        env:
          REASON: ${{ steps.changes.outputs.reason }}
        run: printf '## CI selection\n\n%s\n\nNo app dependencies, builds or services are needed.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      # $RUNNER_TEMP is job-local and format-and-lint checks out at depth 1, so it can neither read this
      # path nor recompute the diff. Publishing the planner's exact NUL-delimited list is the only way that
      # gate can lint the run's changed files. The list is empty whenever the comparison is unavailable
      # (full, docs and proven modes), so an empty file is a valid result and must not fail the upload.
      # A re-run of this job replaces its own earlier upload instead of failing on the existing name.
      - name: Publish the exact changed-path list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-changed-paths
          if-no-files-found: warn
          overwrite: true
          retention-days: 1
      - name: Select the preinstalled Node runtime for dependency-free planning
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Resolve affected packages and required matrices
        id: selection
        if: steps.changes.outputs.mode != 'docs' && steps.changes.outputs.mode != 'proven'
        working-directory: app
        env:
          BOOTSTRAP_MODE: ${{ steps.changes.outputs.mode }}
          LINT_SWEEP: ${{ steps.changes.outputs.lintSweep }}
        run: |
          bash scripts/plan-ci-without-install.sh "$RUNNER_TEMP/ci-changed-paths"
      # A merge queue entry of exactly this tree on this base skips its gates on this run's verdict. The record
      # says what this run tested; the queue recomputes the tree from Git before it believes it.
      - name: Record the tree, base and plan this pull request run tests
        if: github.event_name == 'pull_request'
        env:
          PLAN_MODE: ${{ steps.selection.outputs.mode || steps.changes.outputs.mode }}
        run: bash app/scripts/ci/pull-request-proof.sh record "$RUNNER_TEMP/ci-comparison/comparison.json"
      - name: Publish the record for the merge queue
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-comparison
          path: ${{ runner.temp }}/ci-comparison/comparison.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # The default-branch producer of the caches the gates restore, where every pull request and merge
  # group can read them: the pnpm store, the installed node_modules, the TS-Go typecheck build,
  # the Playwright Chromium build, and the apt packages of Chromium's
  # system libraries. An Actions cache is readable from the current branch or the default branch only, so
  # a merge group run (gh-readonly-queue/main/*) can read nothing a pull request saved, and the gate jobs
  # never run on a proven push to main: this job publishes the shared caches. The planner reads
  # authored JSON without installing this workspace.
  # It is no gate and gates nothing; a later run without its caches only installs and builds from scratch.
  # The toolchain and apt package keys name the runner image, so every gate job that restores these caches
  # runs on this job's image through the gate-image anchor: pinned apart, the warmer ran on Ubuntu 24.04
  # while ubuntu-latest moved the gates to 26.04, and every run missed both entries.
  warm-caches:
    name: Warm the gate caches on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: &gate-image ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'
          save-store: 'true'
          save-node-modules: 'true'

      - name: Typecheck the workspace incrementally
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: Save the TS-Go typecheck build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules/.cache/tsgo
          key: ${{ steps.install.outputs.typescript-build-key }}

      - name: Restore the Playwright Chromium build
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      - name: Download the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app exec playwright install chromium

      - name: Save the Playwright Chromium build
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check for the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          lookup-only: true

      - name: Download the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          mise exec -- pnpm --filter @app/shell-super-app exec playwright install-deps chromium
          mkdir -p ~/.cache/playwright-apt-debs
          # The marker keeps the cache saveable on an image that already has every library.
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;
          echo "Cached $(find ~/.cache/playwright-apt-debs -name '*.deb' | wc -l) packages."

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

  # Source checks start immediately after planning; they do not wait for Node artifacts. The repository
  # tooling tests keep all four cores of their runner for about six minutes, so the workspace compiler pass
  # runs beside the changed-file lint, and the source and deployment contracts take their own runner:
  # sharing one, they starve each other of CPU and take twice as long.
  workspace-gate:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env:
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.source) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          save-node-modules: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: &run-gate-commands |
          failed=()
          while IFS= read -r command; do
            [[ -n "$command" ]] || continue
            echo "::group::$command"
            started=$SECONDS
            if ! mise exec -- bash -c "$command"; then
              failed+=("$command")
            fi
            printf 'Command wall time: %ss — %s\n' "$((SECONDS - started))" "$command"
            echo '::endgroup::'
          done <<<"$COMMANDS"
          for command in "${failed[@]}"; do
            echo "::error title=Gate command failed::$command"
          done
          [[ ${#failed[@]} -eq 0 ]]

  # Part of the workspace-gate check, on its own runner so that its slot frees within minutes for a unit
  # row; the compiler pass and the repository tooling tests hold theirs to the end of the run.
  workspace-source-contracts:
    name: Source, Generation, and Deployment Contracts
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-gate'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env:
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      - name: Run the source, generation, and deployment contracts
        working-directory: app
        env:
          COMMANDS: |
            node scripts/generate-outbox-worker-deployment.mjs
            pnpm module-entrypoints:check
            node scripts/plan-deployment-impact.mts --outbox-worker-mode host
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: *run-gate-commands

  # Unit rows read the build shards' uploads, so they need the build shards: GitHub starts a row only once
  # every shard uploaded, and no row holds a runner while a shard still builds. Each row also takes the slot
  # of a check that frees alongside the owner rows and the bootstrap: the source
  # contracts, the changed-file lint, the static contracts and the repository tooling tests. A whole-tree
  # lint frees two slots, so both deferred unit rows follow it and browser checks follow static contracts.
  # A row reads the build shards only when it asks for Node artifacts, so the shards must have reached what
  # the plan expected of them: a planned skip lets the row run, a failed or cancelled shard never does.
  workspace-unit:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, workspace-source-contracts]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] && needs.workspace-source-contracts.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env: &unit-check-environment
      RAYON_NUM_THREADS: '1'
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unit) }}
    steps: &unit-check-steps
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      # Reuses the lockfile check of the first build shard (install-app lockfile-verdict); only a job that needs
      # the build job reads it, and a job without that need, or whose build job did not succeed, checks freshly.
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ needs.node-artifact-build.result == 'success' && 'reuse' || '' }}

      - name: Download the same-run Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-units-*
          path: ${{ runner.temp }}/native-composition-units

      - name: Unpack the Node artifacts for unit contract fixtures
        if: matrix.node-artifacts == true
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Run ${{ matrix.name }}
        working-directory: app
        env:
          COMMANDS: ${{ matrix.commands }}
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: *run-gate-commands

  workspace-unit-after-lint:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, format-and-lint]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] && needs.format-and-lint.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' && needs.ci-plan.outputs.unitAfterLint != '[]' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env: *unit-check-environment
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unitAfterLint) }}
    steps: *unit-check-steps

  workspace-unit-after-static:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, static-contracts]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] && needs.static-contracts.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' && needs.ci-plan.outputs.unitAfterStatic != '[]' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env: *unit-check-environment
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unitAfterStatic) }}
    steps: *unit-check-steps

  workspace-unit-after-tooling:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, workspace-gate]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] && needs.workspace-gate.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['workspace-unit'] == 'success' && needs.ci-plan.outputs.unitAfterTooling != '[]' }}
    runs-on: *gate-image
    timeout-minutes: 30
    env: *unit-check-environment
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.unitAfterTooling) }}
    steps: *unit-check-steps

  # Independent source analyzers share this runner rather than delaying the third unit runner.
  # Module generation must finish before the i18n scanner walks generated directories.
  static-contracts:
    name: Static Contracts (${{ matrix.row }})
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['static-contracts'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        row: [contracts]
    env:
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
      MODERN_PUBLIC_SITE_URL: http://localhost:8080
      ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep package manifests, lockfiles, and hook configs out of the repository root
        if: matrix.row == 'contracts'
        run: |
          stray="$(
            git ls-files -- ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
              ':(glob)**/pnpm-lock.yaml' ':(glob)**/pnpm-workspace.yaml' ':(glob)**/yarn.lock' ':(glob)**/bun.lock*' \
              ':(exclude)app/**'
            git ls-files -- ':(glob)**/lefthook.yml' ':(glob)**/lefthook.yaml' ':(glob)**/.lefthook.yml' \
              ':(glob)**/.lefthook.yaml' ':(exclude,top)lefthook.yml'
          )"
          if [[ -n "$stray" ]]; then
            echo "::error::The app workspace lives in app/ and its git hooks in the root lefthook.yml. Move or delete:"
            echo "$stray"
            exit 1
          fi

      - name: Install the app workspace
        id: install
        uses: ./.github/actions/install-app

      # zerops.yaml still defines a cloudflared service, so this verifies live stage infrastructure.
      - name: Verify the pinned Cloudflare Tunnel binary
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
        working-directory: app
        timeout-minutes: 5
        run: |
          commands="$(mise exec -- node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse } from "yaml";
            const service = parse(readFileSync("zerops.yaml", "utf8")).zerops.find(({ setup }) => setup === "cloudflared");
            if (!Array.isArray(service?.build?.buildCommands) || service.build.buildCommands.length === 0) {
              throw new Error("Cloudflare Tunnel build commands are missing");
            }
            process.stdout.write(service.build.buildCommands.join("\n"));
          ')"
          scratch="$(mktemp -d "$RUNNER_TEMP/ontos-cloudflared.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          (
            cd "$scratch"
            bash -euo pipefail -c "$commands"
            app/.zerops/runtime/cloudflared/cloudflared --version
          )

      # Share one install across independent checks and retain a log for each check.
      # The API analyzer and database boundary scanner each use one native process.
      - parallel:
          - name: Validate the root lefthook config
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            run: app/node_modules/.bin/lefthook validate

          - name: Skills
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm skills:check

          - name: Database Access Boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm database-access:check

          - name: Lean Core Dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm lean-core:check

          - name: Workspace Contract
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm contract:check

          - name: Module Contract Generation
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            # Generation removes transient bundles; finish it before the API scanner walks source.
            run: |
              mise exec -- pnpm check:module-contracts
              NODE_OPTIONS=--max-old-space-size=6144 mise exec -- pnpm api:check

          - name: Action Unit Tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
            working-directory: app
            run: mise exec -- pnpm action:test:unit

      # Module contract generation creates and deletes bundles inside verticals.
      # Wait for it before the i18n scanner walks those source directories: it shares this row with the
      # group above for exactly that reason, and the scanner costs seconds.
      - name: I18n Boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.row == 'contracts' }}
        working-directory: app
        run: mise exec -- pnpm i18n:boundaries
  # The pre-commit hook is the format and lint gate, run from the git root exactly as a commit runs it.
  # It can only prove that already-committed files are formatted and linted, and the same lefthook hook
  # proves that at commit time, so it runs over the run's changed files instead of the whole tree. The one
  # real failure a changed-file sweep would miss is a changed formatter, linter or hook configuration,
  # which reformats files nobody touched: ci-plan then selects a sweep of every tracked file, as it does
  # for the nightly cron and any run whose exact diff is unavailable. ci-plan publishes the list;
  # $RUNNER_TEMP is job-local and this job checks out at depth 1, so it can neither read that path nor
  # recompute the diff.
  format-and-lint:
    name: Format, Lint, and Repository Tooling (${{ matrix.row }}/${{ matrix.rows }})
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['format-and-lint'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.lint) }}
    env:
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A missing artifact fails this step, which is the point: without the list this gate proves nothing.
      - name: Download the exact changed-path list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-plan

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          restore-typescript-build: 'true'

      # The one workspace compiler pass of the run. The tooling tests hold all four cores of their runner;
      # beside a changed-file lint this pass costs the run nothing.
      - name: Typecheck the workspace
        if: matrix.row == 1
        id: typecheck
        background: true
        working-directory: app
        env:
          # Leave room for the runner and Effect diagnostics while checking the complete workspace.
          GOMEMLIMIT: 4GiB
          ULTRAMODERN_TSGO_BUILDERS: '1'
        run: mise exec -- pnpm typecheck

      - name: Check OntOS APIs and generator behavior
        if: matrix.row == 1
        id: generator-checks
        background: true
        working-directory: app
        run: |
          mise exec -- pnpm api:check:ontos
          mise exec -- pnpm test:generation

      - name: Check lint rules and shared contract types
        if: matrix.row == 1
        id: lint-rule-checks
        background: true
        working-directory: app
        run: |
          mise exec -- pnpm typecheck:lint-rules
          mise exec -- pnpm test:lint-rules
          mise exec -- pnpm lint:repository-policy
          mise exec -- pnpm --filter ./packages/shared-contracts test:types

      - name: Format and Lint the run's changed files through the pre-commit hook
        env:
          LINT_SWEEP: ${{ needs.ci-plan.outputs.lintSweep }}
          LINT_ROW: ${{ matrix.row }}
          LINT_ROWS: ${{ matrix.rows }}
        run: |
          changed="$RUNNER_TEMP/ci-plan/ci-changed-paths"
          files="$RUNNER_TEMP/hook-files"
          # A changed path is a literal file name, never a pathspec pattern.
          export GIT_LITERAL_PATHSPECS=1
          if [[ ! -f "$changed" ]]; then
            echo "::error title=No changed-path list::ci-plan published no changed-path list, so this gate cannot prove anything."
            exit 1
          fi
          case "$LINT_SWEEP" in
            all)
              echo 'ci-plan selected a sweep of every tracked file.'
              git ls-files -z >"$files"
              # Git's sorted, NUL-delimited list is identical on every row. Adjacent boundaries partition
              # it exactly, including odd counts and file names containing whitespace or glob characters.
              tracked=()
              while IFS= read -r -d '' file; do
                tracked+=("$file")
              done <"$files"
              start=$(( ${#tracked[@]} * (LINT_ROW - 1) / LINT_ROWS ))
              end=$(( ${#tracked[@]} * LINT_ROW / LINT_ROWS ))
              : >"$files"
              if (( end > start )); then
                printf '%s\0' "${tracked[@]:start:end-start}" >"$files"
              fi
              ;;
            changed)
              if [[ ! -s "$changed" ]]; then
                echo "::error title=Empty changed-path list::ci-plan selected a changed-file lint with an empty list, so it would prove nothing."
                exit 1
              fi
              # A path the diff deleted, or that this commit does not track, has nothing to check.
              xargs -0 git ls-files -z -- <"$changed" >"$files"
              ;;
            *)
              echo "::error title=Unknown lint sweep::ci-plan selected '$LINT_SWEEP'."
              exit 1
              ;;
          esac
          # A sweep runs through the hook too: lefthook cuts the list into command lines of contiguous files, so no
          # linter process holds every type program at once. One `pnpm lint` over every file did, beside the
          # workspace typecheck, and lost its 16 GB runner.
          mise exec --cd app -- sh -c 'cd .. && app/node_modules/.bin/lefthook run pre-commit --files-from-stdin --no-auto-install' \
            <"$files"
          # Effect's tsgolint emits no Effect language-service diagnostics.
          if [[ "$LINT_ROW" == 1 ]]; then
            mise exec --cd app -- pnpm lint:effect-diagnostics
          fi
          git diff --exit-code HEAD

      # GitHub rejects a workflow whose wait step carries a condition. On row 2 the three background steps
      # are skipped, and waiting for a skipped step returns at once.
      - name: Wait for lint rule checks
        wait: lint-rule-checks

      - name: Wait for API and generator checks
        wait: generator-checks

      - name: Wait for the workspace typecheck
        wait: typecheck

  # No job of this workflow holds a runner while it waits for another job of the same run. A job that reads
  # another job's artifact names that job in `needs`, so GitHub starts it only once the artifact exists:
  # with 20 hosted runners for the whole organisation, jobs that took a runner and then polled for builds
  # that had no runner filled every runner and deadlocked each other until the 30-minute limit.
  # Producers start with the run and only produce: 6 build shards and the database producer. First-wave
  # budget: 6 build shards + database producer + browser checks + lint + tooling tests + source contracts
  # + static contracts = 12 gate jobs, leaving five slots below the 17-gate-job budget.
  # A whole-tree sweep replaces the browser's first-wave slot with a second lint row. Browser checks then
  # take the static-contracts slot, and both deferred unit rows take the two lint slots.
  # The 10 owner rows and this bootstrap use the seven producers' slots plus four of those spare slots;
  # each unit row takes the slot of the check it follows. Peak: 11 consumers + five independent checks or
  # their successors = 16 gate jobs, 17 including the pull request's Quality Audit. The bootstrap and the
  # owner rows always read their producers' artifacts, so every producer they need must have succeeded.
  node-topology-proof:
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: read
    needs: [ci-plan, node-artifact-build]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationTopology) }}
    env: &integration-environment # Cache compiled code only; every fixture still starts fresh owners and databases.
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
      RAYON_NUM_THREADS: '1'
      BETTER_AUTH_SECRET: ontos-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      BETTER_AUTH_URL: http://localhost:3020
      DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
      DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
      ONTOS_GATEWAY_ISSUER: http://localhost:3020
      ONTOS_GATEWAY_PRIVATE_JWK: '{"crv":"Ed25519","d":"UoaeSCRqtNBHKhIQ-gzuhaTWwch5wyr5JUp0NOV_zR0","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}'
      ONTOS_GATEWAY_PUBLIC_JWKS: '{"keys":[{"crv":"Ed25519","x":"QnsRCV4QqDIWrlIw_7gfUmHsm_VYzkOzxkaaQllPXqg","kty":"OKP","alg":"EdDSA","use":"sig","kid":"ontos-ci"}]}'
      ONTOS_RUNTIME_DB_PASSWORD: ontos_runtime
      # One login per runtime database identity, each with its own development-only password.
      PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:party_registry_runtime@localhost:5433/ontos_ci
      PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:party_registry_worker@localhost:5433/ontos_ci
      POSTGRES_DB: ontos_ci
      POSTGRES_PASSWORD: ontos_ci_admin
      POSTGRES_PORT: '5433'
      POSTGRES_USER: ontos_ci_admin
      SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:shell_gateway_issuer@localhost:5433/ontos_ci
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_GRPC_PORT: '50051'
      SPICEDB_HTTP_PORT: '8443'
      SPICEDB_PRESHARED_KEY: ontos-ci-spicedb-key
    steps: &integration-steps
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A slow cluster start, restore or test is read against measured CPU, iowait, steal and write-back of
      # this runner; the runner ends the sampler with the job and the samples print after the tests.
      - name: Sample runner pressure until the job ends
        working-directory: app
        run: &sample-runner-pressure nohup bash scripts/ci/sample-runner-pressure.sh "$RUNNER_TEMP/runner-pressure.txt" >/dev/null 2>&1 &

      # Both producers have finished through needs. Hosted Node, gh, tar and zstd need no workspace
      # install; unpack writes unit build outputs, while install-app restores only node_modules.
      # Only the owner rows unpack here. The bootstrap row proves its migrator and Outbox Worker host
      # from source alone, so its workspace receives the built outputs after those proofs, below.
      - name: Download and unpack the same-run Node artifacts for native owner fixtures
        id: native-artifacts
        if: matrix.suite == 'bootstrap' || matrix.suite == 'integration'
        background: true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'node-units-*' --dir "$RUNNER_TEMP/native-composition-units"
          if [ "$SUITE" = integration ]; then bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output; fi

      - name: Pull integration service images
        id: integration-images
        background: true
        working-directory: app
        run: docker compose pull

      # Reuses the lockfile check of the first build shard (install-app lockfile-verdict); only a job that needs
      # the build job reads it, and a job without that need, or whose build job did not succeed, checks freshly.
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ needs.node-artifact-build.result == 'success' && 'reuse' || '' }}

      # The Chromium build is pinned by the Playwright version in the lockfile; its system libraries are not cached.
      # Only warm-caches on main saves it, so parallel jobs never race to save.
      - name: Restore the Playwright Chromium build
        id: playwright-cache
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

      # Chromium's system libraries come from apt, whose mirror can serve them at 100 kB/s; their downloaded
      # packages are cached per runner image. apt reuses a cached package only when it matches the index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        if: matrix.suite == 'browser'
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('app/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        if: matrix.suite == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}
          restore-keys: playwright-apt-debs-

      # The system-library install goes through apt and can take minutes on a slow mirror, so it runs in the
      # background while the services start and the migrations run; the browser tests wait for it below.
      - name: Install Chromium and its runtime dependencies
        id: chromium-install
        background: true
        if: matrix.suite == 'browser'
        timeout-minutes: 10
        working-directory: app
        env:
          CHROMIUM_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi
          if [ "$CHROMIUM_CACHED" = true ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi
          mise exec -- pnpm --filter @app/shell-super-app exec playwright "$@"

      - name: Create the local SpiceDB TLS certificate
        working-directory: app
        # SpiceDB serves TLS only; every client pins this certificate as SPICEDB_CA_CERT.
        run: |
          mise exec -- pnpm spicedb:tls:local
          {
            echo 'SPICEDB_CA_CERT<<SPICEDB_CA_CERT_EOF'
            cat .spicedb-tls/cert.pem
            echo 'SPICEDB_CA_CERT_EOF'
          } >> "$GITHUB_ENV"

      # TLS generation uses installed Effect packages; image pulls and artifact unpacking do not.
      # Native wait steps fail with the background step's exit code and retain its log.
      - name: Wait for integration service images
        wait: integration-images

      # An owner row starts its empty worker clusters first; only the restore below reads this run's archive.
      - name: Start each integration worker's own empty PostgreSQL cluster and SpiceDB datastore
        if: matrix.suite == 'integration'
        working-directory: app
        env:
          ONTOS_CI_ISOLATED_WORKERS: '2'
        run: bash scripts/ci/start-integration-workers.sh

      # The owner rows need the database producer, so this run's archive exists when they start. The restore
      # downloads it and loads it into every worker cluster while the Node artifacts transfer and
      # unpack; the tests wait for both.
      - name: Restore this run's migrated database into every worker cluster
        id: integration-workers
        if: matrix.suite == 'integration'
        background: true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ONTOS_CI_ISOLATED_WORKERS: '2'
          INTEGRATION_DATABASE_ARCHIVE: ${{ runner.temp }}/integration-database
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name integration-database --dir "$INTEGRATION_DATABASE_ARCHIVE"
          bash scripts/ci/restore-integration-workers.sh

      - name: Start fresh PostgreSQL and SpiceDB services
        if: matrix.suite == 'bootstrap' || matrix.suite == 'browser' || matrix.suite == 'database'
        working-directory: app
        run: |
          # Disposable CI pages do not need the hosted runner's slow persistent disk.
          # Keep the native WAL, fsync and synchronous-commit behavior intact.
          cat > "$RUNNER_TEMP/integration-compose.yml" <<'YAML'
          services:
            ontos-db:
              volumes:
                - type: tmpfs
                  target: /var/lib/postgresql
                  tmpfs:
                    size: 2147483648
          YAML
          export COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/integration-compose.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait --wait-timeout 120
          docker inspect ontos-db --format '{{json .Mounts}}' |
            jq -e 'any(.[]; .Destination == "/var/lib/postgresql" and .Type == "tmpfs")'
          durability="$(docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align \
            --command "SELECT current_setting('fsync') || ':' || current_setting('synchronous_commit') || ':' || current_setting('full_page_writes')")"
          [[ "$durability" == on:on:on ]]

      # Only the bootstrap row removes the pre-seeded runtime role: it is what makes the migrator prove
      # deployment bootstrap ordering against a scratch cluster. A row that dropped it and then restored
      # nothing would have no runtime login for its own suites.
      - name: Remove the pre-seeded runtime role to prove deployment bootstrap ordering
        if: matrix.suite == 'bootstrap'
        working-directory: app
        run: |
          docker compose exec --no-TTY ontos-db psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
          DROP OWNED BY ontos_runtime;
          DROP ROLE ontos_runtime;
          SQL

      - name: Run the assembled stage migrator artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        # Stage-shaped: the migrator ships only its zerops.yaml deployFiles, runs its real start entry
        # point, bootstraps SpiceDB's database, and opts into the Commerce portal realm with its own
        # provider runtime role that nothing pre-creates — exactly what the stage migrator receives.
        env:
          # Closed dotenv discovery: no workspace .env file may leak into the cluster this proves.
          APP_ENV_PATH: /dev/null
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://commerce_auth_runtime:commerce_auth_runtime@localhost:5433/ontos_ci
          MIGRATOR_PORT: '8080'
          NODE_ENV: production
          SPICEDB_DATABASE_PASSWORD: spicedb
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
          ULTRAMODERN_ZEROPS_SERVICE: migrator
        run: mise exec -- sh scripts/prove-zerops-migrator-artifact.sh "$RUNNER_TEMP/zerops-migrator-artifact"

      # Bootstrap already migrated and verified every owner through its assembled stage entry point. The
      # database producer migrates once for every owner row, whose isolated workers restore its archive; the
      # browser checks migrate their own database and need nobody.
      - name: Apply and verify Core, Auth, and Contacts migrations, plus Party Registry
        if: matrix.suite == 'browser' || matrix.suite == 'database'
        working-directory: app
        # The Commerce portal authentication realm is optional and owns its own Drizzle
        # configuration, migration journal and runtime role. Naming its database pair here is what
        # opts this workspace in, so `db:migrate` applies the `commerce_auth` migrations, grants the
        # provider runtime role and verifies the realm — the schema the portal-auth provider
        # integration tests read. Development-only values, exactly as the primary database above.
        # The pair stays scoped to this step: a realm is opted into completely or not at all, and no
        # later step should see a half-named one.
        env:
          COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://ontos_ci_admin:ontos_ci_admin@localhost:5433/ontos_ci
          COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:ontos_runtime@localhost:5433/ontos_ci
        run: |
          mise exec -- pnpm db:migrate
          mise exec -- pnpm db:verify

      # Every runtime login role must hold exactly the grants the checked-in manifest assigns it. The
      # migrations directly above provision the identities this audits, and it reads no matrix input, so
      # one row covers the run.
      - name: Audit runtime database identities against the checked-in grant manifest
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: mise exec -- pnpm database-trust:audit

      - name: Export the migrated integration database
        if: matrix.suite == 'database'
        working-directory: app
        run: bash scripts/ci/export-integration-database.sh

      # The database producer ends with this upload; a re-run of it replaces its own archive.
      - name: Upload the migrated integration database
        if: matrix.suite == 'database'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-database
          path: ${{ runner.temp }}/integration-database
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # Stage-shaped: the host is materialized by its zerops.yaml build command, ships only its
      # deployFiles, polls every hosted owner's outbox against the freshly migrated database until
      # /ready, then drains on SIGTERM.
      - name: Build and run the Outbox Worker host artifact against the fresh database
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
        run: mise exec -- sh scripts/prove-outbox-worker-host-artifact.sh "$RUNNER_TEMP/outbox-worker-host-artifact"

      # Every backend row consumes these exact outputs; a missing archive or incomplete topology
      # fails this join, not a later test. The download and unpack log stays with native-artifacts.
      - name: Wait for the same-run Node artifacts for native owner fixtures
        wait: native-artifacts

      # The source-only bootstrap proofs above ran in a workspace without built outputs. Federation is
      # proved next and reads them.
      - name: Unpack the Node artifacts after the bootstrap's source-only proofs
        if: matrix.suite == 'bootstrap'
        working-directory: app
        run: bash scripts/unpack-unit-build-outputs.sh "$RUNNER_TEMP/native-composition-units" .output

      - name: Wait for the restored worker clusters
        wait: integration-workers

      - name: Derive the fresh built Composition for native owner fixtures
        if: matrix.native-composition == true
        working-directory: app
        env:
          APP_ENV_PATH: /dev/null
        run: |
          mise exec -- pnpm active-composition:publish prove-build --snapshot-output "$RUNNER_TEMP/native-composition-snapshot.json"
          echo "NATIVE_1290_COMPOSITION_SNAPSHOT_PATH=$RUNNER_TEMP/native-composition-snapshot.json" >> "$GITHUB_ENV"
      # The whole-topology Node artifact proof. It needs every build shard's outputs, so it used to run
      # inside the last build shard, which made the complete integration wave wait for it: shard 1 ended
      # at 6.0 min and the proving shard at 11.6. As a row of this matrix it starts with the wave instead,
      # on the PostgreSQL this job already starts and migrates, and it still blocks the required check
      # through this job's single gate id.
      - name: Generate federated types and check performance readiness over every unit
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-contracts/tsconfig.json
          mise exec -- pnpm exec ultramodern-create ultramodern typecheck --build packages/shared-design-tokens/tsconfig.json
          mise exec -- pnpm mf:types
          mise exec -- pnpm performance:readiness

      - name: Prove Node backend-federation artifacts
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm node:proof

      # The deployed publisher derives the snapshot from exactly these artifact kinds; this proves its
      # output decodes with the consumers' ActiveApplicationCompositionSnapshotSchema before stage
      # depends on it.
      - name: Prove the active Application Composition publisher output decodes
        if: matrix.suite == 'bootstrap'
        working-directory: app
        env:
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- pnpm active-composition:publish prove-build

      - name: Run database, RLS, Action, authorization, identity, Outbox, module-state, Shell, and Contacts integration tests, including Party Registry
        if: matrix.suite == 'integration'
        working-directory: app
        # The job environment above is the whole configuration. Native fixtures refuse to start unless
        # dotenv discovery is closed, so no workspace .env file can leak into an owned test database.
        env:
          APP_ENV_PATH: /dev/null
          SPICEDB_DATABASE_PASSWORD: spicedb
          INTEGRATION_TASKS: ${{ toJSON(matrix.tasks) }}
          ONTOS_CI_ISOLATED_WORKERS: '2'
          INTEGRATION_LANES: ${{ matrix.lanes }}
        # Same commands as `pnpm test:integration`, with separate Rstest shards for the root and large packages.
        run: bash scripts/ci/run-integration-suites.sh

      # `wait` always runs, including on non-browser shards where the install was skipped.
      - name: Wait for the Chromium install
        wait: chromium-install

      - name: Run parallel authenticated browser tests without retries
        if: matrix.suite == 'browser'
        working-directory: app
        run: mise exec -- pnpm --filter @app/shell-super-app test:e2e

      - name: Verify browser recovery into a newly published release
        if: matrix.suite == 'browser'
        working-directory: app
        env:
          ONTOS_E2E_RETAINED_PARTY_R2: 'true'
        run: >-
          mise exec -- pnpm --filter @app/shell-super-app exec playwright test
          tests/e2e/login.spec.ts --grep 'reloads failed Contacts into a genuinely published R2'
          --workers 1

      # Diagnostics are named per attempt: a re-run that fails again keeps both failures' evidence, and an
      # upload under a name the run already holds would fail instead of keeping either.
      - name: Upload browser failure diagnostics
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-browser-failure-diagnostics-${{ github.run_attempt }}
          path: |
            app/apps/shell-super-app/test-results/**/trace.zip
            app/apps/shell-super-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

      # The company ICO conformance proof writes each native owner's own output here when it fails; without it
      # a 503 from an owner cannot be traced to the owner's cause. Four jobs share these steps and each
      # numbers its rows from 0, so the name carries the job, the row and the attempt.
      - name: Upload closed native startup and owner HTTP diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-startup-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            app/verticals/commerce-market-catalog/.cache/ontos-1250/startup-diagnostic-*.json
            /tmp/commerce-org-http-*.diag.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Show bounded service diagnostics after failure
        if: failure()
        working-directory: app
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200
          # SpiceDB writes thousands of info lines a second, so the tail above covered 13 ms of a failed
          # browser run and nothing from the second of the failure. Keep its warnings and errors of the whole job.
          docker compose logs --no-color --timestamps ontos-spicedb | awk '!/"level":"info"/' | tail --lines 400

      - name: Print the runner pressure samples
        if: always()
        run: &print-runner-pressure |
          if [[ -s "$RUNNER_TEMP/runner-pressure.txt" ]]; then
            cat "$RUNNER_TEMP/runner-pressure.txt"
          fi

      - name: Remove isolated service containers and volumes
        if: always()
        working-directory: app
        run: |
          workers="$(docker ps --all --quiet --filter label=ontos-ci-worker)"
          if [[ -n "$workers" ]]; then
            docker rm --force --volumes $workers
          fi
          docker compose down --volumes --remove-orphans

  # The database producer and the gate job of the integration check: it runs whenever integration work is
  # selected, so it never expands an empty matrix. It migrates, verifies, exports and uploads this run's
  # database, and ends; the owner rows need it.
  service-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integration) }}
    env: *integration-environment
    steps: *integration-steps

  # The authenticated browser checks migrate their own database and need no other job, so they start with
  # the run. An affected plan that leaves the Shell alone selects none.
  browser-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' && needs.ci-plan.outputs.integrationBrowser != '[]' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationBrowser) }}
    env: *integration-environment
    steps: *integration-steps

  # A whole-tree lint uses the browser's first-wave slot; no runner is allocated until static contracts end.
  browser-integration-after-static:
    name: ${{ matrix.name }}
    needs: [ci-plan, static-contracts]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.static-contracts.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['service-integration'] == 'success' && needs.ci-plan.outputs.integrationBrowserAfterStatic != '[]' }}
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationBrowserAfterStatic) }}
    env: *integration-environment
    steps: *integration-steps

  # Owner rows restore this run's database archive and Node artifacts, so they need both producers and
  # start only once every build shard and the database producer uploaded. `gh run download` reads the
  # archive of this run by its id, which needs `actions: read`.
  owner-integration:
    name: ${{ matrix.name }}
    needs: [ci-plan, node-artifact-build, service-integration]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && needs.node-artifact-build.result == 'success' && needs.service-integration.result == 'success' && needs.ci-plan.outputs.integrationOwners != '[]' }}
    permissions:
      actions: read
      contents: read
    runs-on: *gate-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationOwners) }}
    env: *integration-environment
    steps: *integration-steps

  # Release identities and compiler outputs are built from this exact commit, on every run. A build shard
  # only builds, packs and uploads its units, so it never waits for anything; every consumer needs this job.
  # Every consumer reads all shards, so the slowest shard sets when the consumers start. Consolidating the
  # measured pairs from run 44429728152 keeps two concurrent builds per runner and avoids five setups.
  # Sum of the old pairs' build seconds per new shard: 95, 100, 104, 105, 102, with catalog alone at 53.
  # These are scheduling estimates, not new timings: CI must measure the four-unit shards on real runners.
  node-artifact-build:
    name: ${{ matrix.name }}
    needs: [ci-plan]
    if: ${{ !cancelled() && needs.ci-plan.result == 'success' && fromJSON(needs.ci-plan.outputs.expected)['node-artifact-build'] == 'success' }}
    runs-on: *gate-image
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.integrationBuild) }}
    env:
      NODE_COMPILE_CACHE: /tmp/ontos-node-compile-cache
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A slow build is read against measured CPU, iowait, steal and write-back of this runner.
      - name: Sample runner pressure until the job ends
        working-directory: app
        run: *sample-runner-pressure

      # The first shard publishes its lockfile check to the jobs that need this one (install-app lockfile-verdict).
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          lockfile-verdict: ${{ strategy.job-index == 0 && 'publish' || '' }}

      # A shard build took 55 s median and 90 s at most on healthy hosts, 187 s on one degraded host, so a
      # build past 10 minutes fails the shard instead of holding back every consumer of the run.
      - name: Build the shard's Node artifacts
        timeout-minutes: 10
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
          NODE_OPTIONS: --max-old-space-size=2048
          ONTOS_CI_TYPECHECK_SEPARATE: '1'
          MODERN_PUBLIC_SITE_URL: http://localhost:8080
          ULTRAMODERN_SOURCE_REVISION: ${{ github.sha }}
          # Separates tracing, package assembly and copying in the timestamped CI log.
          DEBUG: nde
        run: |
          read -ra units <<<"$SHARD_UNITS"
          filters=()
          for unit in "${units[@]}"; do
            filters+=(--filter "./$unit")
          done
          mise exec -- pnpm -r --no-sort --workspace-concurrency=2 "${filters[@]}" run build

      # Everything the build wrote inside the shard's units is ignored by git; node_modules is the install.
      - name: Pack the shard's build outputs
        working-directory: app
        env:
          SHARD_UNITS: ${{ matrix.units }}
        run: |
          read -ra units <<<"$SHARD_UNITS"
          git ls-files --others --ignored --exclude-standard --directory -z -- "${units[@]}" \
            | grep -zv '/node_modules/$' \
            | tar --null --files-from=- --create --zstd --file "$RUNNER_TEMP/units.tar.zst"

      # A re-run of a failed shard replaces its own archive instead of failing on the existing name.
      - name: Upload the shard's build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Print the runner pressure samples
        if: always()
        run: *print-runner-pressure

  # Keep one required check. Selected jobs must succeed and every skipped job must be explicitly planned.
  workspace-gates:
    name: Workspace gates
    if: ${{ always() }}
    needs:
      [
        queue-proof,
        ci-plan,
        workspace-gate,
        workspace-source-contracts,
        workspace-unit,
        workspace-unit-after-lint,
        workspace-unit-after-static,
        workspace-unit-after-tooling,
        static-contracts,
        format-and-lint,
        service-integration,
        browser-integration,
        browser-integration-after-static,
        owner-integration,
        node-artifact-build,
        node-topology-proof,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected gates and reject unplanned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash app/scripts/check-ci-gates.sh
