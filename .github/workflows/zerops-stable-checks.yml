name: Zerops Stable Checks

# Tests of the sales-stable release tooling (ops/zerops-stable). Node tests only: no build, no secrets, no Zerops
# access. Dispatchable on its own; zerops-stable.yml never waits for it and it never waits for that workflow.
on:
  push:
    branches:
      - demo/sales-crm
    paths:
      - ops/zerops-stable/**
      - .github/workflows/zerops-stable.yml
      - .github/workflows/zerops-stable-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerops-stable-checks
  cancel-in-progress: true

jobs:
  test:
    name: Test the sales-stable tooling
    if: github.ref == 'refs/heads/demo/sales-crm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.13.1'

      - name: Install the deployment tools
        run: npm ci --prefix ops/zerops-stable --ignore-scripts --no-audit --no-fund

      - name: Run the sales-stable tests
        run: node --test 'ops/zerops-stable/*.test.mjs'
