name: Zerops Stage Deploy

# Deploys the sales demo branch to stage, which runs only on Zerops: one `app` service (the Shell, every owner and
# the Outbox Worker host in one container, see app/scripts/zerops/app-host.mts) and two storefront services built from the
# same `storefront` setup: `storefront` (AKROS, ontos-stage-akros) and `shop` (the pseudonymous demo e-shop,
# ontos-stage-shop). The N1 e-shop (`n1`, ontos-stage-n1) is its own Next storefront with its own setup and service.
# Each storefront service holds its own key, tenant and brand in its service variables
# (ONTOS_AKROS_STOREFRONT_API_KEY, STOREFRONT_BRAND, ONTOS_STOREFRONT_APP_ID, ONTOS_STOREFRONT_LEGAL_ENTITY_ID).
# Zerops builds the app from app/zerops.yaml; the storefronts arrive built from the runner (build_storefronts). The app
# container runs the owner migrations and publishes the Application Composition itself when it starts, and Zerops
# switches traffic only after /_host/ready answers.
# Cloudflare stays in front of stage only as DNS, WAF and Access.
on:
  push:
    branches:
      - demo/sales-crm
    paths-ignore:
      - 'docs/**'
      - 'app/docs/**'
      - '**/README.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/CONTRIBUTING.md'
      - '**/SECURITY.md'
      - '**/CHANGELOG.md'
      - '**/LICENSE.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: zerops-stage
  cancel-in-progress: false

env:
  STAGE_SHELL_URL: https://ontos-stage.web-revolution.cz
  STAGE_STOREFRONT_URL: https://ontos-stage-akros.web-revolution.cz
  STAGE_SHOP_URL: https://ontos-stage-shop.web-revolution.cz
  STAGE_N1_URL: https://ontos-stage-n1.web-revolution.cz

jobs:
  plan:
    name: Plan selective delivery
    if: github.ref == 'refs/heads/demo/sales-crm'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      storefront: ${{ steps.plan.outputs.storefront }}
      shop: ${{ steps.plan.outputs.shop }}
      n1: ${{ steps.plan.outputs.n1 }}
      any: ${{ steps.plan.outputs.any }}
      full: ${{ steps.plan.outputs.full }}
      receipt: ${{ steps.plan.outputs.receipt }}
    steps:
      - name: Checkout the complete release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      # A verified ledger is a cache hint, never proof by itself. Match it to the immediately preceding
      # successful workflow attempt; a failed/missing run, cache eviction or API failure forces all services.
      - name: Restore the last verified service source pins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-delivery/last-success
          key: zerops-stage-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zerops-stage-delivery-v1-

      - name: Read the preceding workflow result
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/zerops-delivery"
          # This repository is public. An anonymous bounded read needs no additional token permissions.
          # Rate limits, malformed responses and missing history all fall back to a full deployment.
          curl --fail --silent --show-error --max-time 30 \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/zerops-stage.yml/runs?branch=demo%2Fsales-crm&per_page=30" \
            -o "$RUNNER_TEMP/zerops-delivery/prior-runs.json" ||
            printf '{"workflow_runs":[]}\n' >"$RUNNER_TEMP/zerops-delivery/prior-runs.json"

      # A failed or old rerun can change stage even outside the bounded API history page.
      # Every deploy attempt publishes this marker BEFORE any remote mutation.
      - name: Restore the latest attempted delivery
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-delivery/last-attempt
          key: zerops-stage-attempt-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zerops-stage-attempt-v1-

      - name: Plan from the last verified release, never HEAD parent
        id: plan
        working-directory: app
        run: mise exec -- node scripts/zerops/delivery-plan-cli.mts plan "$RUNNER_TEMP/zerops-delivery"

      - name: Retain the delivery decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-delivery-plan
          path: ${{ runner.temp }}/zerops-delivery/plan.json
          retention-days: 30

  # The units build on GitHub runners, a shard each, in parallel: the Zerops build container holds only two unit
  # builds at a time. A unit whose committed inputs are unchanged reuses its last build from the Actions cache
  # (scripts/zerops/build-app.sh), and Zerops then keeps every unit the push carries.
  build:
    name: Build units (shard ${{ matrix.shard }})
    needs: [plan]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      SHARDS: 7
      ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
      ONTOS_SHOP_STOREFRONT_ORIGIN: https://ontos-stage-shop.web-revolution.cz
      ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      ULTRAMODERN_SKIP_SERVER_TYPECHECK: '1'
      ZEROPS_FORCE_BUILD: ${{ needs.plan.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      - name: Restore the shard's unit builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-unit-cache
          key: zerops-units-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: zerops-units-${{ matrix.shard }}-

      - name: Build the shard's units
        working-directory: app
        env:
          # Outside the checkout: an untracked file in the tree makes every release identity `workspace`.
          UNIT_CACHE_DIR: ${{ runner.temp }}/zerops-unit-cache
        run: |
          units="$(node -e '
            const ids = ["shell-super-app", ...require("./topology/application-release-intent.json").modules.map((m) => m.appId)];
            console.log(ids.filter((_, index) => index % Number(process.env.SHARDS) === Number(process.argv[1])).join(" "));
          ' "${{ matrix.shard }}")"
          echo "units: $units"
          # shellcheck disable=SC2086
          BUILD_JOBS=2 mise exec -- sh scripts/zerops/build-app.sh $units
          dirs=""
          for unit in $units; do
            [ "$unit" = shell-super-app ] && dirs="$dirs apps/shell-super-app/dist" || dirs="$dirs verticals/$unit/dist"
          done
          # shellcheck disable=SC2086
          # Source maps, type bundles and precompressed copies never serve at runtime; they only slow the Zerops push.
          tar --create --zstd --file "$RUNNER_TEMP/units.tar.zst" --exclude='*.map' --exclude='@mf-types*' \
            --exclude='*.br' --exclude='*.gz' $dirs

      - name: Save the shard's unit builds
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-unit-cache
          key: zerops-units-${{ matrix.shard }}-${{ github.sha }}

      - name: Upload the shard's unit builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          retention-days: 3

  # Preparing secrets and storefront deployment does not wait for unrelated app unit shards.
  # STOREFRONT RUNNER PREBUILD (lane STOREFRONT). Each selected storefront is built once here, beside the unit shards:
  # tsrs typecheck, then `next build` with the build-time environment its zerops.yaml setup declares. The Zerops
  # `storefront` and `n1` setups only check and unpack this archive (app/zerops.yaml); they never install or build.
  # deploy_storefront and deploy_shop take `zerops-storefront-storefront` (one AKROS build: brand, key and app id are
  # runtime service variables), deploy_n1 takes `zerops-storefront-n1`. A storefront the plan keeps is not rebuilt.
  # A missing archive, or one from another revision or setup, fails that deploy job before any push.
  build_storefronts:
    name: Build ${{ matrix.package }} on the runner
    needs: [plan]
    if: >-
      needs.plan.outputs.storefront == 'true' || needs.plan.outputs.shop == 'true' || needs.plan.outputs.n1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One storefront's failure must not cancel the other's build: each deploy job needs only its own archive.
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}{2}]',
          (needs.plan.outputs.storefront == 'true' || needs.plan.outputs.shop == 'true') && '{"setup":"storefront","package":"akros-storefront"}' || '',
          (needs.plan.outputs.storefront == 'true' || needs.plan.outputs.shop == 'true') && needs.plan.outputs.n1 == 'true' && ',' || '',
          needs.plan.outputs.n1 == 'true' && '{"setup":"n1","package":"n1-storefront"}' || '')) }}
    env:
      PKG: ${{ matrix.package }}
      SETUP: ${{ matrix.setup }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      # Webpack's compiler cache only speeds the build; its contents never decide what ships.
      - name: Restore Next's compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/${{ matrix.package }}/.next/cache
          key: next-cache-v1-${{ matrix.package }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            next-cache-v1-${{ matrix.package }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}-
            next-cache-v1-${{ matrix.package }}-

      # `next typegen`, then tsrs over Next's tsconfig.json with the generated route types. The build below still runs
      # Next's own type step too, until the storefronts emit declarations cleanly under the workspace typecheck.
      - name: Typecheck with tsrs
        working-directory: app
        run: mise exec -- pnpm --filter "$PKG" run typecheck

      # The build-time environment of the setup, as zerops.yaml declared it while Zerops built: AKROS reads
      # STOREFRONT_IMAGE_HOSTS (empty) in next.config.ts; N1 reads nothing at build. No secret is present.
      # Next's type check holds the owner API types the storefronts import: a cold N1 build peaks near 3.3 GiB, past
      # Node's default heap (about 2 GiB), so the build gets 4 GiB of the runner's 16 GB. AKROS gets the same.
      - name: Build the standalone server
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [ "$PKG" = akros-storefront ]; then export STOREFRONT_IMAGE_HOSTS=''; fi
          mise exec -- pnpm --filter "$PKG" run build

      - name: Save Next's compiler cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/${{ matrix.package }}/.next/cache
          key: next-cache-v1-${{ matrix.package }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}-${{ github.sha }}

      # The archive unpacks to app/.zerops/runtime/<package> on Zerops, where `start` runs <package>/server.js.
      # Zerops runs Alpine (musl) and this runner is glibc: a native addon would load on neither side safely, so any
      # `.node` file fails here. Symlinks must stay relative so they resolve after the move.
      - name: Pack the standalone server with its manifest
        run: |
          out="$RUNNER_TEMP/storefront-runtime"
          dist="$RUNNER_TEMP/storefront-dist"
          mkdir -p "$out" "$dist"
          mv "app/$PKG/.next/standalone" "$out/$PKG"
          cp -a "app/$PKG/.next/static" "$out/$PKG/$PKG/.next/static"
          cp -a "app/$PKG/public" "$out/$PKG/$PKG/public"
          test -f "$out/$PKG/$PKG/server.js"
          native="$(find "$out" -name '*.node' -print)"
          if [ -n "$native" ]; then echo "::error::native addons in the standalone server:"; echo "$native"; exit 1; fi
          absolute="$(find "$out" -type l -lname '/*' -print)"
          if [ -n "$absolute" ]; then echo "::error::absolute symlinks in the standalone server:"; echo "$absolute"; exit 1; fi
          tar --create --gzip --sort=name --owner=0 --group=0 --numeric-owner \
            --file "$dist/.zerops-storefront.tar.gz" -C "$out" "$PKG"
          # The committed inputs of this build: the storefront, the workspace sources N1 imports, and the install.
          case "$PKG" in
            akros-storefront) inputs=(app/akros-storefront) ;;
            n1-storefront) inputs=(app/n1-storefront app/apps app/packages app/verticals app/tsconfig.json app/tsconfig.base.json) ;;
          esac
          inputs+=(app/package.json app/pnpm-lock.yaml app/pnpm-workspace.yaml app/patches app/.mise.toml)
          input_digest="$(git ls-files -s -- "${inputs[@]}" | sha256sum | cut -d' ' -f1)"
          jq -n --arg setup "$SETUP" --arg package "$PKG" --arg sourceRevision "$GITHUB_SHA" \
            --arg inputDigest "$input_digest" \
            --arg archiveSha256 "$(sha256sum "$dist/.zerops-storefront.tar.gz" | cut -d' ' -f1)" \
            --arg node "$(cd app && mise exec -- node -p process.versions.node)" \
            --arg arch "$(cd app && mise exec -- node -p process.arch)" \
            '{setup: $setup, package: $package, sourceRevision: $sourceRevision, inputDigest: $inputDigest,
              archiveSha256: $archiveSha256, node: $node, arch: $arch, platform: "linux", builtLibc: "glibc",
              nativeAddons: 0}' >"$dist/.zerops-storefront.json"
          ls -lh "$dist"
          cat "$dist/.zerops-storefront.json"

      - name: Upload the storefront archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-storefront-${{ matrix.setup }}
          path: ${{ runner.temp }}/storefront-dist/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  deploy:
    name: Prepare independent service deployments
    needs: [plan]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Reading the cache index before the deploy needs `actions: read`; the deploy itself still needs only
    # `contents: read`.
    permissions:
      actions: read
      contents: read
    environment:
      name: stage-edge
      deployment: false
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_APP_SERVICE_ID: ${{ vars.ZEROPS_APP_SERVICE_ID }}
      ZEROPS_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_STOREFRONT_SERVICE_ID }}
      ZEROPS_SHOP_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_SHOP_STOREFRONT_SERVICE_ID }}
      ZEROPS_N1_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_N1_STOREFRONT_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mark the actual deployment attempt
        # A retry may reuse this run's built artifacts, but must never deploy an older branch head.
        env:
          PLANNED_RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          test "$current_head" = "$GITHUB_SHA"
          printf '%s\n' "$PLANNED_RECEIPT" |
            jq -e --argjson runId "$GITHUB_RUN_ID" --arg sourceRevision "$GITHUB_SHA" \
              '.runId==$runId and .validatedHead==$sourceRevision' >/dev/null
          mkdir -p "$RUNNER_TEMP/zerops-delivery/last-attempt"
          jq -n --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sourceRevision "$GITHUB_SHA" '{runId:$runId,runAttempt:$runAttempt,sourceRevision:$sourceRevision}' \
            >"$RUNNER_TEMP/zerops-delivery/last-attempt/attempt.json"

      # Future selective plans can use this hint; cache visibility never decides whether valid artifacts deploy.
      - name: Persist the attempted delivery before any remote mutation
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-delivery/last-attempt
          key: zerops-stage-attempt-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # The owner secret bundle is the one GitHub copy of every owner's runtime secrets. The app host hands each owner
      # only its own entries; the bundle itself never leaves the supervisor.
      - name: Sync the owner secret bundle to the app service
        if: needs.plan.outputs.app == 'true'
        env:
          OWNER_SECRETS: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: bash app/scripts/zerops/sync-service-secret.sh "$ZEROPS_APP_SERVICE_ID" ONTOS_OWNER_SECRETS_JSON OWNER_SECRETS

      # Stage mail uses the Cloudflare Email Service API; zerops.yaml maps this secret to CLOUDFLARE_EMAIL_API_TOKEN.
      - name: Sync the SMTP password to the app service
        if: needs.plan.outputs.app == 'true'
        env:
          SMTP_PASSWORD: ${{ secrets.STAGE_SMTP_PASSWORD }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: bash app/scripts/zerops/sync-service-secret.sh "$ZEROPS_APP_SERVICE_ID" SMTP_PASSWORD SMTP_PASSWORD

      # ŠroubShop runs as its own storefront application `sroubshop-storefront` with its own managed key (the pseudonym
      # cutover in app/scripts/demo/pseudonymize-akros-demo.md). The key is a stage-edge secret written once by the
      # operator; both values are service variables of the shop service and take effect with the shop push below.
      - name: Sync the ŠroubShop storefront identity to the shop service
        if: needs.plan.outputs.shop == 'true'
        env:
          SHOP_STOREFRONT_API_KEY: ${{ secrets.SHOP_STOREFRONT_API_KEY }}
          SHOP_STOREFRONT_APP_ID: sroubshop-storefront
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          bash app/scripts/zerops/sync-service-secret.sh "$ZEROPS_SHOP_STOREFRONT_SERVICE_ID" ONTOS_AKROS_STOREFRONT_API_KEY SHOP_STOREFRONT_API_KEY
          bash app/scripts/zerops/sync-service-secret.sh "$ZEROPS_SHOP_STOREFRONT_SERVICE_ID" ONTOS_STOREFRONT_APP_ID SHOP_STOREFRONT_APP_ID

      # The N1 storefront key is a stage-edge secret, written once by the operator, and a sensitive service variable of the
      # n1 service. It is never in Git or a log. A missing secret fails the deploy before any push.
      - name: Sync the N1 storefront key to the n1 service
        if: needs.plan.outputs.n1 == 'true'
        env:
          ONTOS_N1_STOREFRONT_API_KEY: ${{ secrets.ONTOS_N1_STOREFRONT_API_KEY }}
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: bash app/scripts/zerops/sync-service-secret.sh "$ZEROPS_N1_STOREFRONT_SERVICE_ID" ONTOS_N1_STOREFRONT_API_KEY ONTOS_N1_STOREFRONT_API_KEY

      - name: Download the delivery plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-delivery-plan
          path: ${{ runner.temp }}/zerops-delivery

  deploy_app:
    name: Deploy and check app
    needs: [plan, deploy, build]
    if: always() && needs.deploy.result == 'success' && needs.build.result == 'success' && needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: stage-edge
      deployment: false
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_APP_SERVICE_ID: ${{ vars.ZEROPS_APP_SERVICE_ID }}
      ZEROPS_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_STOREFRONT_SERVICE_ID }}
      ZEROPS_SHOP_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_SHOP_STOREFRONT_SERVICE_ID }}
      ZEROPS_N1_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_N1_STOREFRONT_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download the delivery plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-delivery-plan
          path: ${{ runner.temp }}/zerops-delivery
      - name: Download the unit builds
        if: needs.plan.outputs.app == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zerops-units-*
          path: ${{ runner.temp }}/units

      # The push carries every prebuilt dist/ (git-ignored) with the checkout; its digests tell the Zerops build to
      # keep them, so Zerops only installs the workspace.
      # The units travel as one zstd archive inside the push, which keeps the package small enough to upload in one
      # go; the Zerops build unpacks it and keeps every unit whose digest it carries.
      - name: Pack the unit builds for the push
        if: needs.plan.outputs.app == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dists"
          for archive in "$RUNNER_TEMP"/units/*/units.tar.zst; do tar --extract --zstd --file "$archive" -C "$RUNNER_TEMP/dists"; done
          tar --create --file - -C "$RUNNER_TEMP/dists" . | zstd -q -12 -T0 -o app/.zerops-prebuilt.tar.zst
          ls -lh app/.zerops-prebuilt.tar.zst

      - name: Push only services whose inputs changed
        if: needs.plan.outputs.app == 'true'
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          test "$current_head" = "$GITHUB_SHA"
          jq --arg service 'app' '.services = [.services[] | select(. == $service)]' \
            "$RUNNER_TEMP/zerops-delivery/plan.json" >"$RUNNER_TEMP/service-plan.json"
          bash app/scripts/zerops/push-delivery.sh "$RUNNER_TEMP/service-plan.json"
      - name: Show app runtime and build logs after a failed deploy
        if: failure()
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          # v1.1.0 ignores --show-build-logs; v1.1.3 fixes its flag lookup.
          npm install --global @zerops/zcli@1.1.3 >/dev/null
          zcli login "$ZEROPS_TOKEN" >/dev/null
          zcli service log --project-id "$ZEROPS_PROJECT_ID" --service-id "$ZEROPS_APP_SERVICE_ID" --limit 300 || true
          # The CLI selects the latest appVersion; correlate it with the failed push process.
          zcli service log --project-id "$ZEROPS_PROJECT_ID" --service-id "$ZEROPS_APP_SERVICE_ID" --show-build-logs --limit 300 || true

  deploy_storefront:
    name: Deploy and check storefront
    needs: [plan, deploy, build_storefronts]
    # A kept service deploys nothing and only re-verifies; a selected one needs build_storefronts to have run. Its
    # own archive is then the gate: a failed build leaves none, and the download below fails before any push.
    if: >-
      always() && needs.deploy.result == 'success' && needs.plan.outputs.any == 'true' &&
      (needs.plan.outputs.storefront != 'true' || needs.build_storefronts.result == 'success' ||
      needs.build_storefronts.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: stage-edge
      deployment: false
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_APP_SERVICE_ID: ${{ vars.ZEROPS_APP_SERVICE_ID }}
      ZEROPS_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_STOREFRONT_SERVICE_ID }}
      ZEROPS_SHOP_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_SHOP_STOREFRONT_SERVICE_ID }}
      ZEROPS_N1_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_N1_STOREFRONT_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download the delivery plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-delivery-plan
          path: ${{ runner.temp }}/zerops-delivery
      - name: Take the storefront archive built on the runner
        if: needs.plan.outputs.storefront == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-storefront-storefront
          path: app
      # Never a stale or foreign build: the manifest must name this commit and this setup, and the archive its digest.
      - name: Refuse an archive from another revision or setup
        if: needs.plan.outputs.storefront == 'true'
        run: |
          jq -e --arg sha "$GITHUB_SHA" --arg setup 'storefront' \
            '.sourceRevision == $sha and .setup == $setup and .nativeAddons == 0' app/.zerops-storefront.json
          echo "$(jq -r .archiveSha256 app/.zerops-storefront.json)  app/.zerops-storefront.tar.gz" | sha256sum -c -
      - name: Push only services whose inputs changed
        if: needs.plan.outputs.storefront == 'true'
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          test "$current_head" = "$GITHUB_SHA"
          jq --arg service 'storefront' '.services = [.services[] | select(. == $service)]' \
            "$RUNNER_TEMP/zerops-delivery/plan.json" >"$RUNNER_TEMP/service-plan.json"
          bash app/scripts/zerops/push-delivery.sh "$RUNNER_TEMP/service-plan.json"
      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile
      - name: Verify storefront after its own deployment (or verify its kept release)
        working-directory: app
        run: mise exec -- node scripts/zerops/verify-service.mjs storefront

  deploy_shop:
