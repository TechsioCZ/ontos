          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: bash app/scripts/zerops/route-stage-domains.sh ontos-stage-n1.web-revolution.cz "$ZEROPS_N1_STOREFRONT_SERVICE_ID" 3071

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile
      - name: Verify n1 after its own deployment (or verify its kept release)
        working-directory: app
        run: mise exec -- node scripts/zerops/verify-service.mjs n1

  verify:
    name: Verify stage
    needs: [plan, deploy, deploy_app]
    if: >-
      always() && needs.deploy.result == 'success' &&
      (needs.plan.outputs.app == 'false' || needs.deploy_app.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Keep the proven full workspace setup: deployment verification must not depend on a partial install.
      - name: Install the verification dependencies
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      # The frozen graph covers both clients' revisions and any overrides; no prefix fallback.
      - name: Use the runner-owned verification browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/zerops-verify-browsers\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"

      # Name both SDK versions for the image-specific apt archive cache.
      - name: Name the pinned verification browsers
        id: verification-browser-versions
        working-directory: app
        run: |
          oauth="$(mise exec -- pnpm --config.verify-deps-before-run=false --filter @app/shell-super-app exec playwright --version)"
          warmup="$(mise exec -- pnpm --config.verify-deps-before-run=false exec playwright-core --version)"
          echo "versions=${oauth// /-}-${warmup// /-}" >>"$GITHUB_OUTPUT"

      - name: Restore the pinned verification browsers
        id: verification-browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: zerops-verify-browsers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}

      # Reuse the gates' apt archive approach, never a cached installed /usr tree. apt checks the current index.
      - name: Name the Chromium system-library package cache
        id: chromium-debs
        run: echo "key=playwright-apt-debs-$ImageOS-$ImageVersion-${{ steps.verification-browser-versions.outputs.versions }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Chromium system-library packages
        id: chromium-debs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

      - name: Seed apt with the cached Chromium system-library packages
        run: |
          if [ -d ~/.cache/playwright-apt-debs ]; then
            sudo find ~/.cache/playwright-apt-debs -maxdepth 1 -name '*.deb' -exec cp {} /var/cache/apt/archives/ \;
          fi

      # Always validate BOTH clients, even on exact cache hits: a restored archive may be partial.
      # --with-deps still checks/installs OS libraries; the restored apt packages only avoid their downloads.
      - name: Install headless Chromium for the OAuth consent screens
        working-directory: app
        run: mise exec -- pnpm --config.verify-deps-before-run=false --filter @app/shell-super-app exec playwright install --with-deps chromium

      - name: Install headless Chromium for the warm-up client
        working-directory: app
        run: mise exec -- pnpm --config.verify-deps-before-run=false exec playwright-core install chromium

      - name: Collect the Chromium system-library packages
        run: |
          mkdir -p ~/.cache/playwright-apt-debs
          touch ~/.cache/playwright-apt-debs/.downloaded
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/playwright-apt-debs/ \;

      - name: Save the Chromium system-library packages
        if: steps.chromium-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-debs
          key: ${{ steps.chromium-debs.outputs.key }}

      - name: Save the pinned verification browsers
        if: steps.verification-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: zerops-verify-browsers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}

      - name: Time /cs and OAuth metadata without waiting for storefronts
        working-directory: app
        run: mise exec -- node scripts/zerops/verify-service.mjs app

      # Independent read-only warm-up accounts and OAuth proof sessions may run together. Neither result is ignored.
      # Warm-up keeps its full persona/route coverage and 85 s budget; only its start time changes.
      - name: Warm declared reads and prove MCP over OAuth side by side
        working-directory: app
        env:
          ONTOS_STAGE_WARMUP_ENABLED: 'true'
          ONTOS_SHELL_URL: ${{ env.STAGE_SHELL_URL }}
          ONTOS_OAUTH_ISSUER: ${{ env.STAGE_SHELL_URL }}/shell-super-app-api/oauth
          E2E_OUT_DIR: ${{ runner.temp }}/mcp-oauth-e2e
          E2E_SHOTS_DIR: ${{ runner.temp }}/mcp-oauth-e2e/shots
        run: |
          mkdir -p "$E2E_OUT_DIR"
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node scripts/ops/stage-warmup.mts >"$E2E_OUT_DIR/warmup.log" 2>&1 &
          warmup_pid=$!
          mise exec -- node scripts/demo/prove-mcp-oauth.mts --variant=1 --verification >"$E2E_OUT_DIR/oauth.log" 2>&1 &
          oauth_pid=$!
          trap 'kill "$warmup_pid" "$oauth_pid" 2>/dev/null || true' EXIT
          warmup_status=0
          oauth_status=0
          wait "$warmup_pid" || warmup_status=$?
          wait "$oauth_pid" || oauth_status=$?
          trap - EXIT
          echo '::group::Stage warm-up'
          cat "$E2E_OUT_DIR/warmup.log"
          echo "Warm-up exit: $warmup_status"
          echo '::endgroup::'
          echo '::group::MCP OAuth proof'
          cat "$E2E_OUT_DIR/oauth.log"
          echo "MCP OAuth exit: $oauth_status"
          echo '::endgroup::'
          test "$warmup_status" -eq 0 && test "$oauth_status" -eq 0

      - name: Upload the MCP OAuth proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-oauth-e2e
          path: ${{ runner.temp }}/mcp-oauth-e2e
          if-no-files-found: ignore
          retention-days: 14

  newsletter:
    name: Optional newsletter proof after app and shop readiness
    needs: [plan, deploy, deploy_app, deploy_shop]
    if: >-
      always() && needs.deploy.result == 'success' && needs.deploy_shop.result == 'success' &&
      (needs.plan.outputs.app == 'false' || needs.deploy_app.result == 'success')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app workspace
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      # The complete frozen dependency graph covers BOTH clients, including browser revision overrides.
      # No restore prefix: another dependency graph or runner architecture is never an exact cache hit.
      - name: Use the runner-owned verification browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/zerops-verify-browsers\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Restore the pinned verification browsers
        id: verification-browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: zerops-verify-browsers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}

      # Always run both clients' own installers, even on a cache hit. They validate their required
      # Chromium/headless-shell/ffmpeg revisions and install anything missing. OS dependencies are NOT cached.
      - name: Install headless Chromium for the OAuth consent screens
        working-directory: app
        run: mise exec -- pnpm --config.verify-deps-before-run=false --filter @app/shell-super-app exec playwright install --with-deps chromium

      # Warm-up imports the workspace's pinned playwright-core, which may differ from Shell's verification client.
      - name: Install headless Chromium for the warm-up client
        working-directory: app
        run: mise exec -- pnpm --config.verify-deps-before-run=false exec playwright-core install chromium

      - name: Save the pinned verification browsers
        if: steps.verification-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: zerops-verify-browsers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/pnpm-lock.yaml', 'app/.mise.toml') }}

      # node24 configures these two PUBLIC resource UUIDs from actual Privacy publication results.
      # Missing account/IDs/publication/read permission stays a visible non-blocking failure, never a fake pass.
      - name: Read native newsletter evidence
        id: newsletter-evidence
        if: success() || failure()
        continue-on-error: true
        working-directory: app
        env:
          NEWSLETTER_PURPOSE_ID: ${{ vars.NEWSLETTER_PURPOSE_ID }}
          NEWSLETTER_NOTICE_ID: ${{ vars.NEWSLETTER_NOTICE_ID }}
        run: mise exec -- node scripts/ops/newsletter-evidence.mts

      # The newsletter proof only warns: its failure is reported and does not fail the run.
      - name: Prove the native newsletter grant and withdrawal
        id: newsletter-proof
        if: (success() || failure()) && steps.newsletter-evidence.outcome == 'success'
        continue-on-error: true
        working-directory: app
        env:
          AKROS_TEST_BASE_URL: ${{ env.STAGE_SHOP_URL }}
          AKROS_EVIDENCE_DIR: ${{ runner.temp }}/newsletter-consent
          NEWSLETTER_PURPOSE_READ_FILE: ${{ runner.temp }}/newsletter-native/processing-purposes.json
          NEWSLETTER_NOTICE_READ_FILE: ${{ runner.temp }}/newsletter-native/notice-versions.json
        run: |
          E2E_PLAYWRIGHT_MODULE="$(cd apps/shell-super-app && mise exec -- node -p "require.resolve('@playwright/test')")"
          export E2E_PLAYWRIGHT_MODULE
          mise exec -- node akros-storefront/tests/browser/newsletter-consent.mjs

      - name: Warn about a failed newsletter proof
        if: >-
          (success() || failure()) &&
          (steps.newsletter-evidence.outcome == 'failure' || steps.newsletter-proof.outcome == 'failure')
        run: |
          echo '::warning title=Newsletter proof::Native Privacy evidence or the newsletter grant and withdrawal proof failed; see the evidence/proof step logs and any newsletter-consent artifact.'
          echo '> [!WARNING]' >>"$GITHUB_STEP_SUMMARY"
          echo '> Native Privacy evidence or the newsletter grant and withdrawal proof failed (non-blocking, not verified).' >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the newsletter screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsletter-consent
          path: ${{ runner.temp }}/newsletter-consent/*.png
          if-no-files-found: ignore
          retention-days: 14

  record:
    name: Record verified service source pins
    needs: [plan, build, deploy, deploy_app, deploy_storefront, deploy_shop, deploy_n1, verify]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.any == 'false' ||
      (needs.deploy.result == 'success' && needs.verify.result == 'success' &&
      (needs.plan.outputs.app == 'false' || needs.deploy_app.result == 'success') &&
      needs.deploy_storefront.result == 'success' && needs.deploy_shop.result == 'success' &&
      needs.deploy_n1.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      # validatedHead is the input-comparison base, NOT every service's deployed revision. A reused
      # service retains its real older source pin. The app still publishes its own composition at readiness.
      - name: Write the verified ledger
        env:
          RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: |
          mkdir -p "$RUNNER_TEMP/zerops-delivery/last-success"
          # Record the attempt that passed the real deployment and live proofs, including a job-only retry.
          printf '%s\n' "$RECEIPT" |
            jq -e --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg sourceRevision "$GITHUB_SHA" \
              'select(.runId==$runId and .validatedHead==$sourceRevision) | .runAttempt=$runAttempt | .lastAttempt={runId:$runId,runAttempt:$runAttempt,sourceRevision:$sourceRevision}' \
              >"$RUNNER_TEMP/zerops-delivery/last-success/receipt.json"

      - name: Save the verified source pins
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-delivery/last-success
          key: zerops-stage-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain the verified ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-verified-delivery
          path: ${{ runner.temp }}/zerops-delivery/last-success/receipt.json
          retention-days: 30
