name: Zerops Stage Deploy

# Deploys the sales demo branch to stage, which runs only on Zerops: one `app` service (the Shell, every owner and
# the Outbox Worker host in one container, see app/scripts/zerops/app-host.mts) and two storefront services built from the
# same `storefront` setup: `storefront` (AKROS, ontos-stage-akros) and `shop` (the pseudonymous demo e-shop,
# ontos-stage-shop). The N1 e-shop (`n1`, ontos-stage-n1) is its own Next storefront with its own setup and service.
# Each storefront service holds its own key, tenant and brand in its service variables
# (ONTOS_AKROS_STOREFRONT_API_KEY, STOREFRONT_BRAND, ONTOS_STOREFRONT_APP_ID, ONTOS_STOREFRONT_LEGAL_ENTITY_ID).
# Zerops builds the app from app/zerops.yaml; the storefronts arrive built on the runner that delivers them. The app
# container runs the owner migrations and publishes the Application Composition itself when it starts, and Zerops
# switches traffic only after /_host/ready answers.
# One verified-history snapshot feeds planning and lint in parallel. Unit builds never wait for lint; only the two
# delivering jobs do. Even a no-service-change plan must pass lint before this run can become the next verified base.
# Every push starts lint, including documentation-only repairs; the plan can select no delivery.
# Cloudflare stays in front of stage only as DNS, WAF and Access.
on:
  push:
    branches:
      - demo/sales-crm
  workflow_dispatch:
    # The upload warm-up shares one curl invocation, and so one connection, with the upload itself
    # (scripts/zerops/push-service.sh). Its rule was: a second upload attempt means this goes back off. Job
    # 134027998055 needed a second attempt with it on (25.58 s at 4.29 MB/s), so it is off; a dispatch can still try it.
    inputs:
      upload_warmup:
        description: Share one warmed connection with the first upload of each service
        type: boolean
        default: false
      # A full release (a dispatch, a retry, or the first push after a failed deploy) deploys every service, yet keeps
      # each unit whose committed inputs are unchanged. Only this input rebuilds every unit regardless of its cache.
      rebuild_units:
        description: Rebuild every app unit, ignoring the unit build cache
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One delivery at a time; a newer push waits for the running one. A run that a newer push superseded ends once its own
# Zerops processes have finished, before its proofs (scripts/zerops/stage-push.sh superseded): GitHub never cancels
# a trunk delivery, and no two runs ever overlap on Zerops.
concurrency:
  # A candidate lint proof never occupies the serialized stage delivery queue.
  group: ${{ startsWith(github.ref, 'refs/heads/candidate/') && format('zerops-stage-lint-{0}', github.ref) || 'zerops-stage' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/candidate/') }}

env:
  STAGE_SHELL_URL: https://ontos-stage.web-revolution.cz
  STAGE_STOREFRONT_URL: https://ontos-stage-akros.web-revolution.cz
  STAGE_SHOP_URL: https://ontos-stage-shop.web-revolution.cz
  STAGE_N1_URL: https://ontos-stage-n1.web-revolution.cz
  # pnpm-workspace.yaml's clone-or-copy copies on the runners' ext4, which has no reflinks: the planner install spent
  # 15 s copying 1331 packages out of the store. Jobs that install from the store restore their own copy and none
  # saves it, so links into it are safe; lint can also restore an installed workspace. Zerops links the same way.
  PNPM_CONFIG_PACKAGE_IMPORT_METHOD: hardlink
  # The Shell build mounts the Symmy REST ingress (apps/shell-super-app/modern.config.ts), as app/zerops.yaml's build
  # does. Declared for the whole run, so the identity step, the build shards and deliver-stage's unit build agree.
  ONTOS_INTERNAL_SYMMY_INGRESS: '1'

jobs:
  # Snapshot the verified base once: a refused lint run never advances this workflow's last green delivery,
  # so the next push includes its files again. Only two API reads here, no app install or 74 s mutation-history
  # scan (run 45228629460): those reads and planning still overlap installation below, beside lint.
  lint-plan:
    name: Select lint from the last verified delivery
    if: github.ref == 'refs/heads/demo/sales-crm' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # A superseded queued head must not consume the 30-50 s lint install or 180-410 s whole-tree lint shards.
      # Candidate dispatches check their own head, but never enter any planning, build or delivery job below.
      - name: Refuse a superseded lint head before preparation
        run: |
          current_head="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          test -n "$current_head" && test "$current_head" = "$GITHUB_SHA"

      - name: Read the shared verified delivery history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/zerops-delivery"
          bash app/scripts/zerops/read-delivery-history.sh comparison >"$RUNNER_TEMP/zerops-delivery/history.json"

      - name: Choose stage whole-tree lint or verified-commit proof
        id: shards
        env:
          COMPARISON_SNAPSHOT: ${{ runner.temp }}/zerops-delivery/history.json
        run: bash app/scripts/ci/choose-stage-lint-shards.sh

      - name: Retain the shared lint and delivery inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-lint-inputs
          path: ${{ runner.temp }}/zerops-delivery/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  lint:
    name: Stage lint (${{ matrix.shard == 'proof' && 'verified commit' || format('{0}/3', matrix.shard) }})
    needs: [lint-plan]
    if: needs.lint-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard prints its findings even if another shard is already red.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lint-plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a superseded lint head before preparation
        run: |
          current_head="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          test -n "$current_head" && test "$current_head" = "$GITHUB_SHA"

      - name: Install the app workspace
        uses: ./.github/actions/install-app

      # A push during the 30-50 s install should not then spend 180-410 s linting an obsolete whole-tree shard.
      - name: Refuse a head superseded during the lint install
        run: |
          current_head="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          test -n "$current_head" && test "$current_head" = "$GITHUB_SHA"

      - name: Format and Lint through every pre-commit job
        uses: ./.github/actions/lint-app
        with:
          shard: ${{ matrix.shard }}

  # Stage and gates share the whole-tree shard cut, lint-app action and lint-files.sh runner.
  # Stage alone selects a global-only proof for an exact verified-SHA manual dispatch.
  # Run 45798439167
  # measured stage shards at 298-449 s; gates run 45798433673 measured 281-411 s. Planning and runner builds
  # overlap lint and hid about 260 s on the build path. A delivery without runner builds waits for lint.
  # Only jobs that can mutate Zerops wait for lint success; a narrowed delivery plan does not narrow its lint.
  plan:
    name: Plan stage and select unit builds
    needs: [lint-plan]
    if: github.ref == 'refs/heads/demo/sales-crm' && needs.lint-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Reading this run's history snapshot and the branch's earlier unit builds needs `actions: read`.
    permissions:
      actions: read
      contents: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
      earlier_run: ${{ steps.earlier.outputs.run_id }}
      missing: ${{ steps.taken.outputs.missing }}
      app: ${{ steps.plan.outputs.app }}
      storefront: ${{ steps.plan.outputs.storefront }}
      shop: ${{ steps.plan.outputs.shop }}
      n1: ${{ steps.plan.outputs.n1 }}
      build_units: ${{ steps.units.outputs.build }}
    env:
      # Must equal the build job's SHARDS and its matrix: this job prints the shard lists the build shards read.
      SHARDS: 8
    steps:
      # Depth 1: changes come from the shared compare API snapshot, not this runner's git history.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # A queued commit can already be obsolete when its runner starts. Fail before install/planning, not only at
      # the mutation marker after every shard built. Never cancel a delivery whose Zerops processes are running.
      - name: Refuse a superseded stage head before preparation
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          if [ -z "$current_head" ] || [ "$current_head" != "$GITHUB_SHA" ]; then
            echo '::notice::Stage head changed or could not be read; this run performs no further preparation or deployment.'
            exit 1
          fi

      - name: Take the same verified history the lint selection read
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-lint-inputs
          path: ${{ runner.temp }}/zerops-delivery

      # Mutation history took 74 s in run 45228629460. Only planning needs it: keep these API reads beside the
      # root-importer install, not ahead of lint. They use the shared run list/base, never query a newer base.
      - name: Start reading mutations since the shared verified base
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            status=0
            bash scripts/zerops/read-delivery-history.sh complete "$RUNNER_TEMP/zerops-delivery/history.json" \
              >"$RUNNER_TEMP/zerops-delivery/complete-history.json" || status=$?
            echo "$status" >"$RUNNER_TEMP/zerops-delivery/history.status.next"
            mv "$RUNNER_TEMP/zerops-delivery/history.status.next" "$RUNNER_TEMP/zerops-delivery/history.status"
          ) </dev/null >"$RUNNER_TEMP/zerops-delivery/history.log" 2>&1 &

      # The planner and unit identities read only the root importer's packages. The delivery jobs install their
      # verification workspace after uploading, beside the Zerops build (.github/actions/deliver-stage).
      - name: Install the planner and identity tooling
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile --filter app

      - name: Finish reading the delivery mutations
        run: |
          until [ -f "$RUNNER_TEMP/zerops-delivery/history.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/zerops-delivery/history.log"
          test "$(cat "$RUNNER_TEMP/zerops-delivery/history.status")" -eq 0
          mv "$RUNNER_TEMP/zerops-delivery/complete-history.json" "$RUNNER_TEMP/zerops-delivery/history.json"

      - name: Plan from the last verified run, never HEAD parent
        id: plan
        working-directory: app
        run: mise exec -- node scripts/zerops/delivery-plan-cli.mts plan "$RUNNER_TEMP/zerops-delivery"

      # Before any mutation: the next run reads this plan back when this one changes stage without being verified.
      - name: Retain the delivery decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-delivery-plan
          path: ${{ runner.temp }}/zerops-delivery/plan.json
          overwrite: true
          retention-days: 30

      # This commit's unit identities, computed exactly as a build computes them (`build-app.sh --digests-only`: the
      # declared build environment, the same table), and each shard's unit list.
      - name: Write the unit identities and shard lists
        if: steps.plan.outputs.app == 'true'
        working-directory: app
        env:
          ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
          ONTOS_SHOP_STOREFRONT_ORIGIN: https://ontos-stage-shop.web-revolution.cz
          ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
          ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        run: |
          out="$RUNNER_TEMP/zerops-unit-identities"
          mkdir -p "$out"
          mise exec -- sh scripts/zerops/build-app.sh --digests-only "$out/digests.tsv"
          # Every shard in one process: one per shard took 6 s of the delivery's critical path (run 44144418654).
          mise exec -- node scripts/zerops/build-shard-units.mts all "$SHARDS" >"$out/shards.tsv"
          test "$(wc -l <"$out/shards.tsv")" -eq "$SHARDS"
          cat "$out/shards.tsv"

      - name: Retain the unit identities
        if: steps.plan.outputs.app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-unit-identities
          path: ${{ runner.temp }}/zerops-unit-identities/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # FRONT PATH (artifacts, not caches), unit by unit. The newest earlier push or dispatch run of this workflow on
      # this branch that holds unit builds (zerops-units-*) lends every unit whose build there carries this commit's
      # identity. When the rest fits the Zerops build's budget, deliver uploads the unchanged units and Zerops
      # builds the rest (build-app.sh proves every kept unit again). The delivering runner builds the missing units
      # off the critical path too, so this run's zerops-units-0 holds every unit. Otherwise the build matrix builds
      # and deliver_app delivers. rebuild_units never reuses.
      - name: Find the newest earlier unit builds of this branch
        id: earlier
        if: steps.plan.outputs.app == 'true' && inputs.rebuild_units != true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/zerops/reuse-shard-units.sh earlier "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Download the earlier unit builds
        if: steps.earlier.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zerops-units-*
          path: ${{ runner.temp }}/earlier-units
          run-id: ${{ steps.earlier.outputs.run_id }}
          github-token: ${{ github.token }}

      # Without earlier builds (none, expired, unreadable) every unit is missing.
      - name: Take this commit's units from the earlier builds by identity
        id: taken
        if: steps.plan.outputs.app == 'true' && inputs.rebuild_units != true
        working-directory: app
        run: |
          missing="$RUNNER_TEMP/zerops-units-missing.txt"
          bash scripts/zerops/reuse-shard-units.sh take-units "$RUNNER_TEMP/zerops-unit-identities" \
            "$RUNNER_TEMP/earlier-units" "$RUNNER_TEMP/dists" "$missing"
          # shellcheck disable=SC2046 # one unit id per line, no spaces.
          seconds="$(mise exec -- node scripts/zerops/zerops-unit-build-seconds.mts $(cat "$missing"))"
          echo "the units that must build take about ${seconds}s in the Zerops build"
          printf 'missing=%s\nseconds=%s\n' "$(tr '\n' ' ' <"$missing")" "$seconds" >>"$GITHUB_OUTPUT"

      # The budget weighs the Zerops build of the missing units against the build matrix's two more runner pickups,
      # its install and its upload: about one module, two modules, or the Shell and one module.
      - name: Decide where the units come from
        id: units
        env:
          APP: ${{ steps.plan.outputs.app }}
          TAKEN: ${{ steps.taken.outcome }}
          ZEROPS_SECONDS: ${{ steps.taken.outputs.seconds }}
          ZEROPS_BUILD_BUDGET_SECONDS: '150'
        run: |
          if [ "$APP" != true ]; then
            echo 'build=false' >>"$GITHUB_OUTPUT"
          elif [ "$TAKEN" = success ] && [ "$ZEROPS_SECONDS" -le "$ZEROPS_BUILD_BUDGET_SECONDS" ]; then
            echo 'build=false' >>"$GITHUB_OUTPUT"
            echo "The front delivery job leaves about ${ZEROPS_SECONDS}s of missing units to the Zerops build."
          else
            echo 'build=true' >>"$GITHUB_OUTPUT"
            echo 'Units must build on runners: the build matrix runs, then deliver_app delivers and verifies.'
          fi

  # The old no-build job took 45-60 s to reach delivery. The extra runner pickup/download is the price of not
  # holding a stage-secret runner idle while lint runs; no extra unit archive is uploaded. Whole-tree lint can
  # take 210-460 s including installation, so making planning/builds wait for it would add that in full.
  deliver:
    name: Deliver and verify stage without runner builds
    needs: [plan, lint]
    if: github.ref == 'refs/heads/demo/sales-crm' && needs.plan.result == 'success' && needs.lint.result == 'success' && needs.plan.outputs.any == 'true' && needs.plan.outputs.build_units != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    environment:
      name: stage-edge
      deployment: false
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_APP_SERVICE_ID: ${{ vars.ZEROPS_APP_SERVICE_ID }}
      ZEROPS_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_STOREFRONT_SERVICE_ID }}
      ZEROPS_SHOP_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_SHOP_STOREFRONT_SERVICE_ID }}
      ZEROPS_N1_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_N1_STOREFRONT_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a superseded stage head before preparation
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          if [ -z "$current_head" ] || [ "$current_head" != "$GITHUB_SHA" ]; then
            echo '::notice::Stage head changed or could not be read; this run performs no further preparation or deployment.'
            exit 1
          fi

      - name: Take this commit's unit identities
        if: needs.plan.outputs.app == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-unit-identities
          path: ${{ runner.temp }}/zerops-unit-identities

      - name: Download the earlier unit builds selected by the plan
        if: needs.plan.outputs.app == 'true' && needs.plan.outputs.earlier_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zerops-units-*
          path: ${{ runner.temp }}/earlier-units
          run-id: ${{ needs.plan.outputs.earlier_run }}
          github-token: ${{ github.token }}

      # The plan already proved that these exact artifacts leave <=150 s of unit builds to Zerops. If the
      # archive disappears between planning and delivery, do not silently turn the front path into a full build.
      - name: Take this commit's unchanged units for the upload
        if: needs.plan.outputs.app == 'true'
        working-directory: app
        env:
          EXPECTED_MISSING: ${{ needs.plan.outputs.missing }}
        run: |
          missing="$RUNNER_TEMP/zerops-units-missing.txt"
          bash scripts/zerops/reuse-shard-units.sh take-units "$RUNNER_TEMP/zerops-unit-identities" \
            "$RUNNER_TEMP/earlier-units" "$RUNNER_TEMP/dists" "$missing"
          test "$(tr '\n' ' ' <"$missing")" = "$EXPECTED_MISSING"

      # delivery-plan.mts MUTATION_MARKER: the next plan reads whether this step succeeded in any attempt of this run.
      # It precedes every secret sync and push, so a run that never got past it changed nothing on stage.
      - name: Mark the actual deployment attempt
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          test "$current_head" = "$GITHUB_SHA"
          echo "delivering $GITHUB_SHA; every secret sync and push of this run follows"

      - name: Deliver and verify stage
        uses: ./.github/actions/deliver-stage
        with:
          toolchain: none
          app: ${{ needs.plan.outputs.app }}
          storefront: ${{ needs.plan.outputs.storefront }}
          shop: ${{ needs.plan.outputs.shop }}
          n1: ${{ needs.plan.outputs.n1 }}
          dists: ${{ runner.temp }}/dists
          keep-units: ${{ needs.plan.outputs.app }}
          build-units: ${{ needs.plan.outputs.missing }}
          zerops-token: ${{ secrets.ZEROPS_TOKEN }}
          owner-secrets: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          smtp-password: ${{ secrets.STAGE_SMTP_PASSWORD }}
          shop-storefront-api-key: ${{ secrets.SHOP_STOREFRONT_API_KEY }}
          n1-storefront-api-key: ${{ secrets.ONTOS_N1_STOREFRONT_API_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-zone-id: ${{ vars.CLOUDFLARE_STAGE_ZONE_ID }}
          zerops-shared-ipv4: ${{ vars.ZEROPS_SHARED_IPV4 }}
          # A push carries no inputs and does not warm; a dispatch's own value decides.
          upload-warmup: ${{ github.event.inputs.upload_warmup || 'false' }}

  # The units build on GitHub runners, a shard each, in parallel: the Zerops build container holds only two unit
  # builds at a time. A unit whose committed inputs are unchanged reuses its last build from the Actions cache
  # (scripts/zerops/build-app.sh), and Zerops then keeps every unit the push carries.
  # The Shell builds alone in shard 0 (measured 74-116 s, no longer the longest unit); the modules are dealt over the
  # two build lanes of shards 1-7 by scripts/zerops/build-shard-units.mts, by their measured build seconds.
  # SHARDS must equal the matrix below and the one in the plan job. Seven module shards, not six: over the five
  # runs that rebuilt every unit, 27 modules over six shards left the slowest lane 14% above the average lane because
  # 4-5 modules pack into two lanes unevenly, and the seventh shard takes the predicted slowest shard from 5.3 to
  # 4.5 min. It adds one runner slot and no cache: a shard's entry holds only its own units, so an extra shard splits
  # the 2.0 GB of zerops-units-v2-* entries instead of duplicating them.
  build:
    name: Build units (shard ${{ matrix.shard }})
    needs: [plan]
    # Only when the units the earlier builds cannot lend exceed the Zerops build's budget (the delivery's front path).
    if: github.ref == 'refs/heads/demo/sales-crm' && needs.plan.result == 'success' && needs.plan.outputs.build_units == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
      ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
      ONTOS_SHOP_STOREFRONT_ORIGIN: https://ontos-stage-shop.web-revolution.cz
      ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
      ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      ZEROPS_FORCE_BUILD: ${{ inputs.rebuild_units == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # The head may have advanced while this job waited for the planner or a runner.
      - name: Refuse a superseded stage head before preparation
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          if [ -z "$current_head" ] || [ "$current_head" != "$GITHUB_SHA" ]; then
            echo '::notice::Stage head changed or could not be read; this run performs no further preparation or deployment.'
            exit 1
          fi

      - name: Take this commit's unit identities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zerops-unit-identities
          path: ${{ runner.temp }}/zerops-unit-identities

      # The shard's cache entry is named by its units' identities, never by commit: a push whose units are unchanged
      # restores its exact entry and saves nothing; a changed unit names a new entry, and the prefix restores the
      # nearest older one. Without the identity table the entry has no name: the prefix still restores, nothing saves.
      - name: Name the shard's unit cache entry
        id: unit-cache-key
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          identities="$RUNNER_TEMP/zerops-unit-identities"
          units="$(awk -F '\t' -v shard="$SHARD" '$1 == shard { print $2 }' "$identities/shards.tsv")"
          test -n "$units"
          # Every unit's row first: a unit without one names no entry at all.
          rows=''
          for unit in $units; do
            row="$(awk -F '\t' -v unit="$unit" '$1 == unit { print; found++ } END { exit found == 1 ? 0 : 1 }' \
              "$identities/digests.tsv")"
            rows="$rows$row"$'\n'
          done
          key="$(printf '%s' "$rows" | bash app/scripts/ci/cache-entry-key.sh "zerops-units-v2-$SHARD-")"
          echo "$key" >>"$GITHUB_OUTPUT"

      - name: Restore the shard's unit builds
        id: unit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-unit-cache
          key: ${{ steps.unit-cache-key.outputs.key || format('zerops-units-v2-{0}-unnamed', matrix.shard) }}
          restore-keys: zerops-units-v2-${{ matrix.shard }}-

      # Every unit of the shard proven unchanged by identity (scripts/zerops/reuse-shard-units.sh): no install, no
      # build. Exit 3 means some unit must build; anything else is a failure. rebuild_units always builds.
      - name: Reuse the shard's unchanged units
        id: reuse
        if: env.ZEROPS_FORCE_BUILD != 'true'
        working-directory: app
        env:
          UNIT_CACHE_DIR: ${{ runner.temp }}/zerops-unit-cache
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          bash scripts/zerops/reuse-shard-units.sh reuse "$RUNNER_TEMP/zerops-unit-identities" "$SHARD" \
            "$UNIT_CACHE_DIR" "$RUNNER_TEMP/units.tar.zst" || status=$?
          case "$status" in
            0) echo 'reused=true' >>"$GITHUB_OUTPUT" ;;
            3) echo 'reused=false' >>"$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Install the app workspace
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/install-app
        with:
          install-args: --trust-lockfile

      - name: Build the shard's units
        if: steps.reuse.outputs.reused != 'true'
        working-directory: app
        env:
          # Outside the checkout: an untracked file in the tree makes every release identity `workspace`.
          UNIT_CACHE_DIR: ${{ runner.temp }}/zerops-unit-cache
          SHARD: ${{ matrix.shard }}
        run: |
          units="$(mise exec -- node scripts/zerops/build-shard-units.mts "$SHARD" "$SHARDS")"
          test -n "$units"
          echo "units: $units"
          # shellcheck disable=SC2086
          BUILD_JOBS=2 mise exec -- sh scripts/zerops/build-app.sh $units
          # The saved cache holds only this shard's units, so a unit that moved shards does not ride along forever.
          for cached in "$UNIT_CACHE_DIR"/*; do
            [ -e "$cached" ] || continue
            case " $units " in *" $(basename "$cached") "*) ;; *) rm -rf -- "$cached" ;; esac
          done
          # shellcheck disable=SC2086
          bash scripts/zerops/reuse-shard-units.sh pack "$RUNNER_TEMP/units.tar.zst" $units

      # Saved whenever the shard ends with its complete, identity-proven unit set (reused or built: a failed step
      # never reaches here) and its exact entry was not restored, so a shard reused through a prefix writes its own
      # entry once and then hits it. A forced rebuild_units run cannot replace an entry that exists (the cache never
      # overwrites a key); delete the entry to replace a bad build.
      - name: Save the shard's unit builds
        if: steps.unit-cache-key.outputs.key != '' && steps.unit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zerops-unit-cache
          key: ${{ steps.unit-cache-key.outputs.key }}

      - name: Upload the shard's unit builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerops-units-${{ matrix.shard }}
          path: ${{ runner.temp }}/units.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 3

  # The same delivery once this run's unit builds exist: one more runner, created only when units had to build.
  deliver_app:
    name: Deliver and verify stage after the unit builds
    needs: [plan, build, lint]
    if: github.ref == 'refs/heads/demo/sales-crm' && needs.plan.result == 'success' && needs.plan.outputs.build_units == 'true' && needs.build.result == 'success' && needs.lint.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    # Downloading this run's unit builds needs `actions: read`.
    permissions:
      actions: read
      contents: read
    environment:
      name: stage-edge
      deployment: false
    env:
      ZEROPS_PROJECT_ID: ${{ vars.ZEROPS_PROJECT_ID }}
      ZEROPS_APP_SERVICE_ID: ${{ vars.ZEROPS_APP_SERVICE_ID }}
      ZEROPS_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_STOREFRONT_SERVICE_ID }}
      ZEROPS_SHOP_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_SHOP_STOREFRONT_SERVICE_ID }}
      ZEROPS_N1_STOREFRONT_SERVICE_ID: ${{ vars.ZEROPS_N1_STOREFRONT_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a superseded stage head before preparation
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          if [ -z "$current_head" ] || [ "$current_head" != "$GITHUB_SHA" ]; then
            echo '::notice::Stage head changed or could not be read; this run performs no further preparation or deployment.'
            exit 1
          fi

      # No install before the push: the delivery's steps up to the app upload run bash, curl, jq, tar, zstd and git
      # only, and it sets up the toolchain and the whole workspace itself once the upload is done (toolchain: none).
      - name: Download the unit builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zerops-units-*
          path: ${{ runner.temp }}/units

      - name: Lay out the unit builds
        run: |
          mkdir -p "$RUNNER_TEMP/dists"
          mapfile -t archives < <(find "$RUNNER_TEMP/units" -type f -name units.tar.zst | LC_ALL=C sort)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do tar --extract --zstd --file "$archive" -C "$RUNNER_TEMP/dists"; done

      # delivery-plan.mts MUTATION_MARKER: the next plan reads whether this step succeeded in any attempt of this run.
      # It precedes every secret sync and push, so a run that never got past it changed nothing on stage.
      - name: Mark the actual deployment attempt
        run: |
          current_head="$(git ls-remote origin refs/heads/demo/sales-crm | cut -f1)"
          test "$current_head" = "$GITHUB_SHA"
          echo "delivering $GITHUB_SHA; every secret sync and push of this run follows"

      - name: Deliver and verify stage
        uses: ./.github/actions/deliver-stage
        with:
          toolchain: none
          app: 'true'
          storefront: ${{ needs.plan.outputs.storefront }}
          shop: ${{ needs.plan.outputs.shop }}
          n1: ${{ needs.plan.outputs.n1 }}
          dists: ${{ runner.temp }}/dists
          zerops-token: ${{ secrets.ZEROPS_TOKEN }}
          owner-secrets: ${{ secrets.DEMO_IMMUTABLE_RELEASE_SECRETS }}
          smtp-password: ${{ secrets.STAGE_SMTP_PASSWORD }}
          shop-storefront-api-key: ${{ secrets.SHOP_STOREFRONT_API_KEY }}
          n1-storefront-api-key: ${{ secrets.ONTOS_N1_STOREFRONT_API_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-zone-id: ${{ vars.CLOUDFLARE_STAGE_ZONE_ID }}
          zerops-shared-ipv4: ${{ vars.ZEROPS_SHARED_IPV4 }}
          # A push carries no inputs and does not warm; a dispatch's own value decides.
          upload-warmup: ${{ github.event.inputs.upload_warmup || 'false' }}
