name: ontos

services:
  ontos-db:
    container_name: ontos-db
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - ontos_postgres_data:/var/lib/postgresql
      - ./scripts/postgres/docker-init-runtime-role.sh:/docker-entrypoint-initdb.d/010-ontos-runtime-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 20

  ontos-spicedb:
    container_name: ontos-spicedb
    image: authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd
    command:
      - serve
      - --datastore-engine=memory
      - --datastore-bootstrap-files=/bootstrap/bootstrap.yaml
      - --http-enabled=true
      # One development certificate serves both listeners (scripts/local-spicedb-tls.mts).
      - --grpc-tls-cert-path=/tls/cert.pem
      - --grpc-tls-key-path=/tls/key.pem
      - --http-tls-cert-path=/tls/cert.pem
      - --http-tls-key-path=/tls/key.pem
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
    ports:
      - '${SPICEDB_GRPC_PORT}:50051'
      - '${SPICEDB_HTTP_PORT}:8443'
    volumes:
      - ./packages/core-runtime/spicedb/bootstrap.yaml:/bootstrap/bootstrap.yaml:ro
      - ./.spicedb-tls:/tls:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/grpc_health_probe
        - -addr=localhost:50051
        - -tls
        - -tls-ca-cert=/tls/cert.pem
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ontos_postgres_data:
    name: ontos_postgres_data
