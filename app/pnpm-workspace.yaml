catalog:
  '@app/commerce-customer-context': workspace:*
  '@app/shared-contracts': workspace:*
  '@app/work-tasks': workspace:*
  '@techsio/ui-kit': 0.59.3
catalogMode: strict

catalogs:
  ultramodern:
    '@modern-js/adapter-rstest': 'npm:@bleedingdev/modern-js-adapter-rstest@3.11.3-ultramodern.1'
    '@modern-js/app-tools': 'npm:@bleedingdev/modern-js-app-tools@3.11.3-ultramodern.1'
    '@modern-js/app-tools-extensions': 'npm:@bleedingdev/modern-js-app-tools-extensions@3.11.3-ultramodern.1'
    '@modern-js/backend-federation-contracts': 'npm:@bleedingdev/modern-js-backend-federation-contracts@3.11.3-ultramodern.1'
    '@modern-js/bff-effect': 'npm:@bleedingdev/modern-js-bff-effect@3.11.3-ultramodern.1'
    '@modern-js/boundary-debugger': 'npm:@bleedingdev/modern-js-boundary-debugger@3.11.3-ultramodern.1'
    '@modern-js/code-tools': 'npm:@bleedingdev/modern-js-code-tools@3.11.3-ultramodern.1'
    '@modern-js/federation-runtime': 'npm:@bleedingdev/modern-js-federation-runtime@3.11.3-ultramodern.1'
    '@modern-js/i18n-integration': 'npm:@bleedingdev/modern-js-i18n-integration@3.11.3-ultramodern.1'
    '@modern-js/plugin-bff': 'npm:@bleedingdev/modern-js-plugin-bff@3.11.3-ultramodern.1'
    '@modern-js/plugin-bff-build-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-build-extensions@3.11.3-ultramodern.1'
    '@modern-js/plugin-bff-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-extensions@3.11.3-ultramodern.1'
    '@modern-js/plugin-i18n': 'npm:@bleedingdev/modern-js-plugin-i18n@3.11.3-ultramodern.1'
    '@modern-js/plugin-tanstack': 'npm:@bleedingdev/modern-js-plugin-tanstack@3.11.3-ultramodern.1'
    '@modern-js/runtime': 'npm:@bleedingdev/modern-js-runtime@3.11.3-ultramodern.1'
    '@modern-js/runtime-extensions': 'npm:@bleedingdev/modern-js-runtime-extensions@3.11.3-ultramodern.1'
    '@modern-js/runtime-renderer-extensions': 'npm:@bleedingdev/modern-js-runtime-renderer-extensions@3.11.3-ultramodern.1'
    '@modern-js/ultramodern-app-tools': 'npm:@bleedingdev/modern-js-ultramodern-app-tools@3.11.3-ultramodern.1'
    '@modern-js/ultramodern-create': 'npm:@bleedingdev/modern-js-ultramodern-create@3.11.3-ultramodern.1'

packages:
  - apps/*
  - verticals/*
  - packages/*
  - akros-storefront
  - n1-storefront
enableGlobalVirtualStore: false
packageImportMethod: clone-or-copy
minimumReleaseAge: 0
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'tsrs@0.25.0-ts7.1.0-beta'
trustPolicyIgnoreAfter: 1440
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true
peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
overrides:
  '@effect/tsgo': 0.70.0
  tsrs: 0.25.0-ts7.1.0-beta
  '@tanstack/react-router': 1.170.39
  '@tanstack/router-core': 1.171.32
  '@effect/opentelemetry': 4.0.7
  '@effect/platform-node-shared': 4.0.7
  node-fetch: ^3.3.2
  '@tanstack/history': 1.162.4
  zod: 4.6.7
  # UltraModern workspace policy: the signed braces fork bounds parser nesting; sharp 0.35.5 is the patched release.
  'braces@>=3.0.0 <3.0.4': npm:@bleedingdev/braces@3.0.4
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'dompurify@>=3.0.0 <3.4.17': 3.4.17
  'seroval@<1.6.8': 1.6.9
  'seroval-plugins@<1.6.8': 1.6.9
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
patchedDependencies:
  # upstream: https://github.com/web-infra-dev/rstest/blob/75b848b384a9e47ac48e805ed239b1655a31e57c/packages/core/src/runtime/worker/env/happyDom.ts
  # Keep the happy-dom fetch family coherent: Node Headers loses credentials when read by happy-dom Request.
  '@rstest/core@0.12.6': patches/@rstest__core@0.12.6.patch
  # upstream: https://github.com/BleedingDev/ultramodern.js/tree/main/packages/server/utils
  # Compile each BFF server closure once from the TS 7 module graph, with an rspack build cache and incremental tsgo.
  # ONTOS_CI_TYPECHECK_SEPARATE=1 (the gates' and the stage's unit builds, scripts/zerops/build-app.sh; also drops source
  # maps) or ULTRAMODERN_SKIP_SERVER_TYPECHECK=1 skips the server declaration emit and TS-Go check; CI gates typecheck
  # every unit.
  '@bleedingdev/modern-js-server-utils@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-server-utils@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/BleedingDev/ultramodern.js/tree/main/packages/toolkit/ultramodern-create (preserve unrelated shells)
  # compiler-prepare accepts the reviewed @effect/tsgo 0.70.0 tsrs contract (tsrs 0.25.0, Oxlint 1.91-1.94; adds win32-arm64).
  '@bleedingdev/modern-js-ultramodern-create@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-ultramodern-create@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/ultramodernjs/ultramodern.js
  '@bleedingdev/modern-js-app-tools@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-app-tools@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/ultramodernjs/ultramodern.js
  '@bleedingdev/modern-js-plugin-bff@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-plugin-bff@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/web-infra-dev/nde/tree/main
  ndepe@0.1.13: patches/ndepe@0.1.13.patch
  # upstream: https://github.com/TanStack/router/tree/84bde660a12d82e8c74859b3240157af7566f843/packages/router-core
  '@tanstack/router-core@1.171.32': patches/@tanstack__router-core@1.171.32.patch
  # upstream: https://github.com/drizzle-team/drizzle-orm/pull/6380 (optional policy/role fields)
  # upstream: https://github.com/drizzle-team/drizzle-orm/pull/6429 (Effect 4.0.0 SqlError path and Schema.isBetweenLength; merged on rc5, unreleased)
  # TS 7.1: https://github.com/microsoft/TypeScript/pull/64307; share the unchanged distributive returning conditional across base/derived declarations.
  drizzle-orm@1.0.0-rc.5-ab785fc: patches/drizzle-orm-rc5-declarations.patch
  # upstream: https://github.com/BleedingDev/ultramodern.js (app-tools-extensions backend-federation-build codegen)
  # A unit may opt in (package.json modernjs.backendFederation.containerMinify: "whitespace-syntax") to whitespace and
  # syntax minification of its backend federation container only; identifiers are never mangled and names are kept.
  # Typecheck compiler discovery (internal-effect-discovery) accepts the reviewed @effect/tsgo 0.70.0 tsrs contract.
  '@bleedingdev/modern-js-app-tools-extensions@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-app-tools-extensions@3.11.3-ultramodern.1.patch
  # Only commerce-customer-context opts in: its container measured trunk 16,510,159 / main 16,090,643 / merged
  # 17,875,235 bytes against the 16,777,216-byte federation entry limit. Follow-up: slim its import graph (Core root
  # barrel exports, the outbox worker host behind gateway-context-server), then drop the opt-in and the app-tools-extensions patch.
  # upstream: https://github.com/ultramodernjs/ultramodern.js/blob/ae58cda012e02d73d4c63288cbaaa908120ed98b/packages/toolkit/code-tools/src/strict-effect-runtime.ts
  # Prove immutable native routes and Effect.fn recovery captures; reject mutated native bindings.
  # Model runtime schema access without rejecting type-only queries; resolve declared Effect routes.
  '@bleedingdev/modern-js-code-tools@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-code-tools@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/BleedingDev/ultramodern.js/tree/main/packages/server/core
  # MODERN_SERVER_RENDER_RESOURCES=lazy defers owner page resources until rendering, never for BFF/static requests.
  # MODERN_SERVER_IMMUTABLE_ASSETS=true caches bounded positive metadata in immutable production containers.
  '@bleedingdev/modern-js-server-core@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-server-core@3.11.3-ultramodern.1.patch
  # upstream: https://github.com/millionco/react-doctor (require array evidence before suggesting Set membership)
  oxlint-plugin-react-doctor@0.9.12: patches/oxlint-plugin-react-doctor@0.9.12.patch
  # upstream: https://github.com/Effect-TS/effect/tree/main/packages/sql-pg (read-only native pool counters)
  # No acquisition, codec, transaction or sizing changes.
  '@effect/sql-pg@4.0.7': patches/@effect__sql-pg@4.0.7.patch
  # upstream: https://github.com/BleedingDev/ultramodern.js/tree/main/packages/server/runtime-extensions
  # Preserve negotiation/406 while skipping probes for explicitly absent compressed assets; retain immutable MF lists.
  '@bleedingdev/modern-js-server-runtime-extensions@3.11.3-ultramodern.1': patches/@bleedingdev__modern-js-server-runtime-extensions@3.11.3-ultramodern.1.patch
