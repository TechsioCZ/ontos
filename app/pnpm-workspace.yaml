catalogs:
  ultramodern:
    '@modern-js/adapter-rstest': 'npm:@bleedingdev/modern-js-adapter-rstest@3.11.3-ultramodern.17'
    '@modern-js/app-tools': 'npm:@bleedingdev/modern-js-app-tools@3.11.3-ultramodern.17'
    '@modern-js/app-tools-extensions': 'npm:@bleedingdev/modern-js-app-tools-extensions@3.11.3-ultramodern.17'
    '@modern-js/backend-federation-contracts': 'npm:@bleedingdev/modern-js-backend-federation-contracts@3.11.3-ultramodern.17'
    '@modern-js/bff-effect': 'npm:@bleedingdev/modern-js-bff-effect@3.11.3-ultramodern.17'
    '@modern-js/boundary-debugger': 'npm:@bleedingdev/modern-js-boundary-debugger@3.11.3-ultramodern.17'
    '@modern-js/code-tools': 'npm:@bleedingdev/modern-js-code-tools@3.11.3-ultramodern.17'
    '@modern-js/federation-runtime': 'npm:@bleedingdev/modern-js-federation-runtime@3.11.3-ultramodern.17'
    '@modern-js/i18n-integration': 'npm:@bleedingdev/modern-js-i18n-integration@3.11.3-ultramodern.17'
    '@modern-js/plugin-bff': 'npm:@bleedingdev/modern-js-plugin-bff@3.11.3-ultramodern.17'
    '@modern-js/plugin-bff-build-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-build-extensions@3.11.3-ultramodern.17'
    '@modern-js/plugin-bff-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-extensions@3.11.3-ultramodern.17'
    '@modern-js/plugin-i18n': 'npm:@bleedingdev/modern-js-plugin-i18n@3.11.3-ultramodern.17'
    '@modern-js/plugin-tanstack': 'npm:@bleedingdev/modern-js-plugin-tanstack@3.11.3-ultramodern.17'
    '@modern-js/runtime': 'npm:@bleedingdev/modern-js-runtime@3.11.3-ultramodern.17'
    '@modern-js/runtime-renderer-extensions': 'npm:@bleedingdev/modern-js-runtime-renderer-extensions@3.11.3-ultramodern.17'
    '@modern-js/ultramodern-app-tools': 'npm:@bleedingdev/modern-js-ultramodern-app-tools@3.11.3-ultramodern.17'
    '@modern-js/ultramodern-create': 'npm:@bleedingdev/modern-js-ultramodern-create@3.11.3-ultramodern.17'

packages:
  - apps/*
  - verticals/*
  - packages/*
enableGlobalVirtualStore: false
packageImportMethod: clone-or-copy
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Official upstream release; tarball integrity and source provenance verified.
  - 'effect-rstest@1.0.0'
  # The design system ships from the same organisation; its releases are taken the day they publish.
  - '@techsio/ui-kit@0.67.0'
  # Better Auth 1.7.23 release cohort.
  - better-auth@1.7.23
  - '@better-auth/api-key@1.7.23'
  - '@better-auth/cimd@1.7.23'
  - '@better-auth/core@1.7.23'
  - '@better-auth/drizzle-adapter@1.7.23'
  - '@better-auth/kysely-adapter@1.7.23'
  - '@better-auth/mcp@1.7.23'
  - '@better-auth/memory-adapter@1.7.23'
  - '@better-auth/mongo-adapter@1.7.23'
  - '@better-auth/oauth-provider@1.7.23'
  - '@better-auth/prisma-adapter@1.7.23'
  - '@better-auth/telemetry@1.7.23'
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'tsrs@7.1.0-beta.tsrs3'
trustPolicyIgnoreAfter: 1440
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true
peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
overrides:
  # The cohort's Rust toolchain supplies type-aware lint and type checking; these are optional peer backends.
  'oxlint@1.94.0>oxlint-tsgolint': '-'
  '@rsbuild/plugin-type-check@1.6.1>@typescript/native-preview': '-'
  'ts-checker-rspack-plugin@1.6.2>@typescript/native-preview': '-'
  '@effect/tsgo': 0.73.2
  tsrs: 7.1.0-beta.tsrs3
  '@tanstack/router-core': 'https://github.com/ultramodernjs/ultramodern.js/releases/download/native-renderers-0b3f7ad610d8acc0b939402ba9a87d094c8576ff-44553146814-1/tanstack-router-core-1.171.39.tgz'
  '@effect/platform-node-shared': 4.1.4
  node-fetch: ^3.3.2
  '@tanstack/history': 1.162.5
  zod: 4.6.7
  # UltraModern workspace policy: the signed braces fork bounds parser nesting; sharp 0.35.5 is the patched release.
  'braces@>=3.0.0 <3.0.4': npm:@bleedingdev/braces@3.0.4
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.4': 8.12.4
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'axios@>=1.0.0 <1.21.1': 1.21.1
  'brace-expansion@>=5.0.0 <5.0.13': 5.0.13
  'tar@>=7.0.0 <7.5.23': 7.5.23
  'seroval@>=1.0.0 <1.8.1': 1.8.2
  'seroval-plugins@>=1.0.0 <1.8.0': 1.8.0
  'qs@>=6.0.0 <6.17.1': 6.17.1
  'smol-toml@>=1.0.0 <1.9.1': 1.9.1
  'serialize-javascript@>=7.0.0 <7.1.4': 7.1.4
  'ws@>=8.0.0 <8.23.0': 8.23.0
  'isomorphic-ws@5.0.0>ws:peer': '*'
  'follow-redirects@>=1.0.0 <1.16.3': 1.16.3
  'postcss-selector-parser@>=7.0.0 <7.2.1': 7.2.1
  'react-router@>=8.0.0 <8.5.1': 8.5.1
  'dompurify@>=3.0.0 <3.4.18': 3.4.18
packageExtensions:
  '@rslib/core@1.0.7':
    peerDependencies:
      rsbuild-plugin-dts: 1.0.7
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
patchedDependencies:
  # upstream: https://github.com/web-infra-dev/nde/tree/main
  ndepe@0.1.13: patches/ndepe@0.1.13.patch
  # upstream: https://github.com/drizzle-team/drizzle-orm/pull/6380 (optional policy/role fields)
  # upstream: https://github.com/drizzle-team/drizzle-orm/pull/6429 (Effect 4.0.0 SqlError path and Schema.isBetweenLength; merged on rc5, unreleased)
  # TS 7.1: https://github.com/microsoft/TypeScript/pull/64307; share the unchanged distributive returning conditional across base/derived declarations.
  drizzle-orm@1.0.0-rc.5-ab785fc: patches/drizzle-orm-rc5-declarations.patch
