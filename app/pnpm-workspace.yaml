    '@modern-js/ultramodern-create': 'npm:@bleedingdev/modern-js-ultramodern-create@3.9.0-ultramodern.14'

packages:
  - apps/*
  - verticals/*
  - packages/*
enableGlobalVirtualStore: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@bleedingdev/*'
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
trustPolicyExclude:
  - '@effect/opentelemetry@4.0.0-rc.117'
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true
peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
    '@effect/vitest>effect': 4.0.0-rc.117
overrides:
  react-server-dom-rspack: 0.1.0
  '@tanstack/react-router': 1.170.39
  '@tanstack/router-core': 1.171.32
  '@effect/opentelemetry': 4.0.0-rc.117
  '@effect/platform-node-shared': 4.0.0-rc.117
  '@rsbuild/core': 2.2.9
  effect: npm:@bleedingdev/effect@4.0.0-rc.117
  node-fetch: ^3.3.2
  '@tanstack/history': 1.162.4
  zod: 4.6.5
  '@effect/vitest': 4.0.0-rc.117
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
patchedDependencies:
  eslint-plugin-perfectionist@5.10.1: patches/eslint-plugin-perfectionist@5.10.1.patch
  '@vercel/nft@0.29.2': patches/@vercel__nft@0.29.2.patch
  '@better-fetch/fetch@1.3.1': patches/@better-fetch__fetch@1.3.1.patch
  drizzle-orm@1.0.0-rc.5-ab785fc: patches/drizzle-orm-rc5-declarations.patch
packageExtensions:
  eslint-plugin-perfectionist@5.10.1:
    dependencies:
      '@typescript-eslint/types': 8.69.0
