  - '@effect/opentelemetry@4.0.0-beta.94'
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true

peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
    '@module-federation/dts-plugin>typescript': '7.0.2'
    '@module-federation/enhanced>typescript': '7.0.2'
    '@module-federation/modern-js-v3>typescript': '7.0.2'
    '@module-federation/rspack>typescript': '7.0.2'
    '@effect/vitest>effect': '4.0.0-beta.94'
    'i18next>typescript': '7.0.2'

overrides:
  '@tanstack/react-router': 1.170.17
  '@tanstack/router-core': 1.171.14
  '@effect/opentelemetry': 4.0.0-beta.94
  '@effect/vitest': 4.0.0-beta.94
  effect: 4.0.0-beta.94
  node-fetch: '^3.3.2'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true

patchedDependencies:
  '@module-federation/dts-plugin@2.7.0': patches/@module-federation__dts-plugin@2.7.0.patch
  '@module-federation/modern-js-v3@2.7.0': patches/@module-federation__modern-js-v3@2.7.0.patch
