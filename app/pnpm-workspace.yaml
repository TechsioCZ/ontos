    '@modern-js/runtime': 'npm:@bleedingdev/modern-js-runtime@3.9.0-ultramodern.14'
    '@modern-js/runtime-extensions': 'npm:@bleedingdev/modern-js-runtime-extensions@3.9.0-ultramodern.14'
    '@modern-js/runtime-renderer-extensions': 'npm:@bleedingdev/modern-js-runtime-renderer-extensions@3.9.0-ultramodern.14'
