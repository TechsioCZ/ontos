    '@modern-js/code-tools': 'npm:@bleedingdev/modern-js-code-tools@3.9.0-ultramodern.14'
    '@modern-js/federation-runtime': 'npm:@bleedingdev/modern-js-federation-runtime@3.9.0-ultramodern.14'
    '@modern-js/i18n-integration': 'npm:@bleedingdev/modern-js-i18n-integration@3.9.0-ultramodern.14'
    '@modern-js/plugin-bff': 'npm:@bleedingdev/modern-js-plugin-bff@3.9.0-ultramodern.14'
    '@modern-js/plugin-bff-build-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-build-extensions@3.9.0-ultramodern.14'
    '@modern-js/plugin-bff-extensions': 'npm:@bleedingdev/modern-js-plugin-bff-extensions@3.9.0-ultramodern.14'
    '@modern-js/plugin-i18n': 'npm:@bleedingdev/modern-js-plugin-i18n@3.9.0-ultramodern.14'
