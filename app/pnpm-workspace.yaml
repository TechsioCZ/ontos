  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
patchedDependencies:
  # upstream: https://github.com/vercel/nft/pull/614
  '@vercel/nft@0.29.2': patches/@vercel__nft@0.29.2.patch
  # upstream: https://github.com/better-auth/better-fetch/pull/126 and /pull/125 (released in 1.3.2).
  # better-auth 1.7.2 pins 1.3.1; 1.7.3+ drops account.issuer, so the bump waits for that auth schema migration.
  '@better-fetch/fetch@1.3.1': patches/@better-fetch__fetch@1.3.1.patch
