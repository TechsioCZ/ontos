# Sales-demo override for app/docker-compose.yml. It isolates the demo containers and the Postgres
# volume from the primary OntOS checkout (which uses ontos-db / ontos_postgres_data) while keeping
# the same host ports (5433, 50051, 8443). It also runs Mailpit for real e-mail capture (SMTP 1025,
# web UI and API 8025). Use through scripts/demo/up.sh.
name: ontos-demo

services:
  ontos-db:
    container_name: ontos-demo-db
  ontos-spicedb:
    container_name: ontos-demo-spicedb
  # Real e-mail capture for the demo: SMTP 127.0.0.1:1025, web UI + REST API http://localhost:8025.
  ontos-mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: ontos-demo-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      # Reverse DNS of the Docker gateway times out, which delayed every SMTP greeting by 8 s.
      MP_SMTP_DISABLE_RDNS: '1'
      TZ: Europe/Prague
    volumes:
      - ontos_mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ontos_postgres_data:
    name: ontos_demo_postgres_data
  ontos_mailpit_data:
    name: ontos_demo_mailpit_data
