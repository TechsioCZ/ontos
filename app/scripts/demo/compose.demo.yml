# Local demo identity. Explicit DEMO_INSTANCE values receive independent containers and data.
name: ${DEMO_PROJECT:-ontos-demo}
services:
  ontos-db:
    container_name: ${DEMO_PROJECT:-ontos-demo}-db
  ontos-spicedb:
    container_name: ${DEMO_PROJECT:-ontos-demo}-spicedb
volumes:
  ontos_postgres_data:
    name: ${DEMO_VOLUME:-ontos_demo_postgres_data}
