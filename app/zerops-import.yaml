services:
  - hostname: db18
    type: postgresql:single@18
  - hostname: spicedb
    type: docker@26.1.5
  - hostname: migrator
    type: alpine/nodejs@26
  - hostname: app
    type: alpine/nodejs@26
    enableSubdomainAccess: true
    # The Shell, the owners, the Outbox worker and the host share one container. At a 2.5 GiB floor it throttled
    # at memory.high and swapped with no users (2026-11-11), so RAM never goes below 4 GiB; the host derives each
    # child's heap limit from the container's memory once, at start (scripts/zerops/heap-limits.mts). Zerops may grow
    # it to 8 GiB; that headroom is for memory outside the heaps.
    # At least four dedicated CPUs: the host, the Shell, the owners and the Outbox worker are four Node processes, and
    # on one CPU they blocked one another (2026-11-13: the Outbox loop stalled 610 ms while using 75 ms of CPU itself).
    # Zerops scales up to eight under load. One container only: the host holds the single serving authority.
    # This file only creates a service; the running one was resized in Zerops on 2026-11-13 (swap stays off there).
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 4
      maxCpu: 8
      minRam: 4
      maxRam: 8
      minFreeRamGB: 0.5
      minDisk: 10
      maxDisk: 20
    minContainers: 1
    maxContainers: 1
  - hostname: storefront
    type: alpine/nodejs@26
    enableSubdomainAccess: true
  # The pseudonymous demo e-shop (ontos-stage-shop): the same `storefront` setup with its own key and brand in the
  # service variables (STOREFRONT_BRAND, ONTOS_AKROS_STOREFRONT_API_KEY, ONTOS_STOREFRONT_APP_ID,
  # ONTOS_STOREFRONT_LEGAL_ENTITY_ID). Shared CPU and the smallest memory: it serves demo traffic only.
  - hostname: shop
    type: alpine/nodejs@26
    enableSubdomainAccess: true
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.5
      maxRam: 1
      minDisk: 1
      maxDisk: 2
    minContainers: 1
    maxContainers: 1
  # The N1 e-shop (ontos-stage-n1): the `n1` setup, one minimal Next container. Its tenant and seller are in zerops.yaml;
  # its storefront key is a sensitive service variable synced from the stage-edge secret (ONTOS_N1_STOREFRONT_API_KEY).
  - hostname: n1
    type: alpine/nodejs@26
    enableSubdomainAccess: true
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.5
      maxRam: 1
      minDisk: 1
      maxDisk: 2
    minContainers: 1
    maxContainers: 1
