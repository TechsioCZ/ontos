services:
  - hostname: db18
    type: postgresql:single@18
  - hostname: spicedb
    type: docker@26.1.5
  - hostname: migrator
    type: nodejs@24
  - hostname: app
    type: nodejs@24
    enableSubdomainAccess: true
    # Owner render resources are lazy and immutable asset metadata is cached. The measured login bursts fit
    # a 2.5 GiB floor; keep 0.5 GiB free and allow growth to 4 GiB instead of relying on swap.
    # Reserve one CPU for the Shell, owners and Outbox while every menu destination is prefetched.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 1
      maxCpu: 1
      minRam: 2.5
      maxRam: 4
      minFreeRamGB: 0.5
      minDisk: 10
      maxDisk: 20
    minContainers: 1
    maxContainers: 1
  - hostname: storefront
    type: nodejs@24
    enableSubdomainAccess: true
