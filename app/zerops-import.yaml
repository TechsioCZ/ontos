services:
  - hostname: db18
    type: postgresql:single@18
  - hostname: spicedb
    type: docker@26.1.5
  - hostname: migrator
    type: nodejs@24
  - hostname: app
    type: nodejs@24
    enableSubdomainAccess: true
    # One container runs the Shell, every owner and the Outbox host; memory scales up before it runs out.
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 2
      maxRam: 4
      minFreeRamGB: 0.5
      minDisk: 10
      maxDisk: 20
    minContainers: 1
    maxContainers: 1
  - hostname: storefront
    type: nodejs@24
    enableSubdomainAccess: true
