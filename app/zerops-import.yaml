services:
  - hostname: db18
    type: postgresql:single@18
  - hostname: spicedb
    type: docker@26.1.5
  - hostname: migrator
    type: nodejs@24
  - hostname: app
    type: nodejs@24
    enableSubdomainAccess: true
    # The combined working set needs 3 GiB at startup. Reactive scaling from 2 GiB allowed
    # memory.high reclaim and swap-in to stall login prefetch before additional RAM arrived.
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 3
      maxRam: 4
      minFreeRamGB: 0.5
      minDisk: 10
      maxDisk: 20
    minContainers: 1
    maxContainers: 1
  - hostname: storefront
    type: nodejs@24
    enableSubdomainAccess: true
