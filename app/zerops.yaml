# Stage deployment topology. Secrets are configured in the corresponding
# Zerops services and are never stored in this file.

zerops:
  - setup: 'migrator'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
      deployFiles:
        - 'app/.mise.toml'
        - 'app/apps/shell-super-app'
        - 'app/node_modules'
        - 'app/package.json'
        - 'app/packages'
        - 'app/pnpm-lock.yaml'
        - 'app/pnpm-workspace.yaml'
        - 'app/scripts'
        - 'app/verticals/contacts'
        - 'app/verticals/party-registry'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8080
          path: '/ready'
        failureTimeout: 10m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
      envVariables:
        BETTER_AUTH_SECRET: ${shellsuperapp_BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${shellsuperapp_BETTER_AUTH_URL}
        DATABASE_ADMIN_URL: postgresql://${db_superUser}:${db_superUserPassword}@${db_hostname}:${db_port}/${db_dbName}
        MIGRATOR_PORT: '8080'
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: migrator
      healthCheck:
        httpGet:
          port: 8080
          path: '/ready'
      start: sh -c 'cd app && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec node scripts/run-zerops-migrator.mjs'

  - setup: 'spicedb'
    build:
      base: 'alpine@3.23'
      deployFiles:
        - 'app/packages/core-runtime/spicedb/stage-bootstrap.yaml'
        - 'app/scripts/run-zerops-spicedb.sh'
    deploy:
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 8443
          path: '/healthz'
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: 'alpine/docker@26.1'
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:17-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: true
      envVariables:
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        httpGet:
          port: 8443
          path: '/healthz'
      start: sh app/scripts/run-zerops-spicedb.sh

  - setup: 'contacts'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && NODE_OPTIONS=--max-old-space-size=4096 PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false --filter '@app/contacts' run build
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'contacts' --package '@app/contacts' --package-dir 'verticals/contacts'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/contacts/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/contacts/local-overlay.json'
      deployFiles:
        - 'app/.zerops/runtime/contacts'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4101
          path: '/contacts-api/contacts/readiness'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 4101
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '4101'
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: contacts
        VERTICAL_CONTACTS_PORT: '4101'
        ONTOS_SHELL_GATEWAY_BASE_URL: 'http://shellsuperapp:3020/shell-super-app-api'
        ONTOS_PARTY_REGISTRY_API_BASE_URL: 'http://party-registry:4102/party-registry-api'
      healthCheck:
        httpGet:
          port: 4101
          path: '/contacts-api/contacts/readiness'
      start: sh -c 'cd app/.zerops/runtime/contacts && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'

  - setup: 'party-registry'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && NODE_OPTIONS=--max-old-space-size=4096 PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false --filter '@app/party-registry' run build
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'party-registry' --package '@app/party-registry' --package-dir 'verticals/party-registry'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/party-registry/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/party-registry/local-overlay.json'
      deployFiles:
        - 'app/.zerops/runtime/party-registry'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4102
          path: '/party-registry-api/party-registry/readiness'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 4102
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '4102'
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: party-registry
        VERTICAL_PARTY_REGISTRY_PORT: '4102'
      healthCheck:
        httpGet:
          port: 4102
          path: '/party-registry-api/party-registry/readiness'
      start: sh -c 'cd app/.zerops/runtime/party-registry && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'

  - setup: 'shellsuperapp'
    build:
      base: 'alpine@3.23'
      envVariables:
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && NODE_OPTIONS=--max-old-space-size=4096 PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false --filter '@app/shell-super-app' run build
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'shell-super-app' --package '@app/shell-super-app' --package-dir 'apps/shell-super-app'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/shell-super-app/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/shell-super-app/local-overlay.json'
      deployFiles:
        - 'app/.zerops/runtime/shell-super-app'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3020
          path: '/'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 3020
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '3020'
        SHELL_SUPER_APP_PORT: '3020'
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: 'shell-super-app'
      healthCheck:
        httpGet:
          port: 3020
          path: '/'
      start: sh -c 'cd app/.zerops/runtime/shell-super-app && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'

  # <generated-outbox-worker-deployments>
  - setup: 'party-registry-worker'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'party-registry' --package '@app/party-registry' --package-dir 'verticals/party-registry' --worker
      deployFiles:
        - 'app/.zerops/runtime/party-registry-worker'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4102
          path: '/ready'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 4102
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '4102'
        OUTBOX_WORKER_HEALTH_PORT: '4102'
        DATABASE_URL: ${party-registry_DATABASE_URL}
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: party-registry-worker
      healthCheck:
        httpGet:
          port: 4102
          path: '/ready'
      start: sh -c 'cd app/.zerops/runtime/party-registry-worker && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'
  # </generated-outbox-worker-deployments>
