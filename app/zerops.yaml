# Stage deployment topology. Secrets are configured in the corresponding
# Zerops services and are never stored in this file.

zerops:
  - setup: 'migrator'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile
      addToRunPrepare:
        - 'app/scripts/install-zerops-node.sh'
      deployFiles:
        - 'app/.mise.toml'
        - 'app/apps/shell-super-app'
        - 'app/node_modules'
        - 'app/package.json'
        - 'app/packages'
        - 'app/pnpm-lock.yaml'
        - 'app/pnpm-workspace.yaml'
        - 'app/scripts'
        - 'app/verticals/crm'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8080
          path: '/ready'
        failureTimeout: 10m
        retryPeriod: 10s
    run:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh app/scripts/install-zerops-node.sh --with-pnpm
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
      envVariables:
        BETTER_AUTH_SECRET: ${shellsuperapp_BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${shellsuperapp_BETTER_AUTH_URL}
        DATABASE_ADMIN_URL: ${db_connectionString}
        MIGRATOR_PORT: '8080'
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: migrator
      healthCheck:
        httpGet:
          port: 8080
          path: '/ready'
      start: cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/run-zerops-migrator.mjs

  - setup: 'spicedb'
    build:
      base: 'alpine@3.23'
      deployFiles:
        - 'app/packages/core-runtime/spicedb/stage-bootstrap.yaml'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8443
          path: '/healthz'
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: 'alpine/docker@26.1'
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:17-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: true
      envVariables:
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        httpGet:
          port: 8443
          path: '/healthz'
      start: |
        docker run --rm --network=host \
          -e SPICEDB_DATASTORE_ENGINE \
          -e SPICEDB_DATASTORE_CONN_URI \
          authzed/spicedb:v1.56.0 datastore migrate head
        schema_count="$(docker run --rm --network=host \
          -e SPICEDB_DATASTORE_CONN_URI \
          postgres:17-alpine sh -c \
          'psql "$SPICEDB_DATASTORE_CONN_URI" --no-psqlrc --tuples-only --no-align --command "select count(*) from namespace_config"')"
        if [ "$schema_count" = '0' ]; then
          exec docker run --rm --network=host \
            -e SPICEDB_DATASTORE_ENGINE \
            -e SPICEDB_DATASTORE_CONN_URI \
            -e SPICEDB_GRPC_PRESHARED_KEY \
            -v /var/www/app/packages/core-runtime/spicedb/stage-bootstrap.yaml:/bootstrap/stage-bootstrap.yaml:ro \
            authzed/spicedb:v1.56.0 serve \
            --datastore-bootstrap-files=/bootstrap/stage-bootstrap.yaml \
            --http-enabled
        fi
        exec docker run --rm --network=host \
          -e SPICEDB_DATASTORE_ENGINE \
          -e SPICEDB_DATASTORE_CONN_URI \
          -e SPICEDB_GRPC_PRESHARED_KEY \
          authzed/spicedb:v1.56.0 serve \
          --http-enabled

  - setup: 'crm'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --filter '@app/crm' run build
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm run zerops:materialize -- --app 'crm' --package '@app/crm' --package-dir 'verticals/crm'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/crm/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/crm/local-overlay.json'
      addToRunPrepare:
        - 'app/scripts/install-zerops-node.sh'
      deployFiles:
        - 'app/.zerops/runtime/crm'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4101
          path: '/crm-api/crm/readiness'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh app/scripts/install-zerops-node.sh
      ports:
        - port: 4101
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: crm
        VERTICAL_CRM_PORT: '4101'
      healthCheck:
        httpGet:
          port: 4101
          path: '/crm-api/crm/readiness'
      start: cd 'app/.zerops/runtime/crm' && PATH="$HOME/.local/node-26.5.0/bin:$PATH" npm run serve

  - setup: 'shellsuperapp'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --filter '@app/shell-super-app' run build
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm run zerops:materialize -- --app 'shell-super-app' --package '@app/shell-super-app' --package-dir 'apps/shell-super-app'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/shell-super-app/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/shell-super-app/local-overlay.json'
      addToRunPrepare:
        - 'app/scripts/install-zerops-node.sh'
      deployFiles:
        - 'app/.zerops/runtime/shell-super-app'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3020
          path: '/'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh app/scripts/install-zerops-node.sh
      ports:
        - port: 3020
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        SHELL_SUPER_APP_PORT: '3020'
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: 'shell-super-app'
      healthCheck:
        httpGet:
          port: 3020
          path: '/'
      start: cd 'app/.zerops/runtime/shell-super-app' && PATH="$HOME/.local/node-26.5.0/bin:$PATH" npm run serve
