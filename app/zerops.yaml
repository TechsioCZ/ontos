# Stage deployment topology. Secrets are configured in the corresponding
# Zerops services and are never stored in this file.

zerops:
  - setup: 'migrator'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
      deployFiles:
        - 'app/.mise.toml'
        - 'app/apps/shell-super-app'
        - 'app/node_modules'
        - 'app/package.json'
        - 'app/packages'
        - 'app/pnpm-lock.yaml'
        - 'app/pnpm-workspace.yaml'
        - 'app/scripts'
        - 'app/verticals/crm'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8080
          path: '/ready'
        failureTimeout: 10m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
      envVariables:
        BETTER_AUTH_SECRET: ${shellsuperapp_BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${shellsuperapp_BETTER_AUTH_URL}
        DATABASE_ADMIN_URL: postgresql://${db_superUser}:${db_superUserPassword}@${db_hostname}:${db_port}/${db_dbName}
        MIGRATOR_PORT: '8080'
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: migrator
      healthCheck:
        httpGet:
          port: 8080
          path: '/ready'
      start: sh -c 'cd app && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec node scripts/run-zerops-migrator.mjs'

  - setup: 'spicedb'
    build:
      base: 'alpine@3.23'
      deployFiles:
        - 'app/packages/core-runtime/spicedb/stage-bootstrap.yaml'
        - 'app/scripts/run-zerops-spicedb.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8443
          path: '/healthz'
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: 'alpine/docker@26.1'
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:17-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: true
      envVariables:
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        httpGet:
          port: 8443
          path: '/healthz'
      start: sh app/scripts/run-zerops-spicedb.sh

  - setup: 'crm'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false --filter '@app/crm' run build
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'crm' --package '@app/crm' --package-dir 'verticals/crm'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/crm/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/crm/local-overlay.json'
      deployFiles:
        - 'app/.zerops/runtime/crm'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4101
          path: '/crm-api/crm/readiness'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 4101
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: crm
        VERTICAL_CRM_PORT: '4101'
      healthCheck:
        httpGet:
          port: 4101
          path: '/crm-api/crm/readiness'
      start: sh -c 'cd app/.zerops/runtime/crm && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'

  - setup: 'shellsuperapp'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
        - cd app && ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false --filter '@app/shell-super-app' run build
        - cd app && PATH="$HOME/.local/node-26.5.0/bin:$PATH" pnpm --config.enable-global-virtual-store=false run zerops:materialize -- --app 'shell-super-app' --package '@app/shell-super-app' --package-dir 'apps/shell-super-app'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/shell-super-app/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/shell-super-app/local-overlay.json'
      deployFiles:
        - 'app/.zerops/runtime/shell-super-app'
        - 'app/scripts/install-zerops-node.sh'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3020
          path: '/'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 3020
          protocol: tcp
          httpSupport: true
      envVariables:
        NODE_ENV: production
        SHELL_SUPER_APP_PORT: '3020'
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: 'shell-super-app'
      healthCheck:
        httpGet:
          port: 3020
          path: '/'
      start: sh -c 'cd app/.zerops/runtime/shell-super-app && PATH="/var/www/.local/node-26.5.0/bin:$PATH" exec npm run serve'
