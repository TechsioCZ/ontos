zerops:
  - setup: spicedb
    build:
      base: alpine@3.23
      deployFiles:
        - app/packages/core-runtime/spicedb/stage-bootstrap.yaml
        - app/scripts/run-zerops-spicedb.sh
        - app/scripts/spicedb-datastore-uri.sh
    deploy:
      temporaryShutdown: true
      readinessCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: alpine/docker@26.1
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:18.6-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: false
      envVariables:
        SPICEDB_DATABASE_HOST: ${db18_hostname}
        SPICEDB_DATABASE_PORT: ${db18_port}
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
      start: sh app/scripts/run-zerops-spicedb.sh
  - setup: storefront
    build:
      base: alpine@3.23
      envVariables:
        AKROS_STANDALONE_BUILD: '1'
        NEXT_TELEMETRY_DISABLED: '1'
        STOREFRONT_IMAGE_HOSTS: ''
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh 26.12.0 12.11.2
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm install --frozen-lockfile --filter 'akros-storefront...'
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm --filter akros-storefront run build
        - mkdir -p 'app/.zerops/runtime' && mv 'app/akros-storefront/.next/standalone' 'app/.zerops/runtime/akros-storefront'
        - cp -a 'app/akros-storefront/.next/static' 'app/.zerops/runtime/akros-storefront/akros-storefront/.next/static'
        - cp -a 'app/akros-storefront/public' 'app/.zerops/runtime/akros-storefront/akros-storefront/public'
        - mkdir -p 'app/.zerops/runtime/akros-storefront/node/bin' && cp "$HOME/.local/node-26.12.0/bin/node" 'app/.zerops/runtime/akros-storefront/node/bin/'
      deployFiles:
        - app/.zerops/runtime/akros-storefront
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3070
          path: /robots.txt
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: nodejs@24
      ports:
        - port: 3070
          protocol: tcp
          httpSupport: true
      envVariables:
        NEXT_TELEMETRY_DISABLED: '1'
        NODE_ENV: production
        ONTOS_SHELL_URL: http://app:3000
        PORT: '3070'
        STOREFRONT_IMAGE_HOSTS: ''
      healthCheck:
        httpGet:
          port: 3070
          path: /robots.txt
      start: sh -c 'test -n "$ONTOS_AKROS_STOREFRONT_API_KEY" || { echo "ONTOS_AKROS_STOREFRONT_API_KEY is required" >&2; exit 1; }; cd app/.zerops/runtime/akros-storefront && HOSTNAME=0.0.0.0 exec node/bin/node akros-storefront/server.js'
  # The whole application in one container: scripts/zerops/app-host.mts serves the Shell, every owner and the Outbox
  # Worker host, runs the owner migrations and publishes the Application Composition. The browser assets of owner
  # <appId> are served under /_m/<appId>/ on the one public origin.
  - setup: app
    build:
      base: alpine@3.23
      envVariables:
        BUILD_JOBS: '2'
        ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_SKIP_SERVER_TYPECHECK: '1'
        ZE_FAIL_BUILD: 'true'
      prepareCommands:
        - sudo apk add --no-cache curl git libstdc++ zstd
        - sh /build/source/app/scripts/install-zerops-node.sh 26.12.0 12.11.2
      buildCommands:
        # Zerops restores the build cache (and unpacks a pushed package) as root; the build user must own the tree, and Git
        # must trust it, or every release identity reads as `workspace`.
        - sudo chown -R "$(id -u):$(id -g)" . && git config --global --add safe.directory /build/source
        # Units the CI prebuilt arrive as one archive (zerops-stage.yml); build-app.sh keeps each unit whose digest matches.
        - if [ -f app/.zerops-prebuilt.tar.zst ]; then zstd -dc app/.zerops-prebuilt.tar.zst | tar -x -C app && rm app/.zerops-prebuilt.tar.zst; fi
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" node scripts/verify-zerops-workspace-install.mts
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" sh scripts/zerops/build-app.sh
        - mkdir -p 'app/.zerops/node' && cp -a "$HOME/.local/node-26.12.0/bin" "$HOME/.local/node-26.12.0/lib" 'app/.zerops/node/'
      deployFiles:
        - app/
      # Unchanged units reuse their last build (scripts/zerops/build-app.sh); Rspack and TS-Go keep their caches.
      cache:
        - app/.zerops/unit-cache
        - app/node_modules/.cache
        - app/apps/*/node_modules/.cache
        - app/verticals/*/node_modules/.cache
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3000
          path: /_host/ready
        failureTimeout: 15m
        retryPeriod: 10s
    run:
      base: nodejs@24
      ports:
        - port: 3000
          protocol: tcp
          httpSupport: true
      envVariables:
        # The portal realm lives in the shared database under the shared identities, as the stage release ran it.
        COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        EMAIL_PROVIDER: smtp
        NODE_ENV: production
        ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
        ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
        PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:${migrator_PARTY_REGISTRY_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PARTY_REGISTRY_DB_PASSWORD: ${migrator_PARTY_REGISTRY_DB_PASSWORD}
        PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:${migrator_PARTY_REGISTRY_WORKER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PARTY_REGISTRY_WORKER_DB_PASSWORD: ${migrator_PARTY_REGISTRY_WORKER_DB_PASSWORD}
        PORT: '3000'
        SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:${migrator_SHELL_GATEWAY_ISSUER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        SHELL_GATEWAY_ISSUER_DB_PASSWORD: ${migrator_SHELL_GATEWAY_ISSUER_DB_PASSWORD}
        SMTP_FROM: OntOS <noreply@ontos-stage.web-revolution.cz>
        SMTP_HOST: smtp.mx.cloudflare.net
        SMTP_PORT: '465'
        SMTP_SECURE: 'true'
        SMTP_USER: api_token
        SPICEDB_CA_CERT: ${spicedb_SPICEDB_GRPC_TLS_CERT}
        SPICEDB_DATABASE_PASSWORD: ${spicedb_SPICEDB_DATABASE_PASSWORD}
        SPICEDB_ENDPOINT: spicedb:50051
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: app
      healthCheck:
        httpGet:
          port: 3000
          path: /_host/live
      start: sh -c 'cd app && PATH="$PWD/.zerops/node/bin:$PATH" exec node scripts/zerops/app-host.mts'
