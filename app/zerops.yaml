# Generated by Modern.js UltraModern workspace tooling.

# Zerops runs each full-stack MicroVertical as a package-owned Node service.

zerops:
  - setup: 'shell-super-app'
    build:
      base: 'nodejs@26'
      buildCommands:
        - |
          curl https://mise.run | sh
          ~/.local/bin/mise install
          ~/.local/bin/mise exec -- pnpm install --frozen-lockfile
          ~/.local/bin/mise exec -- pnpm --filter '@app/shell-super-app' run build
          ~/.local/bin/mise exec -- pnpm run zerops:materialize -- --app 'shell-super-app' --package '@app/shell-super-app' --package-dir 'apps/shell-super-app'
          cp 'topology/reference-topology.json' '.zerops/runtime/shell-super-app/topology.json'
          cp 'topology/local-overlays/development.json' '.zerops/runtime/shell-super-app/local-overlay.json'
      deployFiles:
        - '.zerops/runtime/shell-super-app'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3020
          path: '/'
        failureTimeout: 120
        retryPeriod: 10
    run:
      base: 'nodejs@26'
      ports:
        - port: 3020
          protocol: TCP
          httpSupport: true
      envVariables:
        NODE_ENV: production
        SHELL_SUPER_APP_PORT: '3020'
        ULTRAMODERN_ZEROPS_SERVICE: 'shell-super-app'
      start: cd '.zerops/runtime/shell-super-app' && npm run serve

  - setup: 'crm'
    build:
      base: 'nodejs@26'
      buildCommands:
        - |
          curl https://mise.run | sh
          ~/.local/bin/mise install
          ~/.local/bin/mise exec -- pnpm install --frozen-lockfile
          ~/.local/bin/mise exec -- pnpm --filter '@app/crm' run build
          ~/.local/bin/mise exec -- pnpm run zerops:materialize -- --app 'crm' --package '@app/crm' --package-dir 'verticals/crm'
          cp 'topology/reference-topology.json' '.zerops/runtime/crm/topology.json'
          cp 'topology/local-overlays/development.json' '.zerops/runtime/crm/local-overlay.json'
      deployFiles:
        - '.zerops/runtime/crm'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4101
          path: '/crm-api/crm/readiness'
        failureTimeout: 120
        retryPeriod: 10
    run:
      base: 'nodejs@26'
      ports:
        - port: 4101
          protocol: TCP
          httpSupport: true
      envVariables:
        NODE_ENV: production
        VERTICAL_CRM_PORT: '4101'
        ULTRAMODERN_ZEROPS_SERVICE: 'crm'
      start: cd '.zerops/runtime/crm' && npm run serve
