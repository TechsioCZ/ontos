zerops:
  - setup: migrator
    build:
      base: alpine@3.23
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh 26.12.0 12.11.2
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" node scripts/verify-zerops-workspace-install.mts
        - mkdir -p 'app/.zerops/node' && cp -a "$HOME/.local/node-26.12.0/bin" "$HOME/.local/node-26.12.0/lib" 'app/.zerops/node/'
      deployFiles:
        - app/.mise.toml
        - app/.zerops/node
        - app/apps/shell-super-app
        - app/node_modules
        - app/package.json
        - app/packages
        - app/pnpm-lock.yaml
        - app/pnpm-workspace.yaml
        - app/scripts
        - app/tsconfig.base.json
        - app/verticals/catalog
        - app/verticals/assortment
        - app/verticals/commerce-customer-context
        - app/verticals/commerce-market-catalog
        - app/verticals/inventory
        - app/verticals/party-registry
        - app/verticals/payment-term-catalog
        - app/verticals/price-group-catalog
        - app/verticals/pricing
        - app/verticals/privacy
        - app/verticals/storefront-registry
        - app/verticals/tax
        - app/verticals/property-portfolio
        - app/verticals/property-leasing
        - app/verticals/legal-agreements
        - app/verticals/work-tasks
        - app/verticals/workforce
        - app/verticals/tagging
        - app/verticals/crm
        - app/verticals/sales-pipeline
        - app/verticals/merchandise
        - app/verticals/facility-operations
        - app/verticals/sales-insights
        - app/verticals/finance-billing
        - app/verticals/crm-activities
        - app/verticals/projects
        - 'app/database'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8080
          path: /ready
        failureTimeout: 10m
        retryPeriod: 10s
    run:
      base: nodejs@24
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
      envVariables:
        DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        MIGRATOR_PORT: '8080'
        NODE_ENV: production
        PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:${PARTY_REGISTRY_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:${PARTY_REGISTRY_WORKER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:${SHELL_GATEWAY_ISSUER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        SPICEDB_CA_CERT: ${spicedb_SPICEDB_GRPC_TLS_CERT}
        SPICEDB_ENDPOINT: spicedb:50051
        SPICEDB_DATABASE_PASSWORD: ${spicedb_SPICEDB_DATABASE_PASSWORD}
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: migrator
      healthCheck:
        httpGet:
          port: 8080
          path: /ready
      start: sh -c 'cd app && PATH="$PWD/.zerops/node/bin:$PATH" exec node scripts/run-zerops-migrator.mjs'
  - setup: spicedb
    build:
      base: alpine@3.23
      deployFiles:
        - app/packages/core-runtime/spicedb/stage-bootstrap.yaml
        - app/scripts/run-zerops-spicedb.sh
        - app/scripts/spicedb-datastore-uri.sh
    deploy:
      temporaryShutdown: true
      readinessCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: alpine/docker@26.1
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:18.6-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: false
      envVariables:
        SPICEDB_DATABASE_HOST: ${db18_hostname}
        SPICEDB_DATABASE_PORT: ${db18_port}
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
      start: sh app/scripts/run-zerops-spicedb.sh
  - setup: cloudflared
    build:
      base: alpine@3.23
      prepareCommands:
        - sudo apk add --no-cache curl
      buildCommands:
        - mkdir -p 'app/.zerops/runtime/cloudflared'
        - curl -fsSL -o 'app/.zerops/runtime/cloudflared/cloudflared' 'https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64'
        - echo '77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  app/.zerops/runtime/cloudflared/cloudflared' | sha256sum -c -
        - chmod +x 'app/.zerops/runtime/cloudflared/cloudflared'
      deployFiles:
        - app/.zerops/runtime/cloudflared
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 2000
          path: /ready
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: alpine@3.23
      ports:
        - port: 2000
          protocol: tcp
          httpSupport: true
      healthCheck:
        httpGet:
          port: 2000
          path: /ready
      envVariables:
        QUIC_GO_DISABLE_GSO: 'true'
        QUIC_GO_DISABLE_ECN: 'true'
      start: sh -c 'test -n "$TUNNEL_TOKEN" || { echo "TUNNEL_TOKEN is required" >&2; exit 1; }; exec app/.zerops/runtime/cloudflared/cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:2000 run'
  - setup: shellsuperapp
    build:
      base: alpine@3.23
      envVariables:
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ZE_FAIL_BUILD: 'true'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh 26.12.0 12.11.2
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" node scripts/verify-zerops-workspace-install.mts
        - cd app && NODE_OPTIONS=--max-old-space-size=4096 ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm --filter '@app/shell-super-app' run build
        - cd app && PATH="$HOME/.local/node-26.12.0/bin:$PATH" pnpm run zerops:materialize --app 'shell-super-app' --package '@app/shell-super-app' --package-dir 'apps/shell-super-app'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/shell-super-app/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/shell-super-app/local-overlay.json'
        - mkdir 'app/.zerops/runtime/shell-super-app/node' && cp -a "$HOME/.local/node-26.12.0/bin" "$HOME/.local/node-26.12.0/lib" 'app/.zerops/runtime/shell-super-app/node/'
      deployFiles:
        - app/.zerops/runtime/shell-super-app
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3020
          path: /
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: nodejs@24
      ports:
        - port: 3020
          protocol: tcp
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        NODE_ENV: production
        SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:${migrator_SHELL_GATEWAY_ISSUER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PORT: '3020'
        SHELL_SUPER_APP_PORT: '3020'
        SPICEDB_CA_CERT: ${spicedb_SPICEDB_GRPC_TLS_CERT}
        SPICEDB_ENDPOINT: spicedb:50051
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: shell-super-app
      healthCheck:
        httpGet:
          port: 3020
          path: /
      start: sh -c 'cd app/.zerops/runtime/shell-super-app && PATH="$PWD/node/bin:$PATH" exec npm run serve'
