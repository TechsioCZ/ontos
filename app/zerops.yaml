zerops:
  - setup: spicedb
    build:
      base: alpine@3.23
      deployFiles:
        - app/packages/core-runtime/spicedb/stage-bootstrap.yaml
        - app/scripts/run-zerops-spicedb.sh
        - app/scripts/spicedb-datastore-uri.sh
    deploy:
      temporaryShutdown: true
      readinessCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: alpine/docker@26.1
      prepareCommands:
        - docker image pull authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd
        - docker image pull postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: false
      envVariables:
        SPICEDB_DATABASE_HOST: ${db18_hostname}
        SPICEDB_DATABASE_PORT: ${db18_port}
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        exec:
          command: docker exec spicedb /usr/local/bin/grpc_health_probe -addr=localhost:50051 -tls -tls-ca-cert=/tls/grpc-cert.pem
      start: sh app/scripts/run-zerops-spicedb.sh
  - setup: storefront
    build:
      base: alpine/nodejs@26
      # Built once on the GitHub runner (scripts/zerops/build-storefront.sh): tsrs typecheck, then `next build`
      # with NEXT_TELEMETRY_DISABLED=1 and STOREFRONT_IMAGE_HOSTS empty. `storefront` and `shop` deploy the same
      # archive: brand, key and app id are runtime service variables read per request (src/brand/index.ts; the root
      # layout renders dynamically).
      # The push carries the finished standalone server with its static assets and public files as
      # app/.zerops-storefront.tar.gz, and its manifest app/.zerops-storefront.json. Zerops only checks and unpacks it:
      # this setup, the archive digest, the Node major and CPU architecture, and no native addons (the runner is glibc,
      # this image musl). No archive, or one that does not fit, fails the build; nothing falls back to a stale bundle.
      buildCommands:
        - test -f app/.zerops-storefront.tar.gz && test -f app/.zerops-storefront.json || { echo 'this push carries no prebuilt akros-storefront' >&2; exit 1; }
        - node -e 'const m = require("./app/.zerops-storefront.json"); const digest = require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("app/.zerops-storefront.tar.gz")).digest("hex"); const major = (v) => v.split(".")[0]; if (m.setup !== "storefront" || m.package !== "akros-storefront" || m.archiveSha256 !== digest || major(m.node) !== major(process.versions.node) || m.arch !== process.arch || m.nativeAddons !== 0) { console.error("prebuilt archive does not fit this setup:", JSON.stringify(m)); process.exit(1); } console.log("prebuilt", m.package, "from", m.sourceRevision, "inputs", m.inputDigest);'
        - mkdir -p app/.zerops/runtime && tar -xzf app/.zerops-storefront.tar.gz -C app/.zerops/runtime
        - test -f 'app/.zerops/runtime/akros-storefront/akros-storefront/server.js'
      deployFiles:
        - app/.zerops/runtime/akros-storefront
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3070
          path: /robots.txt
        failureTimeout: 3m
        # 10 s is the shortest probe period Zerops accepts (readinessCheck.retryPeriod: 10 s to 1 h).
        retryPeriod: 10s
    run:
      base: alpine/nodejs@26
      ports:
        - port: 3070
          protocol: tcp
          httpSupport: true
      envVariables:
        NEXT_TELEMETRY_DISABLED: '1'
        NODE_ENV: production
        ONTOS_SHELL_URL: http://app:3000
        PORT: '3070'
        STOREFRONT_IMAGE_HOSTS: ''
      healthCheck:
        httpGet:
          port: 3070
          path: /robots.txt
      start: sh -c 'test -n "$ONTOS_AKROS_STOREFRONT_API_KEY" || { echo "ONTOS_AKROS_STOREFRONT_API_KEY is required" >&2; exit 1; }; cd app/.zerops/runtime/akros-storefront && HOSTNAME=0.0.0.0 exec node akros-storefront/server.js'
  # The N1 e-shop (ontos-stage-n1): its own Next storefront, with no AKROS or shop identity, database or provider
  # credential. Its tenant, seller and image host are declared below; only the storefront key is a service variable
  # (ONTOS_N1_STOREFRONT_API_KEY, synced from a stage-edge secret). N1 reaches the Shell over the internal origin
  # http://app:3000, like the AKROS storefront and the shop; its config reader accepts plain http only for loopback
  # and for exactly that origin.
  - setup: n1
    build:
      base: alpine/nodejs@26
      # Built once on the GitHub runner (scripts/zerops/build-storefront.sh): tsrs typecheck, then `next build`
      # with NEXT_TELEMETRY_DISABLED=1; every other N1 setting is a runtime variable read per request.
      # The push carries the finished standalone server with its static assets and public files as
      # app/.zerops-storefront.tar.gz, and its manifest app/.zerops-storefront.json. Zerops only checks and unpacks it:
      # this setup, the archive digest, the Node major and CPU architecture, and no native addons (the runner is glibc,
      # this image musl). No archive, or one that does not fit, fails the build; nothing falls back to a stale bundle.
      buildCommands:
        - test -f app/.zerops-storefront.tar.gz && test -f app/.zerops-storefront.json || { echo 'this push carries no prebuilt n1-storefront' >&2; exit 1; }
        - node -e 'const m = require("./app/.zerops-storefront.json"); const digest = require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("app/.zerops-storefront.tar.gz")).digest("hex"); const major = (v) => v.split(".")[0]; if (m.setup !== "n1" || m.package !== "n1-storefront" || m.archiveSha256 !== digest || major(m.node) !== major(process.versions.node) || m.arch !== process.arch || m.nativeAddons !== 0) { console.error("prebuilt archive does not fit this setup:", JSON.stringify(m)); process.exit(1); } console.log("prebuilt", m.package, "from", m.sourceRevision, "inputs", m.inputDigest);'
        - mkdir -p app/.zerops/runtime && tar -xzf app/.zerops-storefront.tar.gz -C app/.zerops/runtime
        - test -f 'app/.zerops/runtime/n1-storefront/n1-storefront/server.js'
      deployFiles:
        - app/.zerops/runtime/n1-storefront
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3071
          path: /robots.txt
        failureTimeout: 3m
        # 10 s is the shortest probe period Zerops accepts (readinessCheck.retryPeriod: 10 s to 1 h).
        retryPeriod: 10s
    run:
      base: alpine/nodejs@26
      ports:
        - port: 3071
          protocol: tcp
          httpSupport: true
      envVariables:
        NEXT_TELEMETRY_DISABLED: '1'
        NODE_ENV: production
        ONTOS_SHELL_URL: http://app:3000
        # The N1 demo tenant and its seller on stage (the ids n1-stage-grants.mts provisions).
        # Allow this storefront's uploaded images and the exact public host of imported N1 catalog photos.
        ONTOS_STOREFRONT_LEGAL_ENTITY_ID: d7ad363a-ddb0-46c6-bb11-8d9362281297
        ONTOS_STOREFRONT_TENANT_ID: cfcd7ae8-90b9-4c49-927c-b5d66224a618
        PORT: '3071'
        STOREFRONT_IMAGE_HOSTS: ontos-stage-n1.web-revolution.cz,pub-adde8a563e2c43f7b6bc296d81c86358.r2.dev
      healthCheck:
        httpGet:
          port: 3071
          path: /robots.txt
      start: sh -c 'test -n "$ONTOS_N1_STOREFRONT_API_KEY" || { echo "ONTOS_N1_STOREFRONT_API_KEY is required" >&2; exit 1; }; test -n "$ONTOS_STOREFRONT_TENANT_ID" || { echo "ONTOS_STOREFRONT_TENANT_ID is required" >&2; exit 1; }; test -n "$ONTOS_STOREFRONT_LEGAL_ENTITY_ID" || { echo "ONTOS_STOREFRONT_LEGAL_ENTITY_ID is required" >&2; exit 1; }; cd app/.zerops/runtime/n1-storefront && HOSTNAME=0.0.0.0 exec node n1-storefront/server.js'
  # The whole application in one container: scripts/zerops/app-host.mts serves the Shell, every owner and the Outbox
  # Worker host, runs the owner migrations and publishes the Application Composition. The browser assets of owner
  # <appId> are served under /_m/<appId>/ on the one public origin.
  - setup: app
    build:
      base: alpine/nodejs@26
      envVariables:
        BUILD_JOBS: '2'
        # The Shell build mounts the Symmy REST ingress at /api/symmy/v1 (apps/shell-super-app/modern.config.ts).
        ONTOS_INTERNAL_SYMMY_INGRESS: '1'
        ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
        ONTOS_SHOP_STOREFRONT_ORIGIN: https://ontos-stage-shop.web-revolution.cz
        ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
        # pnpm's content-addressable store, moved from the build user's home into the build tree so `cache:` below can
        # keep it between builds; it shares a filesystem with app/node_modules, so the install still hardlinks instead
        # of copying. pnpm 12 reads this name (`npm_config_store_dir` is ignored). Only the store's location moves:
        # the install still writes real files into app/node_modules, which scripts/verify-zerops-workspace-install.mts
        # keeps requiring, so the runtime tree never ships links into a cache the runtime container does not receive.
        PNPM_CONFIG_STORE_DIR: /build/source/app/.zerops/pnpm-store
        # Peer-context copies of identical packages share inodes, so tar ships the bytes once.
        PNPM_CONFIG_PACKAGE_IMPORT_METHOD: hardlink
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ZE_FAIL_BUILD: 'true'
      prepareCommands:
        - sudo apk add --no-cache curl tar unzip zstd
        - sudo npm install --global pnpm@12.16.1
        - sh /build/source/app/scripts/install-zerops-bun.sh 1.4.4
      buildCommands:
        # Zerops restores the build cache (and unpacks a pushed package) as root; the build user must own the tree, and Git
        # must trust it, or every release identity reads as `workspace`.
        - sudo chown -R "$(id -u):$(id -g)" . && git config --global --add safe.directory /build/source
        # Units the CI prebuilt arrive as one archive (zerops-stage.yml); build-app.sh keeps each unit whose digest matches.
        - if [ -f app/.zerops-prebuilt.tar.zst ]; then zstd -dc app/.zerops-prebuilt.tar.zst | tar -x -C app && rm app/.zerops-prebuilt.tar.zst; fi
        - cd app && pnpm install --frozen-lockfile
        - cd app && node scripts/verify-zerops-workspace-install.mts
        # The unit identity table once per build (15-17 s on this 2-core container), outside the checkout, whose Git tree
        # must stay clean. The unit build and the Outbox Worker host build beside the pack below both read it.
        - cd app && sh scripts/zerops/build-app.sh --digests-only /tmp/zerops-unit-digests.tsv
        - cd app && ZEROPS_UNIT_DIGESTS=/tmp/zerops-unit-digests.tsv sh scripts/zerops/build-app.sh
        - mkdir -p 'app/.zerops/bun' && cp -a "$HOME/.local/bun-1.4.4/bin" 'app/.zerops/bun/'
        # The app host records its boots in .zerops/state (scripts/zerops/app-host.mts, HOST_BOOT_RECORD). It ships with an
        # empty record, so the running container never has to create the directory.
        - mkdir -p 'app/.zerops/state' && printf '[]' >'app/.zerops/state/module-credential-boots.json'
        # The pack leaves out the installed build, lint and test tools (scripts/zerops/app-runtime-excluded-packages.txt).
        # This proves the runtime tree complete without them first; a finding fails the build, so nothing deploys.
        - cd app && node scripts/zerops/prove-app-runtime.mts
        # Compressed archives of the runtime tree, not the tree file by file (858.8 MiB moved in 176 s, 2026-11-15). The
        # Outbox Worker host builds while the rest of the tree packs; its runtime is packed on its own once built.
        - sh app/scripts/zerops/pack-app-release.sh sh -c 'cd app && ZEROPS_UNIT_DIGESTS=/tmp/zerops-unit-digests.tsv sh scripts/zerops/build-app.sh --outbox-host'
      # The runtime tree (scripts/zerops/app-runtime-paths.txt) as two archives (the tree, the Outbox Worker host) with
      # their digests and the unpack step; run.initCommands unpacks both to app/ before the start command.
      deployFiles:
        - .zerops-release
      # Unchanged units reuse their last build (scripts/zerops/build-app.sh); Rspack and TS-Go keep their caches.
      cache:
        - app/.zerops/unit-cache
        # The pnpm store (PNPM_CONFIG_STORE_DIR above). It is not in scripts/zerops/app-runtime-paths.txt, so it is
        # cached but never shipped. Measured bound, not a promise: the in-container install took 22.6 s with the store
        # already warm (1669 reused, 0 downloaded) and 79.8 s on a build that re-fetched and re-ran native postinstalls,
        # so this can recover at most ~57 s and only on a build that would otherwise refetch. Against that, Zerops moves
        # every `cache:` path in and out on each build. If `app deployed in NNNs` does not drop, revert this pair.
        - app/.zerops/pnpm-store
        - app/node_modules/.cache
        - app/apps/*/node_modules/.cache
        - app/verticals/*/node_modules/.cache
    deploy:
      temporaryShutdown: false
      # Zerops probes from inside the container. The host answers them on its loopback control port, because the
      # public port 3000 opens only after publication: project-internal callers reach unready containers too.
      readinessCheck:
        httpGet:
          port: 3001
          path: /_host/ready
        failureTimeout: 15m
        # 10 s is the shortest probe period Zerops accepts (readinessCheck.retryPeriod: 10 s to 1 h).
        retryPeriod: 10s
    run:
      base: alpine/nodejs@26
      # GNU tar and zstd for the release archive (scripts/zerops/unpack-app-release.sh).
      prepareCommands:
        - sudo apk add --no-cache tar zstd
      # Every container start: unpack the release archive into app/ unless this release's tree is already complete.
      initCommands:
        - sh .zerops-release/unpack.sh
      ports:
        - port: 3000
          protocol: tcp
          httpSupport: true
      envVariables:
        # The portal realm lives in the shared database under the shared identities, as the stage release ran it.
        COMMERCE_PORTAL_AUTH_DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        COMMERCE_PORTAL_AUTH_DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        # Stage mail goes through the Cloudflare Email Service REST API. Outbound SMTP over TLS is blocked from Zerops.
        CLOUDFLARE_EMAIL_ACCOUNT_ID: 384e8a94acf428ce447e7e73122d91d1
        CLOUDFLARE_EMAIL_API_TOKEN: ${SMTP_PASSWORD}
        EMAIL_PROVIDER: cloudflare-api
        NODE_ENV: production
        # YAML variables are read-only in Zerops. Keep ONTOS_SHELL_RUNTIME as an editable service override.
        # Both binaries ship, so rollback is ONTOS_SHELL_RUNTIME=node plus a restart, without a rebuild.
        ONTOS_SHELL_RUNTIME_DEFAULT: node
        # Private, container-local directory where composition publication retains its legacy completion evidence.
        ONTOS_LEGACY_COMPLETION_EVIDENCE_DIRECTORY: /tmp/ontos-legacy-completion-evidence
        # Container-local: written at the container's first app-host start. A process restarted inside a container
        # that a newer release superseded never publishes its old release again (scripts/zerops/supersede-drain.mts).
        ONTOS_APP_HOST_BOOT_MARKER: /tmp/ontos-app-host-first-boot
        # Every owner in a process shares one pool per database configuration and role. Small pools
        # keep the old and new containers inside db18's 150 slots during deployment. A minute of idle
        # keeps connections warm between a demo user's searches; a 10 s idle reopened TLS connections
        # for every owner on the first search after a short pause (about +1 s on stage).
        # The runtime-role pool keeps 2 connections open past the idle timeout: 4 processes x 2 = 8 per
        # container, 16 during a deploy overlap. The minimum never raises the cap of 6 per pool.
        ONTOS_DATABASE_POOL_IDLE_TIMEOUT_MILLIS: '60000'
        ONTOS_DATABASE_POOL_MAX_CONNECTIONS: '6'
        ONTOS_DATABASE_POOL_MIN_CONNECTIONS: '2'
        ONTOS_DATABASE_POOL_SHARED: 'true'
        ONTOS_PUBLIC_ORIGIN: https://ontos-stage.web-revolution.cz
        # The demo company's pseudonymous e-shop (ŠroubShop): its staff links, e-mail links and portal sign-in.
        ONTOS_SHOP_STOREFRONT_ORIGIN: https://ontos-stage-shop.web-revolution.cz
        ONTOS_STOREFRONT_ORIGIN: https://ontos-stage-akros.web-revolution.cz
        # Stage only: the retention policy of each Symmy write route (SymmyJobRetentionPolicySchema). The Symmy owner
        # admits a write, and its retention Action erases one, only on a route named here; the route enrollment command
        # refuses a route whose lifecycle policy is missing. Entry: the AKROS playground's products route, kept 30 days.
        # The production materializer drops it (scripts/materialize-zerops-environment.mts).
        ONTOS_SYMMY_JOB_RETENTION_POLICIES: '[{"policyId":"akros-symmy-products","revision":"v1","tenantId":"bceaa540-13eb-5508-9ac0-9ed7e40a2ee9","routeId":"1a24b716-0542-40d5-8906-c78554b7436d","governanceLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","targetLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","retentionMs":2592000000},{"policyId":"akros-symmy-stock","revision":"v1","tenantId":"bceaa540-13eb-5508-9ac0-9ed7e40a2ee9","routeId":"042ef863-a837-48d6-81de-59a239148312","governanceLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","targetLegalEntityId":null,"retentionMs":2592000000},{"policyId":"akros-symmy-price-lists","revision":"v1","tenantId":"bceaa540-13eb-5508-9ac0-9ed7e40a2ee9","routeId":"9e355544-4242-4704-a9d3-0ef0832fc328","governanceLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","targetLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","retentionMs":2592000000},{"policyId":"akros-symmy-prices","revision":"v1","tenantId":"bceaa540-13eb-5508-9ac0-9ed7e40a2ee9","routeId":"3276fa39-f868-4be3-942c-501a6996a74a","governanceLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","targetLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","retentionMs":2592000000},{"policyId":"akros-symmy-customer-groups","revision":"v1","tenantId":"bceaa540-13eb-5508-9ac0-9ed7e40a2ee9","routeId":"f637a6ec-865b-43bc-9c28-57783757f367","governanceLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","targetLegalEntityId":"c0c78a3e-6e2a-57e0-9d0d-86253499fee7","retentionMs":2592000000}]'
        PARTY_REGISTRY_DATABASE_URL: postgresql://party_registry_runtime:${migrator_PARTY_REGISTRY_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PARTY_REGISTRY_DB_PASSWORD: ${migrator_PARTY_REGISTRY_DB_PASSWORD}
        PARTY_REGISTRY_WORKER_DATABASE_URL: postgresql://party_registry_worker:${migrator_PARTY_REGISTRY_WORKER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        PARTY_REGISTRY_WORKER_DB_PASSWORD: ${migrator_PARTY_REGISTRY_WORKER_DB_PASSWORD}
        PORT: '3000'
        SHELL_GATEWAY_ISSUER_DATABASE_URL: postgresql://shell_gateway_issuer:${migrator_SHELL_GATEWAY_ISSUER_DB_PASSWORD}@${db18_hostname}:${db18_port}/${db18_dbName}
        SHELL_GATEWAY_ISSUER_DB_PASSWORD: ${migrator_SHELL_GATEWAY_ISSUER_DB_PASSWORD}
        SMTP_FROM: OntOS <noreply@ontos-stage.web-revolution.cz>
        SPICEDB_CA_CERT: ${spicedb_SPICEDB_GRPC_TLS_CERT}
        SPICEDB_DATABASE_PASSWORD: ${spicedb_SPICEDB_DATABASE_PASSWORD}
        SPICEDB_ENDPOINT: spicedb:50051
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: app
      healthCheck:
        httpGet:
          port: 3001
          path: /_host/live
      start: sh -c 'cd app && exec node scripts/zerops/app-host.mts'
