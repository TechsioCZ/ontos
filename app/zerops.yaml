# Stage deployment topology. Secrets are configured in the corresponding
# Zerops services and are never stored in this file.
# Stage topology provisioned for partyregistry and partyregistryworker.
# Full stage rollout requested after PostgreSQL 18 migration.

zerops:
  - setup: 'migrator'
    build:
      base: 'alpine@3.23'
      prepareCommands:
        - sudo apk add --no-cache curl libstdc++
        - sh /build/source/app/scripts/install-zerops-node.sh --with-pnpm 11.25.0
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.7.0/bin:$PATH" node scripts/reset-workspace-dependencies.mjs
        - cd app && PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false PATH="$HOME/.local/node-26.7.0/bin:$PATH" pnpm install --frozen-lockfile --force --config.enable-global-virtual-store=false --virtual-store-dir=node_modules/.pnpm
      deployFiles:
        - 'app/.mise.toml'
        - 'app/apps/shell-super-app'
        - 'app/node_modules'
        - 'app/package.json'
        - 'app/packages'
        - 'app/pnpm-lock.yaml'
        - 'app/pnpm-workspace.yaml'
        - 'app/scripts'
        - 'app/tsconfig.base.json'
        - 'app/verticals/commerce-customer-context'
        - 'app/verticals/commerce-fx'
        - 'app/verticals/party-registry'
        - 'app/verticals/payment-term-catalog'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 8080
          path: '/ready'
        failureTimeout: 10m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      initCommands:
        - ZEROPS_NODE_ROOT=/var/www sh app/scripts/install-zerops-node.sh
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
      envVariables:
        BETTER_AUTH_SECRET: ${shellsuperapp_BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${shellsuperapp_BETTER_AUTH_URL}
        DATABASE_ADMIN_URL: postgresql://${db18_superUser}:${db18_superUserPassword}@${db18_hostname}:${db18_port}/${db18_dbName}
        MIGRATOR_PORT: '8080'
        NODE_ENV: production
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_INSECURE: 'true'
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: migrator
      healthCheck:
        httpGet:
          port: 8080
          path: '/ready'
      start: sh -c 'cd app && PATH="/var/www/.local/node-26.7.0/bin:$PATH" exec node scripts/run-zerops-migrator.mjs'

  - setup: 'spicedb'
    build:
      base: 'alpine@3.23'
      deployFiles:
        - 'app/packages/core-runtime/spicedb/stage-bootstrap.yaml'
        - 'app/scripts/run-zerops-spicedb.sh'
    deploy:
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 8443
          path: '/healthz'
        failureTimeout: 5m
        retryPeriod: 10s
    run:
      base: 'alpine/docker@26.1'
      prepareCommands:
        - docker image pull authzed/spicedb:v1.56.0
        - docker image pull postgres:18.6-alpine
      ports:
        - port: 50051
          protocol: tcp
          httpSupport: false
        - port: 8443
          protocol: tcp
          httpSupport: true
      envVariables:
        SPICEDB_DATASTORE_ENGINE: postgres
      healthCheck:
        httpGet:
          port: 8443
          path: '/healthz'
      start: sh app/scripts/run-zerops-spicedb.sh

  - setup: 'party-registry'
    build:
