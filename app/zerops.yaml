        - sh /build/source/app/scripts/install-zerops-node.sh 26.7.0 12.4.2
      buildCommands:
        - cd app && PATH="$HOME/.local/node-26.7.0/bin:$PATH" pnpm install --frozen-lockfile
        - cd app && PATH="$HOME/.local/node-26.7.0/bin:$PATH" node scripts/verify-zerops-workspace-install.mts
        - cd app && NODE_OPTIONS=--max-old-space-size=4096 ULTRAMODERN_SOURCE_REVISION="$(git rev-parse HEAD)" PATH="$HOME/.local/node-26.7.0/bin:$PATH" pnpm --filter '@app/party-registry' run build
        - cd app && PATH="$HOME/.local/node-26.7.0/bin:$PATH" pnpm run zerops:materialize --app 'party-registry' --package '@app/party-registry' --package-dir 'verticals/party-registry'
        - cp 'app/topology/reference-topology.json' 'app/.zerops/runtime/party-registry/topology.json'
        - cp 'app/topology/local-overlays/development.json' 'app/.zerops/runtime/party-registry/local-overlay.json'
        - mkdir 'app/.zerops/runtime/party-registry/node' && cp -a "$HOME/.local/node-26.7.0/bin" "$HOME/.local/node-26.7.0/lib" 'app/.zerops/runtime/party-registry/node/'
      deployFiles:
        - 'app/.zerops/runtime/party-registry'
    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 4102
          path: '/party-registry-api/party-registry/readiness'
        failureTimeout: 3m
        retryPeriod: 10s
    run:
      base: 'nodejs@24'
      ports:
        - port: 4102
          protocol: tcp
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://ontos_runtime:${db18_password}@${db18_hostname}:${db18_port}/${db18_dbName}
        NODE_ENV: production
        PORT: '4102'
        SPICEDB_CA_CERT: ${spicedb_SPICEDB_GRPC_TLS_CERT}
        SPICEDB_ENDPOINT: 'spicedb:50051'
        SPICEDB_PRESHARED_KEY: ${spicedb_SPICEDB_GRPC_PRESHARED_KEY}
        ULTRAMODERN_DEPLOYMENT_ENVIRONMENT: stage
        ULTRAMODERN_ZEROPS_SERVICE: party-registry
        VERTICAL_PARTY_REGISTRY_PORT: '4102'
      healthCheck:
        httpGet:
          port: 4102
          path: '/party-registry-api/party-registry/readiness'
      start: sh -c 'cd app/.zerops/runtime/party-registry && PATH="$PWD/node/bin:$PATH" exec npm run serve'

