# Git hooks for the application under app/. Installing app dependencies installs them through the
# lefthook package's own postinstall. Never bypass them with --no-verify.
pre-commit:
  jobs:
    # oxfmt skips unsupported file types and its own ignorePatterns, matching `pnpm format`.
    - name: format
      root: "app/"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Globs match repository-root paths; they select exactly the files `pnpm lint` covers.
    - name: lint
      root: "app/"
      glob:
        - "app/{apps,verticals,packages,scripts}/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
        - "app/tools/oxlint/effect-native/tests/*.test.mts"
      exclude:
        - "app/tools/oxlint/effect-native/tests/fixtures/*"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      root: "app/"
      run: pnpm typecheck
    - name: contract
      root: "app/"
      run: pnpm contract:check
