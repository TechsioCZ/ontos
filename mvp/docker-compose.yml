services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontos_mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontos}
      POSTGRES_USER: ${POSTGRES_USER:-ontos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ontos_mvp_postgres:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  spicedb:
    image: authzed/spicedb:latest
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_PRESHARED_KEY:-local-spicedb-key}
      - --datastore-engine=memory
    ports:
      - '${SPICEDB_GRPC_PORT:-50051}:50051'
      - '${SPICEDB_HTTP_PORT:-8443}:8443'
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=localhost:50051', '-rpc-timeout=2s']
      interval: 5s
      timeout: 5s
      retries: 20

  zed:
    image: authzed/zed:latest
    profiles:
      - tools
    depends_on:
      - spicedb
    entrypoint:
      - zed
    volumes:
      - ./scripts/spicedb:/spicedb:ro

volumes:
  ontos_mvp_postgres:
